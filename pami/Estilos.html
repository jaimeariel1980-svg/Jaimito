.brand .tt{font-weight:800;font-size:22px;color:var(--navy);text-transform:uppercase;letter-spacing:-.01em;text-align:right}
.nav{background:var(--azul);border-bottom:4px solid var(--celeste);color:#fff}
.nav .in{max-width:1100px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:46px}
.nav a,.nav button,.nav select,.nav input{font-family:var(--font)}
.nav .it{color:#fff;text-decoration:none;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:14px 12px;background:none;border:none;cursor:pointer}
.nav .it:hover{background:rgba(255,255,255,.12)}
.nav select,.nav input{padding:7px 10px;border:none;border-radius:4px;font-size:12px;font-weight:600;color:var(--navy);background:#fff}
.nav .sp{margin-left:auto;font-size:12px;color:#BFE3F7;font-weight:600}
.band{background:var(--navy2);color:#fff;padding:12px 20px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.btn{display:inline-block;border:none;border-radius:4px;background:var(--azul);color:#fff;font-family:var(--font);font-weight:700;font-size:13px;padding:10px 18px;cursor:pointer;text-decoration:none;text-transform:uppercase;letter-spacing:.03em}
.btn:hover{background:#02408a}
.btn.sec{background:#fff;color:var(--azul);border:1.5px solid var(--azul)}
.btn.ghost{background:var(--tint);color:var(--azul)}
.btn.ok{background:var(--ok)}.btn.red{background:var(--err)}.btn.wa{background:#25D366}.btn.cel{background:var(--celeste)}
.btn:disabled{opacity:.55;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px}
.ttl{color:var(--azul);font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.sec{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--celeste);margin:16px 0 6px}
.chip{display:inline-block;background:var(--tint);color:var(--azul);padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.plus{display:inline-block;width:18px;height:18px;border:1.5px solid var(--celeste2);color:var(--celeste2);font-weight:800;line-height:15px;text-align:center;font-size:14px;border-radius:2px}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:4px;font-size:14px;font-family:var(--font);background:#fff;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--celeste)}
label.l{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.badge{display:inline-block;min-width:28px;text-align:center;border-radius:4px;padding:2px 8px;font-weight:800;font-size:12px;color:#fff;background:#9AA7B8}
.nA{background:#1E8E5A}.nBp{background:#8BD3A8;color:#0f3a24}.nB{background:#F2B705;color:#4a3a00}.nC{background:#D9534F}
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:11px 18px;border-radius:4px;font-weight:600;opacity:0;transition:.2s;z-index:999;pointer-events:none}
.toast.show{opacity:1}
.loading{padding:60px 20px;text-align:center;color:var(--mut)}
@media print{.nav,.noprint{display:none!important}body{background:#fff}}

      .withFailureHandler(function(e){btn.disabled=false;btn.textContent=old;alert('No se pudo corregir: '+((e&&e.message)||e));}).redactarIA(K_(),ta.value,ind);
  }
  function attach(ta){
    if(ta.dataset.ia)return;ta.dataset.ia='1';

    var mk=function(t){var x=document.createElement('button');x.type='button';x.className='btn ghost';x.textContent=t;x.style.cssText='padding:6px 12px;font-size:12px';return x;};

  }
  function scan(){if(!K_())return;[].forEach.call(document.querySelectorAll('#fbody textarea,#app textarea,#gM,#fichaTxt'),attach);}
  function start(){scan();var t;new MutationObserver(function(){clearTimeout(t);t=setTimeout(scan,80);}).observe(document.body,{childList:true,subtree:true});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>

<script>
window.MOT=(function(){
  function e(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  var LB='display:inline-flex;gap:6px;align-items:center;margin:3px 14px 3px 0;font-size:13px;font-weight:600;cursor:pointer';
  return {
    html:function(id,lista,sel){
      var otro='',s=String(sel||'').split(/\s*;\s*/).filter(Boolean).filter(function(x){if(/^Otro: /.test(x)){otro=x.slice(6);return false;}return true;});
      return '<div id="'+id+'">'+lista.map(function(m){return '<label style="'+LB+'"><input type="checkbox" value="'+e(m)+'"'+(s.indexOf(m)>-1?' checked':'')+' style="width:auto;margin:0"> '+e(m)+'</label>';}).join('')+'<label style="'+LB+'"><input type="checkbox" value="Otro"'+(otro?' checked':'')+' onchange="MOT.otro(\''+id+'\')" style="width:auto;margin:0"> Otro</label></div><input type="text" id="'+id+'-o" maxlength="40" placeholder="Otro motivo (máximo 3 palabras)" value="'+e(otro)+'" style="margin-top:6px;'+(otro?'':'display:none')+'">';
    },
    otro:function(id){var g=document.getElementById(id),c=g.querySelector('input[value="Otro"]'),t=document.getElementById(id+'-o');t.style.display=c.checked?'':'none';if(c.checked)t.focus();},
    valor:function(id){
      var g=document.getElementById(id);if(!g)return {ok:true,texto:''};
      var v=[].slice.call(g.querySelectorAll('input:checked')).map(function(x){return x.value;}).filter(function(x){return x!=='Otro';}),o=g.querySelector('input[value="Otro"]');
      if(o&&o.checked){var t=document.getElementById(id+'-o').value.replace(/\s+/g,' ').trim();if(!t||t.split(' ').length>3)return {ok:false,texto:'',msg:'En "Otro" escribí el motivo con máximo tres palabras.'};v.push('Otro: '+t);}
      return {ok:true,texto:v.join('; ')};
    }
  };
})();
</script>
