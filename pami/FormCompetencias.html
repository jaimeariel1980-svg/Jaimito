<style>
.fc .hero{background:var(--navy2);color:#fff;padding:26px 20px 22px;border-bottom:4px solid var(--celeste)}
.fc .brandrow{display:flex;align-items:center;gap:16px;margin-bottom:18px}.fc .brandrow .lg{height:54px}.fc .brandrow .prod{border-left:1px solid rgba(255,255,255,.35);padding-left:16px;font-weight:800;font-size:16px;letter-spacing:.02em}.brand ~ #app .fc .brandrow{display:none}
.fc .hero .in,.fc .wrap{max-width:980px;margin:0 auto}
.fc .hero h1{font-size:28px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.fc .hero .meta{display:flex;gap:28px;flex-wrap:wrap;margin-top:14px}
.fc .hero .meta div{font-size:14px;font-weight:600}
.fc .hero .meta small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#8FB6D8;font-weight:700}
.fc .hero a{color:#CDE7F6}
.fc .wrap{padding:22px 16px 60px}
.fc .sect{margin-bottom:26px}
.fc .sl{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--azul);display:flex;align-items:center;gap:8px;margin-bottom:14px}
.fc .sl:before{content:'';width:4px;height:16px;background:var(--celeste)}
.fc .meta3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fc .star{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
.fc .star div{background:var(--bg);border:1px solid var(--line);padding:10px;text-align:center;font-size:12px;color:var(--mut);font-weight:600}
.fc .star b{display:block;color:var(--celeste);font-size:12px;margin-bottom:3px}
.fc .comp{border:1px solid var(--line);border-radius:4px;padding:20px;margin-bottom:16px;background:#fff}
.fc .ch{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.fc .cn{font-size:17px;font-weight:800;color:var(--azul);flex:1}
.fc .peso{display:flex;align-items:center;gap:6px;background:var(--tint);color:var(--azul);padding:5px 12px;border-radius:99px;font-size:11px;font-weight:800;text-transform:uppercase}
.fc .peso input{width:52px;padding:2px 4px;border:none;border-bottom:1px dashed var(--azul);background:transparent;text-align:center;font-weight:800;color:var(--azul)}
.fc .cd{font-size:13px;color:var(--mut);font-style:italic;margin:6px 0 12px}
.fc .qb{background:var(--bg);border-left:4px solid var(--celeste);padding:12px 14px;margin-bottom:14px}
.fc .qb ul{list-style:none}
.fc .qb li{font-size:13px;margin:6px 0;padding-left:14px;position:relative}
.fc .qb li:before{content:'•';position:absolute;left:0;color:var(--celeste);font-weight:800}
.fc .fr{display:flex;gap:6px;margin-bottom:12px}
.fc .fr button{flex:1;padding:11px 4px;border:1.5px solid var(--line);background:#fff;font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--mut);cursor:pointer;border-radius:4px;font-family:var(--font)}
.fc .fr button:hover{border-color:var(--celeste)}
.fc .fr button.f1.sel{background:var(--err);color:#fff;border-color:var(--err)}
.fc .fr button.f2.sel{background:#F2B705;color:#4A3A00;border-color:#F2B705}
.fc .fr button.f3.sel{background:#6EE7B7;color:#0F3A24;border-color:#6EE7B7}
.fc .fr button.f4.sel{background:var(--ok);color:#fff;border-color:var(--ok)}
.fc table.m{width:100%;border-collapse:collapse}
.fc table.m th{background:#EEF2F7;color:var(--mut);font-size:10px;text-transform:uppercase;padding:9px;border:1px solid var(--line)}
.fc table.m td{border:1px solid var(--line);height:38px;padding:0 10px;font-size:13px;font-weight:600}
.fc table.m td.p{text-align:center;color:var(--azul);font-weight:800}
.fc table.m td.c{cursor:pointer;text-align:center;font-weight:800}
.fc table.m td.c.sel1{background:var(--err);color:#fff}
.fc table.m td.c.sel2{background:#F2B705;color:#4A3A00}
.fc table.m td.c.sel3{background:#6EE7B7;color:#0F3A24}
.fc table.m td.c.sel4{background:var(--ok);color:#fff}
.fc .score{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:18px 24px;margin:16px 0;background:#fff}
.fc .score b{font-size:42px;color:var(--azul);letter-spacing:-.03em}
.fc .g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.fc .ver{background:#EEF2F7;border:1px solid var(--line);padding:22px;text-align:center}
.fc .ver .vb{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.fc .vb button{flex:1;min-width:150px;padding:15px 10px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:12.5px;text-transform:uppercase;cursor:pointer;border-radius:4px;color:var(--mut);font-family:var(--font)}
.fc .vb button small{display:block;font-size:10px;font-weight:600;text-transform:none;margin-top:2px}
.fc .vb button.on.A{background:#1E8E5A;color:#fff;border-color:#1E8E5A}
.fc .vb button.on.Bp{background:#8BD3A8;color:#0F3A24;border-color:#8BD3A8}
.fc .vb button.on.B{background:#F2B705;color:#4A3A00;border-color:#F2B705}
.fc .vb button.on.C{background:#D9534F;color:#fff;border-color:#D9534F}
.fc .done{display:none;text-align:center;padding:30px 10px}
@media(max-width:760px){.fc .meta3,.fc .g2{grid-template-columns:1fr}.fc .star{grid-template-columns:1fr}.fc .fr{flex-wrap:wrap}.fc .fr button{min-width:45%}}
</style>
<script>
var FC=(function(){
  var K,CID,ENTRE,CONT,O,D,S,ETAPA='',PRE=null;
  var NIV=['','No demuestra','Señales de desarrollo','Demuestra efectividad','Demuestra solidez'];
  var VER=[['A','Alto ajuste','Avanza'],['B+','Muy buen ajuste','Avanza'],['B','Ajuste con observaciones','Reserva'],['C','No ajusta','Descarta']];
  function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function $(s){return CONT.querySelector(s);}
  function open(o){
    O=o;ETAPA=o.etapa||'';K=o.K;CID=o.cid;ENTRE=o.entre||'';CONT=o.container;S={niv:{},manual:null,auto:null,score:null};
    PRE=null;CONT.className='fc';CONT.innerHTML='<div class="loading">Cargando…</div>';
    var fail=function(e){CONT.innerHTML='<div class="loading" style="color:#D9534F">Error: '+esc(e.message)+'</div>';};
    google.script.run.withSuccessHandler(function(d){D=d;
      if(!o.editar){render();return;}
      google.script.run.withSuccessHandler(function(p){if(!p){fail({message:'No encontré una evaluación guardada para editar'});return;}PRE=p;render();previa();}).withFailureHandler(fail).getEvalPrevia(K,CID,'competencias');
    }).withFailureHandler(fail).getDatosForm(K,CID,ETAPA);
  }
  function setV(id,v){var e=$('#'+id);if(!e||v==null||v==='')return;if(e.tagName==='SELECT'&&![].some.call(e.options,function(o){return o.value===v||o.text===v;})){var o=document.createElement('option');o.textContent=v;e.appendChild(o);}e.value=v;}
  function previa(){
    var x=PRE.datos||{},m=x.meta||{};
    setV('m-ent',PRE.entrevistador);setV('m-fecha',PRE.fecha);
    var M={edad:'m-edad',localidad:'m-loc',familia:'m-fam',formacion:'m-form',empresaAct:'m-emp',puestoAct:'m-pue',antig:'m-ant',remAct:'m-ra',remPret:'m-rp',disp:'m-disp',motivo:'m-mot',movilidad:'m-mov',referencias:'m-ref'};
    for(var k in M)setV(M[k],m[k]);
    var cs=x.comps||[];
    D.comps.forEach(function(k){
      var c=cs.filter(function(y){return y.nombre===k.nombre;})[0];if(!c)return;
      var pi=$('.comp[data-id="'+k.id+'"] .peso input');if(pi){pi.value=c.peso;pesoCh(k.id,c.peso);}
      var ta=$('[data-n="'+k.id+'"]');if(ta)ta.value=c.notas||'';
      if(c.nivel>0)nivel(k.id,c.nivel);
    });
    $('#fort').value=x.fortalezas||'';$('#area').value=x.areas||'';$('#rec').value=x.recomendacion||'';
    if(PRE.nota&&PRE.nota!==S.auto)manual(PRE.nota);
    var t=$('.hero h1');if(t)t.textContent+=' (edición)';
    var b=$('#save');if(b)b.textContent='Guardar cambios';
  }
  function inp(id,l,ph,v){return '<div><label class="l">'+l+'</label><input type="text" id="'+id+'" placeholder="'+(ph||'')+'" value="'+esc(v||'')+'"></div>';}
  function render(){
    var c=D.cand,h=D.hero,hoy=new Date(new Date().getTime()-3*3600000).toISOString().slice(0,10),ent=ENTRE||c.entrev||'';
    var scr=(c.notaScr&&ETAPA!=='tecnica')?'<div><small>Screening</small>'+esc(c.notaScr)+(c.infScr?' · <a target="_blank" href="'+esc(c.infScr)+'">📄 Ver screening</a>':'')+'</div>':'';
    CONT.innerHTML=
    '<div class="hero"><div class="in"><div class="brandrow"><span class="lg w"></span><span class="prod">Atracción y Elección</span></div><h1>'+(ETAPA==='tecnica'?'Entrevista técnica de ':'Entrevista de ')+esc(c.nombre)+'</h1><div class="meta"><div><small>Cliente</small>'+esc(h.cliente)+'</div><div><small>Posición</small>'+esc(h.puesto)+'</div>'+(ETAPA==='tecnica'?'':'<div><small>Metodología</small>STAR (A-B-C-D-E)</div>')+scr+'</div></div></div>'+
    '<div class="wrap"><div id="form">'+(ETAPA==='tecnica'?'':'<div class="sect card" id="iaBox"><div class="sl">Completar con la grabación de la entrevista</div><div style="font-size:13px;color:#3F4B66">Grabá la videollamada de Meet desde acá. Al terminar, la IA transcribe y completa el formulario para que lo revises y lo guardes. El audio no se guarda.</div><div style="margin-top:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn" onclick="FC.grabar()">🎙 Grabar entrevista (Meet)</button><span id="iaSt" style="font-size:13px;color:#5D6B82"></span></div></div>')+
    '<div class="sect card"><div class="sl">Datos del candidato</div><div class="meta3">'+
    inp('m-nom','Nombre','',c.nombre).replace('<input','<input disabled')+'<div><label class="l">Fecha</label><input type="date" id="m-fecha" value="'+hoy+'"></div>'+
    (ETAPA==='tecnica'?'':'<div><label class="l">Entrevistador/a</label><select id="m-ent"><option value="">— Elegí —</option>'+D.entrevistadores.map(function(e){return '<option'+(e===ent?' selected':'')+'>'+esc(e)+'</option>';}).join('')+'</select></div>')+
    (ETAPA==='tecnica'?'':inp('m-edad','Edad','Ej: 38')+inp('m-loc','Localidad','Dónde vive',c.loc)+inp('m-fam','Situación familiar','Estado civil, hijos')+inp('m-form','Formación','Título, institución, estado')+inp('m-emp','Empresa actual','—')+inp('m-pue','Puesto actual','—')+inp('m-ant','Antigüedad','Ej: 3 años')+inp('m-ra','Remuneración actual','$')+inp('m-rp','Remuneración pretendida','$',c.pret)+inp('m-disp','Disponibilidad de ingreso','Ej: 15 días')+inp('m-mot','Motivo de cambio','Por qué busca')+inp('m-mov','Movilidad / traslado','Sí / No')+inp('m-ref','Referencias laborales','Nombre, lugar, tel'))+'</div></div>'+
    '<div class="sect card"><div class="sl">Guía para el entrevistador</div><div style="font-size:13px">Cada criterio tiene un peso (editable). El peso se aplica al score final y el cambio solo afecta a este candidato; el peso oficial se edita en la pestaña <b>'+(ETAPA==='tecnica'?'Tecnica':'Competencias')+'</b> del Sheet.</div>'+(ETAPA==='tecnica'?'<div style="display:none">':'')+'<div class="star"><div><b>A: ACCIÓN</b>¿Cómo lo abordaste?</div><div><b>B: PENSAMIENTO</b>¿Por qué elegiste ese enfoque?</div><div><b>C: RESULTADO</b>¿Cuál fue el resultado final?</div><div><b>D: APRENDIZAJE</b>¿Qué te llevaste?</div><div><b>E: APLICACIÓN</b>¿Volviste a usar lo aprendido?</div></div>'+(ETAPA==='tecnica'?'</div>':'')+'</div>'+
    '<div class="sl" style="margin-top:6px">'+(ETAPA==='tecnica'?'Evaluación técnica':'Evaluación por competencias')+'</div><div id="comps"></div>'+
    '<div class="sect card"><div class="sl">Síntesis y evaluación final</div><div class="g2"><div><label class="l">Fortalezas principales</label><textarea id="fort" rows="5" placeholder="•&#10;•&#10;•"></textarea></div><div><label class="l">Áreas a desarrollar</label><textarea id="area" rows="5" placeholder="•&#10;•&#10;•"></textarea></div></div>'+
    '<label class="l">Matriz de evaluación (4 niveles · score ponderado)</label><table class="m"><thead><tr><th style="text-align:left">Competencia</th><th>Peso</th><th>No demuestra</th><th>Señales</th><th>Efectividad</th><th>Solidez</th></tr></thead><tbody id="mx"></tbody></table>'+
    '<div class="score"><div><div class="l" style="margin:0">Score ponderado total</div><div id="sd" style="font-size:13px;color:#5D6B82">Completá la matriz para calcular</div></div><div><b id="sn">—</b> / 10</div></div>'+
    '<label class="l">Recomendación y justificación de viabilidad</label><textarea id="rec" rows="4" placeholder="Redactá la justificación final…"></textarea>'+
    '<div class="ver" style="margin-top:16px"><div class="ttl">Ajuste al rol</div><div style="font-size:12px;color:#5D6B82;font-style:italic">Tu juicio profesional tiene prioridad sobre el score automático <span id="sug"></span></div><div class="vb" id="vb">'+VER.map(function(v){return '<button data-l="'+v[0]+'" onclick="FC.manual(\''+v[0]+'\')">'+v[0]+' · '+v[1]+'<small>'+v[2]+'</small></button>';}).join('')+'</div>'+motHtml()+'</div></div>'+
    '<button class="btn ok" id="save" style="width:100%;padding:14px" onclick="FC.guardar()">Guardar evaluación</button></div><div class="done card" id="done"></div></div>';
    var cs=$('#comps'),mx=$('#mx');
    D.comps.forEach(function(k){
      var d=document.createElement('div');d.className='comp';d.dataset.id=k.id;
      d.innerHTML='<div class="ch"><div class="cn">'+esc(k.nombre)+'</div><div class="peso">Peso <input type="number" min="0" step="0.5" value="'+k.peso+'" oninput="FC.pesoCh(\''+esc(k.id)+'\',this.value)"></div></div><div class="cd">'+esc(k.descripcion)+'</div><div class="qb"><div class="l" style="margin-top:0">Preguntas sugeridas'+(ETAPA==='tecnica'?'':' (STAR)')+'</div><ul>'+k.preguntas.map(function(q){return '<li>'+esc(q)+'</li>';}).join('')+'</ul></div><div class="fr">'+[1,2,3,4].map(function(n){return '<button class="f'+n+'" onclick="FC.nivel(\''+esc(k.id)+'\','+n+')">'+NIV[n]+'</button>';}).join('')+'</div><label class="l">Notas / evidencias (situación, acción, resultado)</label><textarea rows="3" data-n="'+esc(k.id)+'" placeholder="Redactá los hallazgos…"></textarea>';
      cs.appendChild(d);k.pesoAct=k.peso;
      var tr=document.createElement('tr');tr.dataset.id=k.id;tr.innerHTML='<td>'+esc(k.nombre)+'</td><td class="p" data-p="'+esc(k.id)+'">'+k.peso+'</td>'+[1,2,3,4].map(function(n){return '<td class="c" onclick="FC.nivel(\''+esc(k.id)+'\','+n+')"></td>';}).join('');mx.appendChild(tr);
    });
  }
  function comp(id){return D.comps.find(function(x){return x.id===id;});}
  function pesoCh(id,v){comp(id).pesoAct=parseFloat(v)||0;$('[data-p="'+id+'"]').textContent=comp(id).pesoAct;calc();}
  function nivel(id,n){
    S.niv[id]=n;
    CONT.querySelectorAll('.comp[data-id="'+id+'"] .fr button').forEach(function(b){b.classList.toggle('sel',b.className.indexOf('f'+n)>-1);});
    var tr=$('#mx tr[data-id="'+id+'"]');tr.querySelectorAll('td.c').forEach(function(td,i){td.className='c'+(i+1===n?' sel'+n:'');td.textContent=i+1===n?'X':'';});
    calc();
  }
  function calc(){
    var pts=0,max=0,ev=0;
    D.comps.forEach(function(k){var n=S.niv[k.id],p=k.pesoAct;if(n&&p>0){pts+=n*p;max+=4*p;ev++;}});
    var sn=$('#sn'),sd=$('#sd');
    if(!max){S.score=null;S.auto=null;sn.textContent='—';sd.textContent='Completá la matriz para calcular';$('#sug').textContent='';return;}
    var s=Math.round((pts/max)*100)/10,u=D.umbral;S.score=s;S.auto=s>=u.a?'A':s>=u.bplus?'B+':s>=u.b?'B':'C';
    sn.textContent=s.toFixed(1);sd.textContent=ev+' competencia(s) evaluadas · '+pts.toFixed(1)+' / '+max.toFixed(1)+' puntos ponderados';
    $('#sug').textContent='· sugerencia automática: '+S.auto;
    marcar(S.manual||S.auto);
  }
  function motHtml(){return '<div id="mot" style="display:none;margin-top:12px"><label class="l" style="color:#D9534F">Motivos de descarte (obligatorio con C · podés elegir más de uno)</label>'+MOT.html('m-md',D.motivos,PRE?PRE.motivo:'')+'</div>';}
  function motSel(){}
  function marcar(l){var m=$('#mot');if(m)m.style.display=l==='C'?'':'none';CONT.querySelectorAll('#vb button').forEach(function(b){b.className=b.dataset.l===l?'on '+l.replace('+','p'):'';});}
  function manual(l){S.manual=l;marcar(l);}
  function v(id){return $('#'+id).value.trim();}
  function guardar(){
    var letra=S.manual||S.auto;
    if(!letra){alert('Evaluá al menos una competencia o elegí el ajuste al rol.');return;}
    var mf='';if(letra==='C'){var mr=MOT.valor('m-md');if(!mr.ok||!mr.texto){alert(mr.ok?'Con C hay que elegir al menos un motivo de descarte.':mr.msg);return;}mf=mr.texto;}
    var b=$('#save');b.disabled=true;b.textContent='Guardando…';
    var comps=D.comps.map(function(k){return {nombre:k.nombre,peso:k.pesoAct,nivel:S.niv[k.id]||0,notas:$('[data-n="'+k.id+'"]').value};});
    google.script.run.withSuccessHandler(function(r){
      $('#form').style.display='none';var d=$('#done');d.style.display='block';
      d.innerHTML='<h2 style="color:#1E8E5A">¡Evaluación '+(O.editar?'actualizada':'guardada')+'!</h2><p style="margin:10px 0">Ajuste: <b>'+esc(r.nota)+'</b>'+(r.score!=null?' · Score '+r.score.toFixed(1):'')+'<br>Estado del candidato: <b>'+esc(r.estado||'')+'</b></p><p><button class="btn" onclick="FC.volver()">Volver</button> <a class="btn ghost" target="_blank" href="'+esc(r.url)+'">Ver informe</a></p>'+(O.onFicha&&(r.nota==='A'||r.nota==='B+')?'<div style="margin-top:14px;padding:12px;background:#FFF1D6;border-left:4px solid #F2B705;text-align:left"><b>Siguiente paso:</b> preparar el resumen para la entrevista técnica. Los jefes no ven nada hasta que lo revises y lo guardes.<br><button class="btn" style="margin-top:8px;background:#F2B705;color:#4A3A00" onclick="FC.ficha()">🩺 Preparar resumen técnica</button></div>':'');
      CONT.scrollIntoView();if(O.onDone)O.onDone(r);
    }).withFailureHandler(function(e){b.disabled=false;b.textContent=O.editar?'Guardar cambios':'Guardar evaluación';alert('No se pudo guardar: '+e.message);})
    [ETAPA==='tecnica'?'guardarTecnica':'guardarCompetencias'](K,ETAPA==='tecnica'?{id:CID,fecha:v('m-fecha'),comps:comps,fortalezas:$('#fort').value,areas:$('#area').value,recomendacion:$('#rec').value,resultado:letra,motivoDescarte:mf}:{id:CID,entrevistador:v('m-ent'),fecha:v('m-fecha'),comps:comps,fortalezas:$('#fort').value,areas:$('#area').value,recomendacion:$('#rec').value,resultado:letra,motivoDescarte:mf,editar:!!O.editar,
      meta:{edad:v('m-edad'),localidad:v('m-loc'),familia:v('m-fam'),formacion:v('m-form'),empresaAct:v('m-emp'),puestoAct:v('m-pue'),antig:v('m-ant'),remAct:v('m-ra'),remPret:v('m-rp'),disp:v('m-disp'),motivo:v('m-mot'),movilidad:v('m-mov'),referencias:v('m-ref')}});
  }
  function setSi(sel,v){var e=$(sel);if(e&&v&&!String(e.value||'').trim())e.value=v;}
  function aplicar(r,texto){
    D.comps.forEach(function(k){var x=(r.comps||[]).filter(function(c){return c.id===k.id;})[0];if(!x)return;if(x.nivel>0&&!S.niv[k.id])nivel(k.id,x.nivel);setSi('[data-n="'+k.id+'"]',x.evidencia);});
    setSi('#fort',r.fortalezas);setSi('#area',r.areas);setSi('#rec',r.recomendacion);
    var M={edad:'m-edad',localidad:'m-loc',familia:'m-fam',formacion:'m-form',empresaAct:'m-emp',puestoAct:'m-pue',antig:'m-ant',remAct:'m-ra',remPret:'m-rp',disp:'m-disp',motivo:'m-mot',movilidad:'m-mov',referencias:'m-ref'};
    for(var k in M)setSi('#'+M[k],(r.meta||{})[k]);
    var st=$('#iaSt');st.style.color='#1E8E5A';st.textContent='✓ Formulario completado por la IA. Revisá todo antes de guardar.';
    $('#iaBox').insertAdjacentHTML('beforeend','<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;font-weight:700;color:#034EA2">Ver transcripción</summary><div style="white-space:pre-wrap;font-size:12px;max-height:240px;overflow:auto;margin-top:6px;color:#3F4B66">'+esc(texto)+'</div></details>');
    $('#iaBox').scrollIntoView({behavior:'smooth'});
  }
  function transcribir(p,i,acc,st){
    if(i>=p.length){st.textContent='Analizando la entrevista…';
      google.script.run.withSuccessHandler(function(r){aplicar(JSON.parse(r),acc.join(' '));}).withFailureHandler(function(e){st.textContent='';alert('No se pudo analizar: '+((e&&e.message)||e));}).analizarEntrevista(K,CID,acc.join(' '));return;}
    st.textContent='Transcribiendo parte '+(i+1)+' de '+p.length+'…';
    google.script.run.withSuccessHandler(function(t){acc.push(t);transcribir(p,i+1,acc,st);}).withFailureHandler(function(e){st.textContent='';alert('No se pudo transcribir: '+((e&&e.message)||e));}).transcribirAudio(K,p[i].b64,p[i].mime);
  }
  function grabar(){
    var st=$('#iaSt');st.style.color='#5D6B82';st.textContent='';
    window.EntrevistaRec.abrir(function(partes){transcribir(partes,0,[],st);});
  }
  function volver(){if(O.onClose)O.onClose();}
  function ficha(){if(O.onFicha)O.onFicha();}
  return {ficha:ficha,open:open,pesoCh:pesoCh,nivel:nivel,manual:manual,guardar:guardar,volver:volver,motSel:motSel,grabar:grabar};
