function kpiOk(k,c){
  var term=/^Descartad|^Contratado/i.test(c.estado);

  if(k==='ctc'){var ep=etapaPend(c);return !term&&!!ep&&etqContacto(c)===ep&&(!c.cita||citaHecha(c));}
  if(k==='cit')return !!c.cita&&!citaHecha(c)&&c.cita.ts.slice(0,10)===D.ahora.slice(0,10);
  if(k==='mov')return !term&&!terminal(c.estado)&&dias(c)>=D.cfg.diasAlerta;
  if(k==='ct')return c.estado==='Contratado';
  return true;

  var c=byFila(f),et=etapaActual(c),def=et==='cv'?'screening':et;
  var man=new Date(new Date(D.ahora).getTime()+86400000).toISOString().slice(0,10);
  document.getElementById('mbox').innerHTML='<div class="hd"><div><h2>Agendar · '+esc(c.nombre)+'</h2><small>Crea el evento en el calendario'+(/@/.test(c.email||'')?' y le manda la invitación por mail':'')+'</small></div><button class="x" onclick="cerrar()">×</button></div><div class="bd"><div class="grid" style="margin-top:14px">'+
    '<div class="full"><label class="l">Tipo de entrevista</label><select id="aE" onchange="durDef()">'+[['screening','Screening'],['competencias','Competencias'],['pami2','Entrevista técnica']].map(function(o){return '<option value="'+o[0]+'"'+(o[0]===def?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></div>'+
    '<div><label class="l">Fecha</label><input type="date" id="aF" value="'+man+'"></div><div><label class="l">Hora</label><input type="time" id="aH" value="10:00"></div>'+
    '<div><label class="l">Duración (min)</label><input type="number" id="aD" min="10" max="240" step="5"></div><div><label class="l">Lugar / link</label><input type="text" id="aL" placeholder="Meet, Policlínico…"></div>'+
    '<div class="full"><label class="l">Nota para el evento (opcional)</label><input type="text" id="aN"></div></div>'+
    '<div class="btns"><button class="btn ok" id="aB" onclick="crearCita('+f+',false)">Agendar</button><button class="btn sec" onclick="abrir('+f+')">Cancelar</button></div></div>';
  durDef();
}
function durDef(){document.getElementById('aD').value=D.cfg.duraciones[document.getElementById('aE').value]||30;}
function crearCita(f,forzar){
  var o={etapa:document.getElementById('aE').value,fecha:document.getElementById('aF').value,hora:document.getElementById('aH').value,duracion:document.getElementById('aD').value,lugar:document.getElementById('aL').value,nota:document.getElementById('aN').value,forzar:forzar};
  if(!o.fecha||!o.hora){alert('Elegí fecha y hora');return;}
  var b=document.getElementById('aB');b.textContent='Agendando…';b.disabled=true;
  gs().withSuccessHandler(function(r){
    if(!r.ok){b.textContent='Agendar';b.disabled=false;if(confirm('Ya hay algo en ese horario: '+r.conflicto+'\n¿Agendar igual?'))crearCita(f,true);return;}
    toast('Agendado');cargar();
    if(r.url&&confirm('Cita agendada. ¿Mandar la confirmación por WhatsApp?'))window.open(r.url,'_blank');
    setTimeout(function(){abrir(f);},600);
  }).withFailureHandler(function(e){b.textContent='Agendar';b.disabled=false;fer(e);}).agendarCita(K,f,o);
}

function sindCfg(){var sl=[];D.busquedas.forEach(function(b){var r=defRec(b.id);Object.keys(r||{}).forEach(function(k){if(/^sindicato/i.test(k))(r[k]||[]).forEach(function(x){if(sl.indexOf(x)===-1)sl.push(x);});});});return sl;}
function sindDe(c){return /^sindicato/i.test(c.recTipo||'')?String(c.recPor||'').split(';').map(function(x){return x.trim();}).filter(Boolean):[];}
function catOf(c){
  if(/^Descartad/i.test(c.estado))return 'd';
  if(/reserva/i.test(c.estado))return 'r';
  for(var i=0;i<D.estadosCol.length;i++)if(D.estadosCol[i][1].indexOf(c.estado)>-1)return i===0?'p':(D.estadosCol[i][0]==='Contratado'?'c':'a');
  return 'p';
}
function sindOk(c){
  var g=document.getElementById('fsi').value;if(!g)return true;
  var l=sindDe(c).map(function(x){return x.toLowerCase();});
  return g==='-'?!l.length:(g==='*'?l.length>0:l.indexOf(g.toLowerCase())>-1);
}
function sindClick(v){
  var s=document.getElementById('fsi');
  if(v!==''&&v!=='-'&&!Array.prototype.some.call(s.options,function(o){return o.value.toLowerCase()===v.toLowerCase();})){var o=document.createElement('option');o.textContent=v;s.appendChild(o);}
  var act=Array.prototype.find.call(s.options,function(o){return o.value.toLowerCase()===v.toLowerCase();});
  s.value=(s.value&&act&&s.value===act.value)?'':(act?act.value:'');
  render();perfilBtn();
}
function sindBar(){
  var el=document.getElementById('sindBar');if(!el)return;
  SKIPSI=true;var base=D.cands.filter(filtra);SKIPSI=false;
  var filas={},orden=[];
  var fila=function(n){var k=n.toLowerCase();if(!filas[k]){filas[k]={n:n,v:n,a:0,d:0,c:0,r:0,p:0,t:0};orden.push(k);}return filas[k];};
  sindCfg().forEach(fila);
  var sin={n:'Sin sindicato',v:'-',a:0,d:0,c:0,r:0,p:0,t:0};
  var cuenta=function(o,c){o[catOf(c)]++;o.t++;};
  base.forEach(function(c){var l=sindDe(c);if(l.length)l.forEach(function(n){cuenta(fila(n),c);});else cuenta(sin,c);});
  if(!orden.length&&!sin.t){el.innerHTML='';return;}
  orden.sort(function(a,b){return filas[b].t-filas[a].t||filas[a].n.localeCompare(filas[b].n);});
  var act=document.getElementById('fsi').value.toLowerCase();
  var card=function(o,gris){
    var w=function(n){return o.t?(n*100/o.t):0;},on=act&&act===o.v.toLowerCase();
    var num=function(n,col,txt,tx){return '<span class="'+(n?'':'z0')+'" style="'+(n?'color:'+tx:'')+'" title="'+n+' '+txt+'"><i style="background:'+col+'"></i>'+n+'</span>';};
    return '<div class="sc'+(gris?' gr':'')+(on?' on':'')+(o.t?'':' z')+'" onclick="sindClick(\''+esc(o.v).replace(/'/g,"\\'")+'\')" title="'+(on?'Quitar filtro':'Ver estos candidatos')+'">'+
      '<div class="t"><span class="n">'+esc(o.n)+'</span><span class="tot">'+o.t+'</span></div>'+
      '<div class="bar" title="'+o.p+' todavía en análisis de CV"><i style="width:'+w(o.a)+'%;background:#034EA2"></i><i style="width:'+w(o.c)+'%;background:#1E8E5A"></i><i style="width:'+w(o.r)+'%;background:#E0A800"></i><i style="width:'+w(o.d)+'%;background:#D9534F"></i></div>'+
      '<div class="lgd">'+num(o.a,'#034EA2','avanzaron','#034EA2')+num(o.c,'#1E8E5A','contratados','#14764A')+num(o.r,'#E0A800','en reserva','#8A6D00')+num(o.d,'#D9534F','descartados','#C0392B')+'</div></div>';
  };
  el.innerHTML='<div class="sl"><b class="st">Por sindicato</b><span class="lgx"><span><i style="background:#034EA2"></i>avanzaron</span><span><i style="background:#1E8E5A"></i>contratados</span><span><i style="background:#E0A800"></i>en reserva</span><span><i style="background:#D9534F"></i>descartados</span></span></div>'+orden.map(function(k){return card(filas[k]);}).join('')+card(sin,true);
}
var AG=null,AGF='';
function polAg(f){var c=byFila(f);return c?c.policlinico:'';}
function badgePol(p){
  if(!p)return '<span style="background:#E4E9F1;color:#5D6B82;border-radius:3px;padding:2px 8px;font-size:12px;font-weight:800">Sin asignar</span>';
  return '<span style="background:'+(D.policlinicos.indexOf(p)?'#00A3E0':'#034EA2')+';color:#fff;border-radius:3px;padding:2px 8px;font-size:12px;font-weight:800">'+esc(p.replace('Policlínico ',''))+'</span>';
}
function agOk(p,f){return !f||p===f;}
function agFiltro(f){AGF=f;pintarAgenda();}
function pintarAgenda(){
  var e=document.getElementById('agl');if(!e||!AG)return;
  var f=AGF,h='',dia='',hoy=D.ahora.slice(0,10);
  var bt=document.getElementById('agB');
  if(bt)bt.innerHTML=[['','Todos']].concat(D.policlinicos.map(function(p){return [p,p.replace('Policlínico ','')];})).map(function(x,i){
    var n=AG.citas.filter(function(a){return agOk(polAg(a.fila),x[0]);}).length,on=f===x[0],col=i===2?'#00A3E0':'#034EA2';
    return '<button type="button" onclick="agFiltro(\''+x[0]+'\')" style="flex:1;min-width:90px;border:2px solid '+col+';border-radius:6px;padding:8px 6px;font-size:15px;font-weight:800;cursor:pointer;font-family:var(--font);background:'+(on?col:'#fff')+';color:'+(on?'#fff':col)+'">'+esc(x[1])+' · '+n+'</button>';
  }).join('');
  var l=AG.citas.filter(function(a){return agOk(polAg(a.fila),f);});
  if(!l.length)h+='<div class="loading" style="padding:20px">No hay citas próximas'+(f?' en '+esc(f.replace('Policlínico ','')):' de candidatos cargados')+'.</div>';
  h+=l.map(function(a){
    var d=a.ts.slice(8,10)+'/'+a.ts.slice(5,7)+'/'+a.ts.slice(0,4),x='';
    if(d!==dia){dia=d;x='<div class="sec">'+d+(a.ts.slice(0,10)===hoy?' · HOY':'')+'</div>';}
    return x+'<div class="row" style="cursor:pointer'+(a.desfase?';background:#FFF9EC':'')+'" onclick="abrir('+a.fila+')"><span class="l" style="width:60px">'+a.ts.slice(11,16)+'</span><span class="v">'+badgePol(polAg(a.fila))+' <b>'+esc(a.nombre)+'</b> · '+esc(a.tipo)+(citaHecha(byFila(a.fila)||{},a.tipo)?' <span style="background:#E4E9F1;color:#4A5B75;border-radius:3px;padding:1px 7px;font-size:11px;font-weight:800">✓ hecho</span>':'')+' <small style="color:#5D6B82">'+esc(tit(a.busq))+'</small>'+(a.desfase?' <span style="background:#FFF1D6;color:#7A5200;border:1px solid #F2B705;border-radius:3px;padding:1px 7px;font-size:11px;font-weight:800" title="Reservó en el calendario de otro policlínico que el asignado">⚠ reservó en '+esc(a.origen.replace('Policlínico ',''))+'</span>':'')+'</span></div>';
  }).join('');
  var pend=D.cands.filter(function(c){return kpiOk('ctc',c)&&agOk(c.policlinico,f);}).map(function(c){var m=String(c.contactado).match(/^(.*?)\s*·\s*(\d{2})\/(\d{2})\/(\d{4})/);return {c:c,etq:m?m[1]:'',d:m?new Date(m[4],m[3]-1,m[2]):null};}).sort(function(a,b){return (a.d||0)-(b.d||0);});
  if(pend.length)h+='<div class="sec" style="color:#B58900">Contactados · todavía sin agendar ('+pend.length+')</div>'+pend.map(function(x){var dias=x.d?Math.max(0,Math.floor((new Date(D.ahora)-x.d)/86400000)):null;return '<div class="row" style="cursor:pointer" onclick="abrir('+x.c.fila+')"><span class="l" style="width:70px">'+(dias==null?'':(dias===0?'hoy':'hace '+dias+' d'))+'</span><span class="v">'+badgePol(x.c.policlinico)+' <b>'+esc(x.c.nombre)+'</b> · para '+esc(x.etq)+' <small style="color:#5D6B82">'+esc(tit(x.c.busq))+'</small></span></div>';}).join('');
  var sa=AG.sinAsignar.filter(function(a){return agOk(a.poli||'',f);});
  if(sa.length)h+='<div class="sec" style="color:#D9534F">Turnos del calendario sin candidato asociado</div><div class="txt" style="color:#5D6B82;margin-bottom:6px">Alguien reservó pero su nombre o mail no coincide con ningún candidato cargado. Revisalos a mano.</div>'+sa.map(function(a){return '<div class="row"><span class="l" style="width:110px">'+esc(a.ts.slice(8,10)+'/'+a.ts.slice(5,7)+' '+a.ts.slice(11,16))+'</span><span class="v">'+badgePol(a.poli||'')+' '+esc(a.titulo)+(a.invitados?' <small style="color:#5D6B82">'+esc(a.invitados)+'</small>':'')+'</span></div>';}).join('');
  e.innerHTML=h;
}
function exportarAgenda(){
  if(!AG)return;
  var q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';};
  var filas=[['Fecha','Hora','Tipo','Candidato','Teléfono','Policlínico','Búsqueda','Entrevistó'].map(q).join(';')];
  AG.citas.forEach(function(a){
    var p=polAg(a.fila);if(!agOk(p,AGF))return;
    var c=byFila(a.fila)||{};
    filas.push([a.ts.slice(8,10)+'/'+a.ts.slice(5,7)+'/'+a.ts.slice(0,4),a.ts.slice(11,16),a.tipo,a.nombre,a.tel,p||'Sin asignar',tit(a.busq),c.entrev||''].map(q).join(';'));
  });
  var csv='﻿'+filas.join('\r\n');
  try{
    var u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');
    a.href=u;a.download='Agenda_PAMI_'+(AGF?AGF.replace('Policlínico ','').replace(' ','')+'_':'')+D.ahora.slice(0,10)+'.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);
    toast('Agenda exportada ('+(filas.length-1)+' citas)');
  }catch(x){window.open('data:text/csv;charset=utf-8,'+encodeURIComponent(csv),'_blank');}
}
function verAgenda(){
  AGF='';
  document.getElementById('mbox').innerHTML='<div class="hd"><div><h2>Agenda de citas</h2><small>Próximas entrevistas (incluye las que reservan los candidatos en la agenda de Calendar)</small></div><button class="x" onclick="cerrar()">×</button></div><div class="bd" id="ag"><div class="loading">Cargando…</div></div>';
  document.getElementById('modal').classList.add('show');
  gs().withSuccessHandler(function(r){
    var e=document.getElementById('ag');if(!e)return;
    AG=r;
    e.innerHTML=(r.avisos&&r.avisos.length?'<div style="background:#FDE3E1;border:1px solid #D9534F;color:#8B2E2B;border-radius:6px;padding:10px 12px;margin-bottom:10px;font-size:13px;font-weight:600">⚠ '+r.avisos.map(esc).join('<br>⚠ ')+'</div>':'')+'<div id="agB" style="display:flex;gap:8px;margin-bottom:6px"></div><div style="margin-bottom:8px"><button class="btn" onclick="exportarAgenda()">⬇ Exportar a Excel</button></div><div id="agl"></div>';
    pintarAgenda();
  }).withFailureHandler(fer).getAgenda(K);
}

function descartes(){
  var b=document.getElementById('fb').value;
  document.getElementById('mbox').innerHTML='<div class="hd"><div><h2>Mails de descarte</h2><small>'+esc(b?tit(b):'Todas las búsquedas')+'</small></div><button class="x" onclick="cerrar()">×</button></div><div class="bd" id="ds"><div class="loading">Calculando…</div></div>';
  document.getElementById('modal').classList.add('show');
  gs().withSuccessHandler(function(p){
    var e=document.getElementById('ds');if(!e)return;
    if(!p.sin&&!p.post){e.innerHTML='<div class="loading">No hay descartes pendientes de mail.'+(p.sinMail?' ('+p.sinMail+' sin mail válido)':'')+'</div>';return;}
    e.innerHTML='<div class="txt" style="margin:14px 0">Se van a enviar <b>'+(p.sin+p.post)+'</b> mails. Sin screening: <b>'+p.sin+'</b> · Post screening: <b>'+p.post+'</b>'+(p.sinMail?' · Sin mail válido: '+p.sinMail:'')+'.<br><span style="color:#5D6B82">[NOMBRE], [PUESTO], [EMPRESA] y [FIRMA] se completan solos. Podés editar los textos.</span></div>'+
      '<label class="l">Sin screening</label><textarea id="tS" rows="7">'+esc(p.textoSin)+'</textarea><label class="l" style="margin-top:10px">Post screening</label><textarea id="tP" rows="7">'+esc(p.textoPost)+'</textarea>'+
      '<div class="btns"><button class="btn red" onclick="enviarDesc(this)">Enviar descartes</button><button class="btn sec" onclick="cerrar()">Cancelar</button></div>';
  }).withFailureHandler(fer).previaDescartes(K,b);
}
function enviarDesc(btn){
  if(!confirm('¿Confirmás el envío? No se puede deshacer.'))return;
  btn.textContent='Enviando…';btn.disabled=true;
  gs().withSuccessHandler(function(r){alert('Enviados: '+r.enviados+(r.sinMail?' · Sin mail válido: '+r.sinMail:'')+(r.pendientes?' · Quedan '+r.pendientes+' (se envían de a 40 por vez)':''));cerrar();cargar();}).withFailureHandler(function(e){btn.disabled=false;btn.textContent='Enviar descartes';fer(e);}).enviarDescartesMasivo(K,document.getElementById('fb').value,document.getElementById('tS').value,document.getElementById('tP').value);
}
</script>
