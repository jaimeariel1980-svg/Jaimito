function pretVals(v){
  var out=[];(String(v==null?'':v).match(/\d[\d.,]*\d|\d/g)||[]).forEach(function(x){
    var t=x,dot=t.indexOf('.')>-1,com=t.indexOf(',')>-1;
    if(dot&&com){t=t.lastIndexOf('.')>t.lastIndexOf(',')?t.replace(/,/g,''):t.replace(/\./g,'').replace(',','.');}
    else if(com){var a=t.split(',');t=(a.length===2&&a[1].length<=2)?a[0]+'.'+a[1]:t.replace(/,/g,'');}
    else if(dot){var b=t.split('.');t=(b.length===2&&b[1].length!==3)?t:t.replace(/\./g,'');}
    var n=parseFloat(t);if(isFinite(n))out.push(n);
  });

}

    if(!ci&&/agendad/i.test(c.estado)){
      var tp=/^Screening/i.test(c.estado)?'Screening':/^Competencias/i.test(c.estado)?'Competencias':'Entrevista técnica',
          ev=String(c.entrevistas||'').split('\n').filter(function(l){return l.indexOf(tp)===0;})[0],mm=ev&&ev.match(/(\d{2})\/(\d{2})\/(\d{4}) (\d{2}:\d{2})/);
      if(mm)ci={tipo:tp,ts:mm[3]+'-'+mm[2]+'-'+mm[1]+' '+mm[4]};
      else p('sinfecha','📅','Figura agendado para '+tp+' pero no está en el calendario (se canceló o no se creó)');
    }
    if(ci&&!citaHecha(c,ci.tipo)){
      var t=avTs(ci.ts);
      if(t>=now-15*6e4&&t-now<=30*6e4)p('pronto','⏰',ci.tipo+' a las '+ci.ts.slice(11,16)+(t<now?' (ya empezó)':' (en '+Math.max(1,Math.round((t-now)/6e4))+' min)'),true);
      else if(t<now-60*6e4)p('sincargar','📝',ci.tipo+' del '+avHora(ci.ts)+' ya pasó y falta cargar el formulario',true);
    }
    etapasFaltan(c).forEach(function(e){p('falta'+e,'⚠','Falta la etapa de '+e+' (no tiene nota cargada)');});
    if(etapaIdx(c)===3&&!c.fichaOk&&!c.notaP2)p('resumen','🩺','Falta el resumen del proceso para la entrevista técnica');
    if(/reserva/i.test(c.estado)&&dias(c)>=15)p('reserva','🗂','En reserva hace '+dias(c)+' días');
  });
  out.sort(function(a,b){return b.urg-a.urg;});
  return out;
}
function avNovedades(){
  var prev=avLS('snap'),snap={},nov=[],cuando=D.ahora.slice(8,10)+'/'+D.ahora.slice(5,7)+' '+D.ahora.slice(11,16);
  D.cands.forEach(function(c){
    var s={e:c.estado,t:String(c.notaP2||''),d:c.docs?1:0,c:c.cita?c.cita.ts:''};snap[c.id]=s;
    if(!prev)return;
    var a=prev[c.id],p=function(ic,txt){nov.push({ic:ic,txt:txt,f:c.fila,id:c.id,n:c.nombre,h:cuando,po:avPoli(c)});};
    if(!a){p('🆕','Nuevo CV recibido'+(c.busq?' · '+tit(c.busq):''));return;}
    if(s.e!==a.e&&s.e==='Contratado')p('🎉','Contratado/a');
    else if(s.e!==a.e&&s.e==='Descartado en entrevista técnica')p('❌','Descartado/a en la entrevista técnica'+(c.motivo?' · '+c.motivo:''));
    else if(s.t&&s.t!==a.t)p('🩺','Entrevista técnica cargada · nota '+s.t);
    else if(s.e!==a.e)p('🔄','Pasó a «'+s.e+'»'+(a.e?' (antes: '+a.e+')':''));
    if(s.c&&s.c!==a.c&&c.cita)p('📅','Agendó '+c.cita.tipo+' para el '+avHora(c.cita.ts));
    if(s.d&&!a.d)p('📁','Documentación recibida');
  });
  avLS('snap',snap);
  return nov;
}
function avTags(c){
  var out=[],now=avAhora(),ep=etapaPend(c),md=String(c.contactado||'').match(/(\d{2})\/(\d{2})\/(\d{4})$/);
  if(ep&&etqContacto(c)===ep&&!c.cita&&md){var dd=Math.floor((now-new Date(+md[3],+md[2]-1,+md[1]).getTime())/864e5);if(dd>=2)out.push('<span class="tag r">⏳ Sin respuesta hace '+dd+' d</span>');}
  if(c.cita&&!citaHecha(c)&&avTs(c.cita.ts)<now-60*6e4)out.push('<span class="tag r">📝 Falta cargar '+esc(c.cita.tipo)+'</span>');
  return out;
}
function avOk(x){var id=x.id||String(x.k||'').split('|')[1];if(!id)return true;var c=D.cands.find(function(y){return y.id===id;});return !c||filtra(c);}
function avRevisar(){
  if(!D||D.tecnica)return;
  AV_PEND=avPendientes().filter(avOk);
  var nuevas=avNovedades(),hist=avLS('nov')||[];
  if(nuevas.length){hist=nuevas.concat(hist).slice(0,80);avLS('nov',hist);avLS('sinver',(avLS('sinver')||0)+nuevas.filter(avOk).length);}
  AV_NOV=hist;
  var avisados=avLS('urg')||{},hoy=D.ahora.slice(0,10),pop=nuevas.filter(avOk),vistos=avLS('pseen'),act={};
  AV_PEND.forEach(function(x){
    act[x.k]=1;
    if(x.urg&&avisados[x.k]!==hoy){avisados[x.k]=hoy;pop.push(x);}
    else if(vistos&&!vistos[x.k])pop.push(x);
  });
  avLS('urg',avisados);avLS('pseen',act);
  try{if(!sessionStorage.getItem('pami_av_ses')&&AV_PEND.length){sessionStorage.setItem('pami_av_ses','1');var nu=AV_PEND.filter(function(x){return x.urg;}).length;pop.unshift({ic:'🔔',n:'Tenés '+AV_PEND.length+' pendiente'+(AV_PEND.length===1?'':'s'),txt:(nu?nu+' urgente'+(nu===1?'':'s')+' · ':'')+'tocá para ver la lista',panel:1,urg:nu>0});}}catch(e){}
  avPintarCampana();
  if(pop.length)avPopups(pop);
}
function avPintarCampana(){
  var b=document.getElementById('avCnt');if(!b)return;
  var n=AV_PEND.filter(function(x){return x.urg;}).length+(avLS('sinver')||0);
  b.textContent=n||'';b.style.display=n?'':'none';
}
function avBoton(){var c=document.getElementById('avPop'),bt=document.getElementById('avCerrarTodos');if(c&&bt&&c.children.length<=2)bt.remove();}
function avPopups(L){
  var cont=document.getElementById('avPop');
  if(!cont){cont=document.createElement('div');cont.id='avPop';cont.style.cssText='position:fixed;top:70px;right:16px;z-index:9998;display:flex;flex-direction:column;gap:8px;max-width:360px;width:calc(100% - 32px)';document.body.appendChild(cont);}
  L.slice(0,6).forEach(function(x){
    var d=document.createElement('div');
    d.style.cssText='background:#fff;border-left:6px solid '+(x.urg?'#D9534F':'#034EA2')+';border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.25);padding:12px 14px;font-size:14px;cursor:pointer';
    d.innerHTML='<div style="display:flex;gap:8px;align-items:flex-start"><span style="font-size:18px">'+x.ic+'</span><div style="flex:1"><b>'+esc(x.n)+'</b>'+(x.panel?'':avChip(x))+'<div style="color:#3F4B66">'+esc(x.txt)+'</div></div><span style="color:#999;font-size:18px" title="Cerrar">×</span></div>';
    d.onclick=function(ev){d.remove();var bt=document.getElementById('avCerrarTodos');if(bt&&cont.children.length<=2)bt.remove();if(ev.target.title==='Cerrar')return;if(x.panel)verAvisos();else if(x.f)abrir(x.f);};
    cont.appendChild(d);
    setTimeout(function(){if(d.parentNode){d.remove();avBoton();}},60000);
  });
  if(L.length>6){var m=document.createElement('div');m.style.cssText='background:#034EA2;color:#fff;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer';m.textContent='y '+(L.length-6)+' avisos más · ver todos';m.onclick=function(){m.remove();verAvisos();};cont.appendChild(m);setTimeout(function(){if(m.parentNode){m.remove();avBoton();}},60000);}
  if(cont.children.length>1&&!document.getElementById('avCerrarTodos')){var ct=document.createElement('button');ct.id='avCerrarTodos';ct.textContent='Cerrar todos los avisos';ct.style.cssText='align-self:flex-end;background:#192341;color:#fff;border:0;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer';ct.onclick=function(){cont.innerHTML='';};cont.insertBefore(ct,cont.firstChild);}
  try{if(window.Notification&&Notification.permission==='granted'&&document.hidden)L.slice(0,3).forEach(function(x){new Notification(x.n+(x.po?' · '+x.po.t:''),{body:x.ic+' '+x.txt});});}catch(e){}
  try{if(document.hidden)document.title='('+L.length+') Avisos · Reclutamiento y Selección';}catch(e){}
}
function avPermiso(){
  var fin=function(){if(window.Notification&&Notification.permission==='granted'){verAvisos();return;}alert(Notification&&Notification.permission==='denied'?'El navegador tiene bloqueados los avisos para esta página. Tocá el candado de la barra de direcciones → Notificaciones → Permitir, y volvé a probar.':'Tu navegador no deja pedir el permiso desde esta pantalla (es una limitación de Google dentro de Apps Script). Los avisos emergentes y la campanita 🔔 siguen funcionando con la pestaña abierta.');};
  try{var r=Notification.requestPermission(fin);if(r&&r.then)r.then(fin,fin);}catch(e){fin();}
}
function verAvisos(){
  AV_PEND=avPendientes().filter(avOk);var NOVF=AV_NOV.filter(avOk);
  avLS('sinver',0);avPintarCampana();
  var item=function(x,nov){return '<div onclick="cerrar();abrir('+x.f+')" style="display:flex;gap:10px;padding:9px 6px;border-top:1px solid var(--line);cursor:pointer'+(x.urg?';background:#FDECEC':'')+'"><span style="font-size:17px">'+x.ic+'</span><div style="flex:1"><b>'+esc(x.n)+'</b>'+avChip(x)+'<div style="font-size:13px;color:#3F4B66">'+esc(x.txt)+'</div></div>'+(nov?'<small style="color:#888;white-space:nowrap">'+esc(x.h)+'</small>':'')+'</div>';};
  var perm=window.Notification&&Notification.permission!=='granted'?'<button class="btn ghost" style="margin-bottom:10px" onclick="avPermiso()">🔔 Activar avisos del navegador (también con la pestaña minimizada)</button>':'';
  document.getElementById('mbox').innerHTML='<div class="hd"><div><h2>🔔 Avisos</h2><small>Se actualiza solo cada 3 minutos</small></div><button class="x" onclick="cerrar()">×</button></div><div class="bd">'+perm+
    '<div style="font-weight:800;color:#B02A25;margin:6px 0">Pendientes ('+AV_PEND.length+')</div>'+(AV_PEND.length?AV_PEND.map(function(x){return item(x,false);}).join(''):'<div class="txt" style="color:#5D6B82">No hay pendientes.</div>')+
    '<div style="font-weight:800;color:#034EA2;margin:16px 0 6px">Novedades</div>'+(NOVF.length?NOVF.slice(0,40).map(function(x){return item(x,true);}).join(''):'<div class="txt" style="color:#5D6B82">Sin novedades todavía. Aparecen desde la próxima actualización: nuevos CV, contratados, descartados en la técnica, técnicas cargadas y documentación recibida.</div>')+'</div>';
  document.getElementById('modal').classList.add('show');
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)try{document.title='Reclutamiento y Selección';}catch(e){}});
</script>
