<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base target="_top">
<title>Tablero · <?= sitio ?></title>
<style>
:root{--c:<?!= color ?>;--bg:#F1F4F8;--line:#D9DEE5;--txt:#1B2430;--mut:#5C6777}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{background:var(--c);color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header h1{font-size:17px;font-weight:800}
header select,header input{padding:8px 10px;border:none;border-radius:6px;font-family:inherit;font-size:13px}
header .n{margin-left:auto;font-size:12px;opacity:.85}
#board{display:flex;gap:12px;padding:14px;overflow-x:auto;align-items:flex-start;min-height:80vh}
.col{background:#E6EBF2;border-radius:10px;min-width:250px;width:250px;flex-shrink:0;padding:8px}
.col h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:4px 6px 8px;display:flex;justify-content:space-between}
.col.over{outline:2px dashed var(--c)}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--c)}
.card .top{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.card b{font-size:14px}
.card .sub{font-size:12px;color:var(--mut);margin-top:3px}
.badge{min-width:26px;text-align:center;border-radius:5px;padding:2px 7px;font-weight:800;font-size:12px;color:#fff;background:#9AA3AF;flex-shrink:0}
.nA{background:#1E8E5A}.nBp{background:#74B98F;color:#102a1c}.nB{background:#E0A526}.nC{background:#D9534F}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;background:#EEF2F7;border-radius:4px;padding:1px 6px;color:var(--mut)}
.tag.w{background:#FFF1D6;color:#8A5A00}
#modal{display:none;position:fixed;inset:0;background:rgba(15,23,32,.55);z-index:50;overflow:auto;padding:20px 10px}
#modal.show{display:block}
.box{background:#fff;max-width:640px;margin:0 auto;border-radius:12px;padding:20px 22px}
.box h2{font-size:20px;margin-right:30px}
.x{float:right;border:none;background:none;font-size:24px;cursor:pointer;color:var(--mut)}
.row{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid #EEF1F5;font-size:13px}
.row .l{width:120px;color:var(--mut);flex-shrink:0;font-weight:700}
.row .v{flex:1;word-break:break-word}
.sec{margin-top:14px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--c);margin-bottom:6px}
.txt{white-space:pre-line;font-size:13px;line-height:1.5}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.b{padding:8px 14px;border-radius:7px;border:none;background:var(--c);color:#fff;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none;font-family:inherit}
.b.g{background:#EEF2F7;color:var(--txt)}.b.wa{background:#25D366}.b.s{background:#1E8E5A;padding:10px 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{display:block;font-size:11px;font-weight:800;color:var(--mut);margin-bottom:3px;text-transform:uppercase}
.f select,.f input,.f textarea{width:100%;padding:8px;border:1.5px solid var(--line);border-radius:7px;font-family:inherit;font-size:13px}
#toast{position:fixed;bottom:20px;right:20px;background:#1B2430;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;z-index:99}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1><?= sitio ?> · Tablero</h1>
  <select id="fb"></select>
  <input id="fq" placeholder="Buscar nombre, DNI, localidad…">
  <span class="n" id="cnt"></span>
</header>
<div id="board"><div style="padding:40px;color:#5C6777">Cargando…</div></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast">Guardado</div>
<script>
var K = <?!= JSON.stringify(clave) ?>;
var D = null;var CUR = 0;
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function cls(n){return n==='A'?'nA':n==='B+'?'nBp':n==='B'?'nB':n==='C'?'nC':'';}
function tit(id){var b=D.busquedas.find(function(x){return x.id===id;});return b?b.titulo:id;}
function toast(m){var t=document.getElementById('toast');t.textContent=m||'Guardado';t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1600);}

google.script.run.withSuccessHandler(function(j){D=JSON.parse(j);init();})
  .withFailureHandler(function(e){document.getElementById('board').innerHTML='<div style="padding:40px;color:#C0392B">Error: '+esc(e.message)+'</div>';})
  .getTablero(K);

function init(){
  var fb=document.getElementById('fb');
  fb.innerHTML='<option value="">Todas las búsquedas</option>'+D.busquedas.map(function(b){return '<option value="'+esc(b.id)+'">'+esc(b.titulo)+'</option>';}).join('');
  fb.onchange=render;document.getElementById('fq').oninput=render;
  render();
}

function estadoDe(c){return D.estados.indexOf(c.estado)>-1?c.estado:D.estados[0];}

function render(){
  var b=document.getElementById('fb').value,q=document.getElementById('fq').value.toLowerCase().trim();
  var lista=D.cands.filter(function(c){
    if(b&&c.busq!==b)return false;
    return !q||[c.nombre,c.dni,c.loc,c.email].join(' ').toLowerCase().indexOf(q)>-1;
  });
  document.getElementById('cnt').textContent=lista.length+' candidatos';
  document.getElementById('board').innerHTML=D.estados.map(function(e){
    var cs=lista.filter(function(c){return estadoDe(c)===e;});
    return '<div class="col" data-e="'+esc(e)+'" ondragover="event.preventDefault();this.classList.add(\'over\')" ondragleave="this.classList.remove(\'over\')" ondrop="soltar(event,this)"><h2><span>'+esc(e)+'</span><span>'+cs.length+'</span></h2>'+cs.map(card).join('')+'</div>';
  }).join('');
}

function card(c){
  var tags='';
  if(c.notaScr)tags+='<span class="tag">Scr '+esc(c.notaScr)+'</span>';
  if(c.notaComp)tags+='<span class="tag">Comp '+esc(c.notaComp)+'</span>';
  if(c.recTipo)tags+='<span class="tag">★ '+esc(c.recTipo)+(c.recPor?': '+esc(c.recPor):'')+'</span>';
  if(c.proc&&c.proc!=='SI')tags+='<span class="tag w">'+(c.proc==='Pendiente'?'Analizando…':'Revisar CV')+'</span>';
  return '<div class="card" draggable="true" ondragstart="event.dataTransfer.setData(\'text\',\''+c.fila+'\')" onclick="abrir('+c.fila+')"><div class="top"><b>'+esc(c.nombre)+'</b><span class="badge '+cls(c.ajuste)+'">'+(esc(c.ajuste)||'—')+'</span></div><div class="sub">'+esc(c.loc)+' · '+esc(tit(c.busq))+'</div>'+(tags?'<div class="tags">'+tags+'</div>':'')+'</div>';
}

function soltar(ev,col){
  var estado=col.dataset.e;
  ev.preventDefault();col.classList.remove('over');
  var f=Number(ev.dataTransfer.getData('text'));
  var c=D.cands.find(function(x){return x.fila===f;});
  if(!c||estadoDe(c)===estado)return;
  var prev=c.estado;c.estado=estado;render();
  google.script.run.withSuccessHandler(function(){toast('Movido a '+estado);})
    .withFailureHandler(function(e){c.estado=prev;render();alert('Error: '+e.message);})
    .guardarCandidato(K,f,{estado:estado});
}

function tel(t){
  var d=String(t).replace(/\D/g,'');
  if(d.indexOf('54')===0)d=d.slice(2);
  d=d.replace(/^0+/,'');
  if(d.charAt(0)==='9'&&d.length>=11)d=d.slice(1);
  return '549'+d;
}
function row(l,v){return v?'<div class="row"><span class="l">'+l+'</span><span class="v">'+esc(v)+'</span></div>':'';}
function opts(arr,sel,vacio){return (vacio?'<option value="">'+vacio+'</option>':'')+arr.map(function(o){return '<option'+(o===sel?' selected':'')+'>'+esc(o)+'</option>';}).join('');}
function defRec(busq){
  var b=D.busquedas.find(function(x){return x.id===busq;});
  var out={};var def=b&&b.recomendacion?String(b.recomendacion).trim():'';
  if(!def)return null;
  def.split('|').forEach(function(s){var p=s.split(':');var n=p[0].trim();if(n)out[n]=p[1]?p[1].split(';').map(function(x){return x.trim();}).filter(Boolean):null;});
  return out;
}

function abrir(f){
  CUR=f;
  var c=D.cands.find(function(x){return x.fila===f;});
  var rec=defRec(c.busq);
  var recHtml='';
  if(rec){
    recHtml='<div class="f"><label>Recomendado por</label><select id="rcT" onchange="rcVer()">'+opts(Object.keys(rec),c.recTipo,'— Nadie —')+'</select></div>'+
      '<div class="f"><label>&nbsp;</label><select id="rcS" style="display:none"></select><input id="rcN" placeholder="Nombre y apellido" style="display:none" value="'+esc(c.recPor)+'"></div>';
  }
  var resp=c.resp.length?'<div class="sec">Respuestas del formulario</div>'+c.resp.map(function(r){return '<div class="row"><span class="l" style="width:55%">'+esc(r.q)+'</span><span class="v">'+esc(r.a)+'</span></div>';}).join(''):'';
  document.getElementById('mbox').innerHTML=
    '<button class="x" onclick="cerrar()">×</button><h2>'+esc(c.nombre)+' <span class="badge '+cls(c.ajuste)+'" style="vertical-align:middle">'+(esc(c.ajuste)||'—')+'</span></h2>'+
    '<div style="color:#5C6777;margin:2px 0 10px">'+esc(tit(c.busq))+'</div>'+
    row('Recibido',c.fecha)+row('Llegó por',c.fuente)+row('Localidad',c.loc)+row('Teléfono',c.tel)+row('DNI',c.dni)+row('Email',c.email)+row('Pretensión',c.pret)+
    (c.just?'<div class="sec">Análisis del CV</div><div class="txt"><b>'+esc(c.just)+'</b></div>':'')+
    (c.resumen?'<div class="txt" style="margin-top:6px">'+esc(c.resumen)+'</div>':'')+
    (c.req?'<div class="txt" style="margin-top:6px;color:#5C6777">'+esc(c.req)+'</div>':'')+resp+
    '<div class="btns">'+(c.cv?'<a class="b g" href="'+esc(c.cv)+'" target="_blank">📄 Ver CV</a>':'')+
    (c.tel?'<a class="b wa" target="_blank" href="https://wa.me/'+tel(c.tel)+'?text='+encodeURIComponent('Hola '+c.nombre.split(' ')[0]+', te escribimos por tu postulación a '+tit(c.busq)+'. ¿Podemos coordinar una breve entrevista?')+'">💬 WhatsApp</a>':'')+
    (c.email?'<a class="b g" target="_blank" href="https://mail.google.com/mail/?view=cm&to='+encodeURIComponent(c.email)+'">✉ Mail</a>':'')+
    (c.proc!=='SI'?'<button class="b g" onclick="rean('+f+',this)">↻ Re-analizar CV</button>':'')+'</div>'+
    '<div class="sec">Gestión</div><div class="grid">'+
    '<div class="f" style="grid-column:1/3"><label>Búsqueda</label><select id="gB">'+(c.busq?'':'<option value="">— Sin asignar —</option>')+D.busquedas.map(function(b){return '<option value="'+esc(b.id)+'"'+(b.id===c.busq?' selected':'')+'>'+esc(b.titulo)+'</option>';}).join('')+'</select></div>'+
    '<div class="f"><label>Estado</label><select id="gE">'+opts(D.estados,estadoDe(c))+'</select></div>'+
    '<div class="f"><label>Entrevistó</label><select id="gN">'+opts(D.entrevistadores,c.entrev,'—')+'</select></div>'+
    '<div class="f"><label>Nota screening</label><select id="gS">'+opts(['A','B+','B','C'],c.notaScr,'—')+'</select></div>'+
    '<div class="f"><label>Nota competencias</label><select id="gC">'+opts(['A','B+','B','C'],c.notaComp,'—')+'</select></div>'+recHtml+'</div>'+
    '<div class="f" style="margin-top:10px"><label>Comentarios</label><textarea id="gM" rows="3">'+esc(c.coment)+'</textarea></div>'+
    '<div class="btns"><button class="b s" id="gb" onclick="guardar('+f+')">Guardar</button></div>';
  document.getElementById('modal').classList.add('show');
  if(rec){
    rcVer(true);
  }
}

function rcVer(inicial){
  var f=D.cands.find(function(x){return x.fila===CUR;});
  var rec=defRec(f.busq),t=document.getElementById('rcT').value,s=document.getElementById('rcS'),n=document.getElementById('rcN');
  var l=rec[t];
  if(l){s.innerHTML=opts(l,inicial===true?f.recPor:'');s.style.display='';n.style.display='none';}
  else{s.style.display='none';n.style.display=t?'':'none';}
}

function guardar(f){
  var c=D.cands.find(function(x){return x.fila===f;});
  var o={busq:document.getElementById('gB').value,estado:document.getElementById('gE').value,entrev:document.getElementById('gN').value,notaScr:document.getElementById('gS').value,notaComp:document.getElementById('gC').value,coment:document.getElementById('gM').value};
  var rec=defRec(c.busq);
  if(rec){
    var t=document.getElementById('rcT').value;
    o.recTipo=t;o.recPor=t?(rec[t]?document.getElementById('rcS').value:document.getElementById('rcN').value.trim()):'';
  }
  var b=document.getElementById('gb');b.textContent='Guardando…';b.disabled=true;
  google.script.run.withSuccessHandler(function(){
    for(var k in o)c[k]=o[k];
    cerrar();render();toast();
  }).withFailureHandler(function(e){b.textContent='Guardar';b.disabled=false;alert('Error: '+e.message);}).guardarCandidato(K,f,o);
}

function rean(f,btn){
  btn.textContent='Analizando…';btn.disabled=true;
  google.script.run.withSuccessHandler(function(){window.top.location.reload();})
    .withFailureHandler(function(e){btn.textContent='↻ Re-analizar CV';btn.disabled=false;alert('Error: '+e.message);}).reanalizar(K,f);
}
function cerrar(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)cerrar();});
</script>
</body>
</html>
