<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablero de propiedades — Azcuénaga</title>
<style>
:root{--azul:#22386a;--acento:#3b6fb5;--beige:#f7f5f0;--linea:#e6e1d6;--texto:#1f2a44;--gris:#6b7280;
--bg:#eaecf1;--card:#fff;--verde:#2e9e5b;--amarillo:#e0a53d;--rojo:#d1495b;--neutro:#9aa0a6;--oro:#c99a2e;--violeta:#7a5cc0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--texto)}
.top{background:linear-gradient(120deg,#1c2f59,#2b4a8b);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px}
.top .chip{background:#fff;border-radius:10px;padding:7px 10px;display:flex}.top .chip img{height:34px;display:block}
.top h1{font-size:17px;font-weight:600;margin:0}.top .sep{width:1px;height:26px;background:rgba(255,255,255,.35)}
.top .dir{margin-left:auto;font-size:12.5px;opacity:.85}
.wrap{padding:16px 20px 40px;max-width:1500px;margin:0 auto}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--linea);border-radius:14px;padding:22px 20px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--acento)}
.kpi.clk{cursor:pointer}.kpi.clk:hover{box-shadow:0 4px 12px rgba(34,56,106,.14)}
.kpi .n{font-size:44px;font-weight:800;color:var(--azul);line-height:1;letter-spacing:-1px}
.kpi .l{font-size:12px;color:var(--gris);text-transform:uppercase;letter-spacing:.6px;margin-top:8px;font-weight:600}
.kpi.g:before{background:var(--verde)}.kpi.a:before{background:var(--amarillo)}.kpi.o:before{background:var(--oro)}.kpi.r:before{background:var(--rojo)}
.kpi .hint{font-size:9.5px;color:var(--acento);margin-top:3px}
.panel{background:var(--card);border:1px solid var(--linea);border-radius:12px;padding:20px 22px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:.8px;color:var(--azul);font-weight:800}
.bar2{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{padding:10px 12px;border:1px solid var(--linea);border-radius:9px;font-size:14px;min-width:210px;background:#fff}
select{padding:9px 11px;border:1px solid var(--linea);border-radius:9px;font-size:13.5px;background:#fff;color:var(--texto)}
.btn{border:none;border-radius:9px;padding:10px 15px;font-size:13.5px;font-weight:600;cursor:pointer}
.btn.p{background:var(--azul);color:#fff}.btn.s{background:#fff;color:var(--azul);border:1px solid var(--azul)}.btn.g{background:var(--verde);color:#fff}
.board{display:flex;gap:12px;align-items:flex-start;padding-bottom:12px}
.col{background:#e4e7ee;border-radius:14px;flex:1 1 0;min-width:0;padding:9px;display:flex;flex-direction:column;max-height:78vh}.col .col-body{flex:1;overflow-y:auto;padding-right:2px}.col .col-body::-webkit-scrollbar{width:5px}.col .col-body::-webkit-scrollbar-thumb{background:rgba(34,56,106,.25);border-radius:4px}
@media(max-width:900px){.board{overflow-x:auto}.col{flex:0 0 85%}}
.col h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:2;background:#e4e7ee;padding:8px 6px;}
.col h2 .n{background:var(--azul);border-radius:20px;padding:3px 14px;font-size:18px;font-weight:800;color:#fff;margin-left:auto}
.col .dot{width:10px;height:10px;border-radius:50%}
.card{background:var(--card);border:1px solid var(--linea);border-radius:13px;margin-bottom:12px;cursor:pointer;transition:.13s;overflow:hidden}
.card:hover{box-shadow:0 6px 16px rgba(34,56,106,.16);transform:translateY(-2px)}
.card.hot{border-color:#f0c4cc}
.card .strip{height:6px}.card .body{padding:16px 17px}
.card .r1{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.idpill{background:var(--beige);border:1px solid var(--linea);border-radius:6px;padding:2px 8px;color:var(--azul);font-weight:700;font-size:12px}
.card .dir{font-weight:800;font-size:19px;line-height:1.18;margin-bottom:7px;color:var(--texto)}
.card .precio{font-size:17px;font-weight:800;color:var(--azul);margin-bottom:11px}
.warn{display:inline-block;font-size:9.5px;font-weight:700;color:var(--rojo);background:#fdecef;border-radius:20px;padding:1px 7px;margin-bottom:7px}
.sem{display:flex;gap:7px;margin-bottom:10px}
.sem .b{flex:1;text-align:center;background:var(--beige);border-radius:9px;padding:9px 2px}
.sem .b .num{font-size:22px;font-weight:800;line-height:1}.sem .b .lab{font-size:8.5px;color:var(--gris);text-transform:uppercase;margin-top:3px}
.health{display:flex;align-items:center;gap:8px}.health .t{flex:1;background:#eef0f4;border-radius:20px;height:7px;overflow:hidden}
.health .f{height:100%;border-radius:20px}.health .p{font-size:11px;font-weight:600;color:var(--gris);width:36px;text-align:right}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:50}
.ov.on{display:flex}
.ficha{background:#fff;border-radius:14px;max-width:680px;width:100%;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.fh{background:linear-gradient(120deg,#1c2f59,#2b4a8b);color:#fff;padding:18px 22px}
.fh .dir{font-size:19px;font-weight:600}.fh .sub{font-size:12.5px;opacity:.85;margin-top:3px}
.fb{padding:20px 22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px;margin-bottom:16px}
.fi .k{color:var(--gris);font-size:11px;text-transform:uppercase;letter-spacing:.4px}.fi .v{font-weight:600;margin-top:2px;font-size:14px}
.est{display:inline-block;font-size:11px;font-weight:600;border-radius:20px;padding:2px 10px}
h3.sec{font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--azul);margin:14px 0 10px;border-bottom:2px solid var(--beige);padding-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--gris);font-weight:600;font-size:11px;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--linea)}
td{padding:7px 8px;border-bottom:1px solid #f1f0ec;vertical-align:top}
.tag{font-size:10.5px;border-radius:5px;padding:1px 6px;background:var(--beige);border:1px solid var(--linea)}
.empty{color:var(--gris);font-size:13px;padding:10px 0}
.acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.x{float:right;cursor:pointer;font-size:24px;line-height:1}
.dl{max-width:560px}.dl .fb{max-height:70vh;overflow:auto}
@media(max-width:560px){.grid{grid-template-columns:1fr}.top .dir{display:none}}
.docsheet{background:#fff;border:1px solid var(--linea);border-radius:8px;padding:24px 28px;font-size:13px;line-height:1.65;color:#222}
.docsheet .dh{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--azul);padding-bottom:10px;margin-bottom:14px}
.docsheet .dh img{height:28px}
.docsheet h2{text-align:center;font-size:15px;letter-spacing:1.5px;margin:10px 0 14px;color:var(--azul)}
.docsheet .sign{display:flex;justify-content:space-between;margin-top:38px;gap:20px}
.docsheet .sign div{flex:1;border-top:1px solid #444;text-align:center;padding-top:6px;font-size:11px;color:var(--gris)}
.repmet{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.repmet .m{background:var(--beige);border:1px solid var(--linea);border-radius:10px;padding:12px;text-align:center}
.repmet .m .n{font-size:22px;font-weight:700;color:var(--azul)}.repmet .m .l{font-size:10px;color:var(--gris);text-transform:uppercase;margin-top:3px}
.dlbtns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{font-size:12px;color:var(--gris);display:flex;flex-direction:column;gap:4px}
.form input,.form select,.form textarea{padding:8px 10px;border:1px solid var(--linea);border-radius:8px;font-size:13px;font-family:inherit}
.docs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:4px 0 6px}
.doc{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 10px;border:1px solid var(--linea);border-radius:8px;background:#fbfaf7}
.doc .ic{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0}
.doc.ok .ic{background:var(--verde)}.doc.no .ic{background:var(--rojo)}
.doc.no{background:#fdecef;border-color:#f2c9d2}
.pap{display:inline-block;font-size:9.5px;font-weight:700;border-radius:20px;padding:1px 7px;margin-bottom:7px}
.pap.v{background:#e6f6ec;color:#1f7a44}.pap.a{background:#fdf3e0;color:#a9781f}.pap.r{background:#fdecef;color:var(--rojo)}
.col.over{outline:2px dashed var(--acento);outline-offset:-3px;background:#dde3ee}
.dlbtn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;margin-left:14px}
.nav{display:flex;gap:8px;margin-bottom:14px}
.tab{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:10px 18px;font-size:14.5px;font-weight:600;color:var(--gris);cursor:pointer}
.tab.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.card.edit{cursor:grab}.card.edit:active{cursor:grabbing}
.donutwrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0}
.donutwrap svg{width:220px;height:220px;flex-shrink:0}
.donutwrap svg path{cursor:pointer;transition:opacity .12s}.donutwrap svg path:hover{opacity:.8}
.donutwrap .ctr{font-weight:800;fill:var(--azul)}
.legbox{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%}
.lbox{border:1px solid var(--linea);border-radius:12px;padding:11px 14px;min-width:118px;cursor:pointer;background:#fff;transition:.12s;text-align:center}
.lbox:hover{border-color:var(--acento)}
.lbox .t{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px;color:var(--gris);font-weight:600;margin-bottom:7px}
.lbox .t .dot{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.lbox .p{font-size:26px;font-weight:800;color:var(--texto);line-height:1;letter-spacing:-.5px}
.lbox .c{font-size:12px;color:var(--gris);margin-top:4px}
.inp{width:100%;padding:7px 10px;border:1px solid var(--linea);border-radius:8px;font-size:14px;font-family:inherit;margin-top:3px;color:var(--texto);background:#fff}
.inp:focus{outline:none;border-color:var(--acento)}
</style></head><body>

  <div class="board" id="board"></div>
  </div>
</div>

function papEstado(pa){if(!pa)return null;var ks=Object.keys(pa);if(!ks.length)return null;const falta=ks.filter(d=>!pa[d]);const crit=["Escritura","Título de propiedad","DNI propietario"];const critFalta=crit.some(d=>ks.indexOf(d)>-1&&!pa[d]);if(falta.length===0)return"ok";if(critFalta&&falta.length>=3)return"no";return"med";}
function propuestaEstado(p){var pr=(p.seg||[]).filter(s=>/propuesta|oferta/i.test(s.res));if(!pr.length)return null;var u=pr[pr.length-1];var last=(''+u.res).toLowerCase();var q=u.cli?(' de '+u.cli):'';if(/rechaz/.test(last))return{cls:'r',txt:'propuesta rechazada'+q};if(/acept/.test(last))return{cls:'v',txt:'propuesta aceptada'+q};return{cls:'a',txt:'propuesta'+(u.cli?' de '+u.cli:' recibida')};}

function priceNum(s){if(!s)return -1;const n=parseInt((''+s).replace(/[^0-9]/g,''));return isNaN(n)?-1:n;}

function sortIt(arr){

function kpi(n,l,c,dr){return '<div class="kpi '+c+' '+(dr?'clk':'')+'" '+(dr?'onclick="drill(\''+dr+'\')"':'')+'><div class="n">'+n+'</div><div class="l">'+l+'</div>'+(dr?'<div class="hint">ver detalle</div>':'')+'</div>';}
function donutPanel(segs,total,centerLabel,centerNum){
  const tot=segs.reduce((s,x)=>s+x.v,0)||1;const cx=70,cy=70,R=63,r=44;let a=-Math.PI/2;let paths='';
  const nz=segs.filter(z=>z.v>0).length;
  segs.forEach(s=>{if(s.v<=0)return;const frac=s.v/tot;let a2=a+frac*2*Math.PI;if(nz===1)a2=a+2*Math.PI-0.0001;
    const x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
    const xi1=cx+r*Math.cos(a),yi1=cy+r*Math.sin(a),xi2=cx+r*Math.cos(a2),yi2=cy+r*Math.sin(a2);
    const lg=frac>0.5?1:0;
    paths+='<path d="M'+x1.toFixed(2)+' '+y1.toFixed(2)+' A'+R+' '+R+' 0 '+lg+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+' L'+xi2.toFixed(2)+' '+yi2.toFixed(2)+' A'+r+' '+r+' 0 '+lg+' 0 '+xi1.toFixed(2)+' '+yi1.toFixed(2)+' Z" fill="'+s.c+'" onclick="drill(\''+s.k+'\')"></path>';
    a=a2;});
  const leg=segs.map(s=>{const pct=total?Math.round(s.v/total*100):0;return '<div class="lbox" onclick="drill(\''+s.k+'\')"><div class="t"><span class="dot" style="background:'+s.c+'"></span>'+s.l+'</div><div class="p">'+pct+'%</div><div class="c">'+s.v+'</div></div>';}).join('');
  return '<div class="donutwrap"><svg viewBox="0 0 140 140"><g>'+paths+'</g><text x="70" y="74" text-anchor="middle" class="ctr" style="font-size:31px">'+centerNum+'</text><text x="70" y="91" text-anchor="middle" style="font-size:10px;fill:var(--gris);font-weight:600">'+centerLabel+'</text></svg><div class="legbox">'+leg+'</div></div>';
}

    enviarWA('Hola! Nos encantaría conocer tu experiencia con Azcuénaga. Te dejo una breve encuesta (2 min): '+url+'?app=encuesta&prop='+encodeURIComponent(id));
  }).getEncuestaUrl();
}
function verEncuesta(id){
  var p=DATA.find(x=>x.id===id);
  google.script.run.withSuccessHandler(function(e){ if(!e){alert('Sin encuesta');return;} pintarEncuesta(p,e); }).obtenerEncuesta(id);
}
function pintarEncuesta(p,e){
  function row(k,v){return '<tr><td style="color:var(--gris)">'+k+'</td><td style="font-weight:600">'+(v||'—')+'</td></tr>';}
  var cal=parseInt(e['Calificación']||e.cal)||0; var col=cal>=8?'var(--verde)':(cal>=5?'var(--amarillo)':'var(--rojo)');
  document.getElementById('dlg').innerHTML=
    '<div class="fh"><span class="x" onclick="closeDL()">×</span><div class="dir">Encuesta de satisfacción</div><div class="sub">'+p.id+' · '+p.dir+'</div></div>'+
    '<div class="fb"><div style="text-align:center;margin-bottom:16px"><div style="font-size:46px;font-weight:800;color:'+col+';line-height:1">'+(cal||'—')+'<span style="font-size:20px;color:var(--gris)">/10</span></div><div style="font-size:12px;color:var(--gris)">calificación general</div></div>'+
    '<table>'+row('Fecha',e.Fecha)+row('Nombre',e.Nombre)+row('Operación',e['Operación'])+row('Equipo comercial',e.Equipo)+row('Tiempos de respuesta',e['Tiempos respuesta'])+row('Tiempos de operación',e['Tiempos operación'])+row('¿Recomendaría?',e['Recomendación'])+'</table>'+
    (e.Comentarios?'<h3 class="sec">Comentarios</h3><div style="background:var(--beige);border-radius:8px;padding:10px 12px;font-size:13px">'+e.Comentarios+'</div>':'')+
    '<div class="dlbtns"><button class="btn s" onclick="closeDL()">Cerrar</button></div></div>';
  document.getElementById('ov2').classList.add('on');
}
function agendarForm(id){
  var p=DATA.find(x=>x.id===id); if(!p)return;
  var hoy=new Date().toISOString().slice(0,16);
  document.getElementById('dlg').innerHTML=
  '<div class="fh"><span class="x" onclick="closeDL()">x</span><div class="dir">Agendar visita</div><div class="sub">'+p.id+' · '+p.dir+'</div></div>'+
  '<div class="fb"><div class="form">'+
    '<label>Fecha y hora<input id="ag_fecha" type="datetime-local" value="'+hoy+'"></label>'+
    '<label>Interesado<input id="ag_cli" placeholder="Nombre"></label>'+
    '<label>Teléfono<input id="ag_tel" placeholder="+54 341 ..."></label>'+
    '<label>Email (opc.)<input id="ag_mail" type="email" placeholder="email del cliente"></label>'+

    '<label style="grid-column:1/-1">Observaciones<textarea id="ag_obs" rows="2" placeholder="Comentarios..."></textarea></label>'+
  '</div>'+
  '<div class="dlbtns"><button class="btn g" id="ag_btn" onclick="guardarAgenda(\''+p.id+'\',\''+encodeURIComponent(p.dir)+'\')">Agendar</button><button class="btn s" onclick="closeDL()">Cancelar</button></div></div>';
  document.getElementById('ov2').classList.add('on');
}
function guardarAgenda(id,dirEnc){
  var g=x=>document.getElementById(x)?document.getElementById(x).value:'';
  var cuando=g('ag_fecha'); if(!cuando){alert('Poné la fecha y hora');return;}
  var datos={cuando:new Date(cuando).toISOString(),interesado:g('ag_cli'),tel:g('ag_tel'),mail:g('ag_mail')||'',obs:g('ag_obs'),dir:decodeURIComponent(dirEnc)};
  var btn=document.getElementById('ag_btn'); if(btn){btn.textContent='Agendando…';btn.disabled=true;}
  google.script.run
    .withSuccessHandler(function(){closeDL();recargar(id);})
    .withFailureHandler(function(e){alert('Error: '+(e&&e.message?e.message:e));if(btn){btn.textContent='Agendar';btn.disabled=false;}})
    .agendarVisita(id,datos);
}
function enviarReporte(id){
  var p=DATA.find(x=>x.id===id); var sm=SIM[id]||{};
  var ofertas=(p.seg||[]).filter(function(s){return /propuesta|oferta/i.test(s.res);}).length;
  var txt='Estimado/a '+( sm.prop||p.prop||'propietario/a')+', le compartimos el resumen de gestión de '+p.dir+':\n\n'+'Consultas: '+p.cons+'\nVisitas: '+p.vis+'\nPropuestas: '+ofertas+'\nDías sin movimiento: '+(p.dias===null?'sin actividad':p.dias)+'\n\n'+(p.vis>0?'Se mantiene interés activo de compradores.':'Baja actividad — se sugiere revisar precio y difusión.')+'\n\nSaludos, Azcuénaga Inmobiliaria';
  enviarWA(txt);
}
function close_(){document.getElementById('ov').classList.remove('on');}
function closeDL(){document.getElementById('ov2').classList.remove('on');}
function adaptar(datos){
  if(!Array.isArray(datos)) return [];
  return datos.map(function(p){
    var d0=(p.duenos&&p.duenos[0])||{};
    SIM[p.id]={prop:p.prop||d0.nombre||'',tel:d0.tel||'',mail:d0.mail||'',dni:d0.dni||'',dom:d0.dom||'',tokko:p.tokko||''};
    return {id:p.id,dir:norm(p.dir),tipo:norm(p.tipo),prop:norm(p.prop),precio:p.precio,estado:estFromEt(p.etapa),etapa:normEt(p.etapa),obs:p.obs,pct:(function(v){var n=parseInt(v);return (v==null||v===''||isNaN(n))?null:n;})(p.pct),papeles:p.papeles||{},duenos:p.duenos||[],origen:p.origen||'Propia',colega:p.colega||'',colegaTel:p.colegaTel||'',comision:p.comision||'',vendedor:p.vendedor||'',tokko:p.tokko||'',estadoCarga:p.estadoCarga||'',operacion:p.operacion||'',seg:p.seg||[],cons:p.cons||0,vis:p.vis||0,dias:(p.dias==null?null:p.dias),seguimientoPendiente:(function(seg){var hoy=new Date(); hoy.setHours(0,0,0,0);return (seg||[]).some(function(s){if(!/Le interesó/i.test(s.res||''))return false;if(!s.fechaProx)return true;var fp=s.fechaProx;var m=(''+fp).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(!m)return true;var d=new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1]));return d<=hoy;});})(p.seg),plan:p.plan||'',carpeta:p.carpeta||'',motivo:p.motivo||'',docUrls:p.docUrls||{},encuesta:p.encuesta||null};
  });
}
document.getElementById('dash').innerHTML='<div style="padding:22px;color:var(--gris);font-size:15px">Cargando propiedades del maestro…</div>';
google.script.run
  .withSuccessHandler(function(datos){ DATA=adaptar(datos); if(DATA[0]) DOCLIST=Object.keys(DATA[0].papeles); render(); })
  .withFailureHandler(function(err){ document.getElementById('dash').innerHTML='<div style="padding:22px;color:#c0392b">Error al cargar: '+(err&&err.message?err.message:err)+'</div>'; })
  .getDatos();
</script>

      call('azcuRecNuevo', [st.nombre||'', tx, st.agSel, hh], function(r){ if(st.ag && st.ag.items) st.ag.items.push({f:st.agSel, h:('0'+hh.split(':')[0]).slice(-2)+':'+hh.split(':')[1], t:'r', x:tx, v:'', m:true, id:r.id}); st.ag.items.sort(function(a,b){ return (a.f+a.h)<(b.f+b.h)?-1:1; }); st.agNote = 'Listo, te aviso '+r.aviso_para+'.'; render(); }, function(err){ st.agNote = 'No pude guardarlo: '+err; render(); });
    }
    else if(a==='agdel'){
      if(!window.confirm('¿Cancelo este recordatorio?')) return;
      var rid = t.dataset.id; if(st.ag && st.ag.items) st.ag.items = st.ag.items.filter(function(x){ return x.id!==rid; }); st.agNote = 'Cancelando…'; render();
      call('azcuRecCancelar', [st.nombre||'', rid], function(){ st.agNote = 'Recordatorio cancelado.'; render(); }, function(err){ st.agNote = 'No pude cancelarlo: '+err; agLoad(); });
    }
    else if(a==='enter'){ st.entered = true; ls('entered','1'); render(); }
    else if(a==='home'){ st.menu = !st.menu; st.view = 'chat'; render(); }
    else if(a==='menux'){ st.menu = false; render(); }
  });
  root.addEventListener('input', function(e){ if(e.target && e.target.id==='azbInp'){ var pl = e.target.closest('.azb-pill'); if(pl) pl.classList.toggle('has', !!e.target.value.trim()); } });
  root.addEventListener('submit', function(e){ if(e.target.id==='azbForm'){ e.preventDefault(); var i = root.querySelector('#azbInp'); var v = i.value; i.value = ''; if(st.wz) wzIn(v); else ask(v); } });
  root.addEventListener('keydown', function(e){ if(e.key==='Enter' && e.target.id==='azbName'){ e.preventDefault(); root.querySelector('[data-a="start"]').click(); } });
  document.addEventListener('mousemove', function(e){
    root.querySelectorAll('.azb-mk').forEach(function(m){
      var r = m.getBoundingClientRect(); if(!r.width) return;
      var dx = e.clientX-(r.left+r.width/2), dy = e.clientY-(r.top+r.height/2), d = Math.hypot(dx,dy)||1, k = Math.min(1, d/200)*2.6;
      m.querySelectorAll('.azb-pp').forEach(function(p){ p.style.transform = 'translate('+(dx/d*k)+'px,'+(dy/d*k)+'px)'; });
    });
  });
  function hook(){
    ['ficha','close_'].forEach(function(n){
      var f = window[n]; if(typeof f!=='function' || f.__azb) return;
      window[n] = function(id){ AZ.ctx = (n==='ficha') ? id : null; var r = f.apply(this, arguments); if(st.open){ var keep = root.querySelector('#azbInp') ? root.querySelector('#azbInp').value : ''; render(); var i = root.querySelector('#azbInp'); if(i) i.value = keep; } return r; };
      window[n].__azb = 1;
    });
  }
  if(!APP){ hook(); setTimeout(hook, 1500); }
  (function(){
    if(!APP) return;
    var q; try{ q = new URLSearchParams(location.search); }catch(e){ return; }
    if(q.get('ayuda')==='docs'){ try{ history.replaceState(null, '', location.pathname); }catch(e){} st.entered = true; setTimeout(function(){ if(!st.busy) ask('¿Qué documentos faltan?', 'docs'); }, 900); return; }
    if(q.get('agenda')){ try{ history.replaceState(null, '', location.pathname); }catch(e){} st.entered = true; st.view = 'agenda'; st.agSel = iso(new Date()); st.agForm = false; st.agNote = ''; setTimeout(agLoad, 700); return; }
    var id = q.get('cv'); if(!id) return;
    var ci = q.get('ci') || '';
    try{ history.replaceState(null, '', location.pathname); }catch(e){}
    st.entered = true; st.vis = {id:id, interesado:ci};
    var dir = id, say = function(){ st.msgs.push({role:'assistant', content:'¿Cómo te fue en la visita a **'+dir+'**'+(ci?' con **'+ci+'**':'')+'? Contame en un audio (mantené apretado el 🎤) o escribilo, y armo la tarjeta.', w:1}); save(); render(); };
    if(st.props){ var f = st.props.filter(function(p){ return p.id===id; })[0]; if(f) dir = f.dir; say(); }
    else call('azcuWarm', [], function(r){ if(Array.isArray(r)){ st.props = r; var f = r.filter(function(p){ return p.id===id; })[0]; if(f) dir = f.dir; } say(); }, function(){ say(); });
  })();
  render(); pushCheck(); setTimeout(pushCheck, 2500);
  setTimeout(movLoad, 2000); setInterval(function(){ if(!document.hidden) movLoad(); }, 300000); document.addEventListener('visibilitychange', function(){ if(!document.hidden) movLoad(); });
  if(st.nombre!==null && !st.warmed){ st.warmed = true; setTimeout(function(){ call('azcuWarm', [], function(r){ if(Array.isArray(r)) st.props = r; }, function(){}); }, 600); }
  if(APP && window.AZCU_API && !logoSrc()){
    var cl = ls('logo'); if(cl){ window.AZCU_LOGO = cl; render(); }
    else frameCall('azcuLogo', [], function(d){ if(d){ window.AZCU_LOGO = d; ls('logo', d); render(); } }, function(){});
  }
  if(!APP && !st.msgs.length && !ls('tip')){ setTimeout(function(){ if(st.open) return; var t = document.createElement('div'); t.className = 'azb azb-tip'; t.textContent = '¿Te doy una mano? 👋'; document.body.appendChild(t); ls('tip','1'); setTimeout(function(){ t.remove(); }, 7000); }, 2500); }
})();
</script>
