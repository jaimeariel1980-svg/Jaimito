<style>
.azb,.azb *{box-sizing:border-box}
.azb{--n:#0a3d91;--nd:#072a66;--ink:#0f1b33;--cr:#f4f2ee;--ln:#dcd8cf;--mu:#6b7280;--rj:#d1495b;font-family:'Inter','Segoe UI',system-ui,sans-serif;color:var(--ink)}
.azb-fab{position:fixed;right:22px;bottom:22px;width:68px;height:68px;border:0;padding:0;border-radius:50%;background:#fff;box-shadow:0 6px 22px rgba(10,61,145,.35),0 0 0 3px var(--n);cursor:pointer;z-index:9000;transition:transform .15s}
.azb-fab:hover{transform:scale(1.07)}
.azb-fab .azb-dot{position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:#2e9e5b;border:2px solid #fff}
.azb-tip{position:fixed;right:102px;bottom:36px;background:var(--n);color:#fff;font-size:13.5px;font-weight:600;padding:9px 14px;border-radius:12px 12px 2px 12px;z-index:9000;box-shadow:0 4px 14px rgba(0,0,0,.2);animation:azbin .3s}
.azb-tip:after{content:"";position:absolute;right:-7px;bottom:0;border:7px solid transparent;border-left-color:var(--n);border-bottom-color:var(--n)}
.azb-mk{position:relative;display:inline-block;flex-shrink:0;border-radius:50%;background:#fff;overflow:hidden}
.azb-mk img{width:100%;height:100%;display:block;border-radius:50%}
.azb-mk svg.azb-eyes{position:absolute;inset:0;width:100%;height:100%}
.azb-blink{animation:azbblink 4.5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes azbblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes azbin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.azb-panel{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:100vw;background:var(--cr);z-index:9100;display:none;flex-direction:column;box-shadow:-12px 0 40px rgba(15,27,51,.25);border-left:1px solid var(--ln)}
.azb-panel.on{display:flex;animation:azbslide .22s}
@keyframes azbslide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:640px){.azb-panel{width:100vw;border:0}.azb-fab{right:14px;bottom:14px}.azb-tip{display:none}}
.azb-hd{height:58px;background:#fff;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px;padding:0 14px 0 16px;flex-shrink:0}
.azb-hd .azb-t{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);flex:1}
.azb-ib{background:none;border:0;width:34px;height:34px;border-radius:8px;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center}
.azb-ib:hover{background:var(--cr)}
.azb-body{flex:1;overflow-y:auto;padding:20px 18px 12px}
.azb-eyb{display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--n);margin:14px 0 10px}
.azb-eyb:before{content:"";width:26px;height:2px;background:var(--n)}
.azb h1{font-family:'Archivo','Inter',sans-serif;font-weight:800;font-size:31px;line-height:1.05;letter-spacing:-.02em;margin:0 0 10px;color:var(--ink)}
.azb h1 b{color:var(--n)}
.azb p.azb-lead{font-size:14.5px;line-height:1.5;color:#4a5264;margin:0 0 18px}
.azb-av{width:76px;height:76px;border:1px solid var(--n);background:#fff;padding:7px;display:flex}
.azb-lbl{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:16px 0 8px}
.azb-row{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:#fff;border:1px solid var(--ln);padding:12px 14px;margin-bottom:8px;font:500 14px 'Inter',sans-serif;color:var(--ink);cursor:pointer}
.azb-row:hover{border-color:var(--n);color:var(--n)}
.azb-row span{color:var(--n);font-weight:700}
.azb-port{flex:1;background:var(--n);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 28px;position:relative;overflow:hidden}
.azb-port .azb-wm{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font:900 120px 'Archivo',sans-serif;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.13);letter-spacing:-.03em;white-space:nowrap;pointer-events:none}
.azb-port .azb-box{width:128px;height:128px;border:1.5px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;margin-bottom:22px;position:relative}
.azb-port .azb-pe{display:flex;align-items:center;gap:10px;font:500 11px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;margin-bottom:12px;position:relative}
.azb-port .azb-pe:before{content:"";width:28px;height:2px;background:#fff}
.azb-port h2{font:800 40px/1 'Archivo',sans-serif;letter-spacing:-.02em;margin:0 0 8px;position:relative}
.azb-port .azb-rl{font:500 12px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;opacity:.85;margin-bottom:18px;position:relative}
.azb-port p{font-size:15px;line-height:1.45;opacity:.92;margin:0 0 20px;position:relative}
.azb-port input{width:100%;max-width:300px;background:rgba(255,255,255,.14);border:0;border-bottom:2px solid rgba(255,255,255,.7);padding:14px;color:#fff;font:500 16px 'Inter',sans-serif;text-align:center;outline:none;position:relative}
.azb-port input::placeholder{color:rgba(255,255,255,.65)}
.azb-port .azb-go{width:100%;max-width:300px;margin-top:12px;background:#fff;color:var(--n);border:0;padding:15px;font:700 12.5px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;position:relative}
.azb-port .azb-sk{margin-top:16px;background:none;border:0;color:rgba(255,255,255,.75);font:500 11px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;position:relative}
.azb-m{display:flex;gap:8px;margin-bottom:12px;align-items:flex-end}
.azb-m.u{justify-content:flex-end}
.azb-b{max-width:86%;padding:10px 13px;font-size:14px;line-height:1.5;word-wrap:break-word}
.azb-m.a .azb-b{background:#fff;border:1px solid var(--ln);border-radius:14px 14px 14px 3px}
.azb-m.u .azb-b{background:var(--n);color:#fff;border-radius:14px 14px 3px 14px}
.azb-b b{font-weight:700}
.azb-b a{color:var(--n)}
.azb-st{font-style:normal;font-size:12.5px;color:var(--mu);margin-left:8px}
.azb-ty span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--n);margin:0 2px;animation:azbty 1s infinite}
.azb-ty span:nth-child(2){animation-delay:.15s}.azb-ty span:nth-child(3){animation-delay:.3s}
@keyframes azbty{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.azb-card{margin:0 0 12px 30px;background:#f3f7ff;border:1px solid #c9d8f5;border-left:4px solid var(--n);padding:12px 14px}
.azb-card .azb-k{font:500 10.5px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--n);margin-bottom:6px}
.azb-card .azb-s{font-size:13.5px;line-height:1.45;margin-bottom:10px}
.azb-card .azb-bt{display:flex;gap:8px}
.azb-btn{border:1px solid var(--n);background:var(--n);color:#fff;padding:8px 14px;font:700 11.5px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.azb-btn.o{background:#fff;color:var(--n)}
.azb-btn:disabled{opacity:.5;cursor:default}
.azb-card.ok{border-left-color:#2e9e5b;background:#f0faf3;border-color:#c6e6cf}
.azb-card.ok .azb-k{color:#1f7a44}.azb-card.no{opacity:.6}
.azb-chips{display:flex;gap:7px;padding:8px 12px 2px;overflow-x:auto;background:#fff;border-top:1px solid var(--ln);flex-shrink:0;scrollbar-width:none}
.azb-chips::-webkit-scrollbar{display:none}
.azb-chip{flex-shrink:0;border:1px solid var(--n);background:#fff;color:var(--n);padding:7px 12px;font:600 11px 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.azb-chip:active{background:var(--n);color:#fff}
.azb-in{display:flex;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid var(--ln);flex-shrink:0}
.azb-in input{flex:1;border:1px solid var(--ln);padding:11px 12px;font:14.5px 'Inter',sans-serif;outline:none;min-width:0}
.azb-in input:focus{border-color:var(--n)}
.azb-sd{width:44px;border:0;background:var(--n);color:#fff;cursor:pointer;font-size:18px}
.azb-sd:disabled{background:#b9c3d6;cursor:default}
.azb-mic{width:44px;border:1px solid var(--ln);background:#fff;color:var(--n);cursor:pointer;font-size:17px}
.azb-mic.rec{background:var(--rj);border-color:var(--rj);color:#fff;animation:azbrec 1s infinite}
@keyframes azbrec{50%{opacity:.6}}
.azb-mic{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;width:48px}
.azb-rb{flex:1;display:flex;align-items:center;gap:10px;padding:0 12px;border:1px solid var(--rj);background:#fff5f6;color:var(--rj);font:600 13px 'Inter',sans-serif;min-width:0}
.azb-rb .rd{width:10px;height:10px;border-radius:50%;background:var(--rj);animation:azbrec 1s infinite;flex-shrink:0}
.azb-rb .rh{font-weight:500;color:#8a4a52;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.azb-rb.cx{background:#eee;border-color:#999;color:#666}
.azb-opts{margin:0 0 12px 30px;display:flex;flex-wrap:wrap;gap:7px}
.azb-op{border:1px solid var(--n);background:#fff;color:var(--n);padding:9px 13px;font:600 13px 'Inter',sans-serif;cursor:pointer;text-align:left}
.azb-op:active{background:var(--n);color:#fff}
.azb-op.s{border-color:var(--ln);color:var(--mu)}.azb-op.x{border:0;color:var(--rj);background:none}
.azb-pb{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#eef3ff;border-bottom:1px solid #c9d8f5;font:600 13px 'Inter',sans-serif;color:var(--n);flex-shrink:0}.azb-pb .azb-btn{margin-left:auto;white-space:nowrap}
.azb-pn{margin:0 0 12px 30px;background:#fff;border:1px solid var(--ln);padding:12px}
.azb-kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.azb-k1{background:#f3f7ff;border:1px solid #c9d8f5;padding:8px 4px;text-align:center}
.azb-k1 b{display:block;font:800 20px 'Archivo',sans-serif;color:var(--n)}
.azb-k1 span{font:500 9.5px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
.azb-k1.g b{color:#1f7a44}.azb-k1.a b{color:#b57a14}.azb-k1.r b{color:var(--rj)}
.azb-bt2{font:500 10.5px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.14em;color:var(--mu);margin:12px 0 6px}
.azb-br{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:5px}
.azb-br i{font-style:normal;width:92px;flex-shrink:0}
.azb-br div{flex:1;background:#eef0f4;height:10px}.azb-br u{display:block;height:100%}
.azb-br em{font-style:normal;width:26px;text-align:right;font-weight:700}
.azb-card.dg{border-left-color:var(--rj);background:#fff5f6;border-color:#f1c9cf}.azb-card.dg .azb-k{color:var(--rj)}
.azb-opts.ad{margin-top:-4px}
@media print{.azb,.azb-tip{display:none!important}}
.azb-panel.azb-app{inset:0;width:100%;height:100vh;height:100dvh;max-width:none;border:0;box-shadow:none;animation:none}
.azb-ft{position:absolute;left:0;right:0;bottom:0;padding:16px 22px calc(16px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:14px;z-index:1}
.azb-ft .lg{display:flex;align-items:center;gap:9px;font:800 15px 'Archivo',sans-serif;letter-spacing:.01em}
.azb-ft .lm{font:500 9.5px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;opacity:.7;text-align:right;line-height:1.5}
.azb-app .azb-in{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.azb-app .azb-hd{padding-top:env(safe-area-inset-top);height:auto;min-height:58px}
</style>

    }, function(err){ a.estado = 'pendiente'; a.resultado = ''; st.msgs.push({role:'assistant', content:'No pude hacerlo: '+err}); save(); render(); });
  }
  var micDown = false, startX = 0;
  function recTick(){ var el = document.getElementById('azbT'); if(el && st.rec){ var t = Math.floor((Date.now()-st.rec.t0)/1000); el.textContent = Math.floor(t/60)+':'+('0'+(t%60)).slice(-2); if(t>=120) stopRec(true); } }
  function startRec(){
    if(st.rec || st.busy) return;
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(SR && !st.noSR){
      var sr = new SR(), q = { mr:{stop:function(){ sr.stop(); }}, t0:Date.now(), mode: micDown ? 'hold' : 'tap', cancel:false, send:true, txt:'', err:'' };
      sr.lang = 'es-AR'; sr.continuous = false; sr.interimResults = true;
      sr.onresult = function(e){ var o = []; Array.prototype.forEach.call(e.results, function(x){ var t = x[0].transcript.trim(), l = o.length ? o[o.length-1] : ''; if(l && (t.indexOf(l)===0 || l.indexOf(t)===0)) o[o.length-1] = t.length>=l.length ? t : l; else if(t) o.push(t); }); q.txt = o.join(' ').trim(); };
      sr.onerror = function(e){ q.err = e.error || 'error'; };
      sr.onend = function(){
        clearInterval(q.timer); st.rec = null; render();
        if(q.err && q.err!=='no-speech' && q.err!=='aborted'){ st.noSR = true; if(q.err==='not-allowed'||q.err==='service-not-allowed') alert('No pude usar el micrófono. Revisá el permiso del navegador.'); else { st.msgs.push({role:'assistant', content:'No pude usar el dictado rápido; probá de nuevo con el micrófono.'}); save(); render(); } return; }
        if(!q.send) return;
        if(q.txt) ask(q.txt); else { st.msgs.push({role:'assistant', content:'No te escuché bien. ¿Probás de nuevo?'}); save(); render(); }
      };
      try{ sr.start(); }catch(x){ st.noSR = true; return startRec(); }
      st.rec = q; q.timer = setInterval(recTick, 250); render(); return;
    }
    if(!navigator.mediaDevices || !window.MediaRecorder){ alert('Este navegador no permite grabar. Usá el dictado del teclado del celular 🎤'); return; }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      var chunks = [], mr = new MediaRecorder(stream);
      var r = { mr:mr, stream:stream, t0:Date.now(), mode: micDown ? 'hold' : 'tap', cancel:false, send:true };
      mr.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };
      mr.onstop = function(){
        clearInterval(r.timer); stream.getTracks().forEach(function(t){ t.stop(); }); st.rec = null; render();
        if(!r.send || !chunks.length) return;
        var blob = new Blob(chunks, {type:mr.mimeType||'audio/webm'}), fr = new FileReader();
        fr.onload = function(){
          var hist = st.msgs.filter(function(m){ return !m.w; }).map(function(m){ return {role:m.role, content:m.content||''}; }).filter(function(m){ return m.content; }), ph = {role:'user', content:'🎤 Escuchando…'};
          st.wz = null; st.msgs.push(ph); st.busy = true; st.status = ''; render();
          call('azcuVoz', [fr.result.split(',')[1], blob.type, hist, {nombre:st.nombre||'', fichaId:AZ.ctx||''}], function(r){
            st.busy = false;
            if(r.transcripcion) ph.content = r.transcripcion; else st.msgs.splice(st.msgs.indexOf(ph), 1);
            reply(r);
            save(); render();
          }, function(err){ st.busy = false; st.msgs.splice(st.msgs.indexOf(ph), 1); st.msgs.push({role:'assistant', content:'No pude entender el audio: '+err}); save(); render(); });
        };
        fr.readAsDataURL(blob);
      };
      mr.start(); st.rec = r; r.timer = setInterval(recTick, 250); render();
    }).catch(function(){ alert('No pude usar el micrófono. Revisá el permiso del navegador, o usá el dictado del teclado del celular 🎤'); });
  }
  function stopRec(send){ var r = st.rec; if(!r) return; r.send = !!send && !r.cancel; try{ r.mr.stop(); }catch(e){ st.rec = null; render(); } }
  document.addEventListener('pointerdown', function(e){
    var m = e.target.closest && e.target.closest('.azb-mic'); if(!m) return;
    e.preventDefault(); micDown = true; startX = e.clientX;
    if(st.rec && st.rec.mode==='tap'){ stopRec(true); micDown = false; return; }
    startRec();
  });
  document.addEventListener('pointermove', function(e){
    if(!micDown || !st.rec || st.rec.mode!=='hold') return;
    var c = (e.clientX - startX) < -80;
    if(c !== st.rec.cancel){ st.rec.cancel = c; var rb = root.querySelector('.azb-rb'), h = document.getElementById('azbH'); if(rb) rb.classList.toggle('cx', c); if(h) h.textContent = c ? 'Soltá para cancelar' : 'Soltá para enviar · ← cancelar'; }
  });
  function micUp(){
    if(!micDown) return; micDown = false;
    var r = st.rec; if(!r || r.mode!=='hold') return;
    if(Date.now()-r.t0 < 500 && !r.cancel){ r.mode = 'tap'; var h = document.getElementById('azbH'); if(h) h.textContent = 'Tocá el 🎤 para enviar'; }
    else stopRec(true);
  }
  document.addEventListener('pointerup', micUp);
  document.addEventListener('pointercancel', function(){ if(micDown && st.rec && st.rec.mode==='hold'){ micDown = false; stopRec(true); } });
  document.addEventListener('contextmenu', function(e){ if(e.target.closest && e.target.closest('.azb-mic')) e.preventDefault(); });
  root.addEventListener('click', function(e){
    var t = e.target.closest('[data-a],[data-q],[data-ok],[data-no],[data-w],[data-wo],[data-ws],[data-wx],[data-f],#azbFab'); if(!t) return;
    if(t.dataset.f){ openFile(t.dataset.f, t.dataset.fn||'archivo'); return; }
    if(t.dataset.w){ wzStart(t.dataset.w); return; }
    if(t.dataset.wo!==undefined){ var o = st.wz && st.wz.opts[+t.dataset.wo]; if(o){ if(st.wz.i<0) wzMode(o.v); else wzPick(o); } return; }
    if(t.dataset.ws){ wzSkip(); return; }
    if(t.dataset.wx){ wzCancel(); return; }
    if(t.id==='azbFab'){ st.open = !st.open; var tip = document.querySelector('.azb-tip'); if(tip) tip.remove(); render(); return; }
    if(t.dataset.q){ ask(t.dataset.q, t.dataset.at); return; }
    if(t.dataset.ok){ var p = t.dataset.ok.split(':'); doAction(+p[0], +p[1], true); return; }
    if(t.dataset.no){ var q = t.dataset.no.split(':'); doAction(+q[0], +q[1], false); return; }
    var a = t.dataset.a;
    if(a==='close'){ st.open = false; render(); }
    else if(a==='clear'){ if(confirm('¿Borro la charla?')){ st.msgs = []; st.wz = null; save(); render(); } }
    else if(a==='start'){ var v = (root.querySelector('#azbName').value||'').trim(); st.nombre = v; ls('nombre', v); st.entered = true; render(); if(!st.warmed){ st.warmed = true; call('azcuWarm', [], function(r){ if(Array.isArray(r)) st.props = r; }, function(){}); } }
    else if(a==='skip'){ st.nombre = ''; ls('nombre', ''); st.entered = true; render(); if(!st.warmed){ st.warmed = true; call('azcuWarm', [], function(r){ if(Array.isArray(r)) st.props = r; }, function(){}); } }
    else if(a==='push'){ pushOn(); }
    else if(a==='enter'){ st.entered = true; render(); }
    else if(a==='home'){ st.entered = false; render(); }
  });
  root.addEventListener('submit', function(e){ if(e.target.id==='azbForm'){ e.preventDefault(); var i = root.querySelector('#azbInp'); var v = i.value; i.value = ''; if(st.wz) wzIn(v); else ask(v); } });
  root.addEventListener('keydown', function(e){ if(e.key==='Enter' && e.target.id==='azbName'){ e.preventDefault(); root.querySelector('[data-a="start"]').click(); } });
  document.addEventListener('mousemove', function(e){
    root.querySelectorAll('.azb-mk').forEach(function(m){
      var r = m.getBoundingClientRect(); if(!r.width) return;
      var dx = e.clientX-(r.left+r.width/2), dy = e.clientY-(r.top+r.height/2), d = Math.hypot(dx,dy)||1, k = Math.min(1, d/200)*2.6;
      m.querySelectorAll('.azb-pp').forEach(function(p){ p.style.transform = 'translate('+(dx/d*k)+'px,'+(dy/d*k)+'px)'; });
    });
  });
  function hook(){
    ['ficha','close_'].forEach(function(n){
      var f = window[n]; if(typeof f!=='function' || f.__azb) return;
      window[n] = function(id){ AZ.ctx = (n==='ficha') ? id : null; var r = f.apply(this, arguments); if(st.open){ var keep = root.querySelector('#azbInp') ? root.querySelector('#azbInp').value : ''; render(); var i = root.querySelector('#azbInp'); if(i) i.value = keep; } return r; };
      window[n].__azb = 1;
    });
  }
  if(!APP){ hook(); setTimeout(hook, 1500); }
  render(); pushCheck(); setTimeout(pushCheck, 2500);
  if(st.nombre!==null && !st.warmed){ st.warmed = true; setTimeout(function(){ call('azcuWarm', [], function(r){ if(Array.isArray(r)) st.props = r; }, function(){}); }, 600); }
  if(APP && window.AZCU_API && !logoSrc()){
    var cl = ls('logo'); if(cl){ window.AZCU_LOGO = cl; render(); }
    else frameCall('azcuLogo', [], function(d){ if(d){ window.AZCU_LOGO = d; ls('logo', d); render(); } }, function(){});
  }
  if(!APP && !st.msgs.length && !ls('tip')){ setTimeout(function(){ if(st.open) return; var t = document.createElement('div'); t.className = 'azb azb-tip'; t.textContent = '¿Te doy una mano? 👋'; document.body.appendChild(t); ls('tip','1'); setTimeout(function(){ t.remove(); }, 7000); }, 2500); }
})();
</script>
