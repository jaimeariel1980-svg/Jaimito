    var inp = document.createElement('input'); inp.type = 'hidden'; inp.name = 'payload'; inp.value = JSON.stringify({id:id, fn:fn, args:[st.pin].concat(args)}); form.appendChild(inp);
    function finish(){ done = true; clearTimeout(pollT); if(scr) scr.remove(); setTimeout(function(){ ifr.remove(); form.remove(); }, 300); }
    function poll(){
      if(done) return;
      if(Date.now()-t0 > 330000){ finish(); onErr(new Error('El servidor no respondió. Revisá la URL y que el despliegue esté actualizado y sea para "Cualquier persona".')); return; }
      var cb = 'azbcb'+Math.random().toString(36).slice(2,9);
      window[cb] = function(d){ delete window[cb]; if(scr) scr.remove(); if(done) return; if(d && d.progress && d.ok===undefined){ if(st.status!==d.progress){ st.status = d.progress; render(); } pollT = setTimeout(poll, 400); } else if(d){ st.status = ''; finish(); if(d.ok) ok(d.data); else onErr(new Error(d.error || 'error')); } else pollT = setTimeout(poll, 450); };
      scr = document.createElement('script'); scr.src = window.AZCU_API+'?azr='+id+'&cb='+cb+'&_='+Date.now();
      scr.onerror = function(){ delete window[cb]; if(scr) scr.remove(); if(!done) pollT = setTimeout(poll, 2000); };
      document.head.appendChild(scr);
    }
    document.body.appendChild(ifr); document.body.appendChild(form); form.submit();
    pollT = setTimeout(poll, 500);
  }
  function call(fn, args, ok, fail, retried){
    function onErr(e){
      var msg = (e && e.message) ? e.message : String(e);
      if(/PIN/.test(msg) && !retried){ var p = window.prompt('Poné el PIN de AzcuBot:'); if(p){ st.pin = p; ls('pin', p); return call(fn, args, ok, fail, true); } }
      fail(msg.replace(/^Error:\s*/,''));
    }
    if(window.AZCU_API){ frameCall(fn, args, ok, onErr); return; }
    var run = google.script.run.withSuccessHandler(ok).withFailureHandler(onErr);
    run[fn].apply(run, [st.pin].concat(args));
  }
  function doAction(mi, ai, yes){
    var a = st.msgs[mi].acciones[ai];
    if(yes && a.peligro && !window.confirm('¿Seguro? Esto no se puede deshacer.')) return;
    if(!yes){ a.estado = 'cancelado'; delete st.fz[a.id]; save(); render(); return; }
    var fl = [];
    if(a.tipo==='adjuntar' || a.tipo==='nueva'){
      var fz = st.fz[a.id] || [];
      (a.datos.archivos||[]).forEach(function(x){ var f = fz[x.i]; if(f) fl.push({i:x.i, n:f.n, m:f.m, b:f.b}); });
      if(fl.length < (a.datos.archivos||[]).length){ alert('Los archivos ya no están en la app (se cerró o se recargó). Volvé a adjuntarlos.'); return; }
    }
    a.estado = 'hecho'; a.resultado = 'Ejecutando…'; render();
    call('azcuEjecutar', [Object.assign({quien:st.nombre||'', files:fl}, a)], function(r){
      a.resultado = r.mensaje; delete st.fz[a.id];
      if(r.enlaces && r.enlaces.length) st.msgs.push({role:'assistant', content:'', adj:r.enlaces});
      save(); render();
      if(typeof window.recargar==='function'){ try{ window.recargar(AZ.ctx||undefined); }catch(e){} }
    }, function(err){ a.estado = 'pendiente'; a.resultado = ''; st.msgs.push({role:'assistant', content:'No pude hacerlo: '+err}); save(); render(); });
  }
  var micDown = false, startX = 0;
  function recTick(){ var el = document.getElementById('azbT'); if(el && st.rec){ var t = Math.floor((Date.now()-st.rec.t0)/1000); el.textContent = Math.floor(t/60)+':'+('0'+(t%60)).slice(-2); if(t>=120) stopRec(true); } }
  function startRec(){
    if(st.rec || st.busy) return;
    try{ if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); }catch(e){}
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(SR && !st.noSR){
      var sr = new SR(), q = { mr:{stop:function(){ sr.stop(); }, abort:function(){ try{ sr.abort(); }catch(e){ sr.stop(); } }}, t0:Date.now(), mode:'tap', cancel:false, send:true, txt:'', err:'' };
      sr.lang = 'es-AR'; sr.continuous = true; sr.interimResults = true;
      sr.onresult = function(e){ var o = []; Array.prototype.forEach.call(e.results, function(x){ var t = x[0].transcript.trim(), l = o.length ? o[o.length-1] : ''; if(l && (t.indexOf(l)===0 || l.indexOf(t)===0)) o[o.length-1] = t.length>=l.length ? t : l; else if(t) o.push(t); }); q.txt = o.join(' ').trim(); };
      sr.onerror = function(e){ q.err = e.error || 'error'; };
      sr.onend = function(){
        clearInterval(q.timer); st.rec = null; render();
        if(q.err && q.err!=='no-speech' && q.err!=='aborted'){ st.noSR = true; if(q.err==='not-allowed'||q.err==='service-not-allowed') alert('No pude usar el micrófono. Revisá el permiso del navegador.'); else { st.msgs.push({role:'assistant', content:'No pude usar el dictado rápido; probá de nuevo con el micrófono.'}); save(); render(); } return; }
        if(!q.send) return;
        if(q.txt) ask(q.txt); else { st.msgs.push({role:'assistant', content:'No te escuché bien. ¿Probás de nuevo?'}); save(); render(); }
      };
      try{ sr.start(); }catch(x){ st.noSR = true; return startRec(); }
      st.rec = q; q.timer = setInterval(recTick, 250); render(); return;
    }
    if(!navigator.mediaDevices || !window.MediaRecorder){ alert('Este navegador no permite grabar. Usá el dictado del teclado del celular 🎤'); return; }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      var chunks = [], mr = new MediaRecorder(stream);
      var r = { mr:mr, stream:stream, t0:Date.now(), mode:'tap', cancel:false, send:true };
      mr.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };
      mr.onstop = function(){
        clearInterval(r.timer); stream.getTracks().forEach(function(t){ t.stop(); }); st.rec = null; render();
        if(!r.send || !chunks.length) return;
        var blob = new Blob(chunks, {type:mr.mimeType||'audio/webm'}), fr = new FileReader();
        fr.onload = function(){
          if(st.wz){
            st.busy = true; st.status = 'Escuchando…'; render();
            call('azcuTranscribir', [fr.result.split(',')[1], blob.type], function(res){ st.busy = false; st.status = ''; if(res.texto) wzIn(res.texto); else { wzSay('No te escuché bien. ¿Probás de nuevo?'); save(); render(); } },
              function(err){ st.busy = false; st.status = ''; wzSay('No pude entender el audio: '+err); save(); render(); });
            return;
          }
          var hist = st.msgs.filter(function(m){ return !m.w; }).map(function(m){ return {role:m.role, content:m.content||''}; }).filter(function(m){ return m.content; }), ph = {role:'user', content:'🎤 Escuchando…'};
          st.wz = null; st.msgs.push(ph); st.busy = true; st.status = ''; render();
          call('azcuVoz', [fr.result.split(',')[1], blob.type, hist, {nombre:st.nombre||'', fichaId:AZ.ctx||'', visita:st.vis||null}], function(r){
            st.busy = false;
            if(r.transcripcion) ph.content = r.transcripcion; else st.msgs.splice(st.msgs.indexOf(ph), 1);
            reply(r); if(st.view==='agenda'){ st.agNote = r.texto; agLoad(); }
            save(); render();
          }, function(err){ st.busy = false; st.msgs.splice(st.msgs.indexOf(ph), 1); st.msgs.push({role:'assistant', content:'No pude entender el audio: '+err}); save(); render(); });
        };
        fr.readAsDataURL(blob);
      };
      mr.start(); st.rec = r; r.timer = setInterval(recTick, 250); render();
    }).catch(function(){ alert('No pude usar el micrófono. Revisá el permiso del navegador, o usá el dictado del teclado del celular 🎤'); });
  }
  function stopRec(send){ var r = st.rec; if(!r) return; r.send = !!send && !r.cancel; try{ if(!r.send && r.mr.abort) r.mr.abort(); else r.mr.stop(); }catch(e){ st.rec = null; render(); } }
  root.addEventListener('click', function(e){
    var t = e.target.closest('[data-a],[data-q],[data-ok],[data-no],[data-w],[data-wo],[data-ws],[data-wx],[data-f],[data-d],#azbFab'); if(!t) return;
    if(t.dataset.d){ st.agSel = t.dataset.d; st.agForm = false; render(); return; }
    if(t.dataset.f){ openFile(t.dataset.f, t.dataset.fn||'archivo'); return; }
    if(t.dataset.w){ wzStart(t.dataset.w); return; }
    if(t.dataset.wo!==undefined){ var o = st.wz && st.wz.opts[+t.dataset.wo]; if(o){ if(st.wz.i<0) wzMode(o.v); else wzPick(o); } return; }
    if(t.dataset.ws){ wzSkip(); return; }
    if(t.dataset.wx){ wzCancel(); return; }
    if(t.id==='azbFab'){ st.open = !st.open; var tip = document.querySelector('.azb-tip'); if(tip) tip.remove(); render(); return; }
    if(t.dataset.q){ ask(t.dataset.q, t.dataset.at); return; }
    if(t.dataset.ok){ var p = t.dataset.ok.split(':'); doAction(+p[0], +p[1], true); return; }
    if(t.dataset.no){ var q = t.dataset.no.split(':'); doAction(+q[0], +q[1], false); return; }
    var a = t.dataset.a;
    if(a==='close'){ st.open = false; render(); }
    else if(a==='clear'){ if(confirm('¿Borro la charla?')){ st.msgs = []; st.wz = null; save(); render(); } }
    else if(a==='start'){ var v = (root.querySelector('#azbName').value||'').trim(); st.nombre = v; ls('nombre', v); st.entered = true; ls('entered','1'); render(); if(!st.warmed){ st.warmed = true; call('azcuWarm', [], function(r){ if(Array.isArray(r)) st.props = r; }, function(){}); } }
    else if(a==='skip'){ st.nombre = ''; ls('nombre', ''); st.entered = true; ls('entered','1'); render(); if(!st.warmed){ st.warmed = true; call('azcuWarm', [], function(r){ if(Array.isArray(r)) st.props = r; }, function(){}); } }
    else if(a==='push'){ pushOn(); }
    else if(a==='attach'){ st.menu = false; st.sheet = true; render(); }
    else if(a==='sheetx'){ if(t.classList.contains('azb-ov') && e.target!==t) return; st.sheet = false; render(); }
    else if(a==='attcam'){ st.sheet = false; render(); fCam.click(); }
    else if(a==='attgal'){ st.sheet = false; render(); fGal.click(); }
    else if(a==='attdel'){ st.att.splice(+t.dataset.i, 1); render(); }
    else if(a==='attsave'){ attMsg('guardar en una propiedad'); wzStart('adjex'); }
    else if(a==='copy'){ var cu = t.dataset.u, okc = function(){ t.textContent = '✓ Enlace copiado'; }; try{ navigator.clipboard.writeText(cu).then(okc, function(){ window.prompt('Copiá el enlace:', cu); }); }catch(e){ window.prompt('Copiá el enlace:', cu); } }
    else if(a==='adjb'){ if(t.dataset.act==='attprop'){ st.pre = t.dataset.id; st.sheet = true; render(); } else if(t.dataset.act==='compl'){ complStart(t.dataset.id); } }
    else if(a==='attread'){ attRead(); }
    else if(a==='mic'){ startRec(); }
    else if(a==='recsend'){ stopRec(true); }
    else if(a==='reccancel'){ stopRec(false); }
    else if(a==='agenda'){ if(st.view==='agenda'){ st.view = 'chat'; render(); } else { st.menu = false; st.view = 'agenda'; st.agSel = iso(new Date()); st.agForm = false; st.agNote = ''; st.entered = true; render(); agLoad(); } }
    else if(a==='agnew'){ st.agForm = true; render(); var ti = root.querySelector('#azbAgT'); if(ti) ti.focus(); }
    else if(a==='agcancel'){ st.agForm = false; render(); }
    else if(a==='agsave'){
      var tx = (root.querySelector('#azbAgT').value||'').trim(), hh = root.querySelector('#azbAgH').value;
      if(!tx || !hh){ alert('Escribí qué recordar y la hora.'); return; }
      st.agForm = false; st.agNote = 'Guardando…'; render();
      call('azcuRecNuevo', [st.nombre||'', tx, st.agSel, hh], function(r){ if(st.ag && st.ag.items) st.ag.items.push({f:st.agSel, h:('0'+hh.split(':')[0]).slice(-2)+':'+hh.split(':')[1], t:'r', x:tx, v:'', m:true, id:r.id}); st.ag.items.sort(function(a,b){ return (a.f+a.h)<(b.f+b.h)?-1:1; }); st.agNote = 'Listo, te aviso '+r.aviso_para+'.'; render(); }, function(err){ st.agNote = 'No pude guardarlo: '+err; render(); });
    }
    else if(a==='agdel'){
      if(!window.confirm('¿Cancelo este recordatorio?')) return;
      var rid = t.dataset.id; if(st.ag && st.ag.items) st.ag.items = st.ag.items.filter(function(x){ return x.id!==rid; }); st.agNote = 'Cancelando…'; render();
      call('azcuRecCancelar', [st.nombre||'', rid], function(){ st.agNote = 'Recordatorio cancelado.'; render(); }, function(err){ st.agNote = 'No pude cancelarlo: '+err; agLoad(); });
    }
    else if(a==='enter'){ st.entered = true; ls('entered','1'); render(); }
    else if(a==='home'){ st.menu = !st.menu; st.view = 'chat'; render(); }
    else if(a==='menux'){ st.menu = false; render(); }
  });
  root.addEventListener('input', function(e){ if(e.target && e.target.id==='azbInp'){ var pl = e.target.closest('.azb-pill'); if(pl) pl.classList.toggle('has', !!e.target.value.trim()); } });
  root.addEventListener('submit', function(e){ if(e.target.id==='azbForm'){ e.preventDefault(); var i = root.querySelector('#azbInp'); var v = i.value; i.value = ''; if(st.wz) wzIn(v); else ask(v); } });
  root.addEventListener('keydown', function(e){ if(e.key==='Enter' && e.target.id==='azbName'){ e.preventDefault(); root.querySelector('[data-a="start"]').click(); } });
  document.addEventListener('mousemove', function(e){
    root.querySelectorAll('.azb-mk').forEach(function(m){
      var r = m.getBoundingClientRect(); if(!r.width) return;
      var dx = e.clientX-(r.left+r.width/2), dy = e.clientY-(r.top+r.height/2), d = Math.hypot(dx,dy)||1, k = Math.min(1, d/200)*2.6;
      m.querySelectorAll('.azb-pp').forEach(function(p){ p.style.transform = 'translate('+(dx/d*k)+'px,'+(dy/d*k)+'px)'; });
    });
  });
  function hook(){
    ['ficha','close_'].forEach(function(n){
      var f = window[n]; if(typeof f!=='function' || f.__azb) return;
      window[n] = function(id){ AZ.ctx = (n==='ficha') ? id : null; var r = f.apply(this, arguments); if(st.open){ var keep = root.querySelector('#azbInp') ? root.querySelector('#azbInp').value : ''; render(); var i = root.querySelector('#azbInp'); if(i) i.value = keep; } return r; };
      window[n].__azb = 1;
    });
  }
  if(!APP){ hook(); setTimeout(hook, 1500); }
  (function(){
    if(!APP) return;
    var q; try{ q = new URLSearchParams(location.search); }catch(e){ return; }
    if(q.get('ayuda')==='docs'){ try{ history.replaceState(null, '', location.pathname); }catch(e){} st.entered = true; setTimeout(function(){ if(!st.busy) ask('¿Qué documentos faltan?', 'docs'); }, 900); return; }
    var id = q.get('cv'); if(!id) return;
    var ci = q.get('ci') || '';
    try{ history.replaceState(null, '', location.pathname); }catch(e){}
    st.entered = true; st.vis = {id:id, interesado:ci};
    var dir = id, say = function(){ st.msgs.push({role:'assistant', content:'¿Cómo te fue en la visita a **'+dir+'**'+(ci?' con **'+ci+'**':'')+'? Contame en un audio (mantené apretado el 🎤) o escribilo, y armo la tarjeta.', w:1}); save(); render(); };
    if(st.props){ var f = st.props.filter(function(p){ return p.id===id; })[0]; if(f) dir = f.dir; say(); }
    else call('azcuWarm', [], function(r){ if(Array.isArray(r)){ st.props = r; var f = r.filter(function(p){ return p.id===id; })[0]; if(f) dir = f.dir; } say(); }, function(){ say(); });
  })();
  render(); pushCheck(); setTimeout(pushCheck, 2500);
  if(st.nombre!==null && !st.warmed){ st.warmed = true; setTimeout(function(){ call('azcuWarm', [], function(r){ if(Array.isArray(r)) st.props = r; }, function(){}); }, 600); }
  if(APP && window.AZCU_API && !logoSrc()){
    var cl = ls('logo'); if(cl){ window.AZCU_LOGO = cl; render(); }
    else frameCall('azcuLogo', [], function(d){ if(d){ window.AZCU_LOGO = d; ls('logo', d); render(); } }, function(){});
  }
  if(!APP && !st.msgs.length && !ls('tip')){ setTimeout(function(){ if(st.open) return; var t = document.createElement('div'); t.className = 'azb azb-tip'; t.textContent = '¿Te doy una mano? 👋'; document.body.appendChild(t); ls('tip','1'); setTimeout(function(){ t.remove(); }, 7000); }, 2500); }
})();
