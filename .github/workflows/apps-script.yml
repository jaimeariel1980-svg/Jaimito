name: Apps Script
on:
  workflow_dispatch:
    inputs:
      proyecto:
        description: Qué proyecto
        type: choice
        options: [pami, azcu, liq, nj, blumia]
        default: pami
      accion:
        description: bajar = copia el proyecto real al repo; publicar = sube el repo al proyecto
        type: choice
        options: [bajar, publicar]
        default: bajar
  push:
    branches: [main, claude/recruitment-automation-google-b1Ric]
    paths: ['pami/**', 'appscript/**', 'liquidaciones/**', 'caja-obra/**', 'blumia/**']
permissions:
  contents: write
concurrency: apps-script
jobs:
  clasp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: pami, dir: pami, secret: CLASPRC_PAMI, depvar: DEPLOYMENT_PAMI}
          - {id: azcu, dir: appscript, secret: CLASPRC_AZCU, depvar: DEPLOYMENT_AZCU}
          - {id: liq, dir: liquidaciones, secret: CLASPRC_PAMI, depvar: DEPLOYMENT_LIQ}
          - {id: blumia, dir: blumia, secret: CLASPRC_BLUMIA, depvar: DEPLOYMENT_BLUMIA, depid: AKfycbytekPKN31bZLxczDVknMr433K9KflzmrR-dCWsC1hLlx2MO7tbw6SrMjFXa1PnucQo}
          - {id: nj, dir: caja-obra, secret: CLASPRC_NJ, depvar: DEPLOYMENT_NJ, depid: AKfycbzSA249ZvCJvbUKpllHIpJwBfq7uTl6Lt6CDP8Vh3BjejJ6N7JuASWIP4mN81l96a899g}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Decidir si corresponde
        id: dec
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.proyecto }}" = "${{ matrix.id }}" ] && echo "go=1" >> $GITHUB_OUTPUT || echo "go=0" >> $GITHUB_OUTPUT
          else
            [ -f "${{ matrix.dir }}/appsscript.json" ] && git -c core.quotepath=false diff --name-only HEAD~1 HEAD | grep -q "^${{ matrix.dir }}/" && echo "go=1" >> $GITHUB_OUTPUT || echo "go=0" >> $GITHUB_OUTPUT
          fi
      - if: steps.dec.outputs.go == '1'
        uses: actions/setup-node@v4
        with: {node-version: 20}
      - if: steps.dec.outputs.go == '1'
        run: npm i -g @google/clasp@2
      - if: steps.dec.outputs.go == '1'
        run: echo '${{ secrets[matrix.secret] }}' > ~/.clasprc.json
      - name: Adaptar credenciales al formato de clasp 2
        if: steps.dec.outputs.go == '1'
        run: |
          node -e "const fs=require('fs'),f=process.env.HOME+'/.clasprc.json',j=JSON.parse(fs.readFileSync(f)),t=j.tokens&&j.tokens.default;if(t&&!j.token)fs.writeFileSync(f,JSON.stringify({token:{access_token:t.access_token,refresh_token:t.refresh_token,token_type:'Bearer'},oauth2ClientSettings:{clientId:t.client_id,clientSecret:t.client_secret,redirectUri:'http://localhost'},isLocalCreds:false}))"
      - name: Bajar proyecto real
        if: steps.dec.outputs.go == '1' && github.event_name == 'workflow_dispatch' && inputs.accion == 'bajar'
        working-directory: ${{ matrix.dir }}
        run: |
          clasp pull
          git config user.name "apps-script-sync"; git config user.email "sync@users.noreply.github.com"
          git checkout -B sync-${{ matrix.id }}
          git add -A .
          git commit -m "Copia del proyecto Apps Script real (${{ matrix.id }})" || echo "sin cambios"
          git push -f origin sync-${{ matrix.id }}
      - name: Chequear que nadie haya tocado Apps Script a mano
        if: steps.dec.outputs.go == '1' && github.event_name == 'push'
        run: |
          rm -rf /tmp/real /tmp/prev; mkdir -p /tmp/real /tmp/prev
          if ! git archive "${{ github.event.before }}" "${{ matrix.dir }}" 2>/dev/null | tar -x -C /tmp/prev; then echo "Sin versión anterior: no se compara."; exit 0; fi
          [ -f "/tmp/prev/${{ matrix.dir }}/appsscript.json" ] || { echo "Primera publicación del proyecto: no se compara."; exit 0; }
          cp "${{ matrix.dir }}/.clasp.json" /tmp/real/
          (cd /tmp/real && clasp pull > /dev/null)
          DIF=$(python3 .github/scripts/guardia.py "/tmp/prev/${{ matrix.dir }}" /tmp/real) || true
          if [ -n "$DIF" ]; then
            git config user.name "apps-script-sync"; git config user.email "sync@users.noreply.github.com"
            git checkout -B sync-${{ matrix.id }}
            cp /tmp/real/*.gs /tmp/real/*.html /tmp/real/appsscript.json "${{ matrix.dir }}/" 2>/dev/null || true
            git add -f "${{ matrix.dir }}"
            git commit -m "Copia del Apps Script real con cambios hechos a mano (${{ matrix.id }})" || true
            git push -f origin sync-${{ matrix.id }}
            echo "::error::Alguien modificó el Apps Script a mano. NO se publicó para no pisar esos cambios. Diferencias:"
            echo "$DIF"
            exit 1
          fi
          echo "Sin cambios a mano: se puede publicar."
      - name: Publicar
        if: steps.dec.outputs.go == '1' && (github.event_name == 'push' || inputs.accion == 'publicar')
        working-directory: ${{ matrix.dir }}
        run: |
          clasp push -f
          DEP="${{ vars[matrix.depvar] || matrix.depid }}"
          if [ -n "$DEP" ]; then clasp deploy -i "$DEP" -d "GitHub ${{ github.sha }}"; else echo "sin deployment (proyecto con menú)"; fi
