<style>
*{box-sizing:border-box;margin:0;padding:0}

body{font-family:var(--font);background:var(--bg);color:var(--text)}

<script>
const LOGO_BLANCO = '<?!= LOGO_BLUMIA_ ?>';
const PERFIL_ID = '<?= perfil ?>';
const CAND_INICIAL = '<?= candidato ?>';
const ENTR_INICIAL = '<?= entrevistador ?>';
window.EDITAR = false; window.EF_TIPO = 'exploracion';

let DATOS = null, EXD = {}, YA_GUARDADA = false;
const state = {};
const VEREDICTOS = {
  A: { titulo: 'A · Avanza', desc: 'Validó lo que necesitábamos confirmar. Avanza a competencias.', cls: 'res-verde', color: 'verde' },
  'B+': { titulo: 'B+ · Avanza', desc: 'Validó lo central, con una cuestión menor a seguir. Avanza a competencias.', cls: 'res-verdeclaro', color: 'verde' },
  B: { titulo: 'B · Reserva', desc: 'Quedan dudas o condiciones sin validar. Queda en reserva.', cls: 'res-amarillo', color: 'amarillo' },
  C: { titulo: 'C · No avanza', desc: 'No validó lo que necesitábamos o hay alertas importantes.', cls: 'res-rojo', color: 'rojo' }
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

setTimeout(() => { if (!DATOS) document.getElementById('app').innerHTML = '<div class="loading" style="color:red;font-weight:bold;">No se pudo cargar la búsqueda «' + esc(PERFIL_ID) + '». Recargá la página; si sigue igual, avisá.</div>'; }, 20000);
google.script.run.withSuccessHandler(d => {
  if (!d) { document.getElementById('app').innerHTML = '<div class="loading" style="color:red;font-weight:bold;">El servidor devolvió la búsqueda vacía (' + esc(PERFIL_ID) + '). Contactá al administrador.</div>'; return; }
  DATOS = d;
  google.script.run.withSuccessHandler(x => { EXD = x || {}; render(); }).withFailureHandler(() => { EXD = {}; render(); }).explDatos(PERFIL_ID, CAND_INICIAL);
}).withFailureHandler(e => {
  document.getElementById('app').innerHTML = '<div class="loading" style="color:red;font-weight:bold;">Error: ' + esc(e.message) + '</div>';
}).getDatosPerfil(PERFIL_ID);

function parseComun(t) {
  t = String(t || '').trim();
  if (!t) return null;
  const m = t.match(/^([^:\n]{3,45}):\s*([\s\S]+)$/);
  return m ? { titulo: 'Pregunta común – ' + m[1].trim().toLowerCase(), pregunta: m[2].trim() } : { titulo: 'Pregunta común', pregunta: t };
}

function qHtml(q, comun) {
  return `<div class="q-row"${comun ? ' data-comun="1"' : ''}>
    <div class="q-head"><span class="q-num"></span><input type="text" class="q-t" placeholder="Tema de la pregunta" value="${esc(q.titulo)}"><button type="button" class="q-del ia-ui" onclick="quitarPregunta(this)" title="Quitar esta pregunta">✕ Quitar</button></div>
    <textarea class="q-q" data-ia="1" placeholder="Pregunta para la entrevista...">${esc(q.pregunta)}</textarea>
  </div>`;
}
function numerarPreguntas() { document.querySelectorAll('#qs .q-row').forEach((r, i) => { const n = r.querySelector('.q-num'); if (n) n.textContent = i + 1; }); }
function sinBarras() { document.querySelectorAll('#app .q-q, #app .fx-ta').forEach(t => { t.dataset.ia = '1'; }); }
function agregarPregunta(q) { document.getElementById('qs').insertAdjacentHTML('beforeend', qHtml(q || { titulo: '', pregunta: '' }, false)); numerarPreguntas(); }
function quitarPregunta(b) { const r = b.closest('.q-row'); if (r) r.remove(); numerarPreguntas(); }

function render() {
  const h = DATOS.hero || {};
  const entrevistadoras = DATOS.entrevistadoras || [];
  const html = `
<div class="hero">
  <img class="hero-logo" alt="Blumia" src="${LOGO_BLANCO}">
  <h1><span>Exploración de </span><em id="hero-nombre">${esc(CAND_INICIAL) || 'Candidato/a'}</em></h1>
  <div class="hero-sub">${esc(h.posicion || '')} · ${esc(h.empresa || '')}</div>
  <div id="hero-links" class="ia-ui" style="margin:-6px 0 14px"></div>
  <div class="hero-meta">
    <div class="hm-item"><div class="hm-label">Empresa</div><div class="hm-val">${esc(h.empresa || '')}</div></div>
    <div class="hm-item"><div class="hm-label">Posición</div><div class="hm-val">${esc(h.posicion || '')}</div></div>
    <div class="hm-item"><div class="hm-label">Ubicación</div><div class="hm-val">${esc(h.ubicacion || '')}</div></div>
    <div class="hm-item"><div class="hm-label">Instancia</div><div class="hm-val">Entrevista de exploración</div></div>
  </div>
</div>
<div class="wrap">
  <div class="section">
    <div class="section-label"><span>Datos del candidato</span></div>
    <div class="grid-2" style="margin-bottom:14px">
      <div class="field"><label>Nombre y apellido</label><input type="text" id="d-nombre" value="${esc(CAND_INICIAL)}" placeholder="—" oninput="document.getElementById('hero-nombre').innerText=this.value||'Candidato/a'"></div>
      <div class="field"><label for="d-entrevistadora">Entrevistador/a</label>
        <select id="d-entrevistadora"><option value="">— Elegí —</option>${entrevistadoras.map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join('')}</select></div>
    </div>
    <div class="grid-2">
      <div class="field"><label for="d-fecha">Fecha de la entrevista</label><input type="date" id="d-fecha"></div>
      <div class="field"><label>Formación</label><input type="text" id="d-formacion" value="${esc(EXD.formacion || '')}" placeholder="Carrera, título, estado"></div>
    </div>
  </div>
  <hr class="section-divider">
  <div class="section">
    <div class="section-label"><span>Ficha de la entrevista</span></div>
    <div class="fx-bar ia-ui"><button type="button" class="fx-btn prim" id="btn-ia" onclick="prepararConIA()">✨ Preparar ficha con IA</button><span class="fx-hint">Arma un borrador con el CV y el perfil del puesto. Después lo revisás y lo editás.</span></div>
    <div class="field" style="margin-bottom:14px"><label>Perfil predominante</label><input type="text" id="f-perfil" placeholder="Ej: operaciones, supply chain, finanzas y gestión de proyectos"></div>
    <div class="field" style="margin-bottom:14px"><label>Síntesis del perfil</label><textarea class="fx-ta" id="f-sintesis" data-ia="1" placeholder="Qué muestra su trayectoria y qué no evidencia todavía para este puesto..."></textarea></div>
    <div class="field" style="margin-bottom:14px"><label>Foco de la entrevista</label><textarea class="fx-ta" id="f-foco" data-ia="1" placeholder="Qué hay que determinar con esta persona en particular..."></textarea></div>
    <div class="field"><label>Preguntas</label></div>
    <div id="qs"></div>
    <div class="ia-ui" style="margin:-2px 0 18px"><button type="button" class="fx-btn" onclick="agregarPregunta()">+ Agregar pregunta</button></div>
    <div class="field"><label>Qué buscaría validar</label><textarea class="fx-ta" id="f-validar" data-ia="1" placeholder="Qué querés tener confirmado al terminar la entrevista..."></textarea></div>
  </div>
  <hr class="section-divider">
  <div class="section">
    <div class="section-label"><span>Registro de la entrevista</span></div>
    <div class="field" style="margin-bottom:14px"><label>Evidencias relevantes</label><textarea id="r-evid" placeholder="Lo que contó, con ejemplos y resultados concretos..."></textarea></div>
    <div class="field" style="margin-bottom:14px"><label>Fortalezas diferenciales</label><textarea id="r-fort" placeholder="Lo que lo distingue para este puesto..."></textarea></div>
    <div class="field" style="margin-bottom:14px"><label>Aspectos a profundizar / alertas</label><textarea id="r-alert" placeholder="Dudas, contradicciones o puntos para seguir en competencias..."></textarea></div>
    <div class="field"><label>Conclusión y recomendación de avance</label><textarea id="r-concl" placeholder="Qué recomendás y por qué..."></textarea></div>
  </div>
  <hr class="section-divider">
  <div class="section">
    <div class="section-label"><span>Resultado final</span></div>
    <div class="resultado-card sin-res" id="res-card">
      <div class="semaforo">
        <div class="semaforo-dot sd-verde" id="dot-verde"></div>
        <div class="semaforo-dot sd-amarillo" id="dot-amarillo"></div>
        <div class="semaforo-dot sd-rojo" id="dot-rojo"></div>
      </div>
      <div class="resultado-info">
        <div class="resultado-tag"><span>Evaluación general de la entrevista</span></div>
        <div class="resultado-titulo" id="res-titulo">—</div>
        <div class="resultado-desc" id="res-desc">Elegí el resultado al terminar la entrevista</div>
      </div>
    </div>
    <div class="veredicto-manual">
      <div class="veredicto-manual-label">Resultado · Letra para la planilla</div>
      <div class="vd-opts">
        <button type="button" class="vd-btn" data-l="A" onclick="elegirResultado('A')"><strong>A</strong> · Avanza</button>
        <button type="button" class="vd-btn" data-l="B+" onclick="elegirResultado('B+')"><strong>B+</strong> · Avanza con observación</button>
        <button type="button" class="vd-btn" data-l="B" onclick="elegirResultado('B')"><strong>B</strong> · Reserva</button>
        <button type="button" class="vd-btn" data-l="C" onclick="elegirResultado('C')"><strong>C</strong> · No avanza</button>
      </div>
    </div>
    ${(DATOS.proximos || []).length ? `<div class="prox-box ia-ui" id="prox-box" style="display:none">
      <label for="d-proximo">Si avanza: ¿quién hace la entrevista de competencias?</label>
      <select id="d-proximo"><option value="">— Sin asignar —</option>${DATOS.proximos.map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join('')}</select>
      <div class="prox-ayuda">Queda en la tarjeta del candidato («Próxima: …») y en la agenda de esa persona.</div>
    </div>` : ''}
  </div>
  <div class="footer">Confidencial · Blumia Consulting · © 2026</div>
</div>`;
  document.getElementById('app').innerHTML = html;
  const c = parseComun(EXD.comun);
  for (let i = 0; i < 5; i++) agregarPregunta();
  if (c) document.getElementById('qs').insertAdjacentHTML('beforeend', qHtml(c, true));
  numerarPreguntas();
  preseleccionarEntrevistadora();
  cargarLinks();
  cargarPrevia();
}

function letraActual() { const b = document.querySelector('.vd-btn[class*="vd-active-"]'); return b ? b.dataset.l : ''; }

function elegirResultado(letra) {
  const v = VEREDICTOS[letra];
  document.querySelectorAll('.semaforo-dot').forEach(d => d.classList.remove('on'));
  document.getElementById('dot-' + v.color).classList.add('on');
  document.getElementById('res-card').classList.remove('sin-res');
  const pb = document.getElementById('prox-box'); if (pb) pb.style.display = (letra === 'A' || letra === 'B+') ? 'block' : 'none';
  const t = document.getElementById('res-titulo');
  t.textContent = v.titulo; t.className = 'resultado-titulo ' + v.cls;
  document.getElementById('res-desc').textContent = v.desc;
  document.querySelectorAll('.vd-btn').forEach(b => b.className = 'vd-btn');
  const colorClase = { A: 'verde', 'B+': 'verdeclaro', B: 'amarillo', C: 'rojo' }[letra];
  document.querySelector('.vd-btn[data-l="' + letra + '"]')?.classList.add('vd-active-' + colorClase);
}

function cargarLinks() {
  const el = document.getElementById('hero-links');
  if (!el) return;
  let h = '<button type="button" class="pr-btn" style="margin-top:8px" onclick="blPerfilRef()">📋 Perfil del puesto</button>';
  if (EXD.cv) h += ' <a href="' + esc(EXD.cv) + '" target="_blank" rel="noopener" class="pr-btn" style="margin-top:8px;text-decoration:none;display:inline-block">📄 Ver CV</a>';
  el.innerHTML = h;
}

function preseleccionarEntrevistadora() {
  if (!ENTR_INICIAL) return;
  const sel = document.getElementById('d-entrevistadora');
  if (!sel) return;
  let found = false;
  [...sel.options].forEach(o => { if (o.value.toLowerCase() === ENTR_INICIAL.toLowerCase()) { o.selected = true; found = true; } });
  if (!found) { const opt = document.createElement('option'); opt.value = ENTR_INICIAL; opt.text = ENTR_INICIAL; opt.selected = true; sel.appendChild(opt); }
}

// si la ficha ya se guardó (borrador o entrevista completa), se vuelve a abrir tal cual
function cargarPrevia() {
  if (!CAND_INICIAL) return;
  google.script.run.withSuccessHandler(r => {
    if (!r || !r.estado) return;
    try {
      efRestaurar(r.estado);
      sinBarras(); numerarPreguntas(); cargarLinks();
      YA_GUARDADA = !!r.nota;
      const l = letraActual(); if (l) elegirResultado(l);
      showToast(r.nota ? '✏️ Entrevista guardada el ' + r.fecha + ' · nota ' + r.nota : 'Ficha guardada el ' + r.fecha);
      if (r.nota) document.getElementById('btn-save-sheet').textContent = 'Guardar cambios';
    } catch (e) { showToast('No se pudo recuperar lo guardado: ' + e.message); }
  }).withFailureHandler(() => {}).getEvaluacionPrevia(PERFIL_ID, CAND_INICIAL, 'exploracion');
}

function hayFicha() {
  return ['f-perfil', 'f-sintesis', 'f-foco', 'f-validar'].some(id => (document.getElementById(id)?.value || '').trim()) ||
    [...document.querySelectorAll('#qs .q-q')].some(t => t.value.trim() && !t.closest('.q-row').dataset.comun);
}

function prepararConIA() {
  const nombre = (document.getElementById('d-nombre').value || '').trim();
  if (!nombre) { alert('Falta el nombre de la persona entrevistada.'); return; }
  const hacer = () => {
    const b = document.getElementById('btn-ia'), old = b.textContent;
    b.disabled = true; b.textContent = '⏳ Preparando la ficha…';
    google.script.run.withSuccessHandler(r => {
      b.disabled = false; b.textContent = old;
      document.getElementById('f-perfil').value = r.perfil_predominante || '';
      document.getElementById('f-sintesis').value = r.sintesis || '';
      document.getElementById('f-foco').value = r.foco || '';
      document.getElementById('f-validar').value = r.validar || '';
      const comun = document.querySelector('#qs .q-row[data-comun="1"]');
      const hold = comun ? { titulo: comun.querySelector('.q-t').value, pregunta: comun.querySelector('.q-q').value } : null;
      document.getElementById('qs').innerHTML = '';
      (r.preguntas || []).forEach(q => agregarPregunta(q));
      if (hold) document.getElementById('qs').insertAdjacentHTML('beforeend', qHtml(hold, true));
      numerarPreguntas();
      showToast('Ficha preparada: revisala y editala antes de la entrevista.');
    }).withFailureHandler(e => {
      b.disabled = false; b.textContent = old;
      alert('No se pudo preparar la ficha: ' + (e && e.message ? e.message : e));
    }).explPreparar(PERFIL_ID, nombre);
  };
  if (!hayFicha()) return hacer();
  const msg = 'La ficha ya tiene texto. Si seguís, la IA lo reemplaza. ¿Continuar?';
  if (typeof blConfirm === 'function') blConfirm(msg, hacer, { si: 'Reemplazar', no: 'Cancelar' }); else if (confirm(msg)) hacer();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}

// ficha + registro hasta ahora, sin nota ni cambio de etapa
function guardarFicha() {
  const nombre = (document.getElementById('d-nombre').value || '').trim();
  if (!nombre) { alert('Falta el nombre de la persona entrevistada.'); return; }
  const entrevistador = document.getElementById('d-entrevistadora').value;
  const estado = efCapturar();
  const btn = document.getElementById('btn-save-draft'), old = btn.textContent;
  btn.disabled = true; btn.textContent = '⏳ Guardando…';
  google.script.run.withSuccessHandler(() => { btn.disabled = false; btn.textContent = old; showToast('Ficha guardada. Podés volver a abrirla desde el tablero.'); })
    .withFailureHandler(e => { btn.disabled = false; btn.textContent = old; alert('No se pudo guardar la ficha: ' + e.message); })
    .explBorrador(PERFIL_ID, nombre, estado, entrevistador);
}

function enviarExploracion() {
  const nombre = (document.getElementById('d-nombre').value || '').trim();
  const entrevistador = document.getElementById('d-entrevistadora').value;
  if (!nombre) { alert('Falta el nombre de la persona entrevistada.'); return; }
  const cat = letraActual();
  if (!cat) { alert('Elegí el resultado de la entrevista (A, B+, B o C) antes de guardar.'); return; }
  const ESTADO_EF = efCapturar();
  if (cat === 'C' && !YA_GUARDADA && !window.__mot) { mfPedir(function (m) { window.__mot = m; enviarExploracion(); }); return; }

  const btn = document.getElementById('btn-save-sheet');
  btn.innerText = '⏳ GUARDANDO...'; btn.disabled = true;
  const proximo = (cat === 'A' || cat === 'B+') ? (document.getElementById('d-proximo')?.value || '') : '';

  document.querySelectorAll('select[id]').forEach(s => { [...s.options].forEach(o => { if (o.selected) o.setAttribute('selected', 'selected'); else o.removeAttribute('selected'); }); });
  const clone = document.documentElement.cloneNode(true);
  const caja = 'border:1.5px solid #DDDBD7;border-radius:8px;padding:10px 12px;color:#1A1A1A;background:#F7F5F1;';
  clone.querySelectorAll('input[id],textarea,select[id],input.q-t').forEach(el => {
    const dst = el.id ? clone.querySelector('#' + el.id) : el;
    if (!dst) return;
    if (el.tagName === 'TEXTAREA') {
      const div = clone.ownerDocument.createElement('div');
      div.textContent = el.value;
      div.style.cssText = caja + 'white-space:pre-wrap;word-wrap:break-word;font-size:15px;line-height:1.5;min-height:' + (el.classList.contains('q-q') ? '40' : '70') + 'px';
      dst.parentNode.replaceChild(div, dst);
    } else if (el.tagName === 'SELECT') {
      const div = clone.ownerDocument.createElement('div');
      div.textContent = el.options[el.selectedIndex] ? el.options[el.selectedIndex].text : '';
      div.style.cssText = caja + 'font-size:14px;font-weight:700;color:#1A6645;display:inline-block;min-width:140px';
      dst.parentNode.replaceChild(div, dst);
    } else if (el.classList.contains('q-t')) {
      const div = clone.ownerDocument.createElement('div');
      div.textContent = el.value;
      div.style.cssText = 'flex:1;font-size:15px;font-weight:800;color:#0F3F27';
      dst.parentNode.replaceChild(div, dst);
    } else {
      const div = clone.ownerDocument.createElement('div');
      div.textContent = el.value;
      div.style.cssText = caja + 'font-size:15px;min-height:20px';
      dst.parentNode.replaceChild(div, dst);
    }
  });
  clone.querySelectorAll('script').forEach(s => s.remove());
  clone.querySelectorAll('.topbar,.toast,.veredicto-manual,.ia-ui').forEach(el => el.remove());
  clone.querySelectorAll('.hero-logo').forEach(el => { el.style.display = 'block'; });

  blGuardando('Guardando la entrevista…');
  google.script.run
    .withSuccessHandler(() => {
      YA_GUARDADA = true;
      blGuardado('¡Entrevista guardada!' + (proximo ? ' Próxima: ' + proximo + '.' : ''));
      showToast('¡Entrevista guardada!');
      btn.innerHTML = '✅ ¡LISTO!';
      setTimeout(() => { btn.innerHTML = 'Guardar cambios'; btn.disabled = false; }, 3000);
    })
    .withFailureHandler(err => {
      blGuardadoError('No se pudo guardar: ' + err.message);
      btn.innerHTML = '❌ REINTENTAR'; btn.disabled = false;
    })
    .procesarExploracion({
      perfil: PERFIL_ID, editar: YA_GUARDADA, estado: ESTADO_EF, nombre: nombre, entrevistador: entrevistador, proximo: proximo, resultado: cat,
      motivo: cat === 'C' ? (window.__mot || null) : null, htmlFull: clone.outerHTML
    });
  window.__mot = null;
}
</script>
</body>
</html>
