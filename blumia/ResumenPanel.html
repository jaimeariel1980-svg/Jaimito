<style>
.rs-tabs{display:flex;gap:8px;padding:12px 16px 0;max-width:1500px;margin:0 auto}
.rs-tab{background:#fff;border:1px solid #d9d6cf;border-radius:10px;padding:10px 20px;font:700 14px/1 inherit;font-family:inherit;color:#666;cursor:pointer}
.rs-tab.on{background:#1A6645;color:#fff;border-color:#1A6645}
#resumenPage{display:none;max-width:1500px;margin:0 auto;padding:14px 16px 50px;color:#1a1a1a}
#resumenPage [data-k]{cursor:pointer}
.rs-dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.rs-kpi{background:#fff;border:1px solid #e3e0d9;border-radius:14px;padding:20px 18px;position:relative;overflow:hidden;transition:.12s}
.rs-kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#1A6645}
.rs-kpi:hover{box-shadow:0 4px 14px rgba(26,102,69,.18);transform:translateY(-1px)}
.rs-kpi .n{font-size:42px;font-weight:800;color:#1A6645;line-height:1;letter-spacing:-1px}
.rs-kpi .l{font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.6px;margin-top:8px;font-weight:700}
.rs-kpi .h{font-size:10px;color:#1A6645;margin-top:4px}
.rs-kpi.y:before{background:#E0A800}.rs-kpi.y .n{color:#8a6500}
.rs-kpi.r:before{background:#D9534F}.rs-kpi.r .n{color:#B91C1C}
.rs-kpi.g:before{background:#8e95a0}.rs-kpi.g .n{color:#444}
.rs-panel{background:#fff;border:1px solid #e3e0d9;border-radius:12px;padding:20px 22px;margin-bottom:14px}
.rs-panel h3{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.8px;color:#1A6645;font-weight:800}
.rs-row3{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.rs-row3>div{min-width:280px;flex:1}
.rs-row3 h3{text-align:center}
.rs-dw{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0}
.rs-dw svg{width:210px;height:210px;flex-shrink:0}
.rs-dw svg path{transition:opacity .12s}.rs-dw svg path:hover{opacity:.75}
.rs-leg{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;width:100%}
.rs-lb{border:1px solid #e3e0d9;border-radius:12px;padding:10px 13px;min-width:108px;background:#fff;text-align:center;transition:.12s}
.rs-lb:hover{border-color:#1A6645}
.rs-lb .t{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:#666;font-weight:700;margin-bottom:6px}
.rs-lb .t i{width:11px;height:11px;border-radius:4px;display:inline-block}
.rs-lb .p{font-size:24px;font-weight:800;line-height:1}
.rs-lb .c{font-size:11px;color:#777;margin-top:3px}
.rs-fun{display:grid;grid-template-columns:230px 1fr 200px;gap:12px;align-items:center;padding:6px 8px;border-radius:8px;font-size:13px}
.rs-fun:hover{background:#F3F8F5}
.rs-bar{background:#ECEAE4;border-radius:7px;height:22px;overflow:hidden}.rs-bar i{display:block;height:100%;background:linear-gradient(90deg,#1A6645,#3E9A6E);border-radius:7px}
.rs-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rs-ent{display:flex;gap:12px;align-items:center;padding:9px 10px;border-radius:8px;border-bottom:1px solid #f0eee9}
.rs-ent:hover{background:#F3F8F5}
.rs-ent b{min-width:92px;color:#1A6645}
.rs-t{width:100%;border-collapse:collapse;font-size:13px}
.rs-t th,.rs-t td{padding:8px;text-align:right;border-bottom:1px solid #eee}.rs-t th:first-child,.rs-t td:first-child{text-align:left}
.rs-t th{font-size:11px;color:#666;text-transform:uppercase}
.rs-t tr[data-p]:hover td{background:#F3F8F5;cursor:pointer}
.rs-dl{display:flex;gap:10px;align-items:center;padding:9px 8px;border-bottom:1px solid #eee;cursor:pointer;border-radius:6px}
.rs-dl:hover{background:#F3F8F5}
.rs-dl .nm{flex:1;font-weight:700}.rs-dl .es{font-size:12px;color:#666}
.rs-dl .nt{font-weight:800;min-width:26px;text-align:center}
.rs-note{font-size:11px;color:#888;margin-top:8px}
@media(max-width:800px){.rs-fun{grid-template-columns:1fr}.rs-two{grid-template-columns:1fr}}
</style>
<script>
(function(){
  var COLS={cv:'#9aa5b1',scr:'#5aa9e6',comp:'#1A6645',semp:'#e0a800',fin:'#e07b39',cont:'#2e9e5b',res:'#8e7cc3',desc:'#d9534f'};
  var NC={'A':'#1A6645','B+':'#7bc47f','B':'#f0c24b','C':'#d9534f','Sin nota':'#b0b7c0'};
  var PAL=['#1A6645','#5aa9e6','#e0a800','#8e7cc3','#e07b39','#d9534f','#2e9e5b','#9aa5b1'];
  function est(e){
    var l=String(e||'').trim().toLowerCase(),lv;
    if(/^eliminado/.test(l))return null;
    if(l==='contratado')return {lv:5,t:'cont'};
    if(/^descartad/.test(l)){lv=/post screening/.test(l)?1:/en competencias/.test(l)?2:/screening empresa/.test(l)?3:/presencial empresa|en empresa/.test(l)?4:0;return {lv:lv,t:'desc'};}
    if(/reserva/.test(l))return {lv:/competencias/.test(l)?2:/screening empresa/.test(l)?3:/presencial empresa/.test(l)?4:1,t:'res'};
    lv=/competencias/.test(l)?2:/screening empresa/.test(l)?3:/presencial empresa|avanza a empresa|entrevista empresa|en cliente/.test(l)?4:/screening/.test(l)?1:0;
    return {lv:lv,t:'act'};
  }
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function pct(a,b){return b?Math.round(a*100/b)+'%':'—';}
  function fm(n){return n?'$'+(Math.round(n/1e5)/10)+' M':'—';}
  var L=[],ETAPAS=['Análisis de CV','Screening','Competencias','Screening empresa','Final empresa'];
  var STEPS=['Recibidos','Llegaron a screening','Llegaron a competencias','Screening con la empresa','Entrevista final con la empresa','Contratados'];
  function prep(){
    L=[];DATA.forEach(function(c){var e=est(c.estado);if(e){e.c=c;L.push(e);}});
  }
  function inicioDia(){var d=new Date();d.setHours(0,0,0,0);return d.getTime();}
  function citaEn(x,d0,d1){var f=avFecha(x.c.cita);return x.t==='act'&&f&&f>=d0&&f<d1?f:null;}
  // grupos clickeables
  function grupo(k){
    var h0=inicioDia(),n=Date.now(),r=function(f){return L.filter(f);},t,lista;
    if(k==='all'){t='Todos los recibidos';lista=L;}
    else if(k==='act'){t='En proceso';lista=r(function(x){return x.t==='act';});}
    else if(k==='sinc'){t='Sin contactar';lista=r(function(x){return x.t==='act'&&x.lv===0&&/^(nuevo|pendiente|revisar|)$/i.test(String(x.c.estado||'').trim())&&!x.c.contactado;});}
    else if(k==='prox'){t='Entrevistas de los próximos 7 días';lista=r(function(x){return citaEn(x,h0,h0+7*864e5);}).sort(function(a,b){return avFecha(a.c.cita)-avFecha(b.c.cita);});}
    else if(k==='cont'){t='Contratados';lista=r(function(x){return x.t==='cont';});}
    else if(k==='res'){t='En reserva';lista=r(function(x){return x.t==='res';});}
    else if(k==='desc'){t='Descartados';lista=r(function(x){return x.t==='desc';});}
    else if(k==='ult7'){t='Recibidos en los últimos 7 días';lista=r(function(x){var f=avFecha(x.c.recibido);return f&&n-f<=7*864e5;});}
    else if(k.indexOf('et:')===0){var i=+k.slice(3);t='Etapa: '+['Análisis de CV','Screening','Competencias','Screening empresa','Final empresa','Contratados','Reserva','Descartados'][i];
      lista=r(function(x){return i<5?(x.t==='act'&&x.lv===i):i===5?x.t==='cont':i===6?x.t==='res':x.t==='desc';});}
    else if(k.indexOf('nota:')===0){var nt=k.slice(5);t='CVs con nota '+nt;lista=r(function(x){return (String(x.c.nota||'').trim()||'Sin nota')===nt;});}
    else if(k.indexOf('fu:')===0){var fu=k.slice(3);t='Llegaron por: '+fu;lista=r(function(x){return (String(x.c.fuente||'').trim()||'Sin dato')===fu;});}
    else if(k.indexOf('emb:')===0){var s=+k.slice(4);t=STEPS[s];lista=r(function(x){return x.lv>=s;});}
    else if(k.indexOf('pret:')===0){t='Pretensión salarial (de menor a mayor)';lista=r(function(x){return x.t==='act'&&x.c.pretNum>0;}).sort(function(a,b){return a.c.pretNum-b.c.pretNum;});}
    else {t='';lista=[];}
    return {t:t,l:lista};
  }
  var LAST='';
  window.rsDrill=function(k){
    LAST=k;var g=grupo(k);
    var h='<div style="font-size:12px;color:#666;margin-bottom:8px">'+g.l.length+' candidato'+(g.l.length===1?'':'s')+' · tocá uno para abrir su ficha</div>';
    h+=g.l.length?g.l.map(function(x){var c=x.c;var nt=c.nota?'<span class="nota n'+String(c.nota).replace('+','')+'">'+esc(c.nota)+'</span>':'';var extra=k==='prox'?(' · '+esc(c.cita)):(k.indexOf('pret:')===0?' · '+fm(c.pretNum):'');
      return '<div class="rs-dl" onclick="rsFicha('+c.fila+')"><span class="nt">'+nt+'</span><span class="nm">'+esc(c.nombre)+'</span><span class="es">'+esc(c.estado)+extra+'</span></div>';}).join(''):'<div style="color:#888;padding:14px 0">No hay candidatos en este grupo.</div>';
    document.getElementById('mtit').textContent=g.t;document.getElementById('mbody').innerHTML=h;document.getElementById('modal').classList.add('show');
  };
  window.rsFicha=function(f){ficha(f);document.getElementById('mbody').insertAdjacentHTML('afterbegin','<button class="mbtn alt" style="margin-bottom:10px" onclick="rsDrill(\''+String(LAST).replace(/'/g,"\\'")+'\')">← Volver a la lista</button>');};
  function dona(segs,total,centro,sub){
    var tot=segs.reduce(function(s,x){return s+x.v;},0)||1,cx=70,cy=70,R=63,r=44,a=-Math.PI/2,paths='',nz=segs.filter(function(z){return z.v>0;}).length;
    segs.forEach(function(s){if(s.v<=0)return;var fr=s.v/tot,a2=a+fr*2*Math.PI;if(nz===1)a2=a+2*Math.PI-0.0001;
      var x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2),xi1=cx+r*Math.cos(a),yi1=cy+r*Math.sin(a),xi2=cx+r*Math.cos(a2),yi2=cy+r*Math.sin(a2),lg=fr>.5?1:0;
      paths+='<path data-k="'+esc(s.k)+'" d="M'+x1.toFixed(2)+' '+y1.toFixed(2)+' A'+R+' '+R+' 0 '+lg+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+' L'+xi2.toFixed(2)+' '+yi2.toFixed(2)+' A'+r+' '+r+' 0 '+lg+' 0 '+xi1.toFixed(2)+' '+yi1.toFixed(2)+' Z" fill="'+s.c+'"></path>';a=a2;});
    var leg=segs.map(function(s){return '<div class="rs-lb" data-k="'+esc(s.k)+'"><div class="t"><i style="background:'+s.c+'"></i>'+esc(s.l)+'</div><div class="p">'+pct(s.v,total)+'</div><div class="c">'+s.v+' candidato'+(s.v===1?'':'s')+'</div></div>';}).join('');
    return '<div class="rs-dw"><svg viewBox="0 0 140 140"><g>'+paths+'</g><circle cx="70" cy="70" r="'+(r-1)+'" fill="#fff"></circle><text x="70" y="74" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#1A6645">'+centro+'</text><text x="70" y="89" text-anchor="middle" style="font-size:8.5px;fill:#666;font-weight:700">'+sub+'</text></svg><div class="rs-leg">'+leg+'</div></div>';
  }
  function kpi(n,l,c,k){return '<div class="rs-kpi '+c+'" data-k="'+k+'"><div class="n">'+n+'</div><div class="l">'+l+'</div><div class="h">ver detalle ›</div></div>';}
  function pintar(){
    prep();
    var n=L.length,g=function(k){return grupo(k).l.length;},h0=inicioDia(),pr=g('prox'),hoy=L.filter(function(x){return citaEn(x,h0,h0+864e5);}).length;
    var reached=[0,1,2,3,4,5].map(function(k){return L.filter(function(x){return x.lv>=k;}).length;});
    var pend=(typeof AV_PEND!=='undefined'&&AV_PEND)||[],nov=(typeof AV_NOV!=='undefined'&&AV_NOV)||[],urg=pend.filter(function(a){return a.urg;}).length;
    var x='<div class="rs-dash">'+kpi(pend.length,'Avisos pendientes'+(urg?' ('+urg+' urgentes)':''),pend.length?'r':'g','avisos')+kpi(n,'Recibidos','','all')+kpi(g('act'),'En proceso','','act')+kpi(g('sinc'),'Sin contactar','y','sinc')+kpi(pr,'Entrevistas próx. 7 días'+(hoy?' ('+hoy+' hoy)':''),'','prox')+kpi(g('cont'),'Contratados','','cont')+kpi(g('res'),'En reserva','g','res')+kpi(g('desc'),'Descartados','r','desc')+kpi(g('ult7'),'Recibidos en 7 días','g','ult7')+'</div>';
    var fil=function(a,nv){return '<div class="rs-ent" onclick="avAbrir('+a.f+')" style="cursor:pointer"><b style="min-width:0;color:'+(a.urg?'#B91C1C':'#1A6645')+'">'+a.ic+' '+esc(a.n)+'</b><span style="font-size:13px">'+esc(a.txt)+(nv?' <span style="color:#999">· '+esc(a.h)+'</span>':'')+'</span></div>';};
    x+='<div class="rs-panel"><h3>🔔 Avisos <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#888">· lo que hay que hacer · tocá uno para abrir al candidato</span></h3>'
      +(pend.length?pend.slice(0,8).map(function(a){return fil(a,false);}).join('')+(pend.length>8?'<div class="rs-note">y '+(pend.length-8)+' más…</div>':''):'<div style="color:#777;padding:6px 0">No hay pendientes. 👌</div>')
      +(nov.length?'<div style="font-weight:800;color:#1A6645;margin:14px 0 4px;font-size:13px">Novedades desde tu última visita</div>'+nov.slice(0,5).map(function(a){return fil(a,true);}).join(''):'')
      +'<div style="margin-top:10px"><button class="mbtn alt" data-k="avisos">Ver todos los avisos</button></div></div>';
    var ES=[0,1,2,3,4,5,6,7].map(function(i){return {l:['Análisis de CV','Screening','Competencias','Screening empresa','Final empresa','Contratados','En reserva','Descartados'][i],v:g('et:'+i),c:[COLS.cv,COLS.scr,COLS.comp,COLS.semp,COLS.fin,COLS.cont,COLS.res,COLS.desc][i],k:'et:'+i};});
    var notas={},fuentes={};L.forEach(function(y){var nt=String(y.c.nota||'').trim()||'Sin nota';notas[nt]=(notas[nt]||0)+1;var fu=String(y.c.fuente||'').trim()||'Sin dato';fuentes[fu]=(fuentes[fu]||0)+1;});
    var NS=['A','B+','B','C','Sin nota'].filter(function(k){return notas[k];}).map(function(k){return {l:k==='Sin nota'?k:'Nota '+k,v:notas[k],c:NC[k],k:'nota:'+k};});
    var FS=Object.keys(fuentes).sort(function(a,b){return fuentes[b]-fuentes[a];}).map(function(k,i){return {l:k,v:fuentes[k],c:PAL[i%PAL.length],k:'fu:'+k};});
    x+='<div class="rs-panel"><div class="rs-row3"><div><h3>Candidatos por etapa</h3>'+dona(ES,n,n,'candidatos')+'</div><div><h3>Calidad de los CVs</h3>'+dona(NS,n,pct(notas['A']||0,n),'con nota A')+'</div><div><h3>De dónde llegan</h3>'+dona(FS,n,FS.length,FS.length===1?'canal':'canales')+'</div></div></div>';
    x+='<div class="rs-panel"><h3>Embudo de la búsqueda</h3>'+STEPS.map(function(t,k){return '<div class="rs-fun" data-k="emb:'+k+'"><span><b>'+t+'</b></span><div class="rs-bar"><i style="width:'+(n?Math.round(reached[k]*100/n):0)+'%"></i></div><span><b>'+reached[k]+'</b> · '+(k?pct(reached[k],reached[k-1])+' del paso anterior':'100%')+'</span></div>';}).join('')+'<div class="rs-note">Según el estado actual de cada candidato: «llegó» a una etapa si está en ella o ya la pasó (los descartados cuentan hasta donde llegaron).</div></div>';
    var ent=L.filter(function(y){return citaEn(y,h0,h0+7*864e5);}).sort(function(a,b){return avFecha(a.c.cita)-avFecha(b.c.cita);}).slice(0,8);
    var pret=L.filter(function(y){return y.t==='act'&&y.c.pretNum>0;}).map(function(y){return y.c.pretNum;}).sort(function(a,b){return a-b;});
    x+='<div class="rs-two"><div class="rs-panel"><h3>Agenda de la semana</h3>'+(ent.length?ent.map(function(y){return '<div class="rs-ent" onclick="rsFicha('+y.c.fila+')" style="cursor:pointer"><b>'+esc(y.c.cita)+'</b><span>'+esc(y.c.nombre)+'</span><span style="margin-left:auto;font-size:12px;color:#666">'+esc(y.c.estado)+'</span></div>';}).join(''):'<span style="color:#888">No hay entrevistas agendadas en los próximos 7 días.</span>')+'</div>'
     +'<div class="rs-panel"><h3>Pretensión salarial (en proceso)</h3>'+(pret.length?'<div class="rs-dash" style="margin:0"><div class="rs-kpi" data-k="pret:"><div class="n" style="font-size:30px">'+fm(pret[0])+'</div><div class="l">Mínima</div></div><div class="rs-kpi" data-k="pret:"><div class="n" style="font-size:30px">'+fm(pret[Math.floor(pret.length/2)])+'</div><div class="l">Mediana</div></div><div class="rs-kpi" data-k="pret:"><div class="n" style="font-size:30px">'+fm(pret[pret.length-1])+'</div><div class="l">Máxima</div></div></div>':'<span style="color:#888">Todavía no hay pretensiones cargadas.</span>')+'</div></div>';
    x+='<div class="rs-panel" id="rsEmp"><h3>Todas las búsquedas de la empresa</h3><span style="color:#888">Cargando…</span></div>';
    document.getElementById('resumenPage').innerHTML=x;
    google.script.run.withSuccessHandler(function(r){var e=document.getElementById('rsEmp');if(!e)return;var T={total:0,activos:0,l1:0,l2:0,l3:0,l4:0,contratados:0,descartados:0};
      var rows=r.map(function(b){Object.keys(T).forEach(function(k){T[k]+=b[k];});return '<tr data-p="'+esc(b.id)+'"><td>'+esc(b.nombre)+(b.id===PERFIL?' ◂':'')+'</td><td>'+b.total+'</td><td>'+b.activos+'</td><td>'+b.l1+'</td><td>'+b.l2+'</td><td>'+b.l3+'</td><td>'+b.l4+'</td><td>'+b.contratados+'</td><td>'+b.descartados+'</td></tr>';}).join('');
      e.innerHTML='<h3>Todas las búsquedas de la empresa <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#888">· tocá una para abrirla</span></h3><table class="rs-t"><tr><th>Búsqueda</th><th>Recibidos</th><th>En proceso</th><th>Screening</th><th>Competencias</th><th>Scr. empresa</th><th>Final empresa</th><th>Contratados</th><th>Descartados</th></tr>'+rows+(r.length>1?'<tr><td><b>Total</b></td>'+['total','activos','l1','l2','l3','l4','contratados','descartados'].map(function(k){return '<td><b>'+T[k]+'</b></td>';}).join('')+'</tr>':'')+'</table>';
    }).withFailureHandler(function(){var e=document.getElementById('rsEmp');if(e)e.innerHTML='<h3>Todas las búsquedas de la empresa</h3><span style="color:#888">No se pudo cargar.</span>';}).resumenBusquedas(PERFIL);
  }
  function ver(v){
    var R=v==='resumen';
    document.getElementById('resumenPage').style.display=R?'block':'none';
    var f=document.querySelector('.filtros'),b=document.getElementById('board');
    if(f)f.style.display=R?'none':'';if(b)b.style.display=R?'none':'';
    document.getElementById('rsTabR').className='rs-tab'+(R?' on':'');document.getElementById('rsTabT').className='rs-tab'+(R?'':' on');
    try{sessionStorage.setItem('bl_vista',v);}catch(e){}
    if(R)pintar();
  }
  window.rsVer=ver;
  var hd=document.querySelector('header');
  if(hd){
    hd.insertAdjacentHTML('afterend','<div class="rs-tabs"><button class="rs-tab on" id="rsTabR" onclick="rsVer(\'resumen\')">📊 Resumen</button><button class="rs-tab" id="rsTabT" onclick="rsVer(\'tablero\')">🗂 Tablero de candidatos</button></div><div id="resumenPage"></div>');
    document.getElementById('resumenPage').addEventListener('click',function(e){
      var p=e.target.closest('[data-p]');if(p){var s=document.querySelector('#nav select');if(s){s.value=p.getAttribute('data-p');if(s.onchange)s.onchange.call(s);}return;}
      var d=e.target.closest('[data-k]');if(d){var k=d.getAttribute('data-k');if(k==='avisos')verAvisos();else rsDrill(k);}
    });
    var v='resumen';try{v=sessionStorage.getItem('bl_vista')||'resumen';}catch(e){}
    ver(v);
  }
})();
</script>
