<style>
.gdet{border:1px solid #e3dfd3;border-radius:10px;padding:8px 12px;margin:8px 0;background:#fff}.gdet summary{cursor:pointer;font-weight:700;font-size:13px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:10px 0}.gl{display:flex;flex-direction:column;font-size:11px;font-weight:800;color:#555;text-transform:uppercase;gap:3px}.gl input,.gl select{font-size:14px;padding:7px;border:1px solid #ccc;border-radius:7px;text-transform:none;font-weight:400}

/* Tablero estilo PAMI con la paleta de Blumia: columnas de ancho fijo con encabezado de color, tarjetas en capas */
header{min-height:86px}
.hdr-pill{background:rgba(255,255,255,.16);border-radius:99px;padding:7px 16px;font-weight:700;font-size:14px;white-space:nowrap}
.hdr-cta{background:#F0605D;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:800;font-size:13px;cursor:pointer;font-family:var(--font);text-transform:uppercase;white-space:nowrap}
.hdr-cta:hover{background:#DD4B48}
#fTog{display:none;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer}
#kpiT{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:12px 16px 0}
.kpT{background:#fff;border-radius:8px;border-left:5px solid var(--green);padding:9px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;min-width:0}
.kpT.on{outline:2px solid var(--green);background:var(--glight)}
.kpT b{font-size:26px;font-weight:800;color:var(--green);line-height:1}
.kpT span{font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.03em;line-height:1.2}
.kpT.w{border-left-color:#F2B705}.kpT.w b{color:#9A7500}
.kpT.r{border-left-color:#D9534F}.kpT.r b{color:#B73A36}
.kpT.g{border-left-color:#8e95a0}.kpT.g b{color:#555}
.board{height:calc(100vh - 300px);min-height:300px;overflow-x:auto;overflow-y:hidden;align-items:stretch;padding:14px 16px 12px}
.board::-webkit-scrollbar{height:14px}.board::-webkit-scrollbar-track{background:#E4E1DA}.board::-webkit-scrollbar-thumb{background:var(--green);border-radius:8px;border:3px solid #E4E1DA}
.col{min-width:262px;max-width:262px;background:#EEECE6;border:none;border-radius:6px;display:flex;flex-direction:column;min-height:0}
.col-h{background:var(--green);color:#fff;padding:11px 12px;border-bottom:3px solid #8BD3A8;border-radius:6px 6px 0 0;flex-shrink:0}
.col-h span{color:#fff;font-size:12.5px;letter-spacing:.05em}
.col-h b{background:#fff;color:var(--green);border-radius:99px;padding:0 10px;font-size:13px;line-height:22px}
.col.res .col-h{background:#8A6D00;border-bottom-color:#F2B705}.col.res .col-h span{color:#fff}.col.res .col-h b{color:#8A6D00}
.col.desc .col-h{background:#8B2E2B;border-bottom-color:#D9534F}.col.desc .col-h span{color:#fff}.col.desc .col-h b{color:#8B2E2B}
.col.ok .col-h{background:#1E6B47}
.col-body{flex:1 1 0;overflow-y:auto;min-height:0;max-height:none;padding:8px;gap:0}
.col .acc{flex:1 1 0;min-height:0;max-height:none;padding:0}
.col.desc .acc summary,.col.res .acc summary{color:#333}
.card{background:#fff;border:none;border-left:6px solid #C9C5BB;border-radius:4px;padding:11px 12px 9px;margin-bottom:10px;cursor:pointer;color:#1A1A1A}
.card:hover{box-shadow:0 2px 10px rgba(26,102,69,.22)}
.card.cA{border-left-color:#1E8E5A}.card.cBp{border-left-color:#8BD3A8}.card.cB{border-left-color:#F2B705}.card.cC{border-left-color:#D9534F}
.card .top{display:flex;justify-content:space-between;gap:6px;align-items:flex-start;margin-right:14px}
.card .top b{font-size:15px;line-height:1.25;font-weight:800}
.card .bdg{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0}
.card .bdg small{font-size:9.5px;font-weight:800;color:#777;letter-spacing:.05em}
.card .nota{float:none;width:auto;min-width:30px;height:auto;line-height:1;padding:5px 8px;font-size:14px;border-radius:5px}
.nBp{background:#8BD3A8;color:#14502F}
.card .fo{font-size:12.5px;color:#555;font-weight:600;margin-top:4px;line-height:1.35}
.card .ln{display:flex;gap:8px;margin-top:7px;padding-top:6px;border-top:1px solid #EFEDE8;font-size:12.5px;line-height:1.35;align-items:flex-start}
.card .ln>i{font-style:normal;width:16px;flex-shrink:0;text-align:center}
.card .tags{display:flex;gap:4px;flex-wrap:wrap}
.card .tag{margin-top:0;font-size:10.5px;text-transform:none;letter-spacing:0;font-weight:700;border-radius:4px;padding:2px 7px;background:#ECEAE4;color:#444}
.tag.zok{background:#D9F3E4;color:#14502F}.tag.zfu{background:#FDE3E1;color:#9B2C28}
.tag.pdeb{background:#E6EBF2;color:#3F4B66}.tag.plin{background:#D9F3E4;color:#14502F}.tag.penc{background:#FFF1D6;color:#7A5200}
.tag.cit{background:#D9F3E4;color:#14502F;border:1px solid #1E8E5A}.tag.cit.hoy{background:#176B42;color:#fff}
.tag.ctc{background:#FFF1D6;color:#7A5200;border:1px solid #F2B705}
.tag.rj{background:#FDE2E2;color:#9B1C1C}.tag.am{background:#FFF3CD;color:#7a5500}
.card .cx{top:6px;right:6px}
.modal{max-width:760px}
.fh{background:var(--glight);padding:14px 22px;border-bottom:1px solid var(--line)}
.fh .ecs{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px}
.fh .ec{display:inline-flex;align-items:center;gap:6px;padding-bottom:3px;border-bottom:3px solid #C9C5BB;font-size:12px;font-weight:700;color:#555}
.fh .ec .nota{float:none;min-width:22px;height:22px;line-height:22px;padding:0 5px}
.fal{padding:10px 22px 0}
.fal div{border-radius:6px;padding:8px 12px;font-size:13px;margin-bottom:6px;background:#FFF3CD;color:#7a5500}
.fal div.r{background:#FDE2E2;color:#9B1C1C}.fal div.v{background:#D9F3E4;color:#14502F}.fal div.a{background:#E6EBF2;color:#3F4B66}
#mbody .fwrap{width:calc(100% + 48px)}
.fb{padding:6px 22px 20px}
.fb .sec{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin:18px 0 8px;border-bottom:2px solid var(--glight);padding-bottom:4px}
.fp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.fp .pn{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#fff}
.fp .pn h4{margin:0 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
@media(max-width:640px){.fp{grid-template-columns:1fr}}
.fb textarea,.fb select{width:100%;border:1px solid #ccc;border-radius:6px;padding:8px;font-family:var(--font);font-size:13px;box-sizing:border-box}
</style>
<script>
(function(){
  var DIAS_ALERTA=7,KF='';
  var COLS_PUROS=COLS; // [titulo, estados]
  function esc(s){return avEsc(s);}
  function notaCls(n){n=String(n||'').trim();return n==='A'?'cA':n==='B+'?'cBp':n==='B'?'cB':n==='C'?'cC':'';}
  function notaClsBadge(n){n=String(n||'').trim();return n==='A'?'nA':n==='B+'?'nBp':n==='B'?'nB':n==='C'?'nC':'';}
  function etapaNota(c){
    if(c.notaPresEmp)return [c.notaPresEmp,'FINAL'];if(c.notaScrEmp)return [c.notaScrEmp,'EMP'];
    if(c.notaComp)return [c.notaComp,'COMP'];if(c.notaScr)return [c.notaScr,'SCR'];if(c.nota)return [c.nota,'CV'];return ['',''];
  }
  function dias(c){var m=c.movMs;return m?Math.floor((Date.now()-m)/864e5):0;} // sin historial todavía = no se sabe, no se alerta
  function terminal(c){var m=metEstado(c.estado);return !m||m.t==='desc'||m.t==='cont';}
  function money(n){if(!n)return '';if(n<1e6)return '$'+Math.round(n/1e3)+' mil';var m=n/1e6;return '$'+(m>=10?Math.round(m):m.toLocaleString('es-AR',{maximumFractionDigits:1}))+' M';}
  function fmtForm(f){var t=String(f||'').split(/\s+[—–-]\s+/);var a=t.shift().split(' ').map(function(w,i){return i?w.toLowerCase():w;}).join(' ');return [a].concat(t).join(' · ');}
  function fmtTel(t){var d=String(t||'').replace(/\D/g,'');if(d.length===13&&d.indexOf('549')===0)return '+54 9 '+d.slice(3,6)+' '+d.slice(6,9)+'-'+d.slice(9);if(d.length===10)return d.slice(0,3)+' '+d.slice(3,6)+'-'+d.slice(6);return String(t||'');}
  function fmtMiles(v){var d=String(v==null?'':v).replace(/\D/g,'');return d?Number(d).toLocaleString('es-AR'):String(v||'');}
  window.fmtMiles=fmtMiles;window.fmtForm=fmtForm;window.fmtTel=fmtTel;window.money=money; // también los usa la ficha, que vive en otro bloque
  window.dias=dias;
  window.cardN=function(c){
    var en=etapaNota(c),n=en[0],ep=en[1],m=metEstado(c.estado)||{t:'act'};
    var fo=c.formacion&&c.formacion!=='Sin dato'?'<div class="fo" title="'+esc(fmtForm(c.formacion))+'">🎓 '+esc(String(fmtForm(c.formacion)).slice(0,80))+'</div>':'';
    var zt=c.zona&&c.zona!=='Sin dato'?'<span class="tag '+(/fuera/i.test(c.zona)?'zfu':'zok')+'">'+(/fuera/i.test(c.zona)?'Fuera de zona':'En zona')+'</span>':'';
    var ub='<div class="ln ub"><i>📍</i><span>'+esc(c.zona||'—')+' '+zt+'</span></div>';
    var pr='';
    if(c.pretNum>0){var cl=typeof BANDA_REF==='number'&&BANDA_REF>0?(c.pretNum<BANDA_REF*0.95?'pdeb':c.pretNum>BANDA_REF*1.05?'penc':'plin'):'';pr='<div class="ln"><i>💰</i><div class="tags"><span class="tag '+cl+'" title="Pretensión'+(cl?' respecto de la banda de referencia':'')+'">'+money(c.pretNum)+(cl==='pdeb'?' · debajo de la banda':cl==='penc'?' · sobre la banda':cl==='plin'?' · en la banda':'')+'</span></div></div>';}
    else if(c.pretension){pr='<div class="ln"><i>💰</i><span>$'+fmtMiles(c.pretension)+'</span></div>';}
    var t1='',cf=avFecha(c.cita);
    if(c.cita){var hoy=false;if(cf){var d0=new Date();d0.setHours(0,0,0,0);hoy=cf>=d0.getTime()&&cf<d0.getTime()+864e5;}t1+='<span class="tag cit'+(hoy?' hoy':'')+'">📅 '+esc(c.cita)+'</span>';}
    if(c.contactado)t1+='<span class="tag ctc">💬 '+esc(c.contactado)+' <button title="Borrar la marca de contacto" style="border:none;background:none;color:#7A5200;cursor:pointer;font-weight:800;padding:0 0 0 3px" onclick="event.stopPropagation();borrarMarca('+c.fila+')">✕</button></span>';
    var fl='';
    if(/^pendiente$/i.test(c.estado))fl+='<span class="tag am">⏳ Analizando CV…</span>';
    if(/^revisar$/i.test(c.estado))fl+='<span class="tag am">⚠ Revisar CV</span>';
    (c.previos||[]).slice(0,1).forEach(function(p){fl+='<span class="tag '+(/^Descartad/i.test(p.estado)?'rj':'am')+'" title="Ya se postuló antes">↩ Ya se postuló · '+esc(p.busq)+': '+esc(p.estado)+'</span>';});
    if(m.t==='act'&&dias(c)>=DIAS_ALERTA&&!/agendad/i.test(c.estado))fl+='<span class="tag rj">🕒 '+dias(c)+' d sin movimiento</span>';
    if(/recomend|referid/i.test(c.fuente||''))fl+='<span class="tag zok" title="'+esc(c.fuente)+'">⭐ Recomendado</span>';
    fl+=tagsTarjeta(c);
    if(c.ordenCli>0)fl+='<span class="tag zok" title="Orden en el PDF para el cliente">N.º '+c.ordenCli+' en el ranking</span>';
    var rk='';
    if(m.t!=='desc'&&m.lv>=3){var nr=DATA.filter(function(x){var mm=metEstado(x.estado);return mm&&mm.t!=='desc'&&mm.lv>=3;}).length,op='<option value="0">Sin orden</option>';for(var q=1;q<=Math.max(nr,1);q++)op+='<option value="'+q+'"'+(c.ordenCli===q?' selected':'')+'>'+q+'</option>';
      rk='<div class="ln rk"><i>🏆</i><label style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#0F3F27;white-space:nowrap" title="Orden para el cliente (PDF)">Orden <select aria-label="Orden para el cliente" onclick="event.stopPropagation()" onchange="event.stopPropagation();rkSet('+c.fila+',+this.value)" style="height:30px;width:64px;border:1.5px solid var(--line);border-radius:8px;padding:0 6px;font:700 12px inherit;font-family:inherit;background:#fff">'+op+'</select></label></div>';
      if(c.ordenCli>0){var vv=c.valCli||'Se ajusta';rk+='<div class="ln rk"><i></i><select aria-label="Valoración para el cliente" title="Valoración en el PDF para el cliente" onclick="event.stopPropagation()" onchange="event.stopPropagation();rkVal('+c.fila+',this.value)" style="height:30px;max-width:100%;border:1.5px solid var(--line);border-radius:8px;padding:0 6px;font:700 12px inherit;font-family:inherit;background:#fff">'+['Se ajusta','Se ajusta con observaciones'].map(function(o){return '<option'+(vv===o?' selected':'')+'>'+o+'</option>';}).join('')+'</select></div>';}}
    return '<div class="card '+notaCls(n)+'" data-fila="'+c.fila+'" onclick="ficha('+c.fila+')">'
      +'<div class="top"><b>'+esc(c.nombre)+'</b><div class="bdg">'+(n?'<span class="nota '+notaClsBadge(n)+'">'+esc(n)+'</span><small>'+ep+'</small>':'')+'</div></div>'+fo+ub+pr
      +rk+(t1?'<div class="ln"><i>🗓</i><div class="tags">'+t1+'</div></div>':'')+(fl?'<div class="ln"><i>⚑</i><div class="tags">'+fl+'</div></div>':'')+'</div>';
  };
  function rkGuardar(l,ant){google.script.run.withSuccessHandler(function(){toast();}).withFailureHandler(function(e){DATA.forEach(function(c){c.ordenCli=ant[c.fila]||0;});renderBoardN();blAlert('No se pudo guardar el orden: '+((e&&e.message)||e));}).rankingGuardar(PERFIL,l.map(function(f){var c=DATA.find(function(x){return x.fila===f;});return {fila:f,val:c&&c.valCli||'Se ajusta'};}));}
  window.rkVal=function(fila,v){var c=DATA.find(function(x){return x.fila===fila;});if(!c)return;var ant={};DATA.forEach(function(x){ant[x.fila]=x.ordenCli;});c.valCli=v;
    rkGuardar(DATA.filter(function(x){return x.ordenCli>0;}).sort(function(a,b){return a.ordenCli-b.ordenCli;}).map(function(x){return x.fila;}),ant);};
  window.vaciarBusqueda=function(){
    google.script.run.withSuccessHandler(function(i){
      if(!i.candidatos){blAlert('La búsqueda no tiene candidatos para borrar.');return;}
      blPrompt('Esto borra los '+i.candidatos+' candidatos de «'+i.nombre+'» con su historial, contactos y evaluaciones, y manda sus archivos de Drive a la papelera. No se puede deshacer desde acá. Para confirmar, escribí el nombre de la búsqueda:','',function(t){
        blAlert('Vaciando la búsqueda… puede tardar un momento.');
        google.script.run.withSuccessHandler(function(r){blAlert('Listo: se borraron '+r.candidatos+' candidatos, '+r.historial+' movimientos de historial y '+r.archivos+' archivos pasaron a la papelera de Drive.',function(){window.top.location.reload();});}).withFailureHandler(function(e){blAlert((e&&e.message)||e);}).vaciarBusqueda(PERFIL,t,quienSoy());
      },{titulo:'Vaciar la búsqueda',si:'Borrar todo',peligro:true});
    }).withFailureHandler(function(e){blAlert((e&&e.message)||e);}).vaciarBusquedaInfo(PERFIL);
  };
  window.rkSet=function(fila,pos){
    var l=DATA.filter(function(c){return c.ordenCli>0&&c.fila!==fila;}).sort(function(a,b){return a.ordenCli-b.ordenCli;}).map(function(c){return c.fila;});
    if(pos>0)l.splice(Math.min(pos-1,l.length),0,fila);
    var ant={};DATA.forEach(function(c){ant[c.fila]=c.ordenCli;});
    DATA.forEach(function(c){var i=l.indexOf(c.fila);c.ordenCli=i>=0?i+1:0;});
    var val=function(f){var c=DATA.find(function(x){return x.fila===f;});return c&&c.valCli||'Se ajusta';};
    renderBoardN();
    google.script.run.withSuccessHandler(function(){toast();}).withFailureHandler(function(e){DATA.forEach(function(c){c.ordenCli=ant[c.fila]||0;});renderBoardN();blAlert('No se pudo guardar el orden: '+((e&&e.message)||e));}).rankingGuardar(PERFIL,l.map(function(f){return {fila:f,val:val(f)};}));
  };
  function ordCard(a,b){
    if(a.ordenCli>0||b.ordenCli>0){if(!(a.ordenCli>0))return 1;if(!(b.ordenCli>0))return -1;return a.ordenCli-b.ordenCli;}
    var now=Date.now()-36e5,fa=avFecha(a.cita),fb=avFecha(b.cita),ra=fa?(fa>=now?0:2):1,rb=fb?(fb>=now?0:2):1;
    if(ra!==rb)return ra-rb;if(ra===0)return fa-fb;return (b.movMs||b.recMs||0)-(a.movMs||a.recMs||0);
  }
  function acordeonN(titulo,clase,tipos,extras,corto){
    var lista=tipos.slice();
    DATA.forEach(function(c){if(extras(c.estado)&&lista.indexOf(c.estado)===-1)lista.push(c.estado);});
    var total=DATA.filter(function(c){return extras(c.estado);}).length;
    var h='<div class="col '+clase+'"><div class="col-h"><span>'+titulo+'</span><b>'+total+'</b></div><div class="acc">';
    lista.forEach(function(tipo){
      var items=DATA.filter(function(c){return c.estado===tipo;}).sort(ordCard);
      var etq=corto?tipo.replace(corto,'').trim():tipo;
      h+='<details'+(items.length?'':' class="vacio"')+'><summary><span>▸ '+esc(etq||tipo)+'</span><span class="cnt">'+(items.length||'')+'</span></summary><div class="dbody" data-estado="'+esc(tipo)+'">'+items.map(cardN).join('')+'</div></details>';
    });
    return h+'</div></div>';
  }
  function iniciarSortable(){
    if(typeof Sortable==='undefined')return;
    document.querySelectorAll('.col-body,.dbody').forEach(function(col){new Sortable(col,{group:'kb',animation:150,forceFallback:true,fallbackOnBody:true,delay:300,delayOnTouchOnly:true,touchStartThreshold:10,onChoose:function(){try{navigator.vibrate&&navigator.vibrate(25);}catch(e){}},scroll:true,bubbleScroll:true,scrollSensitivity:80,scrollSpeed:15,onEnd:function(evt){
      var fila=+evt.item.dataset.fila,estado=evt.to.dataset.estado,cc=DATA_ALL.find(function(x){return x.fila===fila;});
      if(cc&&estado)cc.estado=estado;
      if(estado&&evt.from!==evt.to){google.script.run.withSuccessHandler(function(){toast();if(/^Descartad/i.test(estado))pedirMotivo(fila,true);else{renderBoardN();}}).withFailureHandler(function(e){blAlert('Error: '+e.message,function(){window.top.location.reload();});}).moverEstado(PERFIL,fila,estado,quienSoy());}
    }});});
  }
  window.renderBoardN=function(){
    var b=document.getElementById('board');if(!b)return;
    var h='';
    COLS_PUROS.forEach(function(x){
      var t=x[0],est=x[1],items=DATA.filter(function(c){return est.indexOf(c.estado)>-1;}).sort(ordCard);
      h+='<div class="col'+(t==='Contratado'?' ok':'')+'"><div class="col-h"><span>'+t+'</span><b>'+items.length+'</b></div><div class="col-body" data-estado="'+BASE[t]+'">'+items.map(cardN).join('')+'</div></div>';
    });
    h+=acordeonN('Reservas','res',RES_TIPOS,function(e){return /reserva/i.test(e);},'');
    h+=acordeonN('Descartados','desc',DESC_TIPOS,function(e){return /^Descartad/.test(e);},'Descartado');
    b.innerHTML=h;iniciarSortable();pintarKpi();filtrar();
  };
  // ---- indicadores clickeables
  function kpiOk(k,c){
    var m=metEstado(c.estado);if(!m)return false;var h0=new Date();h0.setHours(0,0,0,0);
    if(k==='all')return true;if(k==='act')return m.t==='act';
    if(k==='cit'){var f=avFecha(c.cita);return m.t==='act'&&!!f&&f>=h0.getTime()&&f<h0.getTime()+864e5;}
    if(k==='nue'){return !!c.recMs&&Date.now()-c.recMs<=7*864e5;}
    if(k==='ctc'){return avPendientes([c]).some(function(x){return /^contactar/.test(x.k);});}
    if(k==='mov')return m.t==='act'&&dias(c)>=DIAS_ALERTA&&!/agendad/i.test(c.estado);
    if(k==='ffo'){return avPendientes([c]).some(function(x){return /^sincargar/.test(x.k);});}
    if(k==='fet'){return avPendientes([c]).some(function(x){return /^falta/.test(x.k);});}
    if(k==='scr')return m.t==='act'&&m.lv===1;if(k==='comp')return m.t==='act'&&m.lv===2;if(k==='emp')return m.t==='act'&&m.lv>=3;
    if(k==='res')return m.t==='res';if(k==='desc')return m.t==='desc';return true;
  }
  // ---- botones flotantes (pendientes y agenda) y tira con las próximas entrevistas
  function proximas(){var ah=Date.now()-36e5,L=[];DATA.forEach(function(c){var f=avFecha(c.cita);if(f&&f>=ah&&metEstado(c.estado)&&metEstado(c.estado).t==='act')L.push({f:f,c:c});});L.sort(function(a,b){return a.f-b.f;});return L;}
  function cuando(f){var d=new Date(f),h0=new Date();h0.setHours(0,0,0,0);var dif=Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-h0)/864e5),hh=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);return (dif<=0?'Hoy':dif===1?'Mañana':('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2))+' '+hh;}
  function corto(n){var p=String(n||'').trim().split(/\s+/);return p.length>1?p[0]+' '+p[p.length-1].charAt(0)+'.':p[0]||'';}

  function dockPintar(){
    var nv=0;try{nv=(typeof avLS==='function'&&avLS('sinver'))||0;}catch(e){}
    var P=(typeof AV_PEND!=='undefined'&&AV_PEND)||[],urg=P.filter(function(x){return x.urg;}).length,L=proximas(),min=false;

    var r=document.getElementById('ftogRes'),cf=document.getElementById('contadorF');if(r)r.textContent=n&&cf?cf.textContent:'';
  }
  function cmpPintar(){var b=document.getElementById('board'),k=document.getElementById('cmpK'),on=false;try{on=localStorage.getItem('bl_compacto')==='1';}catch(e){}if(b)b.classList.toggle('compact',on);if(k){k.setAttribute('aria-pressed',on?'true':'false');k.textContent=on?'Vista completa':'Vista compacta';}}
  window.cmpToggle=function(){var on=false;try{on=localStorage.getItem('bl_compacto')==='1';localStorage.setItem('bl_compacto',on?'':'1');}catch(e){}cmpPintar();};
  window.ftogToggle=function(){var f=document.querySelector('.filtros');if(!f)return;f.classList.toggle('open');ftogPintar();if(window.ajustarBoard)setTimeout(ajustarBoard,30);};
  function pintarKpi(){
    var K=[['ctc','w','Falta contactar'],['mov','r','Sin movimiento'],['ffo','r','Falta formulario'],['fet','r','Falta etapa']];
    var e=document.getElementById('kpiT');if(!e)return;
    e.innerHTML=K.map(function(k){var n=DATA.filter(function(c){return kpiOk(k[0],c);}).length;return '<div class="kpT '+(n?k[1]:'g')+(KF===k[0]&&k[0]!=='all'?' on':'')+'" title="'+(KF===k[0]?'Quitar filtro':'Ver estos candidatos')+'" onclick="kpiClickT(\''+k[0]+'\')"><b>'+n+'</b><span>'+k[2]+'</span></div>';}).join('');

    });

    document.querySelectorAll('.col').forEach(function(col){var b=col.querySelector('.col-h b');if(!b)return;b.textContent=col.querySelectorAll('.card:not([style*="none"])').length;});

    var cf=document.getElementById('contadorF');if(cf)cf.textContent=hay?visibles+' de '+DATA.length+' candidatos':'';

  var limpiar0=window.limpiarFiltros;window.limpiarFiltros=function(){KF='';var fo=document.getElementById('fFuente');if(fo)fo.value='';limpiar0();pintarKpi();filtrar();};

  window.addEventListener('resize',ajustarBoard);

  var f=document.querySelector('.filtros');
  if(f)f.insertAdjacentHTML('beforebegin','<div id="kpiT"></div>');
  var hd=document.querySelector('header'),h1=hd&&hd.querySelector('h1');

  setTimeout(ajustarBoard,300);setTimeout(ajustarBoard,1500);
})();

    var notasEmp=/screening empresa|presencial empresa|avanza a empresa|entrevista empresa|reserva screening empresa|reserva presencial empresa/i.test(c.estado)?['screening-empresa','presencial-empresa'].map(function(ep){return '<div class="notarow"><span>'+(ep==='screening-empresa'?'Emp. screening':'Emp. presencial')+'</span>'+['A','B','C'].map(function(n){return '<button class="nb'+(String(ep==='screening-empresa'?c.notaScrEmp:c.notaPresEmp).trim()===n?' on '+n.replace('+','p'):'')+'" onclick="setNotaEmp('+c.fila+',\''+ep+'\',\''+n+'\',this)">'+n+'</button>';}).join('')+'</div>';}).join(''):'';
    var notas='<div class="notabox"><div class="notatit">Poner nota manual</div>'+['cv','screening','competencias'].map(function(et){return '<div class="notarow"><span>'+({cv:'CV',screening:'Screening',competencias:'Competencias'}[et])+'</span>'+['A','B+','B','C'].map(function(n){return '<button class="nb'+(String({cv:c.nota,screening:c.notaScr,competencias:c.notaComp}[et]||'').trim()===n?' on '+n.replace('+','p'):'')+'" onclick="setNota('+c.fila+',\''+et+'\',\''+n+'\',this)">'+n+'</button>';}).join('')+'</div>';}).join('')+notasEmp+'</div>';
    var contacto=(c.contactado?'<div class="frow"><span class="fl">Último contacto</span><span class="fv">'+esc(c.contactado)+' <a href="#" onclick="borrarMarca('+c.fila+');return false" style="color:#aaa;font-size:11px;text-decoration:none;margin-left:6px">✕ borrar</a></span></div>':'')
      +'<div class="frow"><span class="fl">Registro de contactos</span><span class="fv" id="regCont" style="white-space:pre-line">cargando…</span></div>';
    var h='<div class="fwrap" style="margin:-24px"><div class="fh"><div style="font-size:16px;color:#0F3F27"><b>'+esc(c.estado)+'</b></div><div class="ecs">'+ecs+'</div></div>'
      +(al?'<div class="fal">'+al+'</div>':'')
      +'<div class="fb"><div class="acts all">'+contBtn+cvBtn+agBtn+'<button class="mbtn alt mas-t" onclick="var b=this.nextElementSibling;b.classList.toggle(\'show\');this.textContent=b.classList.contains(\'show\')?\'Menos opciones ▴\':\'Más opciones ▾\'">Más opciones ▾</button><div class="mas-b">'+etapaBtn('screening',c.scrPDF,'Screening','📝 Cargar screening')+etapaBtn('competencias',c.compPDF,'Competencias','💼 Cargar competencias')+btn(c.postulacion,'📄 Ver postulación')+btn(c.informe,'📄 Ver informe')+genBtn+bancoBtn+'</div></div>'+agendarHtml(c)
      +'<div class="fpw"><button class="fpe" title="Editar datos del candidato" onclick="panelTog(\'edPanel\')">✏️</button><div class="fp"><div class="pn"><h4>Contacto</h4>'+row('Teléfono',esc(fmtTel(c.tel)))+row('Email',esc(c.mail))+row('Zona',esc(c.zona))+'</div>'
      +'<div class="pn"><h4>Postulación</h4>'+row('Recibido',esc(c.recibido))+row('Llegó por',esc(c.fuente))+row('Formación',esc(fmtForm(c.formacion)))+row('Pretensión',c.pretension?'$'+fmtMiles(c.pretension):'')+'</div></div></div>'+editarHtml(c)
      +(c.resumen?'<div class="sec">Análisis del CV</div><div class="fres" style="margin:0">'+esc(c.resumen)+'</div>':'')
      +'<div class="sec">Calificaciones</div>'+notas
      +((c.cita||c.historial)?'<div class="sec">Entrevistas (calendario)</div>'+row('Cita agendada',esc(c.cita))+(c.historial?'<div style="white-space:pre-line;font-size:13px">'+esc(c.historial)+'</div>':''):'')
      +'<div class="sec">Contacto con el candidato</div>'+contacto
      +'<div class="sec">Observaciones</div><textarea id="gObs" rows="3" placeholder="Ampliá cualquier dato del candidato">'+esc(c.obs||'')+'</textarea><div class="obsb"><button class="mbtn sm" id="gObsB" onclick="guardarObs('+c.fila+',this)">Guardar</button></div>'
      +'<div class="sec">Historial</div><div id="histCand" style="font-size:13px">cargando…</div><div class="fdel"><button title="Eliminar a este candidato" onclick="eliminar('+c.fila+')">🗑 Eliminar candidato</button></div></div></div>';
    document.getElementById('mtit').textContent=c.nombre;document.getElementById('mbody').innerHTML=h;document.getElementById('modal').classList.add('show');
    cargarRegCont(f);cargarHist(f);
  };
  function inp(id,l,v,t){return '<label class="gl">'+l+'<input id="'+id+'" type="'+(t||'text')+'" value="'+esc(v||'')+'"></label>';}
  function editarHtml(c){
    return '<div class="edp" id="edPanel" hidden><div class="ggrid">'+inp('gdNom','Nombre',c.nombre)+inp('gdTel','Teléfono',c.tel)+inp('gdDni','DNI',c.dni)+inp('gdMail','Mail',c.mail==='Sin dato'?'':c.mail)+inp('gdFor','Formación',c.formacion)+inp('gdZon','Zona',c.zona)+inp('gdFue','Llegó por (ej: Recomendado por Laura Pérez)',c.fuente)+inp('gdPre','Pretensión ($)',c.pretension)+'</div><div class="obsb"><button class="mbtn sm" onclick="guardarDatosC('+c.fila+',this)">Guardar</button></div></div>';
  }
  function agendarHtml(c){
    var hoy=new Date(Date.now()+864e5).toISOString().slice(0,10);
    return '<div class="edp" id="agPanel" hidden><div class="ggrid"><label class="gl">Tipo<select id="gaTipo"><option value="screening">Screening</option><option value="competencias">Competencias</option><option value="empresa-virtual">Empresa (virtual)</option><option value="empresa-presencial">Empresa (presencial)</option></select></label>'+inp('gaFec','Día',hoy,'date')+inp('gaHor','Hora','10:00','time')+'<label class="gl">Duración<select id="gaDur"><option>30</option><option>45</option><option>60</option><option>90</option></select></label>'+inp('gaLug','Lugar / link (opcional)','')+'</div><div class="obsb"><span class="hint">Se crea en el calendario de Blumia y se invita por mail al candidato (si tiene).</span><button class="mbtn sm" onclick="agendarC('+c.fila+',this)">Agendar</button></div></div>';
  }
  window.panelTog=function(id){var e=document.getElementById(id);if(!e)return;['edPanel','agPanel'].forEach(function(k){var x=document.getElementById(k);if(x&&k!==id)x.hidden=true;});e.hidden=!e.hidden;};
  function val(id){var e=document.getElementById(id);return e?e.value:'';}
  function fail(b,t){return function(e){b.disabled=false;b.textContent=t;alert('No se pudo: '+((e&&e.message)||e));};}
  function refrescar(){setTimeout(function(){window.top.location.reload();},300);}
  window.guardarDatosC=function(f,b){
    var d={nombre:val('gdNom'),tel:val('gdTel'),dni:val('gdDni'),mail:val('gdMail'),formacion:val('gdFor'),zona:val('gdZon'),fuente:val('gdFue'),pretension:val('gdPre')},t=b.textContent;
    b.disabled=true;b.textContent='Guardando…';
    google.script.run.withSuccessHandler(function(r){toast();refrescar();}).withFailureHandler(fail(b,t)).guardarDatosCandidato(PERFIL,f,d,quienSoy());
  };
  window.agendarC=function(f,b,forzar){
    var t=b.textContent;b.disabled=true;b.textContent='Agendando…';
    google.script.run.withSuccessHandler(function(r){
      if(r&&r.conflicto){b.disabled=false;b.textContent=t;blConfirm('Ya hay algo en el calendario a esa hora:\n- '+r.eventos.join('\n- ')+'\n\n¿Agendar igual?',function(){agendarC(f,b,true);},{si:'Agendar igual'});return;}
      alert('Agendado: '+r.cita+(r.invitado?'\nSe envió la invitación por mail.':'\nEl candidato no tiene mail: avisale por WhatsApp.'));refrescar();
    }).withFailureHandler(fail(b,t)).agendarCitaTablero(PERFIL,f,val('gaTipo'),val('gaFec'),val('gaHor'),val('gaDur'),val('gaLug'),!!forzar,quienSoy());
  };
  function parseCita(t){var m=/(\d{2})\/(\d{2})\/(\d{4}).*?(\d{2}):(\d{2})/.exec(String(t||''));return m?new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5]):null;}
  window.abrirAgenda=function(){
    var ahora=Date.now()-36e5,L=[];
    DATA.forEach(function(c){var d=parseCita(c.cita);if(d&&d.getTime()>=ahora)L.push({d:d,c:c});});
    L.sort(function(a,b){return a.d-b.d;});
    var dias=['dom','lun','mar','mié','jue','vie','sáb'],h='',ult='';
    L.forEach(function(x){
      var k=x.d.toDateString();
      if(k!==ult){ult=k;h+='<div class="sec" style="margin-top:12px">'+dias[x.d.getDay()]+' '+String(x.d.getDate()).padStart(2,'0')+'/'+String(x.d.getMonth()+1).padStart(2,'0')+'</div>';}
      h+='<div class="frow" style="cursor:pointer" onclick="ficha('+x.c.fila+')"><span class="fl">'+String(x.d.getHours()).padStart(2,'0')+':'+String(x.d.getMinutes()).padStart(2,'0')+'</span><span class="fv"><b>'+esc(x.c.nombre)+'</b> · '+esc(x.c.estado)+'</span></div>';
    });
    document.getElementById('mtit').textContent='📅 Agenda de entrevistas';
    document.getElementById('mbody').innerHTML=h||'<div style="padding:20px;color:#777">No hay entrevistas agendadas por delante.</div>';
    document.getElementById('modal').classList.add('show');
  };
  window.copiaAhora=function(){google.script.run.withSuccessHandler(function(r){alert('Copia hecha ('+r.fecha+'). Está en Drive, carpeta «Copias de seguridad Blumia». También se hace sola todos los días.');}).withFailureHandler(function(e){alert('No se pudo: '+((e&&e.message)||e));}).copiaAhoraBlumia('sesion');};
  window.guardarObs=function(f,b){
    var t=document.getElementById('gObs').value;b.disabled=true;b.textContent='Guardando…';
    google.script.run.withSuccessHandler(function(r){b.disabled=false;b.textContent='Guardar';var c=DATA_ALL.find(function(x){return x.fila===f;});if(c)c.obs=r.obs;toast();}).withFailureHandler(function(e){b.disabled=false;b.textContent='Guardar';alert('Error: '+e.message);}).guardarObservaciones(PERFIL,f,t,quienSoy());
  };
})();
</script>

<script>
(function(){
  var nav=document.getElementById('nav'),hd=document.querySelector('header');if(!nav||!hd)return;
  var sel=nav.querySelector('select'),im=hd.querySelector('img');
  var irInicio=function(){window.top.location.href=(typeof URL_APP==='string'?URL_APP:'')+'?tipo=inicio';};
  if(im){im.style.cursor='pointer';im.title='Volver al Inicio';im.onclick=irInicio;}
  if(sel&&im){
    var og=sel.options[sel.selectedIndex],emp=(og&&og.parentNode&&og.parentNode.label)||'';
    var w=document.createElement('div');w.className='htit';w.innerHTML='<small></small>';w.firstChild.textContent=emp;w.appendChild(sel);
    im.insertAdjacentElement('afterend',w);
    var fit=function(){var c=document.createElement('canvas').getContext('2d'),cs=getComputedStyle(sel);c.font=cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;var tx=og?og.textContent:'';sel.style.width=Math.min(Math.ceil(c.measureText(tx).width)+30,Math.max(200,hd.clientWidth-60))+'px';};
    fit();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);window.addEventListener('resize',fit);
  }
  // 🏠 solo el ícono, primero de la barra
  var ini=nav.querySelector('button[title^="Volver al inicio"]');
  if(ini){ini.id='inicioBtn';ini.className='';ini.textContent='🏠';ini.title='Volver al Inicio';nav.insertBefore(ini,nav.firstChild);}
  // 📅 Agenda arriba como un botón más, con globito de las entrevistas de hoy
  var tabs=document.querySelector('.rs-tabs'),agT=tabs&&tabs.querySelector('button[onclick^="abrirAgenda"]');if(agT)agT.remove();
  var pc=function(s){var m=/(\d{2})\/(\d{2})\/(\d{4}).*?(\d{2}):(\d{2})/.exec(String(s||''));return m?new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5]):null;};
  var hoy=0,prox=0,ahora=Date.now()-36e5,d0=new Date();
  (typeof DATA!=='undefined'?DATA:[]).forEach(function(c){var d=pc(c.cita);if(!d||d.getTime()<ahora)return;prox++;if(d.toDateString()===d0.toDateString())hoy++;});
  var ag=document.createElement('button');ag.id='agBtn';ag.setAttribute('onclick','abrirAgenda()');
  ag.title=hoy?(hoy+' entrevista'+(hoy===1?'':'s')+' hoy · '+prox+' próximas'):(prox?prox+' entrevista'+(prox===1?'':'s')+' próxima'+(prox===1?'':'s'):'Sin entrevistas agendadas');
  ag.innerHTML='📅 Agenda'+(hoy?'<span class="agb hoy">'+hoy+'</span>':(prox?'<span class="agb">'+prox+'</span>':''));
  var bell=document.getElementById('avBtn');
  if(bell&&bell.nextSibling)nav.insertBefore(ag,bell.nextSibling);else nav.insertBefore(ag,nav.children[1]||null);
})();
</script>
<script>

    document.querySelectorAll('header select:not([aria-label])').forEach(function(b){b.setAttribute('aria-label','Cambiar de búsqueda');});
    document.querySelectorAll('.mx:not([aria-label])').forEach(function(b){b.setAttribute('aria-label','Cerrar');});
    document.querySelectorAll('.card:not([tabindex])').forEach(function(c){c.setAttribute('tabindex','0');c.setAttribute('role','button');});
    document.querySelectorAll('.nota:not([aria-label])').forEach(function(n){n.setAttribute('aria-label','Nota '+n.textContent.trim());});
  }
  var t=null;new MutationObserver(function(){clearTimeout(t);t=setTimeout(fix,150);}).observe(document.body,{childList:true,subtree:true});fix();
  var qb=document.getElementById('quienBtn');if(qb&&qb.parentNode)qb.parentNode.appendChild(qb); // el avatar va al final también para el teclado
  document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('card')){e.preventDefault();e.target.click();}});

})();
</script>

(function(){

    document.getElementById('mbody').innerHTML=(L.length?L.map(function(x,i){return '<div style="padding:10px 0;border-bottom:1px solid #eee"><div style="font-weight:700;font-size:13px;margin-bottom:4px">'+avEsc(x[0])+'</div><div style="display:flex;gap:8px;align-items:center"><input readonly value="'+avEsc(x[1])+'" style="flex:1;min-width:0;border:1.5px solid #D5E0CE;border-radius:8px;padding:8px 10px;font-size:12px" onfocus="this.select()"><button class="mbtn sm" onclick="copiarEnlace('+i+',this)">Copiar</button><a class="mbtn sm alt" href="'+avEsc(x[1])+'" target="_blank">Abrir</a></div></div>';}).join(''):'<div style="color:#777;font-size:14px">Esta búsqueda todavía no tiene enlaces cargados.</div>');
    document.getElementById('modal').classList.add('show');
  };
  window.copiarEnlace=function(i,b){
    var u=ENLACES[i][1],ok=function(){var o=b.textContent;b.textContent='¡Copiado!';setTimeout(function(){b.textContent=o;},1500);};
    try{navigator.clipboard.writeText(u).then(ok,function(){b.previousElementSibling.select();document.execCommand('copy');ok();});}catch(e){b.previousElementSibling.select();try{document.execCommand('copy');ok();}catch(x){}}
  };
  // avisos del navegador (la pestaña tiene que estar abierta, aunque esté minimizada): los urgentes avisan una vez por día
  window.avNotif=function(){
    if(!('Notification' in window)){alert('Este navegador no permite avisos.');return;}
    if(Notification.permission==='granted'){blAlert('Los avisos del navegador ya están activados. Te avisamos de lo urgente cuando la pestaña de Blumia está abierta pero no a la vista.');return;}
    try{Notification.requestPermission().then(function(p){blAlert(p==='granted'?'Listo: te avisamos de lo urgente cuando la pestaña de Blumia está abierta pero no a la vista.':'No se activaron. Si los bloqueaste, permitilos desde el candado de la barra de direcciones.');});}catch(e){alert('No se pudieron activar los avisos en este navegador.');}
  };
  var avp0=window.avPopups;
  window.avPopups=function(L){
    if(avp0)avp0(L);
    try{if('Notification' in window&&Notification.permission==='granted'&&document.hidden){L.slice(0,3).forEach(function(x){if(x.panel)return;var n=new Notification((x.ic||'🔔')+' '+(x.n||'Blumia'),{body:x.txt||'',tag:'bl'+(x.k||x.f||x.txt)});n.onclick=function(){window.focus();n.close();};});}}catch(e){}
  };
})();
</script>
