<style>
.nbf{display:inline-flex;align-items:center;gap:8px;border:1.5px dashed #0F3F27;padding:10px 16px;border-radius:8px;cursor:pointer;color:#0F3F27;font-weight:700;font-size:13px;position:relative;text-transform:none}.nbf:hover{background:#E3EEDC}.nbf:focus-within{outline:3px solid #5BB5A5}
.cf-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9100;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 10px}
.cf-bg.show{display:flex}
.cf-box{background:#fff;border-radius:12px;max-width:900px;width:100%;padding:20px 24px;color:#222;font-size:14px}
.cf-box h2{margin:0 0 12px;font-size:20px;color:#0F3F27}
.cf-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.cf-tab{background:#F7F5F1;border:1px solid #ddd;border-radius:8px;padding:10px 8px;min-height:44px;text-align:center;line-height:1.2;cursor:pointer;font-weight:700;font-size:13px}
.cf-tab.on{background:#0F3F27;color:#fff;border-color:#0F3F27}
.cf-sec{display:none}.cf-sec.on{display:block}
.cf-help{font-size:12px;color:#666;margin-bottom:10px;line-height:1.45}
.cf-box input,.cf-box textarea,.cf-box select{border:1px solid #ccc;border-radius:6px;padding:7px 9px;font:13px/1.35 inherit;font-family:inherit;box-sizing:border-box;width:100%}
.cf-box textarea{min-height:90px}
.cf-box label{font-size:11px;color:#666;display:block;margin:8px 0 2px}
.cf-row{background:#F7F5F1;border-radius:8px;padding:8px 10px;margin-bottom:8px;display:grid;grid-template-columns:1fr 110px 1fr 80px auto;gap:8px;align-items:end}
.cf-pl{background:#F7F5F1;border-radius:8px;padding:10px;margin-bottom:10px}
.cf-mini{background:#fff;border:1px solid #bbb;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px}
.cf-mini.x{color:#B91C1C;border-color:#B91C1C}
.cf-add{background:#E6F2EC;color:#0F3F27;border:1px dashed #0F3F27;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:12px}
.cf-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.cf-save{background:#0F3F27;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-weight:800;cursor:pointer}
.cf-close{background:#fff;border:1px solid #999;border-radius:8px;padding:10px 20px;cursor:pointer}
@media(max-width:640px){.cf-row{grid-template-columns:1fr}}

.ad-btn{border:none;cursor:pointer}
</style>
<div class="cf-bg" id="cfBg" onclick="if(event.target===this)adCerrar()"><div class="cf-box" id="cfBox"></div></div>
<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
  function pin(){return 'sesion';}
  function quien(){var q='';try{q=localStorage.getItem('blumia_quien')||'';}catch(e){}if(!q&&typeof blNombre==='function')q=blNombre();return q;}
  function badPin(e){return (e&&e.message)||String(e);}
  function g(id){var e=document.getElementById(id);return e?e.value:null;}
  function sync(){nbSync();}
  var NB={texto:'',empresa:'',prop:null,creada:null,ocupado:false};
  function nbSync(){
    var v;if((v=g('nb_texto'))!==null)NB.texto=v;if((v=g('nb_emp'))!==null)NB.empresa=v;
    var p=NB.prop;if(!p||g('nb_nombre')===null)return;
    p.nombre=g('nb_nombre');p.empresa=g('nb_empresa');p.ubicacion=g('nb_ubic');p.banda_salarial=g('nb_banda');p.prompt_extra=g('nb_prompt');
    p.screening_eval.forEach(function(e,i){e.criterio=g('nb_ec'+i);e.peso=g('nb_ep'+i);});
    p.screening_val.forEach(function(e,i){e.pregunta=g('nb_vp'+i);e.opciones=g('nb_vo'+i);});
    p.competencias.forEach(function(c,i){c.nombre=g('nb_cn'+i);c.descripcion=g('nb_cd'+i);c.peso=g('nb_cp'+i);c.preguntas=String(g('nb_cq'+i)||'').split('\n').map(function(q){return q.trim();}).filter(Boolean);});
    p.links=p.links||{};['link_empresa_virtual','link_empresa_presencial'].forEach(function(k){var v2=g('nb_'+k);if(v2!==null)p.links[k]=v2.trim();});
    p.postulacion.forEach(function(q,i){q.etiqueta=g('nb_qe'+i);q.tipo=g('nb_qt'+i);q.opciones=g('nb_qo'+i);q.requerido=g('nb_qr'+i);});
  }
  function pesoSel(id,v){return '<select id="'+id+'" style="width:70px">'+[1,2,3].map(function(n){return '<option'+(Number(v)===n?' selected':'')+'>'+n+'</option>';}).join('')+'</select>';}
  function nbHtml(){
    if(NB.creada){var c=NB.creada;return '<div class="cf-pl"><b>✅ Búsqueda creada: '+esc(c.nombre)+'</b><div class="cf-help" style="margin-top:8px">Empresa: '+esc(c.empresa)+'. Ya tiene su pestaña de candidatos, carpetas de Drive, formularios de screening y competencias, y preguntas de postulación.<br><br>'+(c.perfil&&c.perfil.ok?'<b>Perfil del puesto:</b> la IA completó '+c.perfil.campos+' campos con el Word. <b>Revisalo</b> antes de usarlo.'+((c.perfil.avisos||[]).length?'<ul style="margin:6px 0 0 18px">'+c.perfil.avisos.map(function(a){return '<li>'+esc(a)+'</li>';}).join('')+'</ul>':''):'<b>Perfil del puesto:</b> no se pudo armar solo ('+esc((c.perfil&&c.perfil.error)||'sin detalle')+'). Abrilo con el botón y usá «✨ Completar con IA desde un Word».')+'<br><br>Los CVs que lleguen al mail con el nombre del puesto en el asunto se ordenan solos.</div></div><div id="nbPerfilFr" style="margin-top:10px"></div><div class="cf-foot"><button class="cf-close" onclick="nbOtra()">Crear otra</button><button class="cf-close" onclick="nbVerPerfil(this)">✏️ Revisar el perfil del puesto</button><button class="cf-save" onclick="window.top.location.href=NB.creada.kanban">Abrir el tablero de la búsqueda</button></div>';}
    if(!NB.prop)return '<div class="cf-help">Acá se crea una <b>búsqueda nueva</b>; no modifica la que tenés abierta. Subí el <b>Word</b> con el relevamiento del puesto (o pegá el texto) y la <b>IA</b> arma la búsqueda completa: requisitos para puntuar CVs, criterios de screening, competencias con preguntas y preguntas de postulación. <b>Antes de crear nada lo revisás y lo corregís vos.</b> El archivo no se guarda: solo se lee el texto.</div>'
      +'<label>Archivo Word (.docx)</label><label class="nbf"><input type="file" id="nb_file" accept=".docx,.txt" onchange="nbArchivo(this);var f=this.files&&this.files[0];document.getElementById(\'nbFn\').textContent=f?\'✓ \'+f.name:\'\'" style="position:absolute;width:1px;height:1px;opacity:0">📎 Elegir el archivo Word</label><span id="nbFn" style="margin-left:10px;font-size:13px;color:#0F3F27;font-weight:600"></span>'
      +'<label>…o pegá el texto del relevamiento</label><textarea id="nb_texto" style="min-height:220px" placeholder="Pegá acá el texto o subí el Word">'+esc(NB.texto)+'</textarea>'
      +'<label>Empresa (opcional: si la dejás vacía la propone la IA)</label><input id="nb_emp" value="'+esc(NB.empresa)+'">'
      +'<div class="cf-foot"><button class="cf-save" id="nb_go" onclick="nbAnalizar(this)"'+(NB.ocupado?' disabled':'')+'>🤖 Analizar con IA</button></div>';
    var p=NB.prop,x='<div class="cf-help"><b>Revisá todo antes de crear.</b> La IA se equivoca y esto después se usa para evaluar personas.'+(p.avisos&&p.avisos.length?'<br><br><b>La IA avisa:</b><ul style="margin:4px 0 0 18px">'+p.avisos.map(function(a){return '<li>'+esc(a)+'</li>';}).join('')+'</ul>':'')+'</div>';
    x+='<label>Nombre del puesto</label><input id="nb_nombre" value="'+esc(p.nombre)+'"><label>Empresa (agrupa las búsquedas en el tablero)</label><input id="nb_empresa" value="'+esc(p.empresa)+'"><label>Ubicación / modalidad</label><input id="nb_ubic" value="'+esc(p.ubicacion)+'"><label>Banda salarial de referencia en $ (opcional)</label><input id="nb_banda" value="'+esc(p.banda_salarial)+'">';
    x+='<label>Requisitos para que la IA puntúe los CVs (tiene que terminar con el bloque NIVEL_AJUSTE)</label><textarea id="nb_prompt" style="min-height:300px">'+esc(p.prompt_extra)+'</textarea>';
    x+='<h3 style="margin:16px 0 4px;font-size:15px">Screening · criterios con peso</h3>';
    p.screening_eval.forEach(function(e,i){x+='<div class="cf-pl" style="display:flex;gap:8px;align-items:center"><input id="nb_ec'+i+'" value="'+esc(e.criterio)+'">'+pesoSel('nb_ep'+i,e.peso)+'<button class="cf-mini x" onclick="nbQuitar(\'screening_eval\','+i+')">✕</button></div>';});
    x+='<button class="cf-add" onclick="nbAgregar(\'screening_eval\')">+ Criterio</button>';
    x+='<h3 style="margin:16px 0 4px;font-size:15px">Screening · datos a validar (opciones con |)</h3>';
    p.screening_val.forEach(function(e,i){x+='<div class="cf-pl" style="display:flex;gap:8px;align-items:center"><input id="nb_vp'+i+'" value="'+esc(e.pregunta)+'"><input id="nb_vo'+i+'" value="'+esc(e.opciones)+'" style="width:200px"><button class="cf-mini x" onclick="nbQuitar(\'screening_val\','+i+')">✕</button></div>';});
    x+='<button class="cf-add" onclick="nbAgregar(\'screening_val\')">+ Dato</button>';
    x+='<h3 style="margin:16px 0 4px;font-size:15px">Competencias (una pregunta por línea)</h3>';
    p.competencias.forEach(function(c,i){x+='<div class="cf-pl"><div style="display:flex;gap:8px;align-items:center"><input id="nb_cn'+i+'" value="'+esc(c.nombre)+'">'+pesoSel('nb_cp'+i,c.peso)+'<button class="cf-mini x" onclick="nbQuitar(\'competencias\','+i+')">✕</button></div><label>Descripción</label><input id="nb_cd'+i+'" value="'+esc(c.descripcion)+'"><label>Preguntas de entrevista</label><textarea id="nb_cq'+i+'" style="min-height:80px">'+esc((c.preguntas||[]).join('\n'))+'</textarea></div>';});
    x+='<button class="cf-add" onclick="nbAgregar(\'competencias\')">+ Competencia</button>';
    x+='<h3 style="margin:16px 0 4px;font-size:15px">Preguntas de postulación</h3>';
    p.postulacion.forEach(function(q,i){x+='<div class="cf-row"><div><label>Pregunta</label><input id="nb_qe'+i+'" value="'+esc(q.etiqueta)+'"></div><div><label>Tipo</label><select id="nb_qt'+i+'"><option value="texto"'+(q.tipo==='texto'?' selected':'')+'>Texto libre</option><option value="select"'+(q.tipo==='select'?' selected':'')+'>Elegir opción</option></select></div><div><label>Opciones (con |)</label><input id="nb_qo'+i+'" value="'+esc(q.opciones)+'"></div><div><label>Obligatoria</label><select id="nb_qr'+i+'"><option'+(q.requerido!=='NO'?' selected':'')+'>SI</option><option'+(q.requerido==='NO'?' selected':'')+'>NO</option></select></div><button class="cf-mini x" onclick="nbQuitar(\'postulacion\','+i+')">✕</button></div>';});
    x+='<button class="cf-add" onclick="nbAgregar(\'postulacion\')">+ Pregunta</button>';
    var Lk=p.links||{};
    x+='<h3 style="margin:16px 0 4px;font-size:15px">Links de agenda con la empresa (opcional)</h3><div class="cf-help">Para la entrevista con la empresa cliente. Los links de screening y competencias se cargan por persona en Administración → Usuarios. Si todavía no tenés estos, dejalos vacíos.</div><label>Entrevista con la empresa · virtual</label><input id="nb_link_empresa_virtual" value="'+esc(Lk.link_empresa_virtual)+'" placeholder="https://"><label>Entrevista con la empresa · presencial</label><input id="nb_link_empresa_presencial" value="'+esc(Lk.link_empresa_presencial)+'" placeholder="https://">';
    x+='<div class="cf-foot"><button class="cf-close" onclick="nbVolver()">← Volver al texto</button><button class="cf-save" id="nb_crear" onclick="nbCrear(this)">✅ Crear la búsqueda</button></div>';
    return x;
  }
  var NB_VACIO={screening_eval:{criterio:'',peso:1},screening_val:{pregunta:'',opciones:'Sí|No'},competencias:{nombre:'',descripcion:'',peso:1,preguntas:[]},postulacion:{etiqueta:'',tipo:'texto',opciones:'',requerido:'SI'}};
  window.nbAgregar=function(k){sync();NB.prop[k].push(JSON.parse(JSON.stringify(NB_VACIO[k])));render('nueva');};
  window.nbQuitar=function(k,i){sync();NB.prop[k].splice(i,1);render('nueva');};
  window.nbVolver=function(){sync();blConfirm('¿Volver al texto? Se pierden las correcciones que hiciste a la propuesta.',function(){NB.prop=null;render('nueva');},{si:'Volver al texto',peligro:true});};
  window.nbVerPerfil=function(b){b.disabled=true;google.script.run.withSuccessHandler(function(u){b.disabled=false;var d=document.getElementById('nbPerfilFr');if(d)d.innerHTML='<iframe src="'+esc(u)+'" style="width:100%;height:78vh;border:1px solid #ccc;border-radius:8px;background:#fff"></iframe>';}).withFailureHandler(function(e){b.disabled=false;alert((e&&e.message)||e);}).linkPerfilConPin(NB.creada.id,'sesion','editar');};
  window.nbOtra=function(){NB={texto:'',empresa:'',prop:null,creada:null,ocupado:false};render('nueva');};
  function xmlATexto(xml){
    xml=xml.replace(/<w:tab\/>/g,'\t').replace(/<w:(br|cr)\/>/g,'\n').replace(/<\/w:p>\s*<\/w:tc>/g,' | ').replace(/<\/w:tr>/g,'\n').replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,'');
    var ta=document.createElement('textarea');xml=xml.replace(/&(#x?[0-9a-fA-F]+|amp|lt|gt|quot|apos);/g,function(m){ta.innerHTML=m;return ta.value;});
    return xml.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
  }
  function docxTexto(file){
    return file.arrayBuffer().then(function(ab){
      var buf=new Uint8Array(ab),dv=new DataView(ab),e=buf.length-22;
      while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
      if(e<0)throw new Error('No parece un archivo Word (.docx). Si es un .doc viejo, guardalo como .docx o pegá el texto.');
      var n=dv.getUint16(e+10,true),off=dv.getUint32(e+16,true);
      for(var i=0;i<n;i++){
        if(dv.getUint32(off,true)!==0x02014b50)break;
        var meth=dv.getUint16(off+10,true),csz=dv.getUint32(off+20,true),nl=dv.getUint16(off+28,true),xl=dv.getUint16(off+30,true),cl=dv.getUint16(off+32,true),lho=dv.getUint32(off+42,true);
        var name=new TextDecoder().decode(buf.subarray(off+46,off+46+nl));
        if(name==='word/document.xml'){
          var st=lho+30+dv.getUint16(lho+26,true)+dv.getUint16(lho+28,true),data=buf.subarray(st,st+csz);
          if(meth===0)return xmlATexto(new TextDecoder().decode(data));
          if(typeof DecompressionStream==='undefined')throw new Error('Este navegador no puede leer el Word: pegá el texto en el cuadro.');
          return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text().then(xmlATexto);
        }
        off+=46+nl+xl+cl;
      }
      throw new Error('No encontré el contenido del Word. Pegá el texto en el cuadro.');
    });
  }
  window.nbArchivo=function(inp){
    var f=inp.files&&inp.files[0];if(!f)return;
    var done=function(t){NB.texto=t;render('nueva');if(t.length<200)alert('Del archivo salió muy poco texto ('+t.length+' caracteres). Revisá o pegá el texto a mano.');};
    var fail=function(e){alert((e&&e.message)||e);};
    if(/\.txt$/i.test(f.name)){f.text().then(done,fail);return;}
    docxTexto(f).then(done,fail);
  };
  window.nbAnalizar=function(btn){
    nbSync();if((NB.texto||'').trim().length<200){alert('Falta el texto del relevamiento (mínimo 200 caracteres).');return;}
    btn.disabled=true;btn.textContent='La IA está leyendo… (puede tardar 1 minuto)';
    google.script.run.withSuccessHandler(function(p){NB.prop=p;render('nueva');}).withFailureHandler(function(e){btn.disabled=false;btn.textContent='🤖 Analizar con IA';alert('No se pudo analizar: '+badPin(e));}).proponerBusquedaIA(pin(),NB.texto,NB.empresa);
  };
  window.nbCrear=function(btn){
    sync();var q=quien();var p=NB.prop;
    var falta=!p.nombre.trim()?'el nombre del puesto':!p.empresa.trim()?'la empresa':null;
    if(falta){alert('Falta '+falta+'.');return;}
    blConfirm('Se va a crear la búsqueda «'+p.nombre+'» ('+p.empresa+') con carpetas de Drive, pestaña de candidatos y formularios. ¿Crear?',function(){
    btn.disabled=true;btn.textContent='Creando… (con el perfil del puesto puede tardar un par de minutos)';
    google.script.run.withSuccessHandler(function(r){NB.creada=r;render('nueva');}).withFailureHandler(function(e){btn.disabled=false;btn.textContent='✅ Crear la búsqueda';alert('No se creó: '+badPin(e));}).crearBusquedaIA(pin(),p,q,NB.texto);
    },{si:'Crear'});
  };

  function uErr(e){alert((e&&e.message)||e);}
  window.cfUsuarios=function(){
    var d=document.getElementById('cfUsr');if(!d)return;
    google.script.run.withSuccessHandler(function(L){
      var x='<table style="width:100%;border-collapse:collapse;font-size:13px">';
      L.forEach(function(u,i){
        x+='<tr style="border-bottom:1px solid #eee"><td style="padding:8px 4px"><b>'+esc(u.nombre)+'</b><br><small style="color:'+(u.activo==='SI'?(u.pendiente?'#9A7500':'#1E6B47'):'#B91C1C')+'">'+(u.activo==='SI'?(u.pendiente?'PIN temporal sin cambiar':'Activo'):'Bloqueado')+'</small></td>'
         +'<td><select onchange="cfRolU('+i+',this.value)"><option'+(u.rol==='Administrador'?' selected':'')+'>Administrador</option><option'+(u.rol==='Usuario'?' selected':'')+'>Usuario</option></select></td>'
         +'<td style="text-align:right;white-space:nowrap">'+(window.blUsaPin?'<button class="cf-mini" onclick="cfPinU('+i+')">Reiniciar PIN</button> ':'')+'<button class="cf-mini'+(u.activo==='SI'?' x':'')+'" onclick="cfActU('+i+','+(u.activo==='SI'?'false':'true')+')">'+(u.activo==='SI'?'Bloquear':'Habilitar')+'</button></td></tr>'
         +'<tr style="border-bottom:1px solid #eee"><td colspan="3" style="padding:0 4px 10px"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px"><label style="display:flex;gap:6px;align-items:center">Mail de Google (para invitarlo/a a las entrevistas) <input id="cfue'+i+'" type="email" value="'+esc(u.mail||'')+'" placeholder="nombre@gmail.com" style="height:30px;border:1.5px solid #D5E0CE;border-radius:8px;padding:0 8px;font:inherit;min-width:210px"></label><label style="display:flex;gap:4px;align-items:center"><input type="checkbox" id="cfus'+i+'"'+(u.screening?' checked':'')+'> Hace screening</label><label style="display:flex;gap:4px;align-items:center"><input type="checkbox" id="cfuc'+i+'"'+(u.competencias?' checked':'')+'> Hace competencias</label></div><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px;margin-top:6px"><label style="display:flex;gap:6px;align-items:center">Link de su agenda de citas (para screening y competencias) <input id="cful'+i+'" type="url" value="'+esc(u.linkScr||u.linkComp||'')+'" placeholder="https://calendar.app.google/…" style="height:30px;border:1.5px solid #D5E0CE;border-radius:8px;padding:0 8px;font:inherit;min-width:260px"></label><button class="cf-mini" onclick="cfEntU('+i+',this)">Guardar</button></div></td></tr>';
      });
      x+='</table><div class="cf-pl" style="margin-top:14px"><b>Agregar usuario</b><label>Nombre y apellido</label><input id="cfuN" placeholder="Ej: Analía Pérez"><label>Rol</label><select id="cfuR"><option>Usuario</option><option>Administrador</option></select><div class="cf-foot"><button class="cf-save" onclick="cfCrearU(this)">Crear usuario</button></div></div>';
      d.innerHTML=x;d._L=L;
    }).withFailureHandler(function(e){d.innerHTML='<div style="color:#B91C1C">'+esc((e&&e.message)||e)+'</div>';}).listarUsuarios();
  };
  function uL(i){var d=document.getElementById('cfUsr');return d&&d._L&&d._L[i];}
  window.cfCrearU=function(b){
    var n=document.getElementById('cfuN').value,r=document.getElementById('cfuR').value;b.disabled=true;
    google.script.run.withSuccessHandler(function(x){b.disabled=false;alert('Usuario creado: '+x.nombre+(x.pin?'\nPIN temporal: '+x.pin+'\n\nPasale este PIN. Al entrar elige el suyo.':'\n\nYa puede entrar con su nombre y apellido.'));cfUsuarios();}).withFailureHandler(function(e){b.disabled=false;uErr(e);}).crearUsuario(n,r);
  };
  window.cfPinU=function(i){var u=uL(i);if(!u)return;blConfirm('¿Reiniciar el PIN de '+u.nombre+'? Se cierra su sesión y recibe un PIN temporal.',function(){
    google.script.run.withSuccessHandler(function(x){alert('PIN temporal de '+x.nombre+': '+x.pin+'\n\nPasáselo: al entrar elige el suyo.');cfUsuarios();}).withFailureHandler(uErr).reiniciarPinUsuario(u.nombre);},{si:'Reiniciar'});};
  window.cfActU=function(i,a){var u=uL(i);if(!u)return;var go=function(){
    google.script.run.withSuccessHandler(function(){cfUsuarios();}).withFailureHandler(function(e){uErr(e);cfUsuarios();}).activarUsuario(u.nombre,a);};
    if(a)go();else blConfirm('¿Bloquear a '+u.nombre+'? No va a poder entrar.',go,{si:'Bloquear',peligro:true});};
  window.cfEntU=function(i,b){var u=uL(i);if(!u)return;var t=b.textContent;b.disabled=true;b.textContent='Guardando…';
    google.script.run.withSuccessHandler(function(){b.disabled=false;b.textContent='Guardado ✔';setTimeout(function(){b.textContent=t;},1800);}).withFailureHandler(function(e){b.disabled=false;b.textContent=t;uErr(e);})
      .guardarEntrevistaUsuario(u.nombre,document.getElementById('cfue'+i).value,document.getElementById('cfus'+i).checked,document.getElementById('cfuc'+i).checked,document.getElementById('cful'+i).value);};
  window.cfRolU=function(i,r){var u=uL(i);if(!u)return;
    google.script.run.withSuccessHandler(function(){cfUsuarios();}).withFailureHandler(function(e){uErr(e);cfUsuarios();}).cambiarRolUsuario(u.nombre,r);};

  function ocupadoHtml(){return '<div class="cf-help">Cargando…</div>';}
  window.adCopia=function(){
    var d=document.getElementById('adCopia');if(!d)return;
    google.script.run.withSuccessHandler(function(r){
      var L=(r.copias||[]).map(function(c){return '<tr style="border-bottom:1px solid #eee"><td style="padding:7px 4px">'+esc(c.nombre)+'</td><td style="text-align:right"><a href="'+esc(c.url)+'" target="_blank">Abrir en Drive ↗</a></td></tr>';}).join('');
      d.innerHTML='<p style="margin:6px 0"><b>Última copia:</b> '+(r.ultima?esc(r.ultima):'todavía no hay registro')+'</p><div class="cf-help">La copia (de <b>toda la planilla</b>: candidatos, configuración, formularios e historial) se hace <b>sola todos los días a la madrugada</b> y se guardan las últimas 14, en la carpeta «Copias de seguridad Blumia» de <b>Google Drive</b>. Acá abajo ves la lista y las abrís. Para recuperar algo, abrí la copia de la fecha que te sirva y copiá de ahí la pestaña o los datos; si hace falta restaurar todo, pedímelo.</div><button class="cf-save" onclick="adCopiaYa(this)">💾 Hacer una copia ahora</button>'+(L?'<table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:14px">'+L+'</table>':'');
    }).withFailureHandler(function(e){d.innerHTML='<div style="color:#B91C1C">'+esc(badPin(e))+'</div>';}).copiaInfo();
  };
  window.adCopiaYa=function(b){b.disabled=true;b.textContent='Copiando…';google.script.run.withSuccessHandler(function(r){alert('Copia hecha: '+r.fecha);adCopia();}).withFailureHandler(function(e){b.disabled=false;b.textContent='💾 Hacer una copia ahora';alert(badPin(e));}).copiaAhoraBlumia(pin());};
  window.adAccesos=function(){
    var d=document.getElementById('adAcc');if(!d)return;
    google.script.run.withSuccessHandler(function(L){
      d.innerHTML=L.length?'<table style="width:100%;border-collapse:collapse;font-size:12px">'+L.map(function(r){return '<tr style="border-bottom:1px solid #eee"><td style="padding:6px 4px;white-space:nowrap;color:#666">'+esc(r.fecha)+'</td><td style="padding:6px 4px"><b>'+esc(r.usuario)+'</b></td><td style="padding:6px 4px">'+esc(r.evento)+'</td><td style="padding:6px 4px;color:#666">'+esc(r.detalle)+'</td></tr>';}).join('')+'</table>':'<div class="cf-help">Todavía no hay accesos registrados.</div>';
    }).withFailureHandler(function(e){d.innerHTML='<div style="color:#B91C1C">'+esc(badPin(e))+'</div>';}).listarAccesos();
  };
  window.adMedir=function(b){
    var id=document.getElementById('adVelSel').value,d=document.getElementById('adVel');if(!id)return;
    b.disabled=true;b.textContent='Midiendo…';var rtts=[];
    function fin(){b.disabled=false;b.textContent='⏱ Medir';}
    function ping(k){
      if(k===3)return servidor();
      d.innerHTML='<div class="cf-help">Midiendo la conexión ('+(k+1)+'/3)…</div>';var t=Date.now();
      google.script.run.withSuccessHandler(function(){rtts.push(Date.now()-t);ping(k+1);}).withFailureHandler(function(e){fin();d.innerHTML='<div style="color:#B91C1C">'+esc(badPin(e))+'</div>';}).yo();
    }
    function servidor(){
      d.innerHTML='<div class="cf-help">Midiendo la planilla paso a paso…</div>';
      google.script.run.withSuccessHandler(function(r){real(r);}).withFailureHandler(function(e){fin();d.innerHTML='<div style="color:#B91C1C">'+esc(badPin(e))+'</div>';}).diagnosticoVelocidad(id);
    }
    function real(r){
      d.innerHTML='<div class="cf-help">Midiendo la apertura completa…</div>';var t=Date.now();
      google.script.run.withSuccessHandler(function(h){var ms=Date.now()-t;fin();pintar(r,ms,h?Math.round(String(h).length/1024):0);}).withFailureHandler(function(e){fin();pintar(r,0,0);}).pagina({tipo:'kanban',perfil:id});
    }
    function pintar(r,msReal,kbReal){
      var prom=Math.round(rtts.reduce(function(a,c){return a+c;},0)/rtts.length);
      var x='<table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:10px">';
      x+='<tr style="border-bottom:1px solid #eee"><td style="padding:7px 4px"><b>Conexión con Google</b> (ida y vuelta, promedio de 3)</td><td style="text-align:right"><b>'+prom+' ms</b></td></tr>';
      r.pasos.forEach(function(p){x+='<tr style="border-bottom:1px solid #eee"><td style="padding:7px 4px">'+esc(p.n)+'</td><td style="text-align:right">'+p.ms+' ms</td></tr>';});
      x+='<tr style="border-bottom:1px solid #eee"><td style="padding:7px 4px"><b>Total en el servidor</b></td><td style="text-align:right"><b>'+r.total+' ms</b></td></tr>';
      x+='<tr style="border-bottom:1px solid #eee"><td style="padding:7px 4px">Tamaño de la página: '+r.kb+' KB (los datos de los candidatos son '+(r.kbDatos||0)+' KB)</td><td></td></tr>';
      x+='<tr><td style="padding:7px 4px"><b>Abrir el tablero, de punta a punta</b> (lo que esperás vos'+(kbReal?' · página de '+kbReal+' KB':'')+')</td><td style="text-align:right"><b>'+msReal+' ms</b></td></tr></table>';
      x+='<div class="cf-help" style="margin-top:8px">Se suma además la carga del programa y de las fuentes en el navegador. Mandame una captura de esta tabla y veo qué conviene mejorar.</div>';
      d.innerHTML=x;
    }
    ping(0);
  };
  function render(tab){
    var T=[['usr','👥 Usuarios'],['copia','💾 Copia de seguridad'],['acc','📜 Accesos'],['vel','⏱ Diagnóstico de velocidad'],['vac','🧹 Vaciar búsqueda']];
    var x=tab==='nueva'?'<h2>➕ Nueva búsqueda</h2>':'<h2>⚙ Administración</h2><div class="cf-help" style="margin:0 0 6px">Lo que no depende de una búsqueda en particular.</div><div class="cf-tabs">'+T.map(function(t){return '<button class="cf-tab'+(t[0]===tab?' on':'')+'" onclick="adTab(\''+t[0]+'\')">'+t[1]+'</button>';}).join('')+'</div>';
    if(tab==='nueva')x+=nbHtml();
    if(tab==='usr')x+='<div class="cf-help">Quién puede entrar. Los <b>administradores</b> configuran las búsquedas y manejan los usuarios; los <b>usuarios</b> trabajan con los candidatos. Por ahora se entra solo con nombre y apellido (sin PIN): escribí el nombre completo como lo va a poner la persona.</div><div id="cfUsr">Cargando…</div><div class="cf-foot"><button class="cf-close" onclick="adCerrar()">Cerrar</button></div>';
    if(tab==='copia')x+='<div id="adCopia">Cargando…</div><div class="cf-foot"><button class="cf-close" onclick="adCerrar()">Cerrar</button></div>';
    if(tab==='acc')x+='<div class="cf-help">Los últimos ingresos y cambios de usuarios.</div><div id="adAcc">Cargando…</div><div class="cf-foot"><button class="cf-close" onclick="adCerrar()">Cerrar</button></div>';
    if(tab==='vel'){
      var opts=(typeof DATOS!=='undefined'?DATOS:[]).map(function(b){return '<option value="'+esc(b.id)+'">'+esc(b.nombre)+(b.cerrada?' (cerrada)':'')+'</option>';}).join('');
      x+='<div class="cf-help">Mide cuánto tarda en abrirse el tablero de una búsqueda y <b>en qué paso se va el tiempo</b>: la conexión con Google, la lectura de la planilla y el armado de la página. Sirve para saber qué mejorar. Tarda unos segundos.</div><label>Búsqueda</label><select id="adVelSel">'+opts+'</select><div class="cf-foot" style="justify-content:flex-start"><button class="cf-save" onclick="adMedir(this)">⏱ Medir</button></div><div id="adVel"></div><div class="cf-foot"><button class="cf-close" onclick="adCerrar()">Cerrar</button></div>';
    }
    if(tab==='vac'){
      var op2=(typeof DATOS!=='undefined'?DATOS:[]).map(function(b){return '<option value="'+esc(b.id)+'">'+esc(b.nombre)+(b.cerrada?' (cerrada)':'')+'</option>';}).join('');
      x+='<div class="cf-help">Borra <b>todos los candidatos</b> de una búsqueda, con su historial, contactos y evaluaciones, y manda sus archivos de Drive a la papelera (se recuperan 30 días desde la papelera de Drive). No toca la configuración, los formularios, el flyer ni el Banco de talento. Sirve para arrancar de cero después de las pruebas. Te va a pedir que escribas el nombre de la búsqueda para confirmar.</div><label>Búsqueda a vaciar</label><select id="adVacSel">'+op2+'</select><div class="cf-foot" style="justify-content:flex-start"><button class="cf-save" style="background:#b3261e;border-color:#b3261e" onclick="adVaciar(this)">🧹 Vaciar esta búsqueda…</button></div><div id="adVac"></div><div class="cf-foot"><button class="cf-close" onclick="adCerrar()">Cerrar</button></div>';
    }
    document.getElementById('cfBox').innerHTML=x;
    if(tab==='usr')cfUsuarios();if(tab==='copia')adCopia();if(tab==='acc')adAccesos();
  }
  window.adVaciar=function(b){
    var id=document.getElementById('adVacSel').value,d=document.getElementById('adVac');if(!id)return;
    b.disabled=true;d.innerHTML='';
    google.script.run.withSuccessHandler(function(i){
      b.disabled=false;
      if(!i.candidatos){d.innerHTML='<div class="cf-help">La búsqueda «'+esc(i.nombre)+'» no tiene candidatos para borrar.</div>';return;}
      blPrompt('Esto borra los '+i.candidatos+' candidatos de «'+i.nombre+'» con su historial, contactos y evaluaciones, y manda sus archivos de Drive a la papelera. No se puede deshacer desde acá. Para confirmar, escribí el nombre de la búsqueda:','',function(t){
        d.innerHTML='<div class="cf-help">Vaciando la búsqueda… puede tardar un momento.</div>';
        var q='';try{q=localStorage.getItem('blumia_quien')||'';}catch(e){}
        google.script.run.withSuccessHandler(function(r){d.innerHTML='<div class="cf-help" style="color:#0F3F27;font-weight:700">Listo: se borraron '+r.candidatos+' candidatos, '+r.historial+' movimientos de historial y '+r.archivos+' archivos pasaron a la papelera de Drive.</div>';}).withFailureHandler(function(e){d.innerHTML='<div style="color:#B91C1C">'+esc((e&&e.message)||e)+'</div>';}).vaciarBusqueda(id,t,q);
      },{titulo:'Vaciar la búsqueda',si:'Borrar todo',peligro:true});
    }).withFailureHandler(function(e){b.disabled=false;d.innerHTML='<div style="color:#B91C1C">'+esc((e&&e.message)||e)+'</div>';}).vaciarBusquedaInfo(id);
  };
  window.adTab=function(t){sync();render(t);};
  window.adAbrir=function(t){document.getElementById('cfBg').classList.add('show');render(t||'nueva');};
  window.adCerrar=window.cfCerrar=function(){document.getElementById('cfBg').classList.remove('show');};
})();
</script>
