<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Screening · Blumia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F3F8F1;--white:#FFFFFF;--dark:#111111;--text:#1A1A1A;--mid:#555555;--light:#6B6B6B;--line:#D5E0CE;
  --green:#243D2C;--green2:#2F5E41;--glight:#E3EEDC;--dorado:#FBC67B;--coral:#C0391B;--turq:#5BB5A5;
  --font:'Poppins','Plus Jakarta Sans',sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text)}
.wrap{max-width:900px;margin:0 auto;padding:36px 52px 60px}
.topbar{background:rgba(247,245,241,0.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding:0 52px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.tb-logo{height:30px;display:block}.hero-logo{height:30px;display:none;margin-bottom:22px}@media print{.hero-logo{display:block}}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:320px;height:320px;border-radius:50%;border:60px solid rgba(255,255,255,0.06);pointer-events:none}
.tb-brand{font-weight:800;font-size:20px;letter-spacing:-0.04em;color:var(--green)}
.tb-sep{width:1px;height:24px;background:var(--line)}
.tb-doc{font-size:13px;font-weight:600;color:var(--mid)}
.tb-left{display:flex;align-items:center;gap:18px}
.topbar-actions{display:flex;align-items:center;gap:8px}
.btn{border-radius:2px;padding:10px 18px;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;font-family:var(--font);transition:all .15s;border:1.5px solid var(--line);display:flex;align-items:center;gap:7px}
.btn-success{background:var(--green);color:var(--white);border-color:var(--green)}
.btn-success:hover{background:var(--green2);border-color:var(--green2)}
.btn-secondary{background:transparent;color:var(--dark)}
.btn-secondary:hover{border-color:var(--green);color:var(--green)}
[contenteditable]{outline:none;cursor:text;border-radius:2px;transition:background .15s}
[contenteditable]:hover{background:rgba(26,102,69,.05)}
[contenteditable]:focus{background:rgba(26,102,69,.07);box-shadow:0 0 0 2px rgba(26,102,69,.2);padding:2px 5px;margin:-2px -5px}
.hero{background:var(--green);color:#fff;padding:52px 52px 44px;border-bottom:4px solid var(--turq);position:relative;overflow:hidden}
.hero h1{font-size:40px;font-weight:800;letter-spacing:-0.04em;color:#fff;line-height:1.1;margin-bottom:8px}
.hero h1 em{color:rgba(255,255,255,0.75);font-style:normal}
.hero-sub{font-size:15px;color:rgba(255,255,255,0.65);font-weight:500;margin-bottom:32px}
.hero-meta{display:flex;gap:32px;flex-wrap:wrap}
.hm-item{display:flex;flex-direction:column;gap:4px}
.hm-label{font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.78)}
.hm-val{font-size:15px;font-weight:600;color:#fff}
.section{margin-bottom:32px}
.section-label{font-size:11px;font-weight:800;letter-spacing:0.22em;text-transform:uppercase;color:var(--green);display:flex;align-items:center;gap:8px;margin-bottom:20px}
.section-label::before{content:'';display:block;width:3px;height:16px;background:var(--green)}
.section-divider{border:none;border-top:1.5px solid var(--line);margin:32px 0}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:var(--mid)}
.field input,.field select,.field textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:2px;padding:10px 12px;font-size:15px;font-family:var(--font);color:var(--text);outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(26,102,69,.08)}
.field textarea{resize:vertical;min-height:90px;line-height:1.5}
.eval-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);gap:16px}
.eval-row:last-child{border-bottom:none}
.eval-label{font-size:15px;font-weight:600;color:var(--text);flex:1;min-width:0}
.eval-select{appearance:none;-webkit-appearance:none;background:var(--bg);border:1.5px solid var(--line);border-radius:2px;padding:8px 12px;font-size:12px;font-weight:700;font-family:var(--font);color:var(--mid);cursor:pointer;min-width:160px;outline:none}
.val-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;padding:11px 0;border-bottom:1px solid var(--line)}
.val-row:last-child{border-bottom:none}
.val-label{font-size:15px;font-weight:500;color:var(--text)}
.pill-group{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1.5px solid var(--line);border-radius:2px;background:var(--bg);padding:10px 18px;min-height:40px;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--mid);cursor:pointer;transition:all .12s;user-select:none}
.pill.active-alto,.pill.active-si{background:var(--green);color:var(--white);border-color:var(--green)}
.pill.active-medio,.pill.active-revisar{background:var(--dorado);color:#5a3a00;border-color:var(--dorado)}
.pill.active-bajo,.pill.active-no{background:#FDEAE4;color:var(--coral);border-color:var(--coral)}
.resultado-card{border:1.5px solid var(--line);border-radius:2px;background:var(--white);padding:28px 32px;display:flex;align-items:stretch;gap:28px}
.semaforo{display:flex;flex-direction:column;gap:7px;justify-content:center}
.semaforo-dot{width:28px;height:28px;border-radius:50%;border:2px solid transparent;transition:all .25s}
.sd-rojo{background:#FDEAE4;border-color:#FDEAE4}
.sd-amarillo{background:#FEF3D8;border-color:#FEF3D8}
.sd-verde{background:#E6F2EC;border-color:#E6F2EC}
.sd-rojo.on{background:var(--coral);border-color:var(--coral)}
.sd-amarillo.on{background:var(--dorado);border-color:var(--dorado)}
.sd-verde.on{background:var(--green);border-color:var(--green)}
.resultado-info{flex:1}
.resultado-tag{font-size:9px;font-weight:800;letter-spacing:0.22em;text-transform:uppercase;color:var(--mid);margin-bottom:8px}
.resultado-titulo{font-size:32px;font-weight:800;letter-spacing:-0.03em;margin-bottom:8px}
.res-verde{color:var(--green)}
.res-verdeclaro{color:#4A9E6F}
.res-amarillo{color:#92400E}
.res-rojo{color:var(--coral)}
.resultado-desc{font-size:13px;color:var(--mid);font-weight:500;line-height:1.5;min-height:20px;border-radius:2px;padding:2px 4px;margin:-2px -4px}
.barra-score{height:3px;background:var(--line);margin-top:14px;overflow:hidden}
.barra-fill{height:100%;background:var(--green);width:0%;transition:width .4s ease}
.score-aside{text-align:center;flex-shrink:0;display:flex;flex-direction:column;justify-content:center;padding-left:24px;border-left:1px solid var(--line);min-width:110px}
.score-aside-label{font-size:9px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:var(--light);margin-bottom:6px}
.score-aside-num{font-size:28px;font-weight:800;letter-spacing:-0.04em;color:var(--dark);line-height:1}
.score-aside-max{font-size:10px;color:var(--light);font-weight:600;margin-top:2px}
.veredicto-manual{margin-top:16px;background:var(--bg);border:1.5px dashed var(--line);border-radius:2px;padding:14px 16px}
.veredicto-manual-label{font-size:9px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:var(--mid);margin-bottom:10px}
.vd-opts{display:flex;gap:8px}
.vd-btn{border:1.5px solid var(--line);border-radius:2px;background:var(--white);padding:8px 16px;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--mid);cursor:pointer;transition:all .12s;font-family:var(--font)}
.vd-btn.vd-active-verde{background:var(--green);color:#fff;border-color:var(--green)}
.vd-btn.vd-active-verdeclaro{background:#E6F2EC;color:#1A6645;border-color:#4A9E6F}
.vd-btn.vd-active-amarillo{background:var(--dorado);color:#5a3a00;border-color:var(--dorado)}
.vd-btn.vd-active-rojo{background:#FDEAE4;color:var(--coral);border-color:var(--coral)}
.criterio-box{margin-top:16px;background:var(--bg);border-left:3px solid var(--green);padding:12px 16px;display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.criterio-item{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em}
.criterio-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.footer{margin-top:48px;border-top:1.5px solid var(--line);padding-top:18px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:var(--light)}
.toast{position:fixed;bottom:28px;right:28px;background:var(--dark);color:var(--white);padding:12px 20px;border-radius:2px;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:translateY(0)}
.loading{padding:60px;text-align:center;color:var(--mid);font-size:14px}
@media print{
  .topbar,.toast,script,.veredicto-manual,.ia-ui{display:none!important}
  .wrap{padding:20px 32px}body{background:#fff}
  .hero,.pill.active-alto,.pill.active-si,.pill.active-medio,.pill.active-revisar,.pill.active-bajo,.pill.active-no,
  .sd-verde.on,.sd-amarillo.on,.sd-rojo.on,.res-verde,.res-amarillo,.res-rojo{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.gbar{position:sticky;bottom:0;z-index:250;display:flex;justify-content:center;padding:14px 16px 16px;background:linear-gradient(to top,rgba(247,245,241,.97) 65%,rgba(247,245,241,0));pointer-events:none}
.gbar button{pointer-events:auto;background:#243D2C;color:#fff;border:none;border-radius:99px;padding:14px 38px;font:700 15px Poppins,Arial,sans-serif;cursor:pointer;box-shadow:0 6px 20px rgba(36,61,44,.35);letter-spacing:.2px}
.gbar button:hover{background:#1a2d20}.gbar button:disabled{opacity:.65;cursor:default}
@media print{.gbar{display:none!important}}
</style>
<style id="mobcss">
@media (max-width:640px){
  .topbar{padding:8px 14px;height:auto;flex-wrap:wrap;gap:8px}
  .tb-left{gap:10px}.tb-sep,.tb-doc{display:none}
  .topbar-actions{width:100%}
  .topbar-actions .btn{flex:1;padding:12px 8px}
  .hero{padding:28px 18px 24px}.hero h1{font-size:28px}.hero-sub{margin-bottom:18px}.hero-meta{gap:16px}
  .wrap{padding:22px 16px 48px}
  .grid-2,.grid-4{grid-template-columns:1fr}
  .field input,.field select,.field textarea{font-size:16px}
  .field textarea{min-height:140px}
  .eval-row{flex-direction:column;align-items:stretch;gap:8px}
  .eval-select{width:100%;padding:12px}
  .val-row{grid-template-columns:1fr;gap:8px}
  .pill{padding:10px 16px}
  .resultado-card{flex-direction:column;padding:20px;gap:16px}
  .score-aside{border-left:0;border-top:1px solid var(--line);padding:14px 0 0}
  .vd-opts{flex-wrap:wrap}
  .criterio-box{gap:10px}
  .ia-btn{padding:10px 14px;font-size:13px}
  .toast{left:16px;right:16px;bottom:16px}
}
</style>
<style id="skin">.btn,.vd-btn{border-radius:99px}.field input,.field select,.field textarea,.eval-select{border-radius:8px}</style>
<style id="btnU">/* un solo estilo de botón: rectángulo de 8 px (las píldoras quedan solo para etiquetas y contadores) */
.btn,.pill,.vd-btn,.gbar button,.ia-btn,.ed-fab,.ed-mini{border-radius:8px!important}
</style>
</head>

<script>
const LOGO_BLANCO = '<?!= LOGO_BLUMIA_ ?>';
const PERFIL_ID = '<?= perfil ?>';
const EDITAR = '<?= editar ?>' === 'true'; window.EDITAR = EDITAR; window.EF_TIPO = 'screening';
const CAND_INICIAL = '<?= candidato ?>';
const ENTR_INICIAL = '<?= entrevistador ?>';

let DATOS = null;
const state = { eval: {}, val: {}, veredictoManual: null, letraAuto: null };
const EVAL_STYLE = {
  alto: { t: 'Alto', bg: '#E6F2EC', c: '#1A6645', b: 'rgba(26,102,69,.3)' },
  medio: { t: 'Medio', bg: '#FEF3D8', c: '#7a5500', b: 'rgba(251,198,123,.5)' },
  bajo: { t: 'Bajo', bg: '#FDEAE4', c: '#C0391B', b: 'rgba(192,57,27,.3)' },
  '': { t: '— Sin evaluar', bg: '#F7F5F1', c: '#6B6B6B', b: '#DDDBD7' }
};
const VEREDICTOS = {
  A: { titulo: 'A · Avanza', desc: 'Cumple lo crítico y lo deseable. Avanza a la siguiente instancia.', cls: 'res-verde', color: 'verde' },
  'B+': { titulo: 'B+ · Avanza', desc: 'Muy bueno, cumple lo excluyente con una cuestión menor. Avanza a la siguiente instancia.', cls: 'res-verdeclaro', color: 'verde' },
  B: { titulo: 'B · Avanza', desc: 'Cumple lo crítico con algún flanco menor. Avanza a la siguiente instancia.', cls: 'res-amarillo', color: 'amarillo' },
  C: { titulo: 'C · No avanza', desc: 'No cumple lo crítico o presenta red flags importantes.', cls: 'res-rojo', color: 'rojo' }
};

setTimeout(() => { if (!DATOS) document.getElementById('app').innerHTML = '<div class="loading" style="color:red;font-weight:bold;">No se pudo cargar el perfil «' + PERFIL_ID + '». Recargá la página; si sigue igual, avisá.</div>'; }, 20000);
google.script.run.withSuccessHandler(d => { if (!d) { document.getElementById('app').innerHTML = '<div class="loading" style="color:red;font-weight:bold;">El servidor devolvió el perfil vacío (' + PERFIL_ID + '). Contactá al administrador.</div>'; return; } DATOS = d; render(); }).withFailureHandler(e => {
  document.getElementById('app').innerHTML = '<div class="loading" style="color:red;font-weight:bold;">Error: ' + e.message + '</div>';
}).getDatosPerfil(PERFIL_ID);

const fmtN = v => String(v).replace('.', ','); // números con coma decimal (es-AR)

function render() {
  const h = DATOS.hero;
  const entrevistadoras = DATOS.entrevistadoras;
  const html = `
<div class="hero">
  <img class="hero-logo" alt="Blumia" src="${LOGO_BLANCO}">
  <h1><span>Screening de </span><em id="hero-nombre">${CAND_INICIAL || 'Candidato/a'}</em></h1>
  <div class="hero-sub">${h.posicion || ''} · ${h.empresa || ''}</div>
  <div id="hero-links" class="ia-ui" style="margin:-6px 0 14px"></div>
  <div class="hero-meta">
    <div class="hm-item"><div class="hm-label">Empresa</div><div class="hm-val">${h.empresa || ''}</div></div>
    <div class="hm-item"><div class="hm-label">Posición</div><div class="hm-val">${h.posicion || ''}</div></div>
    <div class="hm-item"><div class="hm-label">Ubicación</div><div class="hm-val">${h.ubicacion || ''}</div></div>
    <div class="hm-item"><div class="hm-label">Instancia</div><div class="hm-val">${h.instancia || ''}</div></div>
  </div>
</div>
<div class="wrap">
  <div class="section">
    <div class="section-label"><span>Datos del candidato</span></div>
    <div class="grid-2" style="margin-bottom:14px">
      <div class="field">
        <label>Nombre y apellido</label>
        <input type="text" id="d-nombre" value="${CAND_INICIAL || ''}" placeholder="—" oninput="document.getElementById('hero-nombre').innerText=this.value||'Candidato/a'">
      </div>
      <div class="field">
        <label for="d-entrevistadora">Entrevistador/a</label>
        <select id="d-entrevistadora" onchange="window.ENTR_ELEGIDO=this.value"><option value="">— Elegí —</option>
          ${entrevistadoras.map(e => `<option value="${e}">${e}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="grid-2" style="margin-bottom:14px">
      <div class="field"><label>Empresa actual</label><input type="text" id="d-empresa" placeholder="—"></div>
      <div class="field"><label>Posición actual</label><input type="text" id="d-posicion" placeholder="—"></div>
    </div>
    <div style="margin-bottom:14px">
      <div class="field"><label>Formación</label><input type="text" id="d-formacion" placeholder="Carrera, título, estado"></div>
    </div>
    <div class="grid-4">
      <div class="field"><label for="d-fecha">Fecha de la entrevista</label><input type="date" id="d-fecha"></div>
      <div class="field"><label>Remuneración actual</label><input type="text" id="d-rem-actual" placeholder="$"></div>
      <div class="field"><label>Remuneración pretendida</label><input type="text" id="d-rem-pret" placeholder="$"></div>
      <div class="field">
        <label for="d-disponibilidad">Disponibilidad de ingreso</label>
        <select id="d-disponibilidad"><option value="">—</option><option>Inmediata</option><option>15 días</option><option>30 días</option><option>+30 días</option></select>
      </div>
    </div>
  </div>
  <hr class="section-divider">
  <div class="section">
    <div class="section-label"><span>Ajuste al perfil</span></div>
    <div id="eval-container"></div>
  </div>
  <hr class="section-divider">
  <div class="section">
    <div class="section-label"><span>Validación de condiciones</span></div>
    <div id="val-container"></div>
  </div>
  <hr class="section-divider">
  <div class="section">
    <div class="section-label"><span>Comentario</span></div>
    <div class="field"><textarea id="comentario" placeholder="Observaciones relevantes de la entrevista..."></textarea></div>
  </div>
  <hr class="section-divider">
  <div class="section">
    <div class="section-label"><span>Resultado final</span></div>
    <div class="resultado-card">
      <div class="semaforo">
        <div class="semaforo-dot sd-verde" id="dot-verde"></div>
        <div class="semaforo-dot sd-amarillo" id="dot-amarillo"></div>
        <div class="semaforo-dot sd-rojo" id="dot-rojo"></div>
      </div>
      <div class="resultado-info">
        <div class="resultado-tag"><span>Recomendación</span></div>
        <div class="resultado-titulo" id="res-titulo">—</div>
        <div class="resultado-desc" id="res-desc">Completá la evaluación para obtener la recomendación</div>
        <div class="barra-score"><div class="barra-fill" id="barra"></div></div>
      </div>
      <div class="score-aside">
        <div class="score-aside-label">Puntaje</div>
        <div class="score-aside-num" id="score-num">—</div>
        <div class="score-aside-max">/ 10</div>
      </div>
    </div>
    <div class="veredicto-manual">
      <div class="veredicto-manual-label">Resultado · Letra para la planilla <span id="sugerencia-auto" style="font-weight:600;color:var(--mid);margin-left:8px;text-transform:none;letter-spacing:0">(sugerencia automática: —)</span></div>
      <div class="vd-opts">
        <button class="vd-btn" onclick="setVeredictoManual('A')"><strong>A</strong> · Avanza</button>
        <button class="vd-btn" onclick="setVeredictoManual('B+')"><strong>B+</strong> · Avanza</button>
        <button class="vd-btn" onclick="setVeredictoManual('B')"><strong>B</strong> · Avanza</button>
        <button class="vd-btn" onclick="setVeredictoManual('C')"><strong>C</strong> · No avanza</button>
        <button class="vd-btn" style="color:var(--light);font-size:10px" onclick="resetVeredicto()">↺ Auto</button>
      </div>
    </div>
    <div class="criterio-box">
      <div style="font-size:10px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:var(--mid)">Umbrales automáticos</div>
      <div class="criterio-item"><div class="criterio-dot" style="background:var(--green)"></div><span style="color:var(--green)">≥ ${fmtN(Number(h.criterio_avanza) || 9)} — A (Avanza)</span></div>
      <div class="criterio-item"><div class="criterio-dot" style="background:#6EE7B7"></div><span style="color:var(--green)">≥ ${fmtN(Number(h.criterio_bplus) || 8)} — B+ (Avanza)</span></div>
      <div class="criterio-item"><div class="criterio-dot" style="background:var(--dorado)"></div><span style="color:#7a5500">≥ ${fmtN(Number(h.criterio_reserva) || 6.5)} — B (Avanza)</span></div>
      <div class="criterio-item"><div class="criterio-dot" style="background:var(--coral)"></div><span style="color:var(--coral)">&lt; ${fmtN(Number(h.criterio_reserva) || 6.5)} — C (No avanza)</span></div>
    </div>
  </div>
  <div class="footer">Confidencial · Blumia Consulting · © 2026</div>
</div>`;
  document.getElementById('app').innerHTML = html;
  buildEval();
  buildVal();
  preseleccionarEntrevistadora();
  cargarLinkCV();
}

function buildEval() {
  const c = document.getElementById('eval-container');
  DATOS.eval_items.forEach(item => {
    state.eval[item.id] = '';
    const row = document.createElement('div');
    row.className = 'eval-row';
    row.innerHTML = `<div class="eval-label">${item.label}</div>
      <select class="eval-select" id="sel-${item.id}" aria-label="${item.label}" onchange="onEvalChange('${item.id}',this)">
        <option value="">— Sin evaluar</option><option value="bajo">Bajo</option><option value="medio">Medio</option><option value="alto">Alto</option>
      </select>`;
    c.appendChild(row);
  });
}

function onEvalChange(id, el) {
  const val = el.value;
  state.eval[id] = val;
  const s = EVAL_STYLE[val];
  el.style.backgroundColor = s.bg;
  el.style.color = s.c;
  el.style.borderColor = val ? s.c : '#DDDBD7';
  calcular();
}

function buildVal() {
  const c = document.getElementById('val-container');
  DATOS.val_items.forEach(item => {
    const tipoMap = { 'Sí': 'si', 'No': 'no', 'A revisar': 'revisar', 'Alto': 'alto', 'Medio': 'medio', 'Bajo': 'bajo' };
    const row = document.createElement('div');
    row.className = 'val-row';
    const pills = item.opts.map(t => `<div class="pill" data-id="${item.id}" data-val="${tipoMap[t] || t.toLowerCase()}" data-cls="active-${tipoMap[t] || t.toLowerCase()}" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();pickPill(this)}" onclick="pickPill(this)">${t}</div>`).join('');
    row.innerHTML = `<div class="val-label">${item.label}</div><div class="pill-group">${pills}</div>`;
    c.appendChild(row);
  });
}

function pickPill(el) {
  const id = el.dataset.id;
  document.querySelectorAll('.pill[data-id="' + id + '"]').forEach(p => p.className = 'pill');
  el.classList.add(el.dataset.cls);
  state.val[id] = el.dataset.val;
  calcular();
}

function calcular() {
  const evalEntries = DATOS.eval_items.map(item => ({ peso: item.peso, val: state.eval[item.id] || '' })).filter(e => e.val);
  if (!evalEntries.length) return;
  const valKeys = Object.keys(state.val);
  const salario = state.val.v1;
  const otros = valKeys.filter(k => k !== 'v1').map(k => state.val[k]).filter(Boolean);

  let score = 0, total = 0;
  evalEntries.forEach(e => {
    total += e.peso;
    if (e.val === 'alto') score += e.peso;
    else if (e.val === 'medio') score += e.peso * 0.5;
  });
  if (salario) {
    total += 1.5;
    if (salario === 'si') score += 1.5;
    else if (salario === 'revisar') score += 0.75;
  }
  otros.forEach(v => {
    total += 0.3;
    if (v === 'si' || v === 'alto') score += 0.3;
    else if (v === 'revisar' || v === 'medio') score += 0.15;
  });

  let norm = Math.min(10, Math.round((score / total) * 100) / 10);
  const salarioRechazado = (salario === 'no');
  if (salarioRechazado) norm = Math.min(norm, 4.9);

  document.getElementById('score-num').textContent = fmtN(norm.toFixed(1));
  document.getElementById('barra').style.width = (norm * 10) + '%';

  const cAvanza = Number(DATOS.hero.criterio_avanza) || 9;
  const cBplus = Number(DATOS.hero.criterio_bplus) || 8;
  const cReserva = Number(DATOS.hero.criterio_reserva) || 6.5;
  let letra;
  if (salarioRechazado) letra = 'C';
  else if (norm >= cAvanza) letra = 'A';
  else if (norm >= cBplus) letra = 'B+';
  else if (norm >= cReserva) letra = 'B';
  else letra = 'C';

  state.letraAuto = letra;
  document.getElementById('sugerencia-auto').textContent = '(sugerencia automática: ' + letra + ')';
  if (!state.veredictoManual) aplicarVeredicto(letra, false);
}

function aplicarVeredicto(letra, esManual) {
  const v = VEREDICTOS[letra];
  document.querySelectorAll('.semaforo-dot').forEach(d => d.classList.remove('on'));
  document.getElementById('dot-' + v.color).classList.add('on');
  const t = document.getElementById('res-titulo');
  t.textContent = v.titulo;
  t.className = 'resultado-titulo ' + v.cls;
  document.getElementById('res-desc').textContent = v.desc;
  document.querySelectorAll('.vd-btn').forEach(b => b.className = 'vd-btn');
  const colorClase = { A: 'verde', 'B+': 'verdeclaro', B: 'amarillo', C: 'rojo' }[letra];
  document.querySelector(`.vd-btn[onclick*="'${letra}'"]`)?.classList.add('vd-active-' + colorClase);
}

function setVeredictoManual(letra) {
  state.veredictoManual = letra;
  aplicarVeredicto(letra, true);
}

function resetVeredicto() {
  state.veredictoManual = null;
  if (state.letraAuto) aplicarVeredicto(state.letraAuto, false);
}

function cargarLinkCV() {
  if (!CAND_INICIAL) return;
  google.script.run.withSuccessHandler(info => {
    const el = document.getElementById('hero-links');
    if (el && info && info.cv) el.innerHTML = '<a href="' + info.cv + '" target="_blank" rel="noopener" style="display:inline-block;margin-top:8px;background:#fff;color:#1A6645;padding:4px 12px;border-radius:8px;font-size:12px;font-weight:800;text-decoration:none">📄 Ver CV</a>';
  }).getLinkScreening(PERFIL_ID, CAND_INICIAL);
}

function preseleccionarEntrevistadora() {
  if (!ENTR_INICIAL) return;
  const sel = document.getElementById('d-entrevistadora');
  let found = false;
  [...sel.options].forEach(o => { if (o.value.toLowerCase() === ENTR_INICIAL.toLowerCase()) { o.selected = true; found = true; } });
  if (!found) {
    const opt = document.createElement('option');
    opt.value = ENTR_INICIAL;
    opt.text = ENTR_INICIAL;
    opt.selected = true;
    sel.appendChild(opt);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function enviarALaPlanilla() {
  const nombre = document.getElementById('d-nombre').value;
  const entrevistador = document.getElementById('d-entrevistadora').value;
  const tituloRaw = document.getElementById('res-titulo').textContent;
  const notas = document.getElementById('comentario').value;
  if (!nombre) { alert('Falta el nombre de la persona entrevistada.'); return; }
  const ESTADO_EF = efCapturar();

  let cat = state.veredictoManual || state.letraAuto || 'C';

  const btn = document.getElementById('btn-save-sheet');
  btn.innerText = '⏳ GUARDANDO...';
  btn.disabled = true;

  // forzar que los select de eval reflejen su valor elegido antes de clonar
  DATOS.eval_items.forEach(item => {
    const sel = document.getElementById('sel-' + item.id);
    const val = state.eval[item.id] || '';
    if (sel) {
      [...sel.options].forEach(o => o.selected = (o.value === val));
    }
  });
  document.querySelectorAll('select[id]').forEach(function(s){[...s.options].forEach(function(o){if(o.selected)o.setAttribute('selected','selected');else o.removeAttribute('selected');});});
  const clone = document.documentElement.cloneNode(true);

  // EVAL selects → div con el texto y color correctos desde state.eval
  DATOS.eval_items.forEach(item => {
    const c = clone.querySelector('#sel-' + item.id);
    if (!c) return;
    const estilos = {
      alto:  { t: 'Alto',  bg: '#E6F2EC', col: '#1A6645', bd: '#1A6645' },
      medio: { t: 'Medio', bg: '#FEF3D8', col: '#7a5500', bd: '#FBC67B' },
      bajo:  { t: 'Bajo',  bg: '#FDEAE4', col: '#C0391B', bd: '#C0391B' },
      '':    { t: '— Sin evaluar', bg: '#F7F5F1', col: '#6B6B6B', bd: '#DDDBD7' }
    };
    const e = estilos[state.eval[item.id] || ''] || estilos[''];
    const div = clone.ownerDocument.createElement('div');
    div.textContent = e.t;
    div.style.cssText = 'border:1.5px solid ' + e.bd + ';border-radius:2px;padding:8px 12px;font-size:12px;font-weight:700;color:' + e.col + ';background:' + e.bg + ';display:inline-block;min-width:140px;text-align:center';
    c.parentNode.replaceChild(div, c);
  });

  // resto de inputs/textarea/otros selects
  clone.querySelectorAll('input[id],textarea[id],select[id]').forEach(el => {
    const c = clone.querySelector('#' + el.id);
    if (!c) return;
    if (el.tagName === 'TEXTAREA') {
      const div = clone.ownerDocument.createElement('div');
      div.textContent = el.value;
      div.style.cssText = 'white-space:pre-wrap;word-wrap:break-word;border:1.5px solid #DDDBD7;border-radius:2px;padding:10px 12px;font-size:15px;line-height:1.5;color:#1A1A1A;background:#F7F5F1;min-height:90px';
      c.parentNode.replaceChild(div, c);
    } else if (el.tagName === 'SELECT') {
      const txt = el.options[el.selectedIndex] ? el.options[el.selectedIndex].text : '';
      const div = clone.ownerDocument.createElement('div');
      div.textContent = txt;
      div.style.cssText = 'border:1.5px solid #DDDBD7;border-radius:2px;padding:8px 12px;font-size:12px;font-weight:700;color:#1A6645;background:#F7F5F1;display:inline-block;min-width:140px;text-align:center';
      c.parentNode.replaceChild(div, c);
    } else {
      c.setAttribute('value', el.value);
    }
  });

  clone.querySelectorAll('script').forEach(s => s.remove());
  clone.querySelectorAll('.topbar,.toast,.veredicto-manual,.ia-ui').forEach(el => el.remove());
  clone.querySelectorAll('.hero-logo').forEach(el => { el.style.display = 'block'; });

  google.script.run
    .withSuccessHandler(() => {
      showToast('¡Entrevista guardada!');
      btn.innerHTML = '✅ ¡LISTO!';
      setTimeout(() => { btn.innerHTML = 'Guardar entrevista'; btn.disabled = false; }, 3000);
    })
    .withFailureHandler(err => {
      alert('Falló el guardado: ' + err.message);
      btn.innerHTML = '❌ REINTENTAR';
      btn.disabled = false;
    })
    .procesarScreening({
      perfil: PERFIL_ID,
      editar: EDITAR,
      estado: ESTADO_EF,
      nombre: nombre,
      entrevistador: entrevistador,
      resultado: cat,
      comentarios: notas,
      htmlFull: clone.outerHTML
    });
}
</script>
