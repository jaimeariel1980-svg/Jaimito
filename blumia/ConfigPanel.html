<style>
.cf-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9100;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 10px}
.cf-bg.show{display:flex}
.cf-box{background:#fff;border-radius:12px;max-width:900px;width:100%;padding:20px 24px;color:#222;font-size:14px}
.cf-box h2{margin:0 0 12px;font-size:20px;color:#243D2C}
.cf-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.cf-tab{background:#F7F5F1;border:1px solid #ddd;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:13px}
.cf-tab.on{background:#243D2C;color:#fff;border-color:#243D2C}
.cf-sec{display:none}.cf-sec.on{display:block}
.cf-help{font-size:12px;color:#666;margin-bottom:10px;line-height:1.45}
.cf-box input,.cf-box textarea,.cf-box select{border:1px solid #ccc;border-radius:6px;padding:7px 9px;font:13px/1.35 inherit;font-family:inherit;box-sizing:border-box;width:100%}
.cf-box textarea{min-height:90px}
.cf-box label{font-size:11px;color:#666;display:block;margin:8px 0 2px}
.cf-row{background:#F7F5F1;border-radius:8px;padding:8px 10px;margin-bottom:8px;display:grid;grid-template-columns:1fr 110px 1fr 80px auto;gap:8px;align-items:end}
.cf-pl{background:#F7F5F1;border-radius:8px;padding:10px;margin-bottom:10px}
.cf-mini{background:#fff;border:1px solid #bbb;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px}
.cf-mini.x{color:#B91C1C;border-color:#B91C1C}
.cf-add{background:#E6F2EC;color:#243D2C;border:1px dashed #243D2C;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:12px}
.cf-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.cf-save{background:#243D2C;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-weight:800;cursor:pointer}
.cf-close{background:#fff;border:1px solid #999;border-radius:8px;padding:10px 20px;cursor:pointer}
@media(max-width:640px){.cf-row{grid-template-columns:1fr}}
</style>
<div class="cf-bg" id="cfBg" onclick="if(event.target===this)cfCerrar()"><div class="cf-box" id="cfBox"></div></div>
<script>
(function(){
  var CF=null;
  var ETQ={nombre:'Nombre en el tablero',nombre_perfil:'Nombre del puesto (se usa en los mensajes)',empresa:'Empresa (agrupa las búsquedas en el tablero)',empresa_candidatos:'Cómo se nombra la empresa a los candidatos (vacío = «una empresa cliente del sector…»)',banda_salarial:'Banda salarial de referencia en $ (la usan el Informe de proceso y el Resumen), ej: 13000000',link_screening:'Link de agenda · screening',link_competencias:'Link de agenda · competencias',link_empresa_virtual:'Link de agenda · entrevista con la empresa (virtual / presencial)',link_empresa_presencial:'Link de agenda · empresa presencial (si es otro)',link_flyer:'Link del flyer',link_perfil:'Link del perfil del puesto en PDF (si no está protegido)'};
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
  function pin(){return 'sesion';}
  function quien(){var q='';try{q=localStorage.getItem('blumia_quien')||'';}catch(e){}return q;}
  function badPin(e){var m=(e&&e.message)||String(e);if(/PIN/.test(m)){try{sessionStorage.removeItem('bl_pin');}catch(x){}}return m;}
  window.cfAbrir=function(){
    var p=pin();if(!p)return;
    var bg=document.getElementById('cfBg');bg.classList.add('show');document.getElementById('cfBox').innerHTML='<h2>⚙ Configurar búsqueda</h2><div class="cf-help">Cargando…</div>';
    google.script.run.withSuccessHandler(function(d){CF=d;render('ia');}).withFailureHandler(function(e){alert(badPin(e));bg.classList.remove('show');}).getConfigBusqueda(p,PERFIL);
  };
  window.cfCerrar=function(){document.getElementById('cfBg').classList.remove('show');};
  window.cfTab=function(t){sync();render(t);};
  function sync(){
    nbSync();fdSync();
    if(!CF)return;var g=function(id){var e=document.getElementById(id);return e?e.value:null;},v;
    if((v=g('cf_ia'))!==null)CF.prompt_extra=v;
    Object.keys(CF.datos).forEach(function(k){if((v=g('cfd_'+k))!==null)CF.datos[k]=v;});
    CF.preguntas.forEach(function(q,i){if((v=g('cfq_e'+i))!==null){q.etiqueta=v;q.tipo=g('cfq_t'+i);q.opciones=g('cfq_o'+i);q.requerido=g('cfq_r'+i);}});
    CF.plantillas.forEach(function(t,i){if((v=g('cfp_'+i))!==null){t.texto=v;t.alcance=g('cfa_'+i);}});
  }
  function render(tab){
    var T=[['ia','Requisitos para la IA'],['post','Preguntas de postulación'],['msg','Mensajes'],['dat','Datos de la búsqueda'],['scr','Screening'],['comp','Competencias'],['perfil','Perfil del puesto'],['nueva','➕ Nueva búsqueda'],['usr','Usuarios']];
    var x='<h2>⚙ Configurar búsqueda · '+esc(CF.datos.nombre||PERFIL)+'</h2><div class="cf-tabs">'+T.map(function(t){return '<button class="cf-tab'+(t[0]===tab?' on':'')+'" onclick="cfTab(\''+t[0]+'\')">'+t[1]+'</button>';}).join('')+'</div>';
    x+='<div class="cf-sec'+(tab==='ia'?' on':'')+'"><div class="cf-help">Es el texto que la IA usa para <b>puntuar los CVs</b> de esta búsqueda (perfil, experiencia excluyente, deseable, zona, pretensión…). Si cambia el perfil del puesto, actualizalo acá. Vale para los CVs que entren desde ahora; los ya analizados no se recalculan.</div><textarea id="cf_ia" style="min-height:340px">'+esc(CF.prompt_extra)+'</textarea>'+foot('ia')+'</div>';
    x+='<div class="cf-sec'+(tab==='post'?' on':'')+'"><div class="cf-help">Preguntas que se agregan al formulario de postulación de esta búsqueda (además de los datos básicos y el CV). En «Opciones» separá con | (por ejemplo: Básico|Intermedio|Avanzado).</div>';
    CF.preguntas.forEach(function(q,i){x+='<div class="cf-row"><div><label>Pregunta</label><input id="cfq_e'+i+'" value="'+esc(q.etiqueta)+'"></div><div><label>Tipo</label><select id="cfq_t'+i+'"><option value="texto"'+(q.tipo==='texto'?' selected':'')+'>Texto libre</option><option value="select"'+(q.tipo==='select'?' selected':'')+'>Elegir opción</option></select></div><div><label>Opciones (si elige)</label><input id="cfq_o'+i+'" value="'+esc(q.opciones)+'"></div><div><label>Obligatoria</label><select id="cfq_r'+i+'"><option value="SI"'+(q.requerido!=='NO'?' selected':'')+'>Sí</option><option value="NO"'+(q.requerido==='NO'?' selected':'')+'>No</option></select></div><button class="cf-mini x" onclick="cfQuitar('+i+')">✕</button></div>';});
    x+='<button class="cf-add" onclick="cfAgregar()">+ Agregar pregunta</button>'+foot('post')+'</div>';
    x+='<div class="cf-sec'+(tab==='msg'?' on':'')+'"><div class="cf-help">Textos de los WhatsApp y mails. Por defecto cada cambio vale <b>solo para esta búsqueda</b>; si elegís «Todas las búsquedas» cambia el texto general. Se completan solos: [NOMBRE] [PUESTO] [EMPRESA] [ENTREVISTADOR] (quien envía) y [LINK] (agenda).</div>';
    CF.plantillas.forEach(function(t,i){x+='<div class="cf-pl"><b>'+esc(t.clave)+'</b> <span style="color:#888;font-size:12px">· '+esc(t.canal)+'</span> <span style="font-size:11px;font-weight:700;color:'+(t.propia?'#243D2C':'#888')+'">'+(t.propia?'· texto propio de esta búsqueda':'· texto general')+'</span><textarea id="cfp_'+i+'" style="min-height:120px;margin-top:6px">'+esc(t.texto)+'</textarea><div style="display:flex;gap:10px;align-items:center;margin-top:6px"><label style="margin:0">Guardar para:</label><select id="cfa_'+i+'" style="width:auto"><option value="esta">Solo esta búsqueda</option><option value="todas">Todas las búsquedas</option></select>'+(t.propia?'<button class="cf-mini" onclick="cfVolver('+i+')">↺ Volver al texto general</button>':'')+'</div></div>';});
    x+=foot('msg')+'</div>';
    x+='<div class="cf-sec'+(tab==='dat'?' on':'')+'"><div class="cf-help">Datos de la búsqueda. Los links tienen que empezar con https://. Al guardar se recarga el tablero.</div>';
    Object.keys(ETQ).forEach(function(k){x+='<label>'+ETQ[k]+'</label><input id="cfd_'+k+'" value="'+esc(CF.datos[k])+'">';});
    x+=foot('dat')+'</div>';
    x+='<div class="cf-sec'+(tab==='perfil'?' on':'')+'"><div class="cf-help">El <b>perfil del puesto</b> es el relevamiento de la búsqueda (organización, puesto, perfil, formación, experiencia, competencias, contratación y proceso). Acá se <b>edita</b>; la versión guardada para consultar sin tocar nada está en el menú <b>📚 Búsqueda → Perfil del puesto</b>.</div>'
      +(CF.perfil&&CF.perfil.propio?'<p style="margin:10px 0"><b>Última versión guardada:</b> '+(CF.perfil.fecha||'todavía no se guardó ninguna')+'</p><button class="cf-save" onclick="cfPerfilEditar(this)">✏️ Abrir y editar el perfil</button><div class="cf-help" style="margin-top:10px">Se abre acá mismo, abajo. Al terminar tocá «Guardar en el sistema»: cada versión queda guardada con fecha y hora, y se abre siempre la última.</div><div id="cfPerfilFr" style="margin-top:12px"></div>':'<p style="margin:10px 0">Este puesto usa un documento externo como perfil: su link se cambia en la pestaña «Datos de la búsqueda» (campo «link_perfil»).</p>')
      +'<div class="cf-foot"><button class="cf-close" onclick="cfCerrar()">Cerrar</button></div></div>';
    x+='<div class="cf-sec'+(tab==='scr'?' on':'')+'">'+scrHtml()+'</div><div class="cf-sec'+(tab==='comp'?' on':'')+'">'+compHtml()+'</div>';
    x+='<div class="cf-sec'+(tab==='nueva'?' on':'')+'">'+nbHtml()+'</div>';
    x+='<div class="cf-sec'+(tab==='usr'?' on':'')+'"><div class="cf-help">Quién puede entrar al tablero. Los <b>administradores</b> configuran las búsquedas y manejan los usuarios; los <b>usuarios</b> trabajan con los candidatos. Por ahora se entra solo con nombre y apellido (sin PIN): escribí el nombre completo como lo va a poner la persona.</div><div id="cfUsr">Cargando…</div><div class="cf-foot"><button class="cf-close" onclick="cfCerrar()">Cerrar</button></div></div>';
    document.getElementById('cfBox').innerHTML=x;
    if(tab==='usr')cfUsuarios();
    if((tab==='scr'||tab==='comp')&&!FD&&!FDcarga){FDcarga=true;google.script.run.withSuccessHandler(function(d){FD=d;FDcarga=false;render(tab);}).withFailureHandler(function(e){FDcarga=false;alert(badPin(e));}).getDatosPerfil(PERFIL);}
  }
  function foot(t){return '<div class="cf-foot"><button class="cf-close" onclick="cfCerrar()">Cerrar</button><button class="cf-save" onclick="cfGuardar(\''+t+'\',this)">Guardar</button></div>';}
  window.cfQuitar=function(i){sync();if(!confirm('¿Sacar esta pregunta? (queda copia en Historial_Formularios)'))return;CF.preguntas.splice(i,1);render('post');};
  window.cfVolver=function(i){sync();if(!confirm('¿Volver al texto general para esta búsqueda?'))return;var t=CF.plantillas[i];google.script.run.withSuccessHandler(function(){t.texto=t.general;t.propia=false;render('msg');alert('Listo: esta búsqueda usa el texto general.');}).withFailureHandler(function(e){alert(badPin(e));}).guardarConfigBusqueda(pin(),PERFIL,{plantillas:[{clave:t.clave,volver:true}]},quien());};
  window.cfAgregar=function(){sync();CF.preguntas.push({id:'',etiqueta:'',tipo:'texto',opciones:'',requerido:'SI'});render('post');};
  window.cfGuardar=function(t,btn){
    sync();var q=quien();if(!q)return;var p=pin();if(!p)return;var d={};
    if(t==='ia')d.prompt_extra=CF.prompt_extra;
    if(t==='post')d.preguntas=CF.preguntas;
    if(t==='msg')d.plantillas=CF.plantillas.map(function(x){return {clave:x.clave,texto:x.texto,alcance:x.alcance||'esta'};});
    if(t==='dat')d.datos=CF.datos;
    btn.disabled=true;btn.textContent='Guardando...';
    google.script.run.withSuccessHandler(function(){btn.disabled=false;btn.textContent='Guardar';alert('Guardado ✓');if(t==='dat')location.reload();})
     .withFailureHandler(function(e){btn.disabled=false;btn.textContent='Guardar';alert('No se guardó: '+badPin(e));})
     .guardarConfigBusqueda(p,PERFIL,d,q);
  };
  window.cfPerfilEditar=function(b){b.disabled=true;google.script.run.withSuccessHandler(function(u){b.disabled=false;var d=document.getElementById('cfPerfilFr');if(!d){window.open(u,'_blank');return;}d.innerHTML='<iframe src="'+esc(u)+'" style="width:100%;height:78vh;border:1px solid #ccc;border-radius:8px;background:#fff"></iframe><div style="text-align:right;margin-top:6px"><a href="'+esc(u)+'" target="_blank" style="font-size:12px">Abrir en pantalla completa ↗</a></div>';}).withFailureHandler(function(e){b.disabled=false;alert((e&&e.message)||e);}).linkPerfilConPin(PERFIL,'sesion','editar');};

  var NB={texto:'',empresa:'',prop:null,creada:null,ocupado:false};
  function g(id){var e=document.getElementById(id);return e?e.value:null;}
  function nbSync(){
    var v;if((v=g('nb_texto'))!==null)NB.texto=v;if((v=g('nb_emp'))!==null)NB.empresa=v;
    var p=NB.prop;if(!p||g('nb_nombre')===null)return;
    p.nombre=g('nb_nombre');p.empresa=g('nb_empresa');p.ubicacion=g('nb_ubic');p.banda_salarial=g('nb_banda');p.prompt_extra=g('nb_prompt');
    p.screening_eval.forEach(function(e,i){e.criterio=g('nb_ec'+i);e.peso=g('nb_ep'+i);});
    p.screening_val.forEach(function(e,i){e.pregunta=g('nb_vp'+i);e.opciones=g('nb_vo'+i);});
    p.competencias.forEach(function(c,i){c.nombre=g('nb_cn'+i);c.descripcion=g('nb_cd'+i);c.peso=g('nb_cp'+i);c.preguntas=String(g('nb_cq'+i)||'').split('\n').map(function(q){return q.trim();}).filter(Boolean);});
    p.postulacion.forEach(function(q,i){q.etiqueta=g('nb_qe'+i);q.tipo=g('nb_qt'+i);q.opciones=g('nb_qo'+i);q.requerido=g('nb_qr'+i);});
  }
  function pesoSel(id,v){return '<select id="'+id+'" style="width:70px">'+[1,2,3].map(function(n){return '<option'+(Number(v)===n?' selected':'')+'>'+n+'</option>';}).join('')+'</select>';}
  function nbHtml(){
    if(NB.creada){var c=NB.creada;return '<div class="cf-pl"><b>✅ Búsqueda creada: '+esc(c.nombre)+'</b><div class="cf-help" style="margin-top:8px">Empresa: '+esc(c.empresa)+'. Ya tiene su pestaña de candidatos, carpetas de Drive, formularios de screening y competencias, y preguntas de postulación.<br><br><b>Falta:</b> pegar los links de agenda en «Datos de la búsqueda» y, si querés, cargar el perfil del puesto. Los CVs que lleguen al mail con el nombre del puesto en el asunto se ordenan solos.</div></div><div class="cf-foot"><button class="cf-close" onclick="nbOtra()">Crear otra</button><button class="cf-save" onclick="window.top.location.href=NB.creada.kanban">Abrir el tablero de la búsqueda</button></div>';}
    if(!NB.prop)return '<div class="cf-help">Subí el <b>Word</b> con el relevamiento del puesto (o pegá el texto) y la <b>IA de Anthropic</b> arma la búsqueda completa: requisitos para puntuar CVs, criterios de screening, competencias con preguntas y preguntas de postulación. <b>Antes de crear nada lo revisás y lo corregís vos.</b> El archivo no se guarda: solo se lee el texto.</div>'
      +'<label>Archivo Word (.docx)</label><input type="file" id="nb_file" accept=".docx,.txt" onchange="nbArchivo(this)">'
      +'<label>…o pegá el texto del relevamiento</label><textarea id="nb_texto" style="min-height:220px" placeholder="Pegá acá el texto o subí el Word">'+esc(NB.texto)+'</textarea>'
      +'<label>Empresa (opcional: si la dejás vacía la propone la IA)</label><input id="nb_emp" value="'+esc(NB.empresa)+'">'
      +'<div class="cf-foot"><button class="cf-save" id="nb_go" onclick="nbAnalizar(this)"'+(NB.ocupado?' disabled':'')+'>🤖 Analizar con IA</button></div>';
    var p=NB.prop,x='<div class="cf-help"><b>Revisá todo antes de crear.</b> La IA se equivoca y esto después se usa para evaluar personas.'+(p.avisos&&p.avisos.length?'<br><br><b>La IA avisa:</b><ul style="margin:4px 0 0 18px">'+p.avisos.map(function(a){return '<li>'+esc(a)+'</li>';}).join('')+'</ul>':'')+'</div>';
    x+='<label>Nombre del puesto</label><input id="nb_nombre" value="'+esc(p.nombre)+'"><label>Empresa (agrupa las búsquedas en el tablero)</label><input id="nb_empresa" value="'+esc(p.empresa)+'"><label>Ubicación / modalidad</label><input id="nb_ubic" value="'+esc(p.ubicacion)+'"><label>Banda salarial de referencia en $ (opcional)</label><input id="nb_banda" value="'+esc(p.banda_salarial)+'">';
    x+='<label>Requisitos para que la IA puntúe los CVs (tiene que terminar con el bloque NIVEL_AJUSTE)</label><textarea id="nb_prompt" style="min-height:300px">'+esc(p.prompt_extra)+'</textarea>';
    x+='<h3 style="margin:16px 0 4px;font-size:15px">Screening · criterios con peso</h3>';
    p.screening_eval.forEach(function(e,i){x+='<div class="cf-pl" style="display:flex;gap:8px;align-items:center"><input id="nb_ec'+i+'" value="'+esc(e.criterio)+'">'+pesoSel('nb_ep'+i,e.peso)+'<button class="cf-mini x" onclick="nbQuitar(\'screening_eval\','+i+')">✕</button></div>';});
    x+='<button class="cf-add" onclick="nbAgregar(\'screening_eval\')">+ Criterio</button>';
    x+='<h3 style="margin:16px 0 4px;font-size:15px">Screening · datos a validar (opciones con |)</h3>';
    p.screening_val.forEach(function(e,i){x+='<div class="cf-pl" style="display:flex;gap:8px;align-items:center"><input id="nb_vp'+i+'" value="'+esc(e.pregunta)+'"><input id="nb_vo'+i+'" value="'+esc(e.opciones)+'" style="width:200px"><button class="cf-mini x" onclick="nbQuitar(\'screening_val\','+i+')">✕</button></div>';});
    x+='<button class="cf-add" onclick="nbAgregar(\'screening_val\')">+ Dato</button>';
    x+='<h3 style="margin:16px 0 4px;font-size:15px">Competencias (una pregunta por línea)</h3>';
    p.competencias.forEach(function(c,i){x+='<div class="cf-pl"><div style="display:flex;gap:8px;align-items:center"><input id="nb_cn'+i+'" value="'+esc(c.nombre)+'">'+pesoSel('nb_cp'+i,c.peso)+'<button class="cf-mini x" onclick="nbQuitar(\'competencias\','+i+')">✕</button></div><label>Descripción</label><input id="nb_cd'+i+'" value="'+esc(c.descripcion)+'"><label>Preguntas de entrevista</label><textarea id="nb_cq'+i+'" style="min-height:80px">'+esc((c.preguntas||[]).join('\n'))+'</textarea></div>';});
    x+='<button class="cf-add" onclick="nbAgregar(\'competencias\')">+ Competencia</button>';
    x+='<h3 style="margin:16px 0 4px;font-size:15px">Preguntas de postulación</h3>';
    p.postulacion.forEach(function(q,i){x+='<div class="cf-row"><div><label>Pregunta</label><input id="nb_qe'+i+'" value="'+esc(q.etiqueta)+'"></div><div><label>Tipo</label><select id="nb_qt'+i+'"><option value="texto"'+(q.tipo==='texto'?' selected':'')+'>Texto libre</option><option value="select"'+(q.tipo==='select'?' selected':'')+'>Elegir opción</option></select></div><div><label>Opciones (con |)</label><input id="nb_qo'+i+'" value="'+esc(q.opciones)+'"></div><div><label>Obligatoria</label><select id="nb_qr'+i+'"><option'+(q.requerido!=='NO'?' selected':'')+'>SI</option><option'+(q.requerido==='NO'?' selected':'')+'>NO</option></select></div><button class="cf-mini x" onclick="nbQuitar(\'postulacion\','+i+')">✕</button></div>';});
    x+='<button class="cf-add" onclick="nbAgregar(\'postulacion\')">+ Pregunta</button>';
    x+='<div class="cf-foot"><button class="cf-close" onclick="nbVolver()">← Volver al texto</button><button class="cf-save" id="nb_crear" onclick="nbCrear(this)">✅ Crear la búsqueda</button></div>';
    return x;
  }
  var NB_VACIO={screening_eval:{criterio:'',peso:1},screening_val:{pregunta:'',opciones:'Sí|No'},competencias:{nombre:'',descripcion:'',peso:1,preguntas:[]},postulacion:{etiqueta:'',tipo:'texto',opciones:'',requerido:'SI'}};
  window.nbAgregar=function(k){sync();NB.prop[k].push(JSON.parse(JSON.stringify(NB_VACIO[k])));render('nueva');};
  window.nbQuitar=function(k,i){sync();NB.prop[k].splice(i,1);render('nueva');};
  window.nbVolver=function(){sync();if(!confirm('¿Volver al texto? Se pierden las correcciones que hiciste a la propuesta.'))return;NB.prop=null;render('nueva');};
  window.nbOtra=function(){NB={texto:'',empresa:'',prop:null,creada:null,ocupado:false};render('nueva');};
  function xmlATexto(xml){
    xml=xml.replace(/<w:tab\/>/g,'\t').replace(/<w:(br|cr)\/>/g,'\n').replace(/<\/w:p>\s*<\/w:tc>/g,' | ').replace(/<\/w:tr>/g,'\n').replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,'');
    var ta=document.createElement('textarea');xml=xml.replace(/&(#x?[0-9a-fA-F]+|amp|lt|gt|quot|apos);/g,function(m){ta.innerHTML=m;return ta.value;});
    return xml.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
  }
  function docxTexto(file){
    return file.arrayBuffer().then(function(ab){
      var buf=new Uint8Array(ab),dv=new DataView(ab),e=buf.length-22;
      while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
      if(e<0)throw new Error('No parece un archivo Word (.docx). Si es un .doc viejo, guardalo como .docx o pegá el texto.');
      var n=dv.getUint16(e+10,true),off=dv.getUint32(e+16,true);
      for(var i=0;i<n;i++){
        if(dv.getUint32(off,true)!==0x02014b50)break;
        var meth=dv.getUint16(off+10,true),csz=dv.getUint32(off+20,true),nl=dv.getUint16(off+28,true),xl=dv.getUint16(off+30,true),cl=dv.getUint16(off+32,true),lho=dv.getUint32(off+42,true);
        var name=new TextDecoder().decode(buf.subarray(off+46,off+46+nl));
        if(name==='word/document.xml'){
          var st=lho+30+dv.getUint16(lho+26,true)+dv.getUint16(lho+28,true),data=buf.subarray(st,st+csz);
          if(meth===0)return xmlATexto(new TextDecoder().decode(data));
          if(typeof DecompressionStream==='undefined')throw new Error('Este navegador no puede leer el Word: pegá el texto en el cuadro.');
          return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text().then(xmlATexto);
        }
        off+=46+nl+xl+cl;
      }
      throw new Error('No encontré el contenido del Word. Pegá el texto en el cuadro.');
    });
  }
  window.nbArchivo=function(inp){
    var f=inp.files&&inp.files[0];if(!f)return;

    var fail=function(e){alert((e&&e.message)||e);};
    if(/\.txt$/i.test(f.name)){f.text().then(done,fail);return;}
    docxTexto(f).then(done,fail);

  }
  function compHtml(){
    if(!FD)return cargando();
    var x='<div class="cf-help">Las <b>competencias</b> del formulario de entrevista: nombre, descripción, peso y las preguntas (una por línea). Se aplica a las evaluaciones nuevas.</div>';
    FD.competencias.forEach(function(c,i){x+='<div class="cf-pl"><div style="display:flex;gap:8px;align-items:center"><input id="fc_n'+i+'" value="'+esc(c.nombre)+'"><input id="fc_p'+i+'" type="number" min="0" max="10" step="0.5" value="'+esc(c.peso)+'" style="width:80px" title="Peso"><button class="cf-mini x" onclick="fdQuitar(\'competencias\','+i+')">✕</button></div><label>Descripción</label><input id="fc_d'+i+'" value="'+esc(c.descripcion)+'"><label>Preguntas de entrevista</label><textarea id="fc_q'+i+'" style="min-height:90px">'+esc((c.preguntas||[]).join('\n'))+'</textarea></div>';});
