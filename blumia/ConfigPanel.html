<style>
.cf-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9100;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 10px}
.cf-bg.show{display:flex}
.cf-box{background:#fff;border-radius:12px;max-width:900px;width:100%;padding:20px 24px;color:#222;font-size:14px}
.cf-box h2{margin:0 0 12px;font-size:20px;color:#0F3F27}
.cf-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.cf-tab{background:#F7F5F1;border:1px solid #ddd;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:13px}
.cf-tab.on{background:#0F3F27;color:#fff;border-color:#0F3F27}
.cf-sec{display:none}.cf-sec.on{display:block}
.cf-help{font-size:12px;color:#666;margin-bottom:10px;line-height:1.45}
.cf-box input,.cf-box textarea,.cf-box select{border:1px solid #ccc;border-radius:6px;padding:7px 9px;font:13px/1.35 inherit;font-family:inherit;box-sizing:border-box;width:100%}
.cf-box textarea{min-height:90px}
.cf-box label{font-size:11px;color:#666;display:block;margin:8px 0 2px}
.cf-row{background:#F7F5F1;border-radius:8px;padding:8px 10px;margin-bottom:8px;display:grid;grid-template-columns:1fr 110px 1fr 80px auto;gap:8px;align-items:end}
.cf-pl{background:#F7F5F1;border-radius:8px;padding:10px;margin-bottom:10px}
.cf-mini{background:#fff;border:1px solid #bbb;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px}
.cf-mini.x{color:#B91C1C;border-color:#B91C1C}
.cf-add{background:#E6F2EC;color:#0F3F27;border:1px dashed #0F3F27;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:12px}
.cf-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.cf-save{background:#0F3F27;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-weight:800;cursor:pointer}
.cf-close{background:#fff;border:1px solid #999;border-radius:8px;padding:10px 20px;cursor:pointer}
@media(max-width:640px){.cf-row{grid-template-columns:1fr}}
</style>
<div class="cf-bg" id="cfBg" onclick="if(event.target===this)cfCerrar()"><div class="cf-box" id="cfBox"></div></div>
<script>
(function(){
  var CF=null;
  var ETQ={nombre:'Nombre en el tablero',nombre_perfil:'Nombre del puesto (se usa en los mensajes)',empresa:'Empresa (agrupa las búsquedas en el tablero)',logo_cliente:'Logo del cliente en la postulación (link https a un PNG claro, con fondo transparente; vacío = sin logo)',empresa_candidatos:'Cómo se nombra la empresa a los candidatos (vacío = «una empresa cliente del sector…»)',banda_salarial:'Banda salarial de referencia en $ (la usan el Informe de proceso y el Resumen), ej: 13000000',link_screening:'Link de agenda · screening',link_competencias:'Link de agenda · competencias',link_empresa_virtual:'Link de agenda · entrevista con la empresa (virtual / presencial)',link_empresa_presencial:'Link de agenda · empresa presencial (si es otro)',link_flyer:'Link del flyer',link_perfil:'Link del perfil del puesto en PDF (si no está protegido)'};
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
  function pin(){return 'sesion';}
  function quien(){var q='';try{q=localStorage.getItem('blumia_quien')||'';}catch(e){}return q;}
  function badPin(e){var m=(e&&e.message)||String(e);if(/PIN/.test(m)){try{sessionStorage.removeItem('bl_pin');}catch(x){}}return m;}
  window.cfAbrir=function(){
    var p=pin();if(!p)return;
    var bg=document.getElementById('cfBg');bg.classList.add('show');document.getElementById('cfBox').innerHTML='<h2>⚙ Configurar búsqueda</h2><div class="cf-help">Cargando…</div>';
    google.script.run.withSuccessHandler(function(d){CF=d;CF.base=snapBase();render('ia');}).withFailureHandler(function(e){alert(badPin(e));bg.classList.remove('show');}).getConfigBusqueda(p,PERFIL);
  };
  function snapBase(){return JSON.parse(JSON.stringify({datos:CF.datos,prompt_extra:CF.prompt_extra,hero:CF.extra.hero,estado:CF.extra.estado,cv_ia:CF.extra.cv_ia,mail:CF.extra.mail}));}
  window.cfCerrar=function(){document.getElementById('cfBg').classList.remove('show');};
  window.cfTab=function(t){sync();render(t);};
  function sync(){
    fdSync();
    if(!CF)return;var g=function(id){var e=document.getElementById(id);return e?e.value:null;},v;
    if((v=g('cf_ia'))!==null)CF.prompt_extra=v;
    ['posicion','ubicacion','instancia','entrevistadoras'].forEach(function(k){if((v=g('cfh_'+k))!==null)CF.extra.hero[k]=v;});
    var pb=document.querySelectorAll('.cfpb');if(pb.length){var sel=[];pb.forEach(function(c){if(c.checked)sel.push(c.value);});CF.datos.preguntas_base=sel.length?sel.join(','):'ninguna';}
    var di=document.getElementById('cfdi');if(di)CF.datos.datos_internos=di.checked?'SI':'NO';
    if((v=g('cfx_estado'))!==null)CF.extra.estado=v;if((v=g('cfx_cvia'))!==null)CF.extra.cv_ia=v;if((v=g('cfx_mail'))!==null)CF.extra.mail=v;
    Object.keys(CF.datos).forEach(function(k){if((v=g('cfd_'+k))!==null)CF.datos[k]=v;});
    CF.preguntas.forEach(function(q,i){if((v=g('cfq_e'+i))!==null){q.etiqueta=v;q.tipo=g('cfq_t'+i);q.opciones=g('cfq_o'+i);q.requerido=g('cfq_r'+i);}});
    CF.plantillas.forEach(function(t,i){if((v=g('cfp_'+i))!==null){t.texto=v;t.alcance=g('cfa_'+i);}});
  }
  function render(tab){
    var T=[['ia','Requisitos para la IA'],['post','Preguntas de postulación'],['msg','Mensajes'],['dat','Datos de la búsqueda'],['scr','Screening'],['comp','Competencias'],['perfil','Perfil del puesto'],['flyer','Flyer y textos']];var tb=function(L){return L.map(function(t){return '<button class="cf-tab'+(t[0]===tab?' on':'')+'" onclick="cfTab(\''+t[0]+'\')">'+t[1]+'</button>';}).join('');};
    var x='<h2>⚙ Configurar esta búsqueda</h2><div class="cf-help" style="margin:0 0 6px">'+esc(CF.datos.nombre||PERFIL)+' · para crear búsquedas nuevas o manejar usuarios usá la pantalla de Inicio (🏠).</div><div class="cf-tabs">'+tb(T)+'</div>';
    x+='<div class="cf-sec'+(tab==='ia'?' on':'')+'"><div class="cf-help">Es el texto que la IA usa para <b>puntuar los CVs</b> de esta búsqueda (perfil, experiencia excluyente, deseable, zona, pretensión…). Si cambia el perfil del puesto, actualizalo acá. Vale para los CVs que entren desde ahora; los ya analizados no se recalculan.</div><textarea id="cf_ia" style="min-height:340px">'+esc(CF.prompt_extra)+'</textarea>'+foot('ia')+'</div>';
    x+='<div class="cf-sec'+(tab==='post'?' on':'')+'"><div class="cf-help"><b>Preguntas fijas</b>: tildá las que querés que aparezcan en el formulario de esta búsqueda (todas son obligatorias para quien se postula).</div>';
    var PB=[['excel','Excel'],['powerbi','Power BI'],['ingles','Inglés'],['ia','Herramientas de IA'],['fulltime','Disponibilidad full-time'],['presencial','Trabajo 100% presencial']],on=CF.datos.preguntas_base?CF.datos.preguntas_base.split(','):PB.map(function(o){return o[0];});
    x+='<div style="display:flex;flex-wrap:wrap;gap:6px 18px;margin:6px 0 14px">'+PB.map(function(o){return '<label style="display:flex;gap:6px;align-items:center;margin:0;font-weight:600"><input type="checkbox" class="cfpb" value="'+o[0]+'"'+(on.indexOf(o[0])>=0?' checked':'')+' style="width:auto"> '+o[1]+'</label>';}).join('')+'</div>';
    x+='<div class="cf-help"><b>Preguntas propias</b> de esta búsqueda (se agregan al formulario además de los datos básicos y el CV). En «Opciones» separá con | (por ejemplo: Básico|Intermedio|Avanzado).</div>';
    CF.preguntas.forEach(function(q,i){x+='<div class="cf-row"><div><label>Pregunta</label><input id="cfq_e'+i+'" value="'+esc(q.etiqueta)+'"></div><div><label>Tipo</label><select id="cfq_t'+i+'"><option value="texto"'+(q.tipo==='texto'?' selected':'')+'>Texto libre</option><option value="select"'+(q.tipo==='select'?' selected':'')+'>Elegir opción</option></select></div><div><label>Opciones (si elige)</label><input id="cfq_o'+i+'" value="'+esc(q.opciones)+'"></div><div><label>Obligatoria</label><select id="cfq_r'+i+'"><option value="SI"'+(q.requerido!=='NO'?' selected':'')+'>Sí</option><option value="NO"'+(q.requerido==='NO'?' selected':'')+'>No</option></select></div><button class="cf-mini x" onclick="cfQuitar('+i+')">✕</button></div>';});
    x+='<button class="cf-add" onclick="cfAgregar()">+ Agregar pregunta</button>'+foot('post')+'</div>';
    x+='<div class="cf-sec'+(tab==='msg'?' on':'')+'"><div class="cf-help">Textos de los WhatsApp y mails. Por defecto cada cambio vale <b>solo para esta búsqueda</b>; si elegís «Todas las búsquedas» cambia el texto general. Se completan solos: [NOMBRE] [PUESTO] [EMPRESA] [ENTREVISTADOR] (quien envía) y [LINK] (agenda).</div>';
    CF.plantillas.forEach(function(t,i){x+='<div class="cf-pl"><b>'+esc(t.clave)+'</b> <span style="color:#888;font-size:12px">· '+esc(t.canal)+'</span> <span style="font-size:11px;font-weight:700;color:'+(t.propia?'#0F3F27':'#888')+'">'+(t.propia?'· texto propio de esta búsqueda':'· texto general')+'</span><textarea id="cfp_'+i+'" style="min-height:120px;margin-top:6px">'+esc(t.texto)+'</textarea><div style="display:flex;gap:10px;align-items:center;margin-top:6px"><label style="margin:0">Guardar para:</label><select id="cfa_'+i+'" style="width:auto"><option value="esta">Solo esta búsqueda</option><option value="todas">Todas las búsquedas</option></select>'+(t.propia?'<button class="cf-mini" onclick="cfVolver('+i+')">↺ Volver al texto general</button>':'')+'</div></div>';});
    x+=foot('msg')+'</div>';
    x+='<div class="cf-sec'+(tab==='dat'?' on':'')+'"><div class="cf-help">Datos de la búsqueda. Los links tienen que empezar con https://. Al guardar se recarga el tablero.</div>';
    Object.keys(ETQ).forEach(function(k){x+='<label>'+ETQ[k]+'</label><input id="cfd_'+k+'" value="'+esc(CF.datos[k])+'">';});
    x+='<label style="display:flex;gap:8px;align-items:center;text-transform:none"><input type="checkbox" id="cfdi" style="width:auto"'+(String(CF.datos.datos_internos||'').toUpperCase()!=='NO'?' checked':'')+'> Pedir <b>Edad</b> y <b>Situación familiar</b> en la guía de entrevista y mostrarlas en el informe (uso interno)</label>';
    var E=CF.extra,H=E.hero;
    x+='<h3 style="margin:18px 0 4px;font-size:15px">Puesto y proceso</h3><div class="cf-help">Lo que se ve en el formulario de postulación y en las entrevistas.</div>';
    x+='<label>Nombre del puesto en la postulación</label><input id="cfh_posicion" value="'+esc(H.posicion)+'"><label>Empresa · ubicación (se ve debajo del puesto)</label><input id="cfh_ubicacion" value="'+esc(H.ubicacion)+'"><label>Instancia (etapa de la entrevista)</label><input id="cfh_instancia" value="'+esc(H.instancia)+'"><label>Entrevistadores (separados con coma: Ariel, Analía, Flavia)</label><input id="cfh_entrevistadoras" value="'+esc(H.entrevistadoras)+'">';
    x+='<h3 style="margin:18px 0 4px;font-size:15px">Estado y CVs</h3>';
    x+='<label>Estado de la búsqueda</label><select id="cfx_estado"><option value="ABIERTA"'+(E.estado==='ABIERTA'?' selected':'')+'>ABIERTA</option><option value="CERRADA"'+(E.estado==='CERRADA'?' selected':'')+'>CERRADA</option></select><div class="cf-help">Cerrada: la página de postulación avisa que ya terminó, no entran CVs nuevos por mail ni por la carpeta, y en el selector figura «· cerrada». Los candidatos y el tablero siguen disponibles.</div>';
    x+='<label>Quién lee los CVs</label><select id="cfx_cvia"><option value=""'+(!E.cv_ia?' selected':'')+'>Automático (Claude, ChatGPT en MACS)</option><option value="claude"'+(E.cv_ia==='claude'?' selected':'')+'>Claude</option><option value="openai"'+(E.cv_ia==='openai'?' selected':'')+'>ChatGPT</option></select>';
    x+='<label>Palabras del asunto del mail para ordenar los CVs de esta búsqueda (separadas con |)</label><input id="cfx_mail" value="'+esc(E.mail)+'"><div class="cf-help">Si el asunto del mail contiene una de estas palabras, el CV va a esta búsqueda. Si lo dejás vacío, igual se ordena cuando el asunto nombra el puesto.</div>';
    if(E.enlaces&&(E.enlaces.hoja||E.enlaces.carpeta))x+='<h3 style="margin:18px 0 4px;font-size:15px">Dónde está guardado</h3><div class="cf-help">Solo para abrir: esto no se edita desde acá.</div><div style="display:flex;gap:10px;flex-wrap:wrap">'+(E.enlaces.hoja?'<a class="cf-mini" target="_blank" href="'+esc(E.enlaces.hoja)+'">📄 Pestaña de candidatos</a>':'')+(E.enlaces.carpeta?'<a class="cf-mini" target="_blank" href="'+esc(E.enlaces.carpeta)+'">📁 Carpeta en Drive</a>':'')+'</div>';
    x+=foot('dat')+'</div>';
    x+='<div class="cf-sec'+(tab==='flyer'?' on':'')+'"><div class="cf-help">El <b>flyer</b> y los <b>textos para redes</b> (LinkedIn, Instagram y WhatsApp) de esta búsqueda. Se arman con lo cargado en el perfil del puesto y con los colores y la tipografía de la marca; abrís el editor, retocás directo sobre el flyer y bajás la imagen.</div><button class="cf-save" onclick="window.open(URL_APP+\'?tipo=flyer&perfil=\'+encodeURIComponent(PERFIL),\'_blank\')">📢 Abrir el editor de flyer</button><div class="cf-foot"><button class="cf-close" onclick="cfCerrar()">Cerrar</button></div></div>';
    x+='<div class="cf-sec'+(tab==='perfil'?' on':'')+'"><div class="cf-help">El <b>perfil del puesto</b> es el relevamiento de la búsqueda (organización, puesto, perfil, formación, experiencia, competencias, contratación y proceso). Acá se <b>edita</b>; la versión guardada para consultar sin tocar nada está en el menú <b>📚 Búsqueda → Perfil del puesto</b>.</div>'
      +(CF.perfil&&CF.perfil.propio?'<p style="margin:10px 0"><b>Última versión guardada:</b> '+(CF.perfil.fecha||'todavía no se guardó ninguna')+'</p><button class="cf-save" onclick="cfPerfilEditar(this)">✏️ Abrir y editar el perfil</button><div class="cf-help" style="margin-top:10px">Se abre acá mismo, abajo. Al terminar tocá «Guardar en el sistema»: cada versión queda guardada con fecha y hora, y se abre siempre la última.</div><div id="cfPerfilFr" style="margin-top:12px"></div>':'<p style="margin:10px 0">Esta búsqueda todavía no tiene el perfil del puesto dentro del sistema (hoy usa un link a un documento externo, si lo cargaste en «Datos de la búsqueda»).</p><button class="cf-save" onclick="cfPerfilCrear(this)">Crear el perfil del puesto de esta búsqueda</button><div class="cf-help" style="margin-top:10px">Queda un formulario en blanco para completar a mano o con «✨ Completar con IA desde un Word».</div>')
      +'<div class="cf-foot"><button class="cf-close" onclick="cfCerrar()">Cerrar</button></div></div>';
    x+='<div class="cf-sec'+(tab==='scr'?' on':'')+'">'+scrHtml()+'</div><div class="cf-sec'+(tab==='comp'?' on':'')+'">'+compHtml()+'</div>';
    document.getElementById('cfBox').innerHTML=x;
    if((tab==='scr'||tab==='comp')&&!FD&&!FDcarga){FDcarga=true;google.script.run.withSuccessHandler(function(d){FD=d;FDcarga=false;render(tab);}).withFailureHandler(function(e){FDcarga=false;alert(badPin(e));}).getDatosPerfil(PERFIL);}
  }
  function foot(t){return '<div class="cf-foot"><button class="cf-close" onclick="cfCerrar()">Cerrar</button><button class="cf-save" onclick="cfGuardar(\''+t+'\',this)">Guardar</button></div>';}
  window.cfQuitar=function(i){sync();blConfirm('¿Sacar esta pregunta? (queda guardada una copia de lo anterior)',function(){CF.preguntas.splice(i,1);render('post');},{si:'Sacar',peligro:true});};
  window.cfVolver=function(i){sync();blConfirm('¿Volver al texto general para esta búsqueda?',function(){var t=CF.plantillas[i];google.script.run.withSuccessHandler(function(){t.texto=t.general;t.propia=false;render('msg');alert('Listo: esta búsqueda usa el texto general.');}).withFailureHandler(function(e){alert(badPin(e));}).guardarConfigBusqueda(pin(),PERFIL,{plantillas:[{clave:t.clave,volver:true}]},quien());},{si:'Volver al general'});};
  window.cfAgregar=function(){sync();CF.preguntas.push({id:'',etiqueta:'',tipo:'texto',opciones:'',requerido:'SI'});render('post');};
  window.cfGuardar=function(t,btn){
    sync();var q=quien();if(!q)return;var p=pin();if(!p)return;var d={};
    if(t==='ia')d.prompt_extra=CF.prompt_extra;
    if(t==='post'){d.preguntas=CF.preguntas;d.datos={preguntas_base:CF.datos.preguntas_base};}
    if(t==='msg')d.plantillas=CF.plantillas.map(function(x){return {clave:x.clave,texto:x.texto,alcance:x.alcance||'esta'};});
    if(t==='dat'){d.datos=CF.datos;d.extra={hero:CF.extra.hero,estado:CF.extra.estado,cv_ia:CF.extra.cv_ia,mail:CF.extra.mail};}
    d.base=CF.base;
    btn.disabled=true;btn.textContent='Guardando...';
    google.script.run.withSuccessHandler(function(){btn.disabled=false;btn.textContent='Guardar';var sb=snapBase();if(t==='dat'){CF.base.datos=sb.datos;CF.base.hero=sb.hero;CF.base.estado=sb.estado;CF.base.cv_ia=sb.cv_ia;CF.base.mail=sb.mail;}if(t==='ia')CF.base.prompt_extra=sb.prompt_extra;if(t==='dat')blAlert('Guardado ✓',function(){location.reload();});else blAlert('Guardado ✓');})
     .withFailureHandler(function(e){btn.disabled=false;btn.textContent='Guardar';alert('No se guardó: '+badPin(e));})
     .guardarConfigBusqueda(p,PERFIL,d,q);
  };
  window.cfPerfilEditar=function(b){b.disabled=true;google.script.run.withSuccessHandler(function(u){b.disabled=false;var d=document.getElementById('cfPerfilFr');if(!d){window.open(u,'_blank');return;}d.innerHTML='<iframe src="'+esc(u)+'" style="width:100%;height:78vh;border:1px solid #ccc;border-radius:8px;background:#fff"></iframe><div style="text-align:right;margin-top:6px"><a href="'+esc(u)+'" target="_blank" style="font-size:12px">Abrir en pantalla completa ↗</a></div>';}).withFailureHandler(function(e){b.disabled=false;alert((e&&e.message)||e);}).linkPerfilConPin(PERFIL,'sesion','editar');};

  function g(id){var e=document.getElementById(id);return e?e.value:null;}
  window.cfPerfilCrear=function(b){blConfirm('Se va a crear el perfil del puesto de esta búsqueda (formulario en blanco). Si tenía un link a un documento externo, el botón «Perfil del puesto» de 📚 Búsqueda pasa a abrir este formulario. ¿Seguir?',function(){b.disabled=true;google.script.run.withSuccessHandler(function(){CF.perfil={propio:true,fecha:''};render('perfil');}).withFailureHandler(function(e){b.disabled=false;alert((e&&e.message)||e);}).activarPerfilPuesto(pin(),PERFIL);},{si:'Crear'});};
  var FD=null,FDcarga=false;
  function fdSync(){
    if(!FD||g('fd_a')===null)return;var v;
    FD.hero.criterio_avanza=g('fd_a');FD.hero.criterio_bplus=g('fd_b');FD.hero.criterio_reserva=g('fd_r');
    FD.eval_items.forEach(function(e,i){e.label=g('fe_l'+i);e.peso=g('fe_p'+i);});
    FD.val_items.forEach(function(e,i){e.label=g('fv_l'+i);e.opts=String(g('fv_o'+i)||'').split('|').map(function(o){return o.trim();}).filter(Boolean);});
    FD.competencias.forEach(function(c,i){c.nombre=g('fc_n'+i);c.descripcion=g('fc_d'+i);c.peso=g('fc_p'+i);c.preguntas=String(g('fc_q'+i)||'').split('\n').map(function(q){return q.trim();}).filter(Boolean);});
  }
  function cargando(){return '<div class="cf-help">Cargando…</div>';}
  function scrHtml(){
    if(!FD)return cargando();
    var h=FD.hero,x='<div class="cf-help">El <b>formulario de screening</b> de esta búsqueda: criterios con su peso, datos a validar con el candidato y los puntajes que definen la nota (A, B+, B). Se aplica a las evaluaciones nuevas; las ya guardadas no cambian. También se puede editar con el lápiz ✏️ dentro del formulario.</div>';
    x+='<h3 style="margin:10px 0 4px;font-size:15px">Criterios con peso</h3>';
    FD.eval_items.forEach(function(e,i){x+='<div class="cf-pl" style="display:flex;gap:8px;align-items:center"><input id="fe_l'+i+'" value="'+esc(e.label)+'"><input id="fe_p'+i+'" type="number" min="0" max="10" step="0.5" value="'+esc(e.peso)+'" style="width:80px" title="Peso"><button class="cf-mini x" onclick="fdQuitar(\'eval_items\','+i+')">✕</button></div>';});
    x+='<button class="cf-add" onclick="fdAgregar(\'eval_items\')">+ Criterio</button>';
    x+='<h3 style="margin:16px 0 4px;font-size:15px">Datos a validar (opciones separadas con |)</h3>';
    FD.val_items.forEach(function(e,i){x+='<div class="cf-pl" style="display:flex;gap:8px;align-items:center"><input id="fv_l'+i+'" value="'+esc(e.label)+'"><input id="fv_o'+i+'" value="'+esc((e.opts||[]).join('|'))+'" style="width:220px"><button class="cf-mini x" onclick="fdQuitar(\'val_items\','+i+')">✕</button></div>';});
    x+='<button class="cf-add" onclick="fdAgregar(\'val_items\')">+ Dato</button>';
    x+='<h3 style="margin:16px 0 4px;font-size:15px">Puntajes de corte</h3><div class="cf-help">Nota A: desde · B+: desde · B (en reserva): desde. Tienen que ir de mayor a menor.</div><div style="display:flex;gap:10px"><div><label>A desde</label><input id="fd_a" type="number" step="0.1" value="'+esc(h.criterio_avanza==null?'8.5':h.criterio_avanza)+'"></div><div><label>B+ desde</label><input id="fd_b" type="number" step="0.1" value="'+esc(h.criterio_bplus==null?'8':h.criterio_bplus)+'"></div><div><label>B desde</label><input id="fd_r" type="number" step="0.1" value="'+esc(h.criterio_reserva==null?'6.5':h.criterio_reserva)+'"></div></div>';
    return x+'<div class="cf-foot"><button class="cf-close" onclick="cfCerrar()">Cerrar</button><button class="cf-save" onclick="fdGuardar(\'scr\',this)">Guardar</button></div>';
  }
  function compHtml(){
    if(!FD)return cargando();
    var x='<div class="cf-help">Las <b>competencias</b> del formulario de entrevista: nombre, descripción, peso y las preguntas (una por línea). Se aplica a las evaluaciones nuevas.</div>';
    FD.competencias.forEach(function(c,i){x+='<div class="cf-pl"><div style="display:flex;gap:8px;align-items:center"><input id="fc_n'+i+'" value="'+esc(c.nombre)+'"><input id="fc_p'+i+'" type="number" min="0" max="10" step="0.5" value="'+esc(c.peso)+'" style="width:80px" title="Peso"><button class="cf-mini x" onclick="fdQuitar(\'competencias\','+i+')">✕</button></div><label>Descripción</label><input id="fc_d'+i+'" value="'+esc(c.descripcion)+'"><label>Preguntas de entrevista</label><textarea id="fc_q'+i+'" style="min-height:90px">'+esc((c.preguntas||[]).join('\n'))+'</textarea></div>';});
    x+='<button class="cf-add" onclick="fdAgregar(\'competencias\')">+ Competencia</button>';
    return x+'<div class="cf-foot"><button class="cf-close" onclick="cfCerrar()">Cerrar</button><button class="cf-save" onclick="fdGuardar(\'comp\',this)">Guardar</button></div>';
  }
  var FD_VACIO={eval_items:{label:'',peso:1},val_items:{label:'',opts:['Sí','No']},competencias:{nombre:'',descripcion:'',peso:1,preguntas:[]}};
  window.fdAgregar=function(k){sync();FD[k].push(JSON.parse(JSON.stringify(FD_VACIO[k])));render(k==='competencias'?'comp':'scr');};
  window.fdQuitar=function(k,i){sync();blConfirm('¿Sacar este elemento? (queda guardada una copia de lo anterior)',function(){FD[k].splice(i,1);render(k==='competencias'?'comp':'scr');},{si:'Sacar',peligro:true});};
  window.fdGuardar=function(t,btn){
    sync();var q=quien();var p={};
    if(t==='scr'){p.eval=FD.eval_items.map(function(e){return {label:e.label,peso:e.peso};});p.val=FD.val_items.map(function(e){return {label:e.label,opts:e.opts};});p.hero={criterio_avanza:FD.hero.criterio_avanza,criterio_bplus:FD.hero.criterio_bplus,criterio_reserva:FD.hero.criterio_reserva};}
    else p.comps=FD.competencias.map(function(c){return {nombre:c.nombre,descripcion:c.descripcion,peso:c.peso,preguntas:c.preguntas};});
    btn.disabled=true;btn.textContent='Guardando...';
    google.script.run.withSuccessHandler(function(){btn.disabled=false;btn.textContent='Guardar';FD=null;alert('Guardado ✓');render(t);}).withFailureHandler(function(e){btn.disabled=false;btn.textContent='Guardar';alert('No se guardó: '+badPin(e));}).guardarFormularioPerfil(pin(),PERFIL,p,q);
  };
  var nav=document.getElementById('nav');
  if(nav&&(typeof blRol!=='function'||blRol()==='Administrador'))nav.insertAdjacentHTML('beforeend','<button onclick="cfAbrir()">⚙ Configurar</button>');
})();
</script>
