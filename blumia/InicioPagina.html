<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blumia · Atracción y Elección</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--deep:#0D3F29;--green:#243D2C;--glight:#E3EEDC;--bg:#F3F8F1;--line:#D5E0CE;--cream:#FBE794;--pink:#F9BDBB;--teal:#5BB5A5;--font:'Poppins',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:#1A1A1A;font-size:14px}
.hero{background:var(--deep);color:#fff;position:relative;overflow:hidden;padding:20px 0 34px;min-height:300px}
.in{padding:0 28px;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.top img{height:38px}
.top .r{display:flex;gap:10px;align-items:center;position:relative}
.top .gear{width:40px;height:40px;border-radius:50%;font-size:18px;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);cursor:pointer;display:none}
.top .gear:hover{background:rgba(255,255,255,.26)}
.top .avt{width:40px;height:40px;border-radius:50%;font:800 14px var(--font);color:var(--deep);background:var(--cream);border:none;cursor:pointer}
.top .avt:hover{background:#f6dc72}
.menu{position:absolute;right:0;top:48px;background:#fff;color:var(--deep);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.28);padding:6px;min-width:210px;display:none;z-index:5}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;border:none;background:none;padding:10px 14px;border-radius:10px;font:600 13px var(--font);color:var(--deep);cursor:pointer}
.menu button:hover{background:var(--glight)}
.ht{position:relative;z-index:2;max-width:620px;margin-top:34px}
.ht .hi{font-size:16px;color:#cfe3d4;font-weight:500}.ht .hi em{font-style:normal;color:var(--cream);font-weight:700}
.ht h1{font-size:38px;font-weight:800;line-height:1.1;letter-spacing:-.5px;margin-top:6px}
.ht p{margin-top:10px;font-size:15px;color:#cfe3d4;max-width:460px}
.stats{display:flex;gap:26px;margin-top:20px}
.stats b{display:block;font-size:26px;font-weight:800;color:var(--cream);line-height:1}
.stats span{font-size:12px;color:#cfe3d4}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.cta button,.cta a{padding:13px 26px;border-radius:26px;font:700 14px var(--font);cursor:pointer;text-decoration:none;display:inline-block}
.cta .pri{background:var(--cream);color:var(--deep);border:none}.cta .pri:hover{background:#f6dc72}
.cta .sec{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55)}.cta .sec:hover{background:rgba(255,255,255,.14)}
.sq{position:absolute;z-index:1;pointer-events:none}
.s2{right:-70px;top:calc(50% + 26px);transform:translateY(-50%);height:270px;opacity:.7}
body{overflow-x:hidden}
main{padding:30px 28px 50px}
.emp{margin-bottom:30px}
.emp h2{font-size:18px;font-weight:800;color:var(--deep);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.emp h2{flex-wrap:wrap}.emp h2 span{white-space:nowrap}
.emp h2 span.gr{background:#E6E8E4;color:#666}
.emp h2 span{background:var(--cream);color:var(--deep);border-radius:14px;padding:3px 12px;font-size:12px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;display:flex;gap:14px;align-items:center;transition:.15s}
.card:hover{box-shadow:0 8px 22px rgba(13,63,41,.16);transform:translateY(-2px);border-color:var(--deep)}
.card img{width:54px;height:54px;border-radius:14px;flex:none}
.card .av{width:54px;height:54px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font:800 18px var(--font);color:var(--deep)}.card.cerr .av{filter:grayscale(1)}
.card .t{flex:1;min-width:0}
.card b{display:block;font-size:14px;font-weight:700;color:var(--deep);line-height:1.25}
.card small{display:block;margin-top:4px;color:#666;font-size:12px}
.card .go{font-size:20px;color:var(--deep);font-weight:700}
.card.cerr{background:#FAFBF9}.card.cerr .t b{color:#4A4A4A}.card.cerr small{color:#5E5E5E!important}.card.cerr img{filter:grayscale(1)}
.card .cl{flex:none;border:1px solid var(--line);background:#fff;color:#666;border-radius:8px;width:32px;height:32px;font:700 18px/1 var(--font);cursor:pointer}.card .cl:hover{background:var(--glight);color:var(--deep);border-color:var(--deep)}
.tag{display:inline-block;background:#eee;color:#666;border-radius:10px;padding:1px 8px;font-size:11px;margin-left:6px;font-weight:600}
details.cerr{margin-top:12px}details.cerr summary{cursor:pointer;color:#666;font-weight:700;margin:4px 0 12px}
.vacio{background:#fff;border:1px dashed var(--line);border-radius:18px;padding:34px;text-align:center;color:#666}
footer{text-align:center;color:#5E5E5E;font-size:12px;padding:10px 0 30px}
@media(max-width:640px){.hero{padding:16px 16px 28px;min-height:260px}.ht{margin-top:26px}.ht h1{font-size:26px}.s2{display:none}.stats{gap:20px}.cta button,.cta a{flex:1 1 100%;text-align:center}.grid{grid-template-columns:1fr}.top img{height:32px}}
</style><style id="btnU">/* un solo estilo de botón: rectángulo de 8 px (las píldoras quedan solo para etiquetas y contadores) */
.cta button,.cta a{border-radius:8px}
</style>
</head><body>
<section class="hero">
  <img class="sq s2" id="s2" alt="">
  <div class="in">
  <div class="top"><img id="lg" alt="Blumia"><div class="r"><button class="gear" id="gear" title="Administración" onclick="menuAdm(event)">⚙</button><div class="menu" id="menu"></div><button class="avt" id="quienBtn" onclick="blMenuUsuario()">·</button></div></div>
  <div class="ht"><div class="hi" id="hola">Hola</div><h1>Atracción y Elección</h1><p>Elegí una búsqueda para ver a sus candidatos.</p>
    <div class="stats"><div><b id="stA">0</b><span>búsquedas abiertas</span></div><div><b id="stC">0</b><span>candidatos</span></div></div>
    <div class="cta" id="cta"></div></div>
  </div>
</section>
<main>
  <div id="lista"></div>
</main>
<footer>Blumia Consulting · Confidencial</footer>
<script>
var DATOS=%%DATOS%%;
var URL_APP=%%URL%%;
var LOGO=%%LOGO%%;
var AS=%%ASSETS%%;
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function ir(id){window.top.location.href=URL_APP+'?tipo=kanban&perfil='+encodeURIComponent(id);}
document.getElementById('lg').src=LOGO;document.getElementById('s2').src=AS.s2;
var esAdmin=(typeof blRol==='function')&&blRol()==='Administrador';
var nom='';try{nom=(typeof blNombre==='function'&&blNombre())||localStorage.getItem('blumia_quien')||'';}catch(e){}
document.getElementById('hola').innerHTML=nom?'Hola, <em>'+esc(nom.split(' ')[0])+'</em>':'Hola';
var pn=nom.trim().split(/\s+/).filter(Boolean);document.getElementById('quienBtn').textContent=pn.length?(pn[0].charAt(0)+(pn.length>1?pn[pn.length-1].charAt(0):'')).toUpperCase():'👤';document.getElementById('quienBtn').title=(nom||'Usuario')+' · tocá para salir';
var cta='';
if(esAdmin)cta+='<button class="pri" onclick="adAbrir(\'nueva\')">➕ Nueva búsqueda</button>';
cta+='<a class="sec" href="#" onclick="window.top.location.href=URL_APP+\'?tipo=banco\';return false">★ Banco de talento</a>';
document.getElementById('cta').innerHTML=cta;
if(esAdmin){document.getElementById('gear').style.display='inline-block';document.getElementById('menu').innerHTML='<button onclick="adAbrir(\'usr\')">👥 Usuarios</button><button onclick="adAbrir(\'copia\')">💾 Copias de seguridad</button><button onclick="adAbrir(\'acc\')">📜 Accesos</button><button onclick="adAbrir(\'vel\')">⏱ Velocidad</button>';}
function menuAdm(e){e.stopPropagation();document.getElementById('menu').classList.toggle('show');}
document.addEventListener('click',function(){var m=document.getElementById('menu');if(m)m.classList.remove('show');});
function pintar(){
var abiertas=DATOS.filter(function(b){return !b.cerrada;});
document.getElementById('stA').textContent=abiertas.length;
document.getElementById('stC').textContent=abiertas.reduce(function(a,b){return a+(b.n||0);},0);
var k=0;
function ini(e){var w=String(e||'').trim().split(/\s+/).filter(Boolean);return ((w[0]||'?').charAt(0)+(w.length>1?w[1].charAt(0):(w[0]||'').charAt(1))).toUpperCase();}
function colorEmp(e){var h=0,t=String(e||'');for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return ['#FBE794','#F9BDBB','#DCE8D3','#BFE3DB'][h%4];}
function tarjeta(b){return '<div class="card'+(b.cerrada?' cerr':'')+'" onclick="ir(\''+esc(b.id)+'\')"><div class="av" style="background:'+colorEmp(b.empresa)+'" aria-hidden="true">'+esc(ini(b.empresa))+'</div><div class="t"><b>'+esc(b.nombre)+'</b><small>'+b.n+' candidato'+(b.n===1?'':'s')+(b.cerrada?' · cerrada':'')+'</small></div>'+(esAdmin?'<button class="cl" title="Más opciones" aria-label="Más opciones de '+esc(b.nombre)+'" onclick="event.stopPropagation();menuTar(\''+esc(b.id)+'\')">⋯</button>':'')+'<span class="go">›</span></div>';}
var por={};DATOS.forEach(function(b){(por[b.empresa]=por[b.empresa]||[]).push(b);});
var h='';
Object.keys(por).sort().forEach(function(emp,ix){k=ix;
  var ab=por[emp].filter(function(b){return !b.cerrada;}),ce=por[emp].filter(function(b){return b.cerrada;});
  h+='<div class="emp"><h2>'+esc(emp)+'<span>'+ab.length+' abierta'+(ab.length===1?'':'s')+'</span>'+(ce.length?'<span class="gr">'+ce.length+' cerrada'+(ce.length===1?'':'s')+'</span>':'')+'</h2>'
    +'<div class="grid">'+ab.concat(ce).map(tarjeta).join('')+'</div></div>';
});
document.getElementById('lista').innerHTML=h||'<div class="vacio">Todavía no hay búsquedas.'+(esAdmin?' Creá la primera con «➕ Nueva búsqueda».':'')+'</div>';
}
function menuTar(id){var b=DATOS.filter(function(x){return x.id===id;})[0];if(!b)return;blMenu(b.nombre,'',[[b.cerrada?'Reabrir búsqueda':'Cerrar búsqueda',function(){estado(id,!b.cerrada);}]]);}
function estado(id,cerrar){
  var b=DATOS.filter(function(x){return x.id===id;})[0];if(!b)return;
  var msg=cerrar?'¿Cerrar «'+b.nombre+'»?\n\nLa página de postulación avisa que ya terminó y deja de recibir CVs por mail y por carpeta. Los candidatos y el tablero siguen disponibles. Podés reabrirla cuando quieras.':'¿Reabrir «'+b.nombre+'»? Vuelve a recibir postulaciones y CVs.';
  blConfirm(msg,function(){
  google.script.run.withSuccessHandler(function(){b.cerrada=!!cerrar;pintar();}).withFailureHandler(function(e){alert((e&&e.message)||e);}).cambiarEstadoBusqueda(id,cerrar?'CERRADA':'ABIERTA');
  },{si:cerrar?'Cerrar':'Reabrir',peligro:!!cerrar});
}
pintar();
</script>
</body></html>
