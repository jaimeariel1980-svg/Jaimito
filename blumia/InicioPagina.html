<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blumia · Inicio</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#243D2C;--glight:#E3EEDC;--bg:#F3F8F1;--line:#D5E0CE;--cream:#F9E7A0;--teal:#5BB5A5;--font:'Poppins',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:#1A1A1A;font-size:14px}
header{background:var(--green);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{height:36px}header h1{font-size:18px;font-weight:800}
header .nav{margin-left:auto;display:flex;gap:8px;align-items:center}
header button{padding:8px 14px;border-radius:20px;font:700 13px var(--font);color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);cursor:pointer}
header button:hover{background:rgba(255,255,255,.28)}
main{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
.hola{font-size:20px;font-weight:800;color:var(--green);margin-bottom:4px}
.sub{color:#555;margin-bottom:18px}
.acc{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.acc button,.acc a{padding:11px 20px;border-radius:24px;font:700 14px var(--font);cursor:pointer;border:1px solid var(--green);background:#fff;color:var(--green);text-decoration:none;display:inline-block}
.acc .big{background:var(--cream);border-color:#d9c46a;font-size:15px;padding:13px 26px}
.acc button:hover,.acc a:hover{background:var(--glight)}.acc .big:hover{background:#f4dc7e}
.emp{margin-bottom:26px}
.emp h2{font-size:15px;font-weight:800;color:var(--green);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.emp h2 span{background:var(--glight);border-radius:12px;padding:2px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:12px;padding:14px 16px;cursor:pointer;transition:.15s}
.card:hover{box-shadow:0 4px 14px rgba(36,61,44,.14);transform:translateY(-1px)}
.card b{display:block;font-size:14px;color:var(--green);margin-bottom:6px}
.card small{color:#666}
.card.cerr{border-left-color:#bbb;opacity:.75}
.tag{display:inline-block;background:#eee;color:#666;border-radius:10px;padding:1px 8px;font-size:11px;margin-left:6px}
details.cerr{margin-top:6px}details.cerr summary{cursor:pointer;color:#666;font-weight:700;margin:6px 0 10px}
.vacio{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:#666}
@media(max-width:640px){header h1{font-size:16px}.acc button,.acc a{flex:1 1 100%;text-align:center}.grid{grid-template-columns:1fr}}
</style></head><body>
<header><img id="lg" alt="Blumia"><h1>Búsquedas</h1><div class="nav"><button id="quienBtn" onclick="blMenuUsuario()">👤 Usuario</button></div></header>
<main>
  <div class="hola" id="hola">Hola</div>
  <div class="sub">Elegí una búsqueda para ver sus candidatos.</div>
  <div class="acc" id="acc"></div>
  <div id="lista"></div>
</main>
<script>
var DATOS=/*DATOS*/[];
var URL_APP=/*URL*/"";
var LOGO=/*LOGO*/"";
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function ir(id){window.top.location.href=URL_APP+'?tipo=kanban&perfil='+encodeURIComponent(id);}
document.getElementById('lg').src=LOGO;
var esAdmin=(typeof blRol==='function')&&blRol()==='Administrador';
var nom='';try{nom=(typeof blNombre==='function'&&blNombre())||localStorage.getItem('blumia_quien')||'';}catch(e){}
document.getElementById('hola').textContent=nom?'Hola, '+nom.split(' ')[0]:'Hola';
if(nom)document.getElementById('quienBtn').textContent='👤 '+nom;
var acc='';
if(esAdmin)acc+='<button class="big" onclick="adAbrir(\'nueva\')">➕ Nueva búsqueda</button>';
acc+='<a href="#" onclick="window.top.location.href=URL_APP+\'?tipo=banco\';return false">★ Banco de talento</a>';
if(esAdmin)acc+='<button onclick="adAbrir(\'usr\')">👥 Usuarios</button><button onclick="adAbrir(\'copia\')">💾 Copia de seguridad</button><button onclick="adAbrir(\'acc\')">📜 Accesos</button>';
document.getElementById('acc').innerHTML=acc;
function tarjeta(b){return '<div class="card'+(b.cerrada?' cerr':'')+'" onclick="ir(\''+esc(b.id)+'\')"><b>'+esc(b.nombre)+(b.cerrada?'<span class="tag">cerrada</span>':'')+'</b><small>'+b.n+' candidato'+(b.n===1?'':'s')+'</small></div>';}
var por={};DATOS.forEach(function(b){(por[b.empresa]=por[b.empresa]||[]).push(b);});
var h='';
Object.keys(por).sort().forEach(function(emp){
  var ab=por[emp].filter(function(b){return !b.cerrada;}),ce=por[emp].filter(function(b){return b.cerrada;});
  h+='<div class="emp"><h2>'+esc(emp)+'<span>'+ab.length+' abierta'+(ab.length===1?'':'s')+'</span></h2>'
    +(ab.length?'<div class="grid">'+ab.map(tarjeta).join('')+'</div>':'<div class="sub">No hay búsquedas abiertas.</div>')
    +(ce.length?'<details class="cerr"><summary>Cerradas ('+ce.length+')</summary><div class="grid">'+ce.map(tarjeta).join('')+'</div></details>':'')+'</div>';
});
document.getElementById('lista').innerHTML=h||'<div class="vacio">Todavía no hay búsquedas.'+(esAdmin?' Creá la primera con «➕ Nueva búsqueda».':'')+'</div>';
</script>
</body></html>
