<style id="huntcss">
.rs-tab .hb{display:inline-block;min-width:18px;padding:2px 6px;margin-left:6px;border-radius:99px;background:#E0A800;color:#fff;font-weight:800;font-size:11px;line-height:1.3;font-family:inherit;text-align:center}
#huntPage{display:none;padding:14px 28px 50px;color:#1a1a1a}
#huntPage .hu-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
#huntPage .hu-top h2{margin:0;font-size:20px;color:#0F3F27;flex:1 1 auto}
#huntPage .hu-btn{height:40px;padding:0 16px;border-radius:8px;border:1px solid #0F3F27;background:#fff;color:#0F3F27;font-weight:700;font-size:13px;line-height:1;font-family:inherit;cursor:pointer}
#huntPage .hu-btn.p{background:#0F3F27;color:#fff}
#huntPage .hu-btn.s{height:32px;padding:0 11px;font-size:12px}
#huntPage .hu-btn.r{border-color:#B91C1C;color:#B91C1C}
#huntPage .hu-btn:disabled{opacity:.5;cursor:default}
#huntPage .hu-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
#huntPage .rs-kpi{cursor:default}
#huntPage .hu-help{font-size:12.5px;color:#555;background:#F3F8F1;border:1px solid #DCE8D3;border-radius:10px;padding:10px 14px;margin-bottom:14px;line-height:1.5}
#huntPage .hu-board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:10px}
#huntPage .hu-col{flex:1 1 220px;min-width:220px;background:#EEF4EC;border-radius:12px;padding:10px;max-height:calc(100vh - 330px);overflow:auto}
#huntPage .hu-ch{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13px;line-height:1.2;font-family:inherit;color:#0F3F27;text-transform:uppercase;letter-spacing:.5px;margin:2px 4px 10px}
#huntPage .hu-ch b{background:#FEE795;border-radius:8px;min-width:30px;text-align:center;padding:3px 8px;font-size:15px}
#huntPage .hu-card{background:#fff;border:1px solid #DDE5DA;border-left:5px solid #0F3F27;border-radius:10px;padding:11px 12px;margin-bottom:9px}
#huntPage .hu-card.B{border-left-color:#E0A800}
#huntPage .hu-n{font-weight:800;font-size:15px;line-height:1.25;display:flex;gap:6px;align-items:flex-start}
#huntPage .hu-n span{flex:1}
#huntPage .hu-pr{font-weight:800;font-size:10px;line-height:1;font-family:inherit;border-radius:6px;padding:3px 6px;background:#0F3F27;color:#fff}
#huntPage .hu-card.B .hu-pr{background:#E0A800}
#huntPage .hu-s{font-size:12.5px;color:#555;margin:3px 0 0;line-height:1.35}
#huntPage .hu-seg{display:inline-block;margin-top:7px;font-weight:700;font-size:11px;line-height:1;font-family:inherit;border-radius:99px;padding:4px 9px;background:#F3F1EC;color:#555}
#huntPage .hu-seg.v{background:#FBE3E1;color:#B91C1C}#huntPage .hu-seg.h{background:#FDF1C4;color:#7A5A00}
#huntPage .hu-acc{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
#huntPage .hu-cer{margin-top:14px}
#huntPage .hu-cer summary{cursor:pointer;font-weight:800;color:#555;font-size:13px;margin-bottom:8px}
#huntPage .hu-cerg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}
#huntPage .hu-vac{font-size:12.5px;color:#888;text-align:center;padding:14px 6px}
.hu-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99998;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.hu-box{background:#fff;border-radius:12px;max-width:620px;width:100%;padding:20px 22px;font:14px 'PP Pangram Sans',Poppins,sans-serif;color:#222}
.hu-spin{display:inline-block;width:12px;height:12px;border:2px solid #CDE7CE;border-top-color:#0F3F27;border-radius:50%;animation:huspin .8s linear infinite;vertical-align:-2px}@keyframes huspin{to{transform:rotate(360deg)}}
.hu-box h3{margin:0 0 10px;color:#0F3F27}.hu-box p{font-size:12.5px;color:#666;line-height:1.5;margin:0 0 10px}
.hu-box label{display:block;font-size:12px;font-weight:700;color:#555;margin:10px 0 4px}
.hu-box input[type=text],.hu-box select,.hu-box textarea{width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:8px;padding:9px 10px;font-size:13.5px;font-family:inherit}
.hu-box textarea{min-height:120px}
.hu-box .hu-row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.hu-box .hu-g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hu-box button{border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;border:1px solid #999;background:#fff;font-family:inherit}
.hu-box button.go{background:#0F3F27;color:#fff;border-color:#0F3F27}
.hu-box .hu-cnt{font-size:11px;color:#888;text-align:right}
.hu-box .hu-tp{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.hu-box .hu-tp button{padding:6px 12px;font-size:12.5px}.hu-box .hu-tp button.on{background:#0F3F27;color:#fff;border-color:#0F3F27}
@media(max-width:640px){#huntPage{padding:10px 10px 50px}#huntPage .hu-kpis{grid-template-columns:repeat(2,1fr)}#huntPage .hu-col{flex:0 0 84%;max-height:none}.hu-box .hu-g2{grid-template-columns:1fr}}
</style>
<script>
(function(){
  if(typeof google==='undefined'||!google.script||typeof PERFIL==='undefined')return;
  var ETAPAS=['Identificado','Contactado','Respondió','Interesado','En proceso'],CERR=['No le interesa','Sin respuesta','No encaja'],lbl=function(e){return e==='Sin respuesta'?'No respondió':e==='No encaja'?'No se ajusta':e;};
  var DESC={'Identificado':'Mapeados, todavía sin contactar','Contactado':'Mensaje enviado, esperando respuesta','Respondió':'Hay conversación','Interesado':'Quiere avanzar: pasala a la búsqueda','En proceso':'Ya están en el tablero de candidatos'};
  var COLS4=[['Por contactar',['Identificado'],'Cargados, todavía sin contactar'],['Contactado',['Contactado','Respondió','Interesado'],'Ya les escribiste'],['Descartado',CERR,'No siguen en el proceso'],['En la búsqueda',['En proceso'],'Ya están en el tablero de candidatos']];
  var D={items:[],stats:null,hoy:''},abierta=false,cargando=false;
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function quien(){try{return quienSoy();}catch(e){return '';}}
  function run(fn,args,ok,ko){var r=google.script.run.withSuccessHandler(ok||function(){}).withFailureHandler(ko||function(e){aviso((e&&e.message)||String(e));});r[fn].apply(r,args);}
  function aviso(m,fn){if(typeof blAlert==='function')blAlert(m,fn);else{alert(m);if(fn)fn();}}
  function confirma(m,fn,o){if(typeof blConfirm==='function')blConfirm(m,fn,o);else if(confirm(m))fn();}
  function dias(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);}
  function porId(id){for(var i=0;i<D.items.length;i++)if(D.items[i].id===id)return D.items[i];return null;}

  function cargar(cb){
    cargando=true;
    run('huntingListar',[PERFIL],function(r){D=r;cargando=false;pintar();badge();if(cb)cb();},function(e){cargando=false;var p=document.getElementById('huntPage');if(p)p.innerHTML='<div class="hu-help" style="color:#B91C1C">'+esc((e&&e.message)||e)+'</div>';});
  }
  function badge(){
    var b=document.getElementById('rsTabH');if(!b)return;
    var v=D.stats?D.stats.vencidos:0;
    b.innerHTML='🎯 Hunting'+(v?'<span class="hb" title="Seguimientos para hacer hoy">'+v+'</span>':'');
  }
  function kpis(){
    var f=function(n,l){return '<div class="rs-kpi"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';};
    return '<div class="hu-kpis">'+COLS4.map(function(c){return f(D.items.filter(function(o){return c[1].indexOf(o.estado)>=0;}).length,c[0]);}).join('')+'</div>';
  }
  function tarjeta(o){
    var seg='';
    if(o.estado==='Contactado'&&o.seguimiento){var d=dias(D.hoy,o.seguimiento);seg=d<0?'<span class="hu-seg v">Seguimiento vencido hace '+(-d)+' d</span>':d===0?'<span class="hu-seg h">Seguimiento HOY</span>':'<span class="hu-seg">Seguimiento en '+d+' d</span>';}
    else if(o.estado==='Contactado'&&o.seguimientos>=3)seg='<span class="hu-seg">Sin más seguimientos</span>';
    var acc='';
    var B=function(t,a,c){return '<button class="hu-btn s '+(c||'')+'" data-a="'+a+'" data-id="'+esc(o.id)+'">'+t+'</button>';};
    var enBus=o.estado==='En proceso',desc=CERR.indexOf(o.estado)>=0;
    if(desc)acc=B('↩ Reabrir','mov:'+(o.nivel>=1?'Contactado':'Identificado'))+B('✏ Motivo','desc');
    else if(!enBus){
      acc=B(o.estado==='Identificado'?'✓ Contactado':'↻ Seguimiento enviado','mov:Contactado',o.estado==='Identificado'?'p':'')+B('✗ Descartar','desc')+(o.tienePdf?B('➡ A la búsqueda','pasar','p'):B('📄 Subir PDF','pdf'));
    }
    acc=B('📄 Ficha','ficha')+acc;
    acc+=B('⋯','menu');
    return '<div class="hu-card '+esc(o.prioridad)+'"><div class="hu-n"><span data-a="ficha" data-id="'+esc(o.id)+'" style="cursor:pointer" title="Ver ficha">'+esc(o.nombre)+'</span><i class="hu-pr" title="Prioridad">'+esc(o.prioridad)+'</i></div>'+
      ((o.cargo||o.empresa)?'<div class="hu-s">'+esc(o.cargo)+(o.cargo&&o.empresa?' · ':'')+esc(o.empresa)+'</div>':'')+
      (o.nota?'<span class="hu-seg" title="Nota que le puso la IA al leer su PDF">Nota IA: '+esc(o.nota)+'</span> ':'')+(o.notas?'<div class="hu-s" style="color:#888">'+esc(o.notas)+'</div>':'')+
      ((o.estado==='Respondió'||o.estado==='Interesado')?'<span class="hu-seg">'+esc(o.estado)+'</span> ':'')+(desc?'<div class="hu-s" style="font-weight:700;color:#8a4b2a">'+esc(lbl(o.estado))+'</div>'+(o.motivo?'<div class="hu-s" style="color:#555;white-space:pre-wrap">'+esc(o.motivo)+'</div>':''):'')+(o.estado==='En proceso'&&o.candidato?'<div class="hu-s" style="color:#0F3F27;font-weight:700">En el tablero como «'+esc(o.candidato)+'»</div>':'')+seg+'<div class="hu-acc">'+acc+'</div></div>';
  }
  function pintar(){
    var p=document.getElementById('huntPage');if(!p)return;
    var it=D.items,s=D.stats||{identificados:0,contactados:0,respondieron:0,interesados:0,enProceso:0,vencidos:0};
    var x='<div class="hu-top"><h2>🎯 Hunting</h2><button class="hu-btn p" data-a="pdfs">📄 Subir PDFs de LinkedIn</button><button class="hu-btn" data-a="mailm">✉ Mensaje modelo</button><button class="hu-btn" data-a="mas">Más ▾</button></div>';
    x+='<div class="hu-help"><b>Cómo se trabaja.</b> 1) En LinkedIn, <i>Más → Guardar como PDF</i> del perfil y subilo con <b>«Subir PDFs de LinkedIn»</b> (varios juntos): la IA lo lee y la persona queda en <b>Por contactar</b>, con su PDF guardado. 2) Cuando le escribís, tocá <b>«Contactado»</b>. 3) Si no sigue, <b>«Descartar»</b> y elegís el motivo. 4) Si avanza, <b>«A la búsqueda»</b> la manda al tablero de candidatos con «Llegó por: Hunting (LinkedIn)». Todo queda registrado con fecha y quién lo hizo.</div>';
    x+=kpis();
    x+='<div class="hu-board">'+COLS4.map(function(c){
      var l=it.filter(function(o){return c[1].indexOf(o.estado)>=0;});
      l.sort(function(a,b){if(a.prioridad!==b.prioridad)return a.prioridad<b.prioridad?-1:1;var x=a.seguimiento||'9',y=b.seguimiento||'9';return x<y?-1:x>y?1:0;});
      return '<div class="hu-col"><div class="hu-ch"><span>'+c[0]+'</span><b>'+l.length+'</b></div><div class="hu-s" style="margin:-6px 4px 10px;font-size:11.5px;color:#6a7a6a">'+c[2]+'</div>'+(l.length?l.map(tarjeta).join(''):'<div class="hu-vac">Nadie por acá</div>')+'</div>';
    }).join('')+'</div>';
    p.innerHTML=x;
  }

  /* ---------- ventanas ---------- */
  function modal(html){var bg=document.createElement('div');bg.className='hu-bg';bg.innerHTML='<div class="hu-box">'+html+'</div>';document.body.appendChild(bg);bg.addEventListener('mousedown',function(e){if(e.target===bg)bg.remove();});return bg;}
  function formPersona(o,pre){
    var n=!o;o=o||{nombre:'',cargo:'',empresa:(pre&&pre.empresa)||'',linkedin:'',prioridad:'A',notas:''};
    var bg=modal('<h3>'+(n?'Agregar persona':'Editar')+'</h3><label>Nombre y apellido</label><input type="text" id="hf-n" value="'+esc(o.nombre)+'"><div class="hu-g2"><div><label>Cargo actual</label><input type="text" id="hf-c" value="'+esc(o.cargo)+'"></div><div><label>Empresa actual</label><input type="text" id="hf-e" value="'+esc(o.empresa)+'"></div></div><label>Link de LinkedIn</label><input type="text" id="hf-l" value="'+esc(o.linkedin)+'" placeholder="https://www.linkedin.com/in/…"><div class="hu-g2"><div><label>Prioridad</label><select id="hf-p"><option value="A"'+(o.prioridad==='A'?' selected':'')+'>A · encaje directo</option><option value="B"'+(o.prioridad==='B'?' selected':'')+'>B · secundario</option></select></div><div></div></div><label>Notas para personalizar el mensaje (opcional)</label><input type="text" id="hf-o" value="'+esc(o.notas)+'" placeholder="Ej: lideró licitaciones en minería; la recomendó un contacto"><div class="hu-row"><button id="hf-x">Cancelar</button><button class="go" id="hf-g">Guardar</button></div>');
    bg.querySelector('#hf-x').onclick=function(){bg.remove();};
    bg.querySelector('#hf-g').onclick=function(){
      var d={nombre:bg.querySelector('#hf-n').value,cargo:bg.querySelector('#hf-c').value,empresa:bg.querySelector('#hf-e').value,linkedin:bg.querySelector('#hf-l').value,prioridad:bg.querySelector('#hf-p').value,notas:bg.querySelector('#hf-o').value};
      if(String(d.nombre).trim().length<2){aviso('Falta el nombre.');return;}
      this.disabled=true;
      var ok=function(){bg.remove();cargar();};
      if(n)run('huntingAgregar',[PERFIL,JSON.stringify([d]),quien()],function(r){if(!r.agregadas)aviso('Esa persona ya estaba en la lista.');ok();});
      else run('huntingActualizar',[PERFIL,o.id,JSON.stringify(d),quien()],ok);
    };
    setTimeout(function(){bg.querySelector('#hf-n').focus();},50);
  }
  function pegarLista(){
    var bg=modal('<h3>Pegar lista</h3><p>Copiá las filas de tu planilla (con la fila de títulos) y pegalas acá. Entiende las columnas <b>Nombre, Cargo, Empresa, LinkedIn, Estado</b> (y «Última comunicación» y «Fecha»). Si no hay fila de títulos, el orden es <b>Nombre | Cargo | Empresa | LinkedIn | Estado</b>, separado con <b>|</b> o tabulación. Solo el nombre es obligatorio.</p><p><b>Estado:</b> «Sin contactar» queda en <i>Por contactar</i>; «Contactado» queda en <i>Contactado</i> (con el seguimiento agendado a 4 días de la fecha); «Contactado - No le interesa» y «Descartado - motivo» quedan en <i>Descartado</i> con ese motivo. Las personas que ya están cargadas se ignoran.</p><textarea id="hl-t" placeholder="Nombre\tCargo actual\tEmpresa\tEstado\nAna Pérez\tDirectora Comercial\tEmpresa S.A.\tContactado"></textarea><label><input type="checkbox" id="hl-b" style="width:auto;margin-right:6px">Marcar todas como prioridad B (secundarias)</label><div class="hu-row"><button id="hl-x">Cancelar</button><button class="go" id="hl-g">Agregar</button></div>');
    bg.querySelector('#hl-x').onclick=function(){bg.remove();};
    function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
    bg.querySelector('#hl-g').onclick=function(){
      var pr=bg.querySelector('#hl-b').checked?'B':'A',L=[],map=null;
      var rows=bg.querySelector('#hl-t').value.split(/\r?\n/);
      rows.forEach(function(r,n){r=r.trim();if(!r)return;var c=r.split(/\t|\||;/).map(function(x){return x.trim();});
        if(n===0||!map&&!L.length){var h=c.map(norm);if(h.indexOf('nombre')>-1){map={};h.forEach(function(x,i){if(x==='nombre')map.nombre=i;else if(/^cargo/.test(x))map.cargo=i;else if(/^empresa/.test(x))map.empresa=i;else if(/linkedin|perfil|^url/.test(x))map.linkedin=i;else if(/^estado/.test(x))map.estado=i;else if(/ultima|comunicaci/.test(x))map.ultima=i;else if(/^fecha/.test(x))map.fecha=i;else if(/^nota/.test(x))map.notas=i;});return;}}
        if(/linkedin\.com/i.test(c[0])&&c.length===1)return;
        var g=function(k,pos){var i=map?map[k]:pos;return i==null?'':(c[i]||'');};
        L.push({nombre:g('nombre',0),cargo:g('cargo',1),empresa:g('empresa',2),linkedin:g('linkedin',3),estado:g('estado',4),ultima:g('ultima',5),fecha:g('fecha',6),notas:g('notas',99),prioridad:pr});});
      if(!L.length){aviso('No hay nada para agregar.');return;}
      this.disabled=true;
      run('huntingAgregar',[PERFIL,JSON.stringify(L),quien()],function(r){bg.remove();var pe=r.porEstado||{},x=Object.keys(pe).map(function(k){return pe[k]+' '+(k==='Identificado'?'por contactar':lbl(k));}).join(', ');aviso('Se agregaron '+r.agregadas+' persona'+(r.agregadas===1?'':'s')+(x?' ('+x+')':'')+'.'+(r.repetidas?' Ya estaban '+r.repetidas+(r.repetidasNombres&&r.repetidasNombres.length?': '+r.repetidasNombres.join(', '):'')+'.':''));cargar();},function(e){bg.querySelector('#hl-g').disabled=false;aviso((e&&e.message)||String(e));});
    };
  }
  function copiar(t,btn){
    var ok=function(){if(btn){var o=btn.textContent;btn.textContent='¡Copiado!';setTimeout(function(){btn.textContent=o;},1500);}};
    try{navigator.clipboard.writeText(t).then(ok,function(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();ok();});}catch(e){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok();}catch(x){}a.remove();}
  }
  function wsp(t){
    t=String(t||'').trim();if(!t){aviso('Todavía no hay mensaje para enviar.');return;}
    window.open((/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)?'https://wa.me/?text=':'https://web.whatsapp.com/send?text=')+encodeURIComponent(t),'_blank');
  }
  function mensaje(o){
    var bg=modal('<h3>✉ Mensaje'+(o?' para '+esc(o.nombre):' modelo')+'</h3><p>Texto de Flavia, listo para pegar en un InMail (o en un mensaje de LinkedIn).</p><label>Nombre y apellido</label><input type="text" id="mm-n" value="'+esc(o?o.nombre:'')+'" placeholder="Ej: Juan Pablo Ceballos"><label>Asunto</label><input type="text" id="mm-a"><label>Mensaje</label><textarea id="mm-t" style="min-height:240px"></textarea><div class="hu-row" style="margin-top:4px"><button id="mm-ca">Copiar asunto</button><button class="go" id="mm-ct">Copiar mensaje</button><button id="mm-cj">Copiar asunto y mensaje</button><button id="mm-wa">Enviar por WhatsApp</button></div>'+(o?'<details style="margin-top:12px"><summary style="cursor:pointer;font-weight:700;font-size:13px">✨ Redactar con IA (opcional)</summary><p style="margin-top:6px">La IA escribe un mensaje distinto, personalizado. El texto de Flavia de arriba es el oficial.</p><div class="hu-tp"><button data-t="primero">Primer mensaje</button><button data-t="seg1">Seguimiento 1</button><button data-t="seg2">Último seguimiento</button></div><div class="hu-row" style="margin-top:6px;justify-content:flex-start"><button class="go" id="hm-g">✨ Generar con IA</button></div><label>Mensaje directo (IA)</label><textarea id="hm-m" style="min-height:150px"></textarea><div class="hu-row"><button id="hm-cm">Copiar mensaje</button><button id="hm-wa">Enviar por WhatsApp</button></div></details>':'')+'<div class="hu-row">'+(o&&o.linkedin?'<button id="mm-l">Abrir LinkedIn</button>':'')+(o&&o.estado==='Identificado'?'<button class="go" id="mm-ya">Ya lo envié ✓</button>':'')+'<button id="mm-x">Cerrar</button></div>');
    var $=function(s){return bg.querySelector(s);},bm='';
    function pon(){var p=String($('#mm-n').value||'').trim().split(/\s+/)[0]||'[Nombre]';$('#mm-t').value=bm.split('[Nombre]').join(p);}
    run('huntingMailModelo',[PERFIL,quien()],function(r){$('#mm-a').value=r.asunto||'';bm=r.mail||'';pon();},function(e){bg.remove();aviso((e&&e.message)||String(e));});
    $('#mm-n').oninput=pon;
    $('#mm-ca').onclick=function(){copiar($('#mm-a').value,this);};
    $('#mm-ct').onclick=function(){copiar($('#mm-t').value,this);};
    $('#mm-cj').onclick=function(){copiar('Asunto: '+$('#mm-a').value+'\n\n'+$('#mm-t').value,this);};
    $('#mm-wa').onclick=function(){wsp($('#mm-t').value);};
    if($('#mm-l'))$('#mm-l').onclick=function(){window.open(o.linkedin,'_blank');};
    if($('#mm-ya'))$('#mm-ya').onclick=function(){this.disabled=true;run('huntingMover',[PERFIL,o.id,'Contactado',quien()],function(){bg.remove();cargar();});};
    if(o){
      var tipo=o.estado==='Contactado'?(o.seguimientos>=1?'seg2':'seg1'):'primero';
      var marcar=function(){[].forEach.call(bg.querySelectorAll('.hu-tp button'),function(b){b.className=b.getAttribute('data-t')===tipo?'on':'';});};marcar();
      [].forEach.call(bg.querySelectorAll('.hu-tp button'),function(b){b.onclick=function(){tipo=b.getAttribute('data-t');marcar();};});
      $('#hm-g').onclick=function(){var g=this;g.disabled=true;g.textContent='La IA está escribiendo…';
        run('huntingMensaje',[PERFIL,o.id,tipo,true,quien()],function(r){g.disabled=false;g.textContent='✨ Generar de nuevo';$('#hm-m').value=r.mensaje||'';},function(e){g.disabled=false;g.textContent='✨ Generar con IA';aviso((e&&e.message)||String(e));});};
      $('#hm-cm').onclick=function(){copiar($('#hm-m').value,this);};
    $('#hm-wa').onclick=function(){wsp($('#hm-m').value);};
    }
    $('#mm-x').onclick=function(){bg.remove();};
    setTimeout(function(){if(!o)$('#mm-n').focus();},50);
  }
  function pdfs(){
    var inp=document.createElement('input');inp.type='file';inp.accept='application/pdf,.pdf';inp.multiple=true;
    inp.onchange=function(){
      var fs=[].slice.call(inp.files||[]);if(!fs.length)return;
      var bg=modal('<h3>📄 Perfiles de LinkedIn</h3><p id="hp-t"><b>Leyendo los perfiles…</b> La IA lee cada PDF (unos 20 a 40 segundos cada uno). No cierres esta pantalla.</p><div id="hp-l" style="font-size:13px;line-height:1.7"></div><div class="hu-row"><button class="go" id="hp-ok" disabled>Leyendo…</button></div>');
      var L=bg.querySelector('#hp-l'),ok=bg.querySelector('#hp-ok'),hechos=0,fallas=0;
      L.innerHTML=fs.map(function(f,i){return '<div id="hp-'+i+'" style="color:#777">⏳ En espera · '+esc(f.name)+'</div>';}).join('');
      function una(i){
        if(i>=fs.length){var tt=bg.querySelector('#hp-t');if(tt)tt.innerHTML='<b>'+(hechos?'Listo.':'No se pudo cargar.')+'</b>';ok.disabled=false;ok.textContent=hechos?'Listo ('+hechos+' cargada'+(hechos===1?'':'s')+(fallas?', '+fallas+' con error':'')+')':'Cerrar';cargar();return;}
        var f=fs[i],el=bg.querySelector('#hp-'+i);
        el.style.color='#0F3F27';el.innerHTML='<span class="hu-spin"></span> <b>Leyendo…</b> '+esc(f.name)+(fs.length>1?' <span style="color:#777">('+(i+1)+' de '+fs.length+')</span>':'');
        if(f.size>10*1024*1024){el.innerHTML='❌ '+esc(f.name)+' · pesa más de 10 MB';fallas++;una(i+1);return;}
        var fr=new FileReader();
        fr.onload=function(){
          run('huntingCargarPdf',[PERFIL,String(fr.result).split(',')[1],f.name,quien()],function(r){
            hechos++;el.style.color='';el.innerHTML='✅ <b>'+esc(r.nombre)+'</b>'+(r.nota?' · nota IA '+esc(r.nota):'')+(r.existente?' · ya estaba en la lista: se agregó el PDF':'')+(r.yaEnTablero?' · <span style="color:#B45309">ya figura en el tablero de candidatos</span>':'');una(i+1);
          },function(e){fallas++;el.innerHTML='❌ '+esc(f.name)+' · '+esc((e&&e.message)||e);una(i+1);});
        };
        fr.onerror=function(){fallas++;el.innerHTML='❌ '+esc(f.name)+' · no pude leer el archivo';una(i+1);};
        fr.readAsDataURL(f);
      }
      ok.onclick=function(){bg.remove();};
      una(0);
    };
    inp.click();
  }
  function ficha(o){
    var bg=modal('<h3>'+esc(o.nombre)+'</h3><p id="hf-c">Cargando…</p>');
    run('huntingFicha',[PERFIL,o.id],function(f){
      var R=function(t,v){return v?'<label>'+t+'</label><div style="font-size:13.5px;line-height:1.5;white-space:pre-wrap">'+esc(v)+'</div>':'';};
      var sub=[f.cargo,f.empresa].filter(Boolean).join(' · ');
      var x='<h3 style="margin-bottom:2px">'+esc(f.nombre)+'</h3>'+(sub?'<p style="margin:0 0 6px">'+esc(sub)+'</p>':'')+
        '<div style="margin:6px 0 4px"><span class="hu-seg">'+esc(f.estado)+'</span> '+(f.nota?'<span class="hu-seg" style="background:#E3EEDC;color:#0F3F27">Nota IA: '+esc(f.nota)+'</span>':'')+'</div>';
      if(f.tienePdf){
        x+=R('Por qué esa nota',f.justificacion)+R('Resumen de su experiencia',f.resumen)+R('Formación',f.formacion)+R('Zona',f.zona)+R('Contacto',[f.email,f.telefono].filter(Boolean).join(' · '));
      }else x+='<p style="margin-top:10px">Todavía no tiene su PDF de LinkedIn cargado: sin eso la IA no puede leerlo. Subilo con «Subir PDFs de LinkedIn» (si ya está en la lista, se le agrega al mismo registro).</p>';
      x+=R('Motivo del descarte',f.motivo);
      x+=R('Notas',f.notas);
      x+='<div class="hu-row">'+(f.pdf?'<button class="go" id="hf-pdf">📄 Ver PDF</button>':'')+(f.linkedin?'<button id="hf-li">Abrir LinkedIn</button>':'')+'<button id="hf-m">✉ Mensaje</button>'+(f.tienePdf&&f.estado!=='En proceso'?'<button id="hf-p">➡ Pasar a la búsqueda</button>':'')+'<button id="hf-x">Cerrar</button></div>';
      bg.querySelector('.hu-box').innerHTML=x;
      var $=function(s){return bg.querySelector(s);};
      if($('#hf-pdf'))$('#hf-pdf').onclick=function(){window.open(f.pdf,'_blank');};
      if($('#hf-li'))$('#hf-li').onclick=function(){window.open(f.linkedin,'_blank');};
      $('#hf-m').onclick=function(){bg.remove();mensaje(o);};
      if($('#hf-p'))$('#hf-p').onclick=function(){bg.remove();pasar(o);};
      $('#hf-x').onclick=function(){bg.remove();};
    },function(e){bg.remove();aviso((e&&e.message)||String(e));});
  }

  function pasar(o){
    confirma('¿Pasar a '+o.nombre+' a la búsqueda? Entra al tablero de candidatos con «Llegó por: Hunting (LinkedIn)», con los datos que ya leyó la IA.',function(){
      run('huntingPasar',[PERFIL,o.id,quien()],function(r){
        aviso(r.candidato+' ya está en el tablero de candidatos'+(r.nota?' con nota '+r.nota:'')+(r.repetido?' (ya figuraba: se vinculó con el existente)':'')+'.',function(){cargar();try{if(typeof refrescarTablero==='function')refrescarTablero();}catch(e){}});
      });
    },{si:'Pasar'});
  }
  function subirPdf(o){
    var inp=document.createElement('input');inp.type='file';inp.accept='application/pdf,.pdf';
    inp.onchange=function(){
      var f=inp.files&&inp.files[0];if(!f)return;
      if(f.size>10*1024*1024){aviso('El archivo es muy pesado (máximo 10 MB).');return;}
      var bg=modal('<h3>📄 Perfil de LinkedIn</h3><p id="hp-s">Leyendo el perfil con la IA… puede tardar hasta un minuto. No cierres esta pantalla.</p>');
      var fr=new FileReader();
      fr.onload=function(){
        var b64=String(fr.result).split(',')[1];
        run('huntingSubirPdf',[PERFIL,o.id,b64,f.name,quien()],function(r){
          bg.remove();
          aviso(r.candidato+' ya está en el tablero de candidatos'+(r.nota?' con nota '+r.nota:'')+(r.repetido?' (ya figuraba: se vinculó con el existente)':'')+'. Llegó por «Hunting (LinkedIn)».',function(){cargar();try{if(typeof refrescarTablero==='function')refrescarTablero();}catch(e){}});
        },function(e){bg.remove();aviso((e&&e.message)||String(e));});
      };
      fr.onerror=function(){bg.remove();aviso('No pude leer el archivo.');};
      fr.readAsDataURL(f);
    };
    inp.click();
  }
  function descartar(o){
    var cerr=CERR.indexOf(o.estado)>=0;var bg=modal('<h3>'+(cerr?'Motivo de ':'Descartar a ')+esc(o.nombre)+'</h3><label>¿Por qué?</label><select id="hd-t"><option value="">Elegir…</option><option value="No le interesa">No le interesa</option><option value="Sin respuesta">No respondió</option><option value="No encaja">No se ajusta al perfil</option></select><label>Motivo (opcional): escribí lo que quieras que quede registrado</label><textarea id="hd-m" style="min-height:90px" maxlength="300" placeholder="Ej: está en un proceso con la competencia; pretensión muy por encima de la banda…"></textarea><div class="hu-cnt" id="hd-n">0 / 300</div><div class="hu-row"><button class="go" id="hd-g">'+(cerr?'Guardar':'Descartar')+'</button><button id="hd-x">Cancelar</button></div>');
    var m=bg.querySelector('#hd-m');
    if(cerr){bg.querySelector('#hd-t').value=o.estado;m.value=o.motivo||'';bg.querySelector('#hd-n').textContent=m.value.length+' / 300';}
    m.oninput=function(){bg.querySelector('#hd-n').textContent=m.value.length+' / 300';};
    bg.querySelector('#hd-x').onclick=function(){bg.remove();};
    bg.querySelector('#hd-g').onclick=function(){
      var g=this,t=bg.querySelector('#hd-t').value;if(!t){aviso('Elegí por qué se descarta.');return;}g.disabled=true;g.textContent='Guardando…';
      run('huntingMover',[PERFIL,o.id,t,quien(),m.value],function(){bg.remove();cargar();},function(e){g.disabled=false;g.textContent=cerr?'Guardar':'Descartar';aviso((e&&e.message)||String(e));});
    };
    setTimeout(function(){m.focus();},50);
  }
  function masMenu(){
    var T=window.blMenu;if(!T)return;
    T('Más opciones','',[['+ Agregar a mano',function(){formPersona();}],['Pegar una lista',function(){pegarLista();}],['✉ Mensajes (todos)',function(){if(window.abrirMensajes)abrirMensajes();}],['📋 Perfil del puesto',function(){if(window.blPerfilRef)blPerfilRef();}]]);
  }
  function menu(o){
    var bg=modal('<h3>'+esc(o.nombre)+'</h3><div class="hu-row" style="justify-content:flex-start;flex-direction:column;align-items:stretch"><button data-a="edit">Editar datos</button>'+(o.linkedin?'<button data-a="li">Abrir LinkedIn</button>':'')+'<button data-a="msg">✉ Mensaje</button>'+(o.tienePdf&&o.estado!=='En proceso'?'<button data-a="pasar">➡ Pasar a la búsqueda</button>':'')+'<label>Mover a otra etapa</label><select id="hmv"><option value="">Elegir…</option>'+ETAPAS.concat(CERR).map(function(e){return '<option value="'+e+'"'+(e===o.estado?' disabled':'')+'>'+lbl(e)+'</option>';}).join('')+'</select><button data-a="del" style="border-color:#B91C1C;color:#B91C1C;margin-top:12px">Borrar de la lista</button><button data-a="x">Cerrar</button></div>');
    bg.querySelector('#hmv').onchange=function(){var v=this.value;if(v){bg.remove();run('huntingMover',[PERFIL,o.id,v,quien()],function(){cargar();});}};
    bg.addEventListener('click',function(ev){var a=ev.target.getAttribute&&ev.target.getAttribute('data-a');if(!a)return;bg.remove();
      if(a==='edit')formPersona(o);else if(a==='li')window.open(o.linkedin,'_blank');else if(a==='msg')mensaje(o);else if(a==='pasar')pasar(o);
      else if(a==='del')confirma('¿Borrar a '+o.nombre+' de la lista de hunting? Se elimina todo lo que guardamos de esa persona.',function(){run('huntingBorrar',[PERFIL,o.id,quien()],function(){cargar();});},{si:'Borrar',peligro:true});});
  }

  /* ---------- pestaña ---------- */
  function ver(v){
    var H=v==='hunting',p=document.getElementById('huntPage');
    if(H){
      base('resumen');
      var rp=document.getElementById('resumenPage');if(rp)rp.style.display='none';
      if(p)p.style.display='block';
      ['rsTabR','rsTabT'].forEach(function(i){var b=document.getElementById(i);if(b)b.className='rs-tab';});
      var h=document.getElementById('rsTabH');if(h)h.className='rs-tab on';
      abierta=true;cargar();
    }else{
      abierta=false;if(p)p.style.display='none';
      var h2=document.getElementById('rsTabH');if(h2)h2.className='rs-tab';
      base(v);
      if(v==='resumen')resumenBloque();
    }
  }
  /* embudo de hunting dentro del Resumen (solo si la búsqueda tiene hunting) */
  var cache=null;
  /* tocar una tarjeta del embudo abre la lista de esas personas (mismo criterio que el número: nivel alcanzado) y cada una abre su ficha */
  var NOMB=['Identificados','Contactados','Respondieron','Interesados','En el proceso'];
  function listaEmbudo(k){
    var L=D.items.filter(function(o){return Number(o.nivel||0)>=k;});
    L.sort(function(a,b){return Number(b.nivel||0)-Number(a.nivel||0)||String(a.nombre).localeCompare(String(b.nombre));});
    var rows=L.map(function(o){var sub=[o.cargo,o.empresa].filter(Boolean).join(' · ');
      return '<div class="hu-fr" data-id="'+esc(o.id)+'" tabindex="0" style="display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid #E5E9E2;cursor:pointer"><div><b>'+esc(o.nombre)+'</b>'+(sub?'<div style="font-size:12.5px;color:#666">'+esc(sub)+'</div>':'')+'</div><span class="hu-seg" style="margin:0;white-space:nowrap">'+esc(o.estado==='Identificado'?'Por contactar':lbl(o.estado))+'</span></div>';}).join('');
    var bg=modal('<h3>'+NOMB[k]+' · '+L.length+'</h3><div style="max-height:60vh;overflow:auto">'+(rows||'<p>Todavía no hay nadie.</p>')+'</div><div class="hu-row"><button id="hl-c">Cerrar</button><button class="go" id="hl-h">Ir a Hunting</button></div>');
    bg.querySelector('#hl-c').onclick=function(){bg.remove();};
    bg.querySelector('#hl-h').onclick=function(){bg.remove();window.rsVer('hunting');};
    var abrir=function(e){var r=e.target.closest&&e.target.closest('.hu-fr');if(!r)return;var o=porId(r.getAttribute('data-id'));if(o){bg.remove();ficha(o);}};
    bg.addEventListener('click',abrir);
    bg.addEventListener('keydown',function(e){if(e.key==='Enter')abrir(e);});
  }
  function resumenBloque(){
    var rp=document.getElementById('resumenPage');if(!rp)return;
    if(!rp._huClick){rp._huClick=1;
      rp.addEventListener('click',function(e){var c=e.target.closest&&e.target.closest('#rsHunt [data-hl]');if(c)listaEmbudo(Number(c.getAttribute('data-hl')));});
      rp.addEventListener('keydown',function(e){if(e.key!=='Enter')return;var c=e.target.closest&&e.target.closest('#rsHunt [data-hl]');if(c)listaEmbudo(Number(c.getAttribute('data-hl')));});}
    var pon=function(){
      var s=cache;if(!s||!s.identificados||document.getElementById('rsHunt'))return;
      var f=function(n,l,k){return '<div class="rs-kpi" data-hl="'+k+'" role="button" tabindex="0" title="Ver quiénes son" style="cursor:pointer"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';};
      var h='<div class="rs-panel" id="rsHunt"><h3>Hunting · búsqueda directa</h3><div class="rs-dash" style="grid-template-columns:repeat(5,1fr)">'+f(s.identificados,'Identificados',0)+f(s.contactados,'Contactados',1)+f(s.respondieron,'Respondieron',2)+f(s.interesados,'Interesados',3)+f(s.enProceso,'En el proceso',4)+'</div></div>';
      var d=rp.querySelector('.rs-dash');if(d&&d.parentNode===rp)d.insertAdjacentElement('afterend',document.createRange().createContextualFragment(h).firstChild);else rp.insertAdjacentHTML('beforeend',h);
    };
    run('huntingListar',[PERFIL],function(r){cache=r.stats;D=r;badge();pon();},function(){});
    if(!resumenBloque.obs){resumenBloque.obs=new MutationObserver(function(){if(document.getElementById('resumenPage').style.display==='block')pon();});resumenBloque.obs.observe(rp,{childList:true});}
  }

  var base=window.rsVer;
  var tabs=document.querySelector('.rs-tabs');
  if(!base||!tabs)return;
  var t=document.createElement('button');t.className='rs-tab';t.id='rsTabH';t.setAttribute('onclick',"rsVer('hunting')");t.textContent='🎯 Hunting';
  var tt=document.getElementById('rsTabT');if(tt)tt.insertAdjacentElement('afterend',t);else tabs.appendChild(t);
  var page=document.createElement('div');page.id='huntPage';
  var rp0=document.getElementById('resumenPage');if(rp0)rp0.insertAdjacentElement('afterend',page);else document.body.appendChild(page);
  window.rsVer=ver;
  page.addEventListener('click',function(e){
    var b=e.target.closest('[data-a]');if(!b)return;
    var a=b.getAttribute('data-a'),id=b.getAttribute('data-id'),o=id?porId(id):null;
    if(a==='nueva')formPersona();else if(a==='pdfs')pdfs();else if(a==='mailm')mensaje(null);else if(a==='mensajes'){if(window.abrirMensajes)abrirMensajes();}else if(a==='lista')pegarLista();else if(a==='perfil'){if(window.blPerfilRef)blPerfilRef();}
    else if(a==='mas'){masMenu();}else if(a==='desc'&&o)descartar(o);else if(a==='ficha'&&o)ficha(o);else if(a==='msg'&&o)mensaje(o);else if(a==='pdf'&&o)subirPdf(o);else if(a==='pasar'&&o)pasar(o);else if(a==='menu'&&o)menu(o);
    else if(a.indexOf('mov:')===0&&o){b.disabled=true;run('huntingMover',[PERFIL,o.id,a.slice(4),quien()],function(){cargar();},function(er){b.disabled=false;aviso((er&&er.message)||String(er));});}
  });
  // el globito con los seguimientos de hoy se ve desde cualquier pestaña
  run('huntingListar',[PERFIL],function(r){D=r;cache=r.stats;badge();},function(){});
})();
</script>
