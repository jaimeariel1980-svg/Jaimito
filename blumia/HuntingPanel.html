</style>
<script>
(function(){
  if(typeof google==='undefined'||!google.script||typeof PERFIL==='undefined')return;
  var ETAPAS=['Identificado','Contactado','Respondió','Interesado','En proceso'],CERR=['No le interesa','Sin respuesta','No encaja'];
  var DESC={'Identificado':'Mapeados, todavía sin contactar','Contactado':'Mensaje enviado, esperando respuesta','Respondió':'Hay conversación','Interesado':'Quiere avanzar: pasala a la búsqueda','En proceso':'Ya están en el tablero de candidatos'};
  var COLS4=[['Por contactar',['Identificado'],'Cargados, todavía sin contactar'],['Contactado',['Contactado','Respondió','Interesado'],'Ya les escribiste'],['Descartado',CERR,'No siguen en el proceso'],['En la búsqueda',['En proceso'],'Ya están en el tablero de candidatos']];
  var D={items:[],stats:null,hoy:''},abierta=false,cargando=false;
  var vista='personas',E={items:[],stats:null},F={prio:'',cat:'',est:'',q:'',comp:false},ESTE=['Sin revisar','En búsqueda','Revisada','Descartada'];
  var CARGOS_DEF='("gerente comercial" OR "business development" OR "desarrollo de negocios" OR "key account" OR "account manager" OR "sales director" OR "director comercial" OR "client partner")';
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function quien(){try{return quienSoy();}catch(e){return '';}}
  function run(fn,args,ok,ko){var r=google.script.run.withSuccessHandler(ok||function(){}).withFailureHandler(ko||function(e){aviso((e&&e.message)||String(e));});r[fn].apply(r,args);}
  function aviso(m,fn){if(typeof blAlert==='function')blAlert(m,fn);else{alert(m);if(fn)fn();}}
  function confirma(m,fn,o){if(typeof blConfirm==='function')blConfirm(m,fn,o);else if(confirm(m))fn();}
  function dias(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);}
  function porId(id){for(var i=0;i<D.items.length;i++)if(D.items[i].id===id)return D.items[i];return null;}

  function cargar(cb){
    cargando=true;
    run('huntingListar',[PERFIL],function(r){D=r;cargando=false;pintar();badge();if(cb)cb();},function(e){cargando=false;var p=document.getElementById('huntPage');if(p)p.innerHTML='<div class="hu-help" style="color:#B91C1C">'+esc((e&&e.message)||e)+'</div>';});
  }
  function badge(){
    var b=document.getElementById('rsTabH');if(!b)return;
    var v=D.stats?D.stats.vencidos:0;
    b.innerHTML='🎯 Hunting'+(v?'<span class="hb" title="Seguimientos para hacer hoy">'+v+'</span>':'');
  }
  function kpis(){
    var f=function(n,l){return '<div class="rs-kpi"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';};
    return '<div class="hu-kpis">'+COLS4.map(function(c){return f(D.items.filter(function(o){return c[1].indexOf(o.estado)>=0;}).length,c[0]);}).join('')+'</div>';
  }
  function tarjeta(o){
    var seg='';
    if(o.estado==='Contactado'&&o.seguimiento){var d=dias(D.hoy,o.seguimiento);seg=d<0?'<span class="hu-seg v">Seguimiento vencido hace '+(-d)+' d</span>':d===0?'<span class="hu-seg h">Seguimiento HOY</span>':'<span class="hu-seg">Seguimiento en '+d+' d</span>';}
    else if(o.estado==='Contactado'&&o.seguimientos>=3)seg='<span class="hu-seg">Sin más seguimientos</span>';
    var acc='';
    var B=function(t,a,c){return '<button class="hu-btn s '+(c||'')+'" data-a="'+a+'" data-id="'+esc(o.id)+'">'+t+'</button>';};
    var enBus=o.estado==='En proceso',desc=CERR.indexOf(o.estado)>=0;
    if(desc)acc=B('↩ Reabrir','mov:'+(o.nivel>=1?'Contactado':'Identificado'));
    else if(!enBus){
      acc=B(o.estado==='Identificado'?'✓ Contactado':'↻ Seguimiento enviado','mov:Contactado',o.estado==='Identificado'?'p':'')+B('✗ Descartar','desc')+(o.tienePdf?B('➡ A la búsqueda','pasar','p'):B('📄 Subir PDF','pdf'));
    }
    acc=B('📄 Ficha','ficha')+acc;
    acc+=B('⋯','menu');
    return '<div class="hu-card '+esc(o.prioridad)+'"><div class="hu-n"><span data-a="ficha" data-id="'+esc(o.id)+'" style="cursor:pointer" title="Ver ficha">'+esc(o.nombre)+'</span><i class="hu-pr" title="Prioridad">'+esc(o.prioridad)+'</i></div>'+
      ((o.cargo||o.empresa)?'<div class="hu-s">'+esc(o.cargo)+(o.cargo&&o.empresa?' · ':'')+esc(o.empresa)+'</div>':'')+
      (o.nota?'<span class="hu-seg" title="Nota que le puso la IA al leer su PDF">Nota IA: '+esc(o.nota)+'</span> ':'')+(o.notas?'<div class="hu-s" style="color:#888">'+esc(o.notas)+'</div>':'')+
      ((o.estado==='Respondió'||o.estado==='Interesado')?'<span class="hu-seg">'+esc(o.estado)+'</span> ':'')+(desc?'<div class="hu-s" style="font-weight:700;color:#8a4b2a">'+esc(o.estado==='Sin respuesta'?'No respondió':o.estado)+'</div>':'')+(o.estado==='En proceso'&&o.candidato?'<div class="hu-s" style="color:#0F3F27;font-weight:700">En el tablero como «'+esc(o.candidato)+'»</div>':'')+seg+'<div class="hu-acc">'+acc+'</div></div>';
  }
  function vistaBtns(){return '<div class="hu-vista"><button data-a="vista:personas" class="'+(vista==='personas'?'on':'')+'">Personas</button><button data-a="vista:empresas" class="'+(vista==='empresas'?'on':'')+'">Empresas objetivo</button></div>';}
  function pintar(){
    if(vista==='empresas'){pintarEmpresas();return;}
    var p=document.getElementById('huntPage');if(!p)return;
    var it=D.items,s=D.stats||{identificados:0,contactados:0,respondieron:0,interesados:0,enProceso:0,vencidos:0};
    var x='<div class="hu-top"><h2>🎯 Hunting</h2>'+vistaBtns()+'<button class="hu-btn p" data-a="pdfs">📄 Subir PDFs de LinkedIn</button><button class="hu-btn" data-a="mailm">✉ Mensaje modelo</button><button class="hu-btn" data-a="mas">Más ▾</button></div>';
    x+='<div class="hu-help"><b>Cómo se trabaja.</b> 1) En LinkedIn, <i>Más → Guardar como PDF</i> del perfil y subilo con <b>«Subir PDFs de LinkedIn»</b> (varios juntos): la IA lo lee y la persona queda en <b>Por contactar</b>, con su PDF guardado. 2) Cuando le escribís, tocá <b>«Contactado»</b>. 3) Si no sigue, <b>«Descartar»</b> y elegís el motivo. 4) Si avanza, <b>«A la búsqueda»</b> la manda al tablero de candidatos con «Llegó por: Hunting (LinkedIn)». Todo queda registrado con fecha y quién lo hizo.</div>';
    x+=kpis();
    x+='<div class="hu-board">'+COLS4.map(function(c){
      var l=it.filter(function(o){return c[1].indexOf(o.estado)>=0;});
      l.sort(function(a,b){if(a.prioridad!==b.prioridad)return a.prioridad<b.prioridad?-1:1;var x=a.seguimiento||'9',y=b.seguimiento||'9';return x<y?-1:x>y?1:0;});
      return '<div class="hu-col"><div class="hu-ch"><span>'+c[0]+'</span><b>'+l.length+'</b></div><div class="hu-s" style="margin:-6px 4px 10px;font-size:11.5px;color:#6a7a6a">'+c[2]+'</div>'+(l.length?l.map(tarjeta).join(''):'<div class="hu-vac">Nadie por acá</div>')+'</div>';
    }).join('')+'</div>';
    p.innerHTML=x;
  }

  /* ---------- ventanas ---------- */
  function modal(html){var bg=document.createElement('div');bg.className='hu-bg';bg.innerHTML='<div class="hu-box">'+html+'</div>';document.body.appendChild(bg);bg.addEventListener('mousedown',function(e){if(e.target===bg)bg.remove();});return bg;}
  function formPersona(o,pre){
    var n=!o;o=o||{nombre:'',cargo:'',empresa:(pre&&pre.empresa)||'',linkedin:'',prioridad:'A',notas:''};
    var bg=modal('<h3>'+(n?'Agregar persona':'Editar')+'</h3><label>Nombre y apellido</label><input type="text" id="hf-n" value="'+esc(o.nombre)+'"><div class="hu-g2"><div><label>Cargo actual</label><input type="text" id="hf-c" value="'+esc(o.cargo)+'"></div><div><label>Empresa actual</label><input type="text" id="hf-e" value="'+esc(o.empresa)+'"></div></div><label>Link de LinkedIn</label><input type="text" id="hf-l" value="'+esc(o.linkedin)+'" placeholder="https://www.linkedin.com/in/…"><div class="hu-g2"><div><label>Prioridad</label><select id="hf-p"><option value="A"'+(o.prioridad==='A'?' selected':'')+'>A · encaje directo</option><option value="B"'+(o.prioridad==='B'?' selected':'')+'>B · secundario</option></select></div><div></div></div><label>Notas para personalizar el mensaje (opcional)</label><input type="text" id="hf-o" value="'+esc(o.notas)+'" placeholder="Ej: lideró licitaciones en minería; la recomendó un contacto"><div class="hu-row"><button id="hf-x">Cancelar</button><button class="go" id="hf-g">Guardar</button></div>');
    bg.querySelector('#hf-x').onclick=function(){bg.remove();};
    bg.querySelector('#hf-g').onclick=function(){
      var d={nombre:bg.querySelector('#hf-n').value,cargo:bg.querySelector('#hf-c').value,empresa:bg.querySelector('#hf-e').value,linkedin:bg.querySelector('#hf-l').value,prioridad:bg.querySelector('#hf-p').value,notas:bg.querySelector('#hf-o').value};
      if(String(d.nombre).trim().length<2){aviso('Falta el nombre.');return;}
      this.disabled=true;
      var ok=function(){bg.remove();cargar();};
      if(n)run('huntingAgregar',[PERFIL,JSON.stringify([d]),quien()],function(r){if(!r.agregadas)aviso('Esa persona ya estaba en la lista.');ok();});
      else run('huntingActualizar',[PERFIL,o.id,JSON.stringify(d),quien()],ok);
    };
    setTimeout(function(){bg.querySelector('#hf-n').focus();},50);
  }
  function pegarLista(){
    var bg=modal('<h3>Pegar lista</h3><p>Una persona por línea, separando con <b>|</b> (o con tabulación si la copiás de una planilla): <b>Nombre | Cargo | Empresa | LinkedIn</b>. Solo el nombre es obligatorio. Las repetidas se ignoran.</p><textarea id="hl-t" placeholder="Ana Pérez | Directora Comercial | Empresa S.A. | https://www.linkedin.com/in/anaperez"></textarea><label><input type="checkbox" id="hl-b" style="width:auto;margin-right:6px">Marcar todas como prioridad B (secundarias)</label><div class="hu-row"><button id="hl-x">Cancelar</button><button class="go" id="hl-g">Agregar</button></div>');
    bg.querySelector('#hl-x').onclick=function(){bg.remove();};
    bg.querySelector('#hl-g').onclick=function(){
      var pr=bg.querySelector('#hl-b').checked?'B':'A',L=[];
      bg.querySelector('#hl-t').value.split(/\r?\n/).forEach(function(r){r=r.trim();if(!r)return;var c=r.split(/\t|\||;/).map(function(x){return x.trim();});
        if(/linkedin\.com/i.test(c[0])&&c.length===1)return;
        L.push({nombre:c[0],cargo:c[1]||'',empresa:c[2]||'',linkedin:c[3]||'',prioridad:pr});});
      if(!L.length){aviso('No hay nada para agregar.');return;}
      this.disabled=true;
      run('huntingAgregar',[PERFIL,JSON.stringify(L),quien()],function(r){bg.remove();aviso('Se agregaron '+r.agregadas+' persona'+(r.agregadas===1?'':'s')+(r.repetidas?' ('+r.repetidas+' ya estaban)':'')+'.');cargar();},function(e){bg.querySelector('#hl-g').disabled=false;aviso((e&&e.message)||String(e));});
    };
  }
  function copiar(t,btn){
    var ok=function(){if(btn){var o=btn.textContent;btn.textContent='¡Copiado!';setTimeout(function(){btn.textContent=o;},1500);}};
    try{navigator.clipboard.writeText(t).then(ok,function(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();ok();});}catch(e){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok();}catch(x){}a.remove();}
  }
  function wsp(t){
    t=String(t||'').trim();if(!t){aviso('Todavía no hay mensaje para enviar.');return;}
    window.open((/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)?'https://wa.me/?text=':'https://web.whatsapp.com/send?text=')+encodeURIComponent(t),'_blank');
  }
  function mensaje(o){
    var bg=modal('<h3>✉ Mensaje'+(o?' para '+esc(o.nombre):' modelo')+'</h3><p>Texto de Flavia, listo para pegar en un InMail (o en un mensaje de LinkedIn).</p><label>Nombre y apellido</label><input type="text" id="mm-n" value="'+esc(o?o.nombre:'')+'" placeholder="Ej: Juan Pablo Ceballos"><label>Asunto</label><input type="text" id="mm-a"><label>Mensaje</label><textarea id="mm-t" style="min-height:240px"></textarea><div class="hu-row" style="margin-top:4px"><button id="mm-ca">Copiar asunto</button><button class="go" id="mm-ct">Copiar mensaje</button><button id="mm-cj">Copiar asunto y mensaje</button><button id="mm-wa">Enviar por WhatsApp</button></div>'+(o?'<details style="margin-top:12px"><summary style="cursor:pointer;font-weight:700;font-size:13px">✨ Redactar con IA (opcional)</summary><p style="margin-top:6px">La IA escribe un mensaje distinto, personalizado. El texto de Flavia de arriba es el oficial.</p><div class="hu-tp"><button data-t="primero">Primer mensaje</button><button data-t="seg1">Seguimiento 1</button><button data-t="seg2">Último seguimiento</button></div><div class="hu-row" style="margin-top:6px;justify-content:flex-start"><button class="go" id="hm-g">✨ Generar con IA</button></div><label>Mensaje directo (IA)</label><textarea id="hm-m" style="min-height:150px"></textarea><div class="hu-row"><button id="hm-cm">Copiar mensaje</button><button id="hm-wa">Enviar por WhatsApp</button></div></details>':'')+'<div class="hu-row">'+(o&&o.linkedin?'<button id="mm-l">Abrir LinkedIn</button>':'')+(o&&o.estado==='Identificado'?'<button class="go" id="mm-ya">Ya lo envié ✓</button>':'')+'<button id="mm-x">Cerrar</button></div>');
    var $=function(s){return bg.querySelector(s);},bm='';
    function pon(){var p=String($('#mm-n').value||'').trim().split(/\s+/)[0]||'[Nombre]';$('#mm-t').value=bm.split('[Nombre]').join(p);}
    run('huntingMailModelo',[PERFIL,quien()],function(r){$('#mm-a').value=r.asunto||'';bm=r.mail||'';pon();},function(e){bg.remove();aviso((e&&e.message)||String(e));});
    $('#mm-n').oninput=pon;
    $('#mm-ca').onclick=function(){copiar($('#mm-a').value,this);};
    $('#mm-ct').onclick=function(){copiar($('#mm-t').value,this);};

    if(a==='epegar'){pegarEmpresas();return;}if(a==='ecargos'){cargosModal();return;}
    if(a==='ebusq'&&oe){window.open(urlLinkedin(oe),'_blank');if(oe.estado==='Sin revisar'){run('huntingEmpresaEstado',[PERFIL,oe.id,'En búsqueda',quien()],function(){cargarEmpresas();});}return;}
    if(a==='eper'&&oe){formPersona(null,{empresa:oe.empresa});return;}
    if(a==='emenu'&&oe){empresaMenu(oe);return;}
    if(a==='nueva')formPersona();else if(a==='pdfs')pdfs();else if(a==='mailm')mensaje(null);else if(a==='mensajes'){if(window.abrirMensajes)abrirMensajes();}else if(a==='lista')pegarLista();else if(a==='perfil'){if(window.blPerfilRef)blPerfilRef();}
    else if(a==='mas'){masMenu();}else if(a==='desc'&&o)descartar(o);else if(a==='ficha'&&o)ficha(o);else if(a==='msg'&&o)mensaje(o);else if(a==='pdf'&&o)subirPdf(o);else if(a==='pasar'&&o)pasar(o);else if(a==='menu'&&o)menu(o);
    else if(a.indexOf('mov:')===0&&o){b.disabled=true;run('huntingMover',[PERFIL,o.id,a.slice(4),quien()],function(){cargar();},function(er){b.disabled=false;aviso((er&&er.message)||String(er));});}
  });
  page.addEventListener('change',function(ev){
    var t=ev.target,k=t.getAttribute&&t.getAttribute('data-e');if(!k)return;
    if(k==='estado'){run('huntingEmpresaEstado',[PERFIL,t.getAttribute('data-id'),t.value,quien()],function(){cargarEmpresas();});return;}
    if(k==='fprio')F.prio=t.value;else if(k==='fcat')F.cat=t.value;else if(k==='fest')F.est=t.value;else if(k==='fcomp')F.comp=t.checked;pintarListaE();
  });
  page.addEventListener('input',function(ev){var t=ev.target;if(t.getAttribute&&t.getAttribute('data-e')==='fq'){F.q=t.value;pintarListaE();}});
  // el globito con los seguimientos de hoy se ve desde cualquier pestaña
  run('huntingListar',[PERFIL],function(r){D=r;cache=r.stats;badge();},function(){});
})();
