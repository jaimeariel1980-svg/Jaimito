<script>

var USA_PIN = <?!= usaPin ?>; window.blUsaPin = USA_PIN;

/* Llamadas al servidor de las pantallas: todo pasa por la sesión (api verifica el usuario y el rol en cada pedido) */
function chain(ok, ko) {
  return new Proxy({}, { get: function (_, k) {
    if (k === 'withSuccessHandler') return function (f) { return chain(f, ko); };

      r.api(TOK, k, args);
    };
  } });
}
window.blRun = chain(null, null);

};
window.blMenuUsuario = function () {
  if (!USA_PIN) { blSalir(); return; }

function guardarSesion(r) { TOK = r.token; NOM = r.nombre; ROL = r.rol; ls('bl_tok', TOK); ls('blumia_quien', NOM); }
function formLogin(texto) {

function formPin() {
