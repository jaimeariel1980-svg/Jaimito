<style>

body{font-family:'Poppins',Arial,sans-serif;background:#243D2C;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.bx{background:#fff;color:#1A1A1A;border-radius:20px;padding:38px 38px 34px;width:100%;max-width:460px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.lg{display:block;height:46px;margin:0 auto 6px}.sub{text-align:center;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#2F7F6F;margin:10px 0 6px}
h1{font-size:22px;text-align:center;margin:12px 0 4px;color:#243D2C}
p.s{font-size:14px;color:#555;text-align:center;margin-bottom:16px;line-height:1.5}
label{display:block;font-size:12.5px;font-weight:700;color:#444;text-transform:uppercase;margin:12px 0 4px}

button:disabled{opacity:.6}
@media(min-width:900px){.bx{max-width:560px;padding:52px 56px 46px}.lg{height:58px}.sub{font-size:13.5px}h1{font-size:28px}p.s{font-size:16px}label{font-size:13.5px}input{font-size:17px;padding:15px 16px}button{font-size:17px;padding:16px}}
.er{color:#B91C1C;font-size:13px;font-weight:600;margin-top:10px;text-align:center;min-height:18px}
.cg{text-align:center;color:#243D2C;font-weight:600;padding:10px 0}
.sp{width:30px;height:30px;border:4px solid #D5E0CE;border-top-color:#243D2C;border-radius:50%;margin:8px auto;animation:g 1s linear infinite}

</style><style id="btnU">/* un solo estilo de botón: rectángulo de 8 px (las píldoras quedan solo para etiquetas y contadores) */

<div class="bx"><img class="lg" alt="Blumia" src="<?!= LOGO_BLUMIA_VERDE_ ?>"><div class="sub">Atracción y Elección</div><div id="v"><div class="cg"><div class="sp"></div>Entrando…</div></div></div>
<script>
var PARAMS = <?!= params ?>;
var USA_PIN = <?!= usaPin ?>; window.blUsaPin = USA_PIN;
var R0 = google.script.run, TOK = '', ROL = '', NOM = '';
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ''; if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { } return ''; }
function $(i) { return document.getElementById(i); }
function msg(m) { var e = $('er'); if (e) e.textContent = m || ''; }
function E(e) { return (e && e.message) ? e.message.replace(/^SESION:\s*/, '') : String(e); }

/* Llamadas al servidor de las pantallas: todo pasa por la sesión (api verifica el usuario y el rol en cada pedido) */
function chain(ok, ko) {
  return new Proxy({}, { get: function (_, k) {
    if (k === 'withSuccessHandler') return function (f) { return chain(f, ko); };
    if (k === 'withFailureHandler') return function (f) { return chain(ok, f); };
    if (k === 'withUserObject') return function () { return chain(ok, ko); };
    return function () {
      var args = [].slice.call(arguments), r = R0;
      if (ok) r = r.withSuccessHandler(ok);
      r = r.withFailureHandler(function (e) { var m = (e && e.message) || String(e); if (/SESION/.test(m)) { sesionVencida(m); return; } if (ko) ko(e); else console.error(m); });
      r.api(TOK, k, args);
    };
  } });
}
window.blRun = chain(null, null);
window.blToken = function () { return TOK; };
window.blRol = function () { return ROL; };
window.blNombre = function () { return NOM; };
function sesionVencida(m) { ls('bl_tok', null); ls('bl_rol', null); blAlert(E({ message: m }), function () { try { window.top.location.reload(); } catch (e) { location.reload(); } }); }
window.blSalir = function () { blConfirm('Estás como ' + NOM + '. ¿Salir y cambiar de usuario?', function () { ls('bl_tok', null); ls('bl_rol', null); ls('blumia_quien', null); try { window.top.location.reload(); } catch (e) { location.reload(); } }, { si: 'Salir' }); };
window.blCambiarPin = function () {
  blForm('Cambiar mi PIN', [{ label: 'PIN nuevo (4 a 6 números)', tipo: 'password', modo: 'numeric', max: 6 }, { label: 'Repetilo', tipo: 'password', modo: 'numeric', max: 6 }], function (v) {
    var a = v[0].trim(), b = v[1].trim();
    if (!/^\d{4,6}$/.test(a)) return 'El PIN tiene que tener de 4 a 6 números.';
    if (a !== b) return 'Los PIN no coinciden.';
    R0.withSuccessHandler(function (r) { TOK = r.token; ls('bl_tok', TOK); alert('PIN cambiado ✓'); }).withFailureHandler(function (e) { alert(E(e)); }).cambiarMiPin(TOK, a);
  }, { si: 'Guardar' });
};
window.blMenuUsuario = function () {
  var op = [];
  if (typeof window.avNotif === 'function') op.push(['🔔 Avisos del navegador', window.avNotif]);
  if (USA_PIN) op.push(['Cambiar mi PIN', blCambiarPin]);
  op.push(['Salir', blSalir]);
  if (op.length === 1) { blSalir(); return; }
  blMenu('Usuario', NOM + ' (' + ROL + ')', op);
};

function guardarSesion(r) { TOK = r.token; NOM = r.nombre; ROL = r.rol; ls('bl_tok', TOK); ls('blumia_quien', NOM); ls('bl_rol', ROL); }
function formLogin(texto) {
  $('v').innerHTML = '<h1>Ingresá</h1><p class="s">' + (texto || (USA_PIN ? 'Con tu nombre y apellido y tu PIN.' : 'Con tu nombre y apellido.')) + '</p><label for="n">Nombre y apellido</label><input id="n" autocomplete="name" value="' + (ls('bl_ult') || '').replace(/"/g, '') + '">' + (USA_PIN ? '<label for="p">PIN</label><input id="p" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password">' : '') + '<div class="er" id="er"></div><button id="b" onclick="entrar()">Entrar</button>' + (USA_PIN ? '<p class="s" style="margin:12px 0 0">¿Primer ingreso? Tu PIN temporal te lo da un administrador.</p>' : '<p class="s" style="margin:12px 0 0">Si no podés entrar, pedile a un administrador que te dé de alta.</p>');
  $('n').onkeydown = function (e) { if (e.key === 'Enter') entrar(); };
  if ($('p')) $('p').onkeydown = $('n').onkeydown;
  ($('n').value && $('p') ? $('p') : $('n')).focus();
}
function entrar() {
  var n = $('n').value.trim(), p = $('p') ? $('p').value.trim() : '';
  if (!n || (USA_PIN && !p)) { msg(USA_PIN ? 'Completá tu nombre y tu PIN.' : 'Escribí tu nombre y apellido.'); return; }
  $('b').disabled = true; msg('');
  R0.withSuccessHandler(function (r) {
    ls('bl_ult', r.nombre); guardarSesion(r);
    if (r.debeCambiar) formPin(); else cargar();
  }).withFailureHandler(function (e) { $('b').disabled = false; msg(E(e)); }).login(n, p);
}
function formPin() {
  $('v').innerHTML = '<h1>Elegí tu PIN</h1><p class="s">Hola ' + NOM + '. Tu PIN actual es temporal: elegí uno propio de 4 a 6 números.</p><label for="p1">PIN nuevo</label><input id="p1" type="password" inputmode="numeric" maxlength="6"><label for="p2">Repetilo</label><input id="p2" type="password" inputmode="numeric" maxlength="6"><div class="er" id="er"></div><button id="b" onclick="guardarPin()">Guardar y entrar</button>';
  $('p1').focus();
}
function guardarPin() {
  var a = $('p1').value.trim(), b = $('p2').value.trim();
  if (a !== b) { msg('Los PIN no coinciden.'); return; }
  $('b').disabled = true; msg('');
  R0.withSuccessHandler(function (r) { guardarSesion(r); cargar(); }).withFailureHandler(function (e) { $('b').disabled = false; msg(E(e)); }).cambiarMiPin(TOK, a);
}
function cargar() {
  $('v').innerHTML = '<div class="cg"><div class="sp"></div>Cargando…</div>';
  blRun.withSuccessHandler(function (html) { document.open(); document.write(html); document.close(); refrescarSesion(); })
    .withFailureHandler(function (e) { $('v').innerHTML = '<div class="er" style="min-height:0">No se pudo abrir: ' + E(e) + '</div><button onclick="cargar()">Reintentar</button>'; })
    .pagina(PARAMS);
}
// actualiza en segundo plano el nombre y el rol (la página ya se pidió con la sesión: el servidor la verifica en cada pedido)
function refrescarSesion() {
  R0.withSuccessHandler(function (r) { NOM = r.nombre; ROL = r.rol; ls('blumia_quien', NOM); ls('bl_rol', ROL); }).withFailureHandler(function () { }).validarSesion(TOK);
}
(function () {
  var t = ls('bl_tok');
  if (!t) { formLogin(); return; }
  TOK = t;
  // con la sesión ya conocida se pide la página directo (una vuelta al servidor menos); si el token venció, la propia página lo avisa
  var n0 = ls('blumia_quien'), r0 = ls('bl_rol');
  if (n0 && r0) { NOM = n0; ROL = r0; cargar(); return; }
  R0.withSuccessHandler(function (r) { NOM = r.nombre; ROL = r.rol; ls('blumia_quien', NOM); cargar(); })
    .withFailureHandler(function () { TOK = ''; ls('bl_tok', null); formLogin('Tu sesión venció. Ingresá de nuevo.'); }).validarSesion(t);
})();
</script></body></html>
