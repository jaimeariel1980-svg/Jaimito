<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NJ Arquitectura · Obras</title>
<style>
:root{--p:#AD1457;--pd:#880E4F;--bg:#FFF3F8;--card:#fff;--bd:#F6D3E2;--mu:#9C6079;--tx:#32091F;--ok:#12805C;--ng:#C62828;--sh:0 10px 30px -12px rgba(136,14,79,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-variant-numeric:tabular-nums;padding-bottom:40px}
button{font:inherit;cursor:pointer}
.hero{background:linear-gradient(135deg,#6A0F3F 0%,#AD1457 55%,#E91E63 100%);color:#fff;padding:18px 18px 64px;position:relative;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero:before{width:240px;height:240px;right:-70px;top:-90px}.hero:after{width:150px;height:150px;left:-50px;bottom:-70px}
.top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.brand{font-weight:800;font-size:15px;letter-spacing:.4px}.brand small{display:block;font-weight:500;font-size:11px;opacity:.8;letter-spacing:0}
.rf{background:rgba(255,255,255,.18);border:0;color:#fff;width:36px;height:36px;border-radius:50%;font-size:17px;backdrop-filter:blur(4px)}
.hl{margin-top:20px;font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:1.2px;position:relative;z-index:1}
.hn{font-size:clamp(34px,10vw,52px);font-weight:900;letter-spacing:-1px;line-height:1.05;position:relative;z-index:1}
.hs{font-size:12px;opacity:.85;margin-top:4px;position:relative;z-index:1}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:-44px 14px 0;position:relative;z-index:2}
.chip{background:var(--card);border-radius:14px;padding:11px 12px;box-shadow:var(--sh);border:1px solid var(--bd)}
.chip small{display:block;font-size:10.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.6px}.chip b{font-size:clamp(14px,4vw,18px)}
.tabs{display:flex;gap:4px;margin:16px 14px 4px;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:4px;position:sticky;top:8px;z-index:5;box-shadow:var(--sh)}
.tab{flex:1;border:0;background:none;padding:10px 4px;border-radius:10px;font-weight:700;font-size:13px;color:var(--pd);transition:.2s}
.tab.on{background:linear-gradient(135deg,#AD1457,#E91E63);color:#fff;box-shadow:0 6px 14px -6px rgba(173,20,87,.7)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;padding:14px}
.oc{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--sh);border:1px solid var(--bd);cursor:pointer;transition:transform .2s,box-shadow .2s;animation:rise .5s both;animation-delay:calc(var(--i)*70ms)}
.oc:active{transform:scale(.985)}@media(hover:hover){.oc:hover{transform:translateY(-4px);box-shadow:0 18px 38px -14px rgba(136,14,79,.5)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.oh{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:relative}
.av{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-weight:900;font-size:20px;flex:none}
.oh h2{margin:0;font-size:17px;line-height:1.15}.oh p{margin:2px 0 0;font-size:12px;opacity:.85}
.st{margin-left:auto;font-size:10.5px;font-weight:800;background:rgba(255,255,255,.25);padding:4px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.ob{padding:16px}
.mid{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:var(--sz,96px);height:var(--sz,96px);flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .rb{stroke:#F8DCE7}.ring .rg{stroke:var(--a,#AD1457);transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring.over .rg{stroke:var(--ng)}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.rc b{font-size:20px;line-height:1}.rc small{font-size:9.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.sal small{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.8px}
.sal b{display:block;font-size:clamp(26px,8vw,32px);font-weight:900;letter-spacing:-.5px;color:var(--ok);line-height:1.1}.sal b.neg{color:var(--ng)}
.flow{height:10px;border-radius:8px;background:#DDF3EA;margin-top:16px;overflow:hidden}
.flow i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--a),var(--b));transition:width 1s cubic-bezier(.2,.8,.2,1)}
.flowl{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);margin-top:5px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.tile{background:#FFF7FA;border:1px solid var(--bd);border-radius:12px;padding:8px 9px}.tile small{display:block;font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}.tile b{font-size:14px}
.spark{display:flex;align-items:flex-end;gap:7px;margin-top:16px}
.spark>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;justify-content:flex-end}
.spark .bb{display:flex;align-items:flex-end;gap:2px;width:100%;height:40px}.spark .bb i{flex:1;border-radius:4px 4px 0 0;min-height:2px;background:var(--b);opacity:.55;height:var(--h)}.spark .bb i+i{background:var(--a);opacity:1}
.spark span{font-size:9.5px;color:var(--mu)}
.sk{font-size:10.5px;color:var(--mu);margin-top:6px;display:flex;gap:12px}.sk u{text-decoration:none;display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.of{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--bd)}
.gn small{display:block;font-size:10.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.7px}.gn b{font-size:22px;font-weight:900;color:var(--p)}
.cf{text-align:right;font-size:11px;color:var(--mu)}.cf b{color:var(--tx)}
.dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end;margin-top:4px;max-width:150px}.dots i{width:9px;height:9px;border-radius:50%;background:#F4D5E2}.dots i.on{background:var(--a,#AD1457)}
.dcard .dots{justify-content:flex-start;max-width:none}.det{animation:rise .4s both}
.dh{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;padding:14px 16px 70px;position:relative;overflow:hidden}
.dh:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.back{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:20px;padding:7px 14px;font-weight:700;font-size:13px;position:relative;z-index:1}
.dh h1{margin:14px 0 0;font-size:26px;position:relative;z-index:1}.dh p{margin:2px 0 0;opacity:.85;font-size:13px;position:relative;z-index:1}
.dring{display:flex;align-items:center;gap:16px;margin:-52px 14px 0;position:relative;z-index:2}
.dring .ring{background:#fff;border-radius:50%;box-shadow:var(--sh);padding:7px;border:1px solid var(--bd)}
.dcard{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);padding:14px 16px;margin:14px}
.dcard h3{margin:0 0 10px;font-size:13px;color:var(--pd);text-transform:uppercase;letter-spacing:.8px}
.kg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 14px 0}
.wf .r{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px;border-bottom:1px dashed var(--bd)}.wf .r:last-child{border:0}
.wf .r.t{font-weight:900;font-size:17px;color:var(--p);border-top:2px solid var(--p);border-bottom:0;margin-top:4px;padding-top:12px}
.neg{color:var(--ng)}.pos{color:var(--ok)}
.rr{padding:9px 0;border-bottom:1px dashed var(--bd)}.rr:last-child{border:0}
.rr .l{display:flex;justify-content:space-between;font-size:14px;font-weight:600}.rr .l span:last-child{font-weight:700}
.rr .bar{height:8px;border-radius:6px;background:#F8DCE7;margin-top:6px;overflow:hidden}.rr .bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--a),var(--b));transition:width 1s cubic-bezier(.2,.8,.2,1)}.rr .bar.x i{background:var(--ng)}
.rr small{font-size:11px;color:var(--mu)}
.feed .m{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--bd)}.feed .m:last-child{border:0}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.ic.Ingreso{background:#DDF3EA}.ic.Compra{background:#FFF1D6}.ic[class*="Pago"]{background:#E4E9FF}.ic.Gasto{background:#FBE0E0}
.m .t{flex:1;min-width:0}.m .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.m .t small{font-size:11.5px;color:var(--mu)}
.m .a{font-weight:800;font-size:14px;white-space:nowrap;text-align:right}.m .a small{display:block;font-weight:500;font-size:10.5px;color:var(--mu)}
.m a{text-decoration:none}
.chipsc{display:flex;flex-wrap:wrap;gap:6px}.cc{background:#FFF7FA;border:1px solid var(--bd);border-radius:12px;padding:7px 10px;font-size:12px}.cc b{display:block;font-size:13px}.cc small{color:var(--mu)}
.nx{margin-top:10px;font-size:12px;color:var(--mu);background:#FFF7FA;border:1px dashed var(--p);border-radius:12px;padding:8px 10px}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin:14px 14px 0}
.flt select,.flt input{flex:1;min-width:130px;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;font-size:14px;background:#fff;color:var(--tx)}
.vacio{padding:28px;text-align:center;color:var(--mu);font-size:14px}

.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(135deg,#AD1457,#E91E63);color:#fff;font-size:32px;line-height:1;box-shadow:0 12px 26px -8px rgba(173,20,87,.8);z-index:20;display:none}
.fab:active{transform:scale(.94)}
.ov{position:fixed;inset:0;background:rgba(50,9,31,.55);z-index:40;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.ov.on{display:flex}
.sh{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sh h2{margin:0 0 12px;font-size:19px;color:var(--pd)}
.fl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mu);margin:12px 0 5px;font-weight:700}
.in{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;font-size:16px;background:#fff;color:var(--tx);font-family:inherit}
.in:focus{outline:2px solid #F48FB1;border-color:transparent}
.big{font-size:26px;font-weight:900;color:var(--p);text-align:right}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;min-width:70px;padding:10px 6px;border:1px solid var(--bd);border-radius:12px;background:#fff;color:var(--pd);font-weight:700;font-size:13px}
.seg button.on{background:linear-gradient(135deg,#AD1457,#E91E63);color:#fff;border-color:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:10px;margin-top:18px}.acts button{flex:1;padding:14px;border-radius:14px;border:0;font-weight:800;font-size:15px}
.pri{background:linear-gradient(135deg,#AD1457,#E91E63);color:#fff}.sec{background:#F8DCE7;color:var(--pd)}.dan{background:#FDE7E7;color:var(--ng)}.dan.on{background:var(--ng);color:#fff}
.acts button:disabled{opacity:.55}
.lnk{background:none;border:0;color:var(--p);font-weight:700;font-size:13px;padding:6px 0}
.mini{background:#FFF0F6;border:1px solid var(--bd);color:var(--pd);font-weight:700;font-size:12px;border-radius:20px;padding:6px 12px;float:right;margin-top:-4px}
.err{color:var(--ng);font-size:13px;margin-top:10px;min-height:16px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#32091F;color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;z-index:60;display:none;align-items:center;gap:12px;max-width:92vw;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
.toast.on{display:flex;animation:rise .25s both}.toast button{background:none;border:0;color:#F48FB1;font-weight:800;font-size:14px}
.gate{position:fixed;inset:0;background:linear-gradient(135deg,#6A0F3F,#AD1457 60%,#E91E63);z-index:80;display:none;align-items:center;justify-content:center;padding:24px}
.gate.on{display:flex}.gate .bx{background:#fff;border-radius:24px;padding:26px 22px;width:100%;max-width:360px;text-align:center}
.gate h2{margin:6px 0 4px;color:var(--pd)}.gate p{color:var(--mu);font-size:13px;margin:0 0 14px}
.sk1{height:340px;border-radius:22px;margin:14px;background:linear-gradient(90deg,#F8E3EC 25%,#FDF0F5 50%,#F8E3EC 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.nueva{border:2px dashed #E6A9C2;background:transparent;box-shadow:none;display:grid;place-items:center;min-height:120px;color:var(--p);font-weight:800;font-size:15px;text-align:center}
.m{cursor:pointer}.m:active{background:#FFF7FA}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<section class="hero">
  <div class="top"><div class="brand">NJ ARQUITECTURA<small>Caja de obra · <span id="upd"></span></small></div><button class="rf" onclick="location.reload()" aria-label="Actualizar">&#8635;</button></div>
  <div class="hl">Ganancia neta total</div><div class="hn" id="hn">$0</div><div class="hs" id="hs">Cargando…</div>
</section>
<div class="chips" id="chips"></div>
<div class="tabs" id="tabs"></div>
<div id="app"><div class="sk1"></div><div class="sk1"></div></div>
<button class="fab" id="fab" onclick="frmMov(0)" aria-label="Cargar movimiento">+</button>
<div class="ov" id="ov" onclick="if(event.target===this)cerrar()"><div class="sh" id="sh"></div></div>
<div class="toast" id="toast"></div>
<div class="gate" id="gate"><div class="bx" id="gbx"></div></div>
<script>
let D=null,CL='';
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const PAL=[['#AD1457','#F06292'],['#6A1B9A','#BA68C8'],['#D84315','#FFAB91'],['#00796B','#4DB6AC'],['#283593','#7986CB'],['#EF6C00','#FFB74D']];
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const ICO={'Ingreso':'💰','Compra':'🧱','Pago sub':'👷','Gasto':'🧾'};
let T='obras',SEL=-1,FO=-1,FT='',FQ='';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const money=n=>{n=Math.round(+n||0);return(n<0?'-$':'$')+Math.abs(n).toLocaleString('es-AR')};
const mc=n=>{n=+n||0;const a=Math.abs(n),s=n<0?'-':'';if(a>=1e6)return s+'$'+(a/1e6).toFixed(a>=1e7?1:2).replace('.',',')+' M';if(a>=1e3)return s+'$'+Math.round(a/1e3)+' mil';return s+'$'+Math.round(a)};
const pc=x=>x==null?'—':Math.round(x*100)+'%';
const pct4=x=>(Math.round(x*10000)/100).toString().replace('.',',')+' %';
const col=i=>PAL[i%PAL.length];
const sum=k=>D.obras.reduce((a,o)=>a+(o[k]||0),0);
const sty=i=>`--a:${col(i)[0]};--b:${col(i)[1]}`;
function ringInfo(o){
  if(o.avance!=null)return[o.avance,'avance'];
  if(o.params&&o.params.plazo)return[o.certs.length/o.params.plazo,'certif.'];
  return[null,'s/ presup.'];
}
function ring(p,label,sz){
  const r=42,c=2*Math.PI*r,pp=p==null?0:Math.min(p,1);
  return `<div class="ring${p>1?' over':''}" style="--sz:${sz}px"><svg viewBox="0 0 100 100"><circle class="rb" cx="50" cy="50" r="${r}"/><circle class="rg" cx="50" cy="50" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${c*(1-pp)}"/></svg><div class="rc"><b>${pc(p)}</b><small>${label}</small></div></div>`;
}
function dots(o){
  const p=o.params;if(!p||!p.plazo)return'';
  return`<div class="dots">${Array.from({length:p.plazo},(_,i)=>`<i class="${i<o.certs.length?'on':''}"></i>`).join('')}</div>`;
}
function spark(o){
  const s=o.serie||[],mx=Math.max(1,...s.map(x=>Math.max(x.c,x.p)));
  if(!s.some(x=>x.c||x.p))return'<div class="sk">Sin movimientos en los últimos 6 meses</div>';
  return`<div class="spark">${s.map(x=>`<div><div class="bb"><i style="--h:${Math.max(3,x.c/mx*40)}px"></i><i style="--h:${Math.max(3,x.p/mx*40)}px"></i></div><span>${x.l}</span></div>`).join('')}</div><div class="sk"><span><u style="background:var(--b);opacity:.55"></u>Cobrado</span><span><u style="background:var(--a)"></u>Pagado</span></div>`;
}
function card(o,i){
  const[rp,rl]=ringInfo(o),pg=o.cobrado>0?o.pagado/o.cobrado:null,p=o.params;
  return`<article class="oc" style="${sty(i)};--i:${i}" onclick="ver(${i})">
  <div class="oh"><div class="av">${esc(o.obra.charAt(0).toUpperCase())}</div><div><h2>${esc(o.obra)}</h2><p>${esc(o.dir)||'Sin dirección'}</p></div>${o.estado?`<span class="st">${esc(o.estado)}</span>`:''}</div>
  <div class="ob">
    <div class="mid">${ring(rp,rl,96)}<div class="sal"><small>Saldo en caja</small><b class="${o.saldo<0?'neg':''}" data-n="${o.saldo}">${money(0)}</b></div></div>
    <div class="flow"><i data-w="${pg==null?0:Math.min(pg,1)*100}"></i></div>
    <div class="flowl"><span>${pg==null?'Sin cobros todavía':'Gastado el '+pc(pg)+' de lo cobrado'}</span><span>${mc(o.cobrado)} cobrado</span></div>
    <div class="tiles"><div class="tile"><small>Cobrado</small><b>${mc(o.cobrado)}</b></div><div class="tile"><small>Pagado</small><b>${mc(o.pagado)}</b></div><div class="tile"><small>Bonus</small><b>${mc(o.bonus)}</b></div></div>
    ${spark(o)}
    <div class="of"><div class="gn"><small>Ganancia neta</small><b class="${o.neta<0?'neg':''}">${mc(o.neta)}</b></div>
      <div class="cf">${p&&p.plazo?`Certificados <b>${o.certs.length}/${p.plazo}</b>${dots(o)}`:'<small>Sin certificados</small>'}</div></div>
  </div></article>`;
}
function vObras(){
  return`<div class="grid">${D.obras.map(card).join('')}<article class="oc nueva" style="--i:${D.obras.length}" onclick="frmObra()">+ Nueva obra</article></div>`;
}
function wf(o){
  return`<div class="wf"><div class="r"><span>Caja (cobrado − pagado)</span><b>${money(o.saldo)}</b></div><div class="r"><span>+ Bonus</span><b>${money(o.bonus)}</b></div><div class="r"><span>+ Honorarios</span><b>${money(o.honorarios)}</b></div><div class="r"><span>− Gastos de estudio</span><b class="neg">${money(o.gastoEstudio)}</b></div><div class="r t"><span>Ganancia neta</span><b>${money(o.neta)}</b></div></div>`;
}
function proximo(o){
  const p=o.params;if(!p||!p.plazo||!p.base)return'';
  const n=o.certs.length+1;if(n>p.plazo)return'<div class="nx">✔ Plazo completo: todos los certificados emitidos.</div>';
  const b=p.base.split('/'),bm=+b[1]-1,by=+b[2],idx=bm+n;
  return`<div class="nx">Próximo certificado: <b>N° ${n} · ${MES[idx%12]} ${by+Math.floor(idx/12)}</b></div>`;
}
function boxCerts(o,i){
  const p=o.params;
  if(!p||!p.mensual)return`<div class="dcard"><h3>Certificados de honorarios</h3><div class="vacio">Falta cargar el honorario mensual en la pestaña Certificados.</div></div>`;
  return`<div class="dcard" style="${sty(i)}"><h3>Certificados de honorarios</h3>
  <div class="mid">${ring(o.certs.length/p.plazo,'emitidos',84)}<div class="sal"><small>Honorario mensual</small><b style="color:var(--p);font-size:24px">${money(p.mensual)}</b><small>${p.plazo} meses · base ${esc(p.base)}</small></div></div>
  ${dots(o)?`<div style="margin-top:12px">${dots(o)}</div>`:''}
  ${o.certs.length?`<div class="chipsc" style="margin-top:12px">${o.certs.map(c=>`<div class="cc"><small>N° ${c.n} · ${esc(c.mes)}</small><b>${money(c.total)}</b><small>IPC ${pct4(c.pct)} · acum. ${pct4(c.acum)}</small></div>`).join('')}</div>`:''}
  ${proximo(o)}</div>`;
}
function feed(l){
  if(!l.length)return'<div class="vacio">Sin movimientos.</div>';
  return`<div class="feed">${l.map(x=>{const ing=x.tipo==='Ingreso',lk=x.link?` <a href="${esc(x.link)}" target="_blank" rel="noopener">📎</a>`:'';
  return`<div class="m" onclick="frmMov(${x.row})"><div class="ic ${esc(x.tipo)}">${ICO[x.tipo]||'•'}</div><div class="t"><b>${esc(x.det||x.rubro)}</b><small>${esc(x.rubro)}${x.prov?' · '+esc(x.prov):''}${lk}</small></div><div class="a ${ing?'pos':'neg'}">${ing?'+':'−'}${money(x.monto)}<small>${esc(x.f)}</small></div></div>`}).join('')}</div>`;
}
function vDetalle(o,i){
  const[rp,rl]=ringInfo(o),u=D.movs.filter(x=>x.obra===o.obra).slice(0,10);
  const rubs=o.rubros.map(r=>{const av=r.pres>0?r.ejecutado/r.pres:null,v=r.ejecutado||r.cobrado;
    return`<div class="rr"><div class="l"><span>${esc(r.rubro)}</span><span>${money(v)}</span></div>${av==null?'':`<div class="bar${av>1?' x':''}"><i data-w="${Math.min(av,1)*100}"></i></div><small>${pc(av)} de ${money(r.pres)}${r.bonus?' · bonus '+money(r.bonus):''}</small>`}</div>`}).join('')||'<div class="vacio">Sin movimientos ni presupuesto.</div>';
  return`<div class="det" style="${sty(i)}"><div class="dh"><button class="back" onclick="ver(-1)">← Obras</button><h1>${esc(o.obra)}</h1><p>${esc(o.dir)}</p></div>
  <div class="dring">${ring(rp,rl,104)}<div style="color:var(--tx);padding-top:46px"><small style="color:var(--mu);text-transform:uppercase;letter-spacing:.8px;font-size:11px">Saldo en caja</small><div style="font-size:30px;font-weight:900" class="${o.saldo<0?'neg':'pos'}" data-n="${o.saldo}">${money(0)}</div></div></div>
  <div class="kg"><div class="chip"><small>Cobrado</small><b>${mc(o.cobrado)}</b></div><div class="chip"><small>Pagado</small><b>${mc(o.pagado)}</b></div><div class="chip"><small>Bonus</small><b>${mc(o.bonus)}</b></div></div>
  <div class="dcard"><h3>Desglose de ganancia</h3>${wf(o)}</div>
  <div class="dcard"><button class="mini" onclick="frmPres(${i})">✏️ Presupuesto</button><h3>Rubros</h3>${rubs}</div>
  ${boxCerts(o,i)}
  <div class="dcard"><h3>Últimos movimientos</h3>${feed(u)}</div></div>`;
}
function vCerts(){
  if(!D.obras.length)return'<div class="vacio">Todavía no hay obras.</div>';
  return'<div class="nx" style="margin:14px">Para emitir un certificado (IPC del mes) usá por ahora a Anita en Telegram.</div>'+D.obras.map((o,i)=>`<div style="margin:14px 14px 0;font-weight:800;color:var(--pd)">${esc(o.obra)}</div>${boxCerts(o,i)}`).join('');
}
function vMovs(){
  return`<div class="flt"><select onchange="FO=+this.value;lstMovs()"><option value="-1">Todas las obras</option>${D.obras.map((o,i)=>`<option value="${i}"${FO===i?' selected':''}>${esc(o.obra)}</option>`).join('')}</select>
  <select onchange="FT=this.value;lstMovs()"><option value="">Todos los tipos</option>${['Ingreso','Pago sub','Compra','Gasto'].map(t=>`<option${FT===t?' selected':''}>${t}</option>`).join('')}</select>
  <input placeholder="Buscar proveedor, detalle, rubro…" value="${esc(FQ)}" oninput="FQ=this.value;lstMovs()"></div><div class="dcard" id="lm"></div>`;
}
function lstMovs(){
  const q=FQ.toLowerCase(),on=FO>=0?D.obras[FO].obra:'';
  const l=D.movs.filter(x=>(!on||x.obra===on)&&(!FT||x.tipo===FT)&&(!q||(x.prov+' '+x.det+' '+x.rubro).toLowerCase().includes(q)));
  const t=l.reduce((a,x)=>a+(x.tipo==='Ingreso'?x.monto:-x.monto),0);
  $('lm').innerHTML=`<h3>${l.length} movimientos · neto ${money(t)}</h3>${feed(l.slice(0,150))}`;
}
const $=id=>document.getElementById(id);
function cu(){
  document.querySelectorAll('[data-n]').forEach(el=>{
    const to=+el.dataset.n;if(RM){el.textContent=money(to);return}
    const t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,3);el.textContent=money(to*e);if(k<1)requestAnimationFrame(s)})(t0);
  });
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('.rg').forEach(c=>c.style.strokeDashoffset=c.dataset.off);
    document.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%');
  }));
}
function tabs(){
  $('tabs').innerHTML=[['obras','🏗 Obras'],['certs','📄 Certificados'],['movs','💸 Movimientos']].map(x=>`<button class="tab${T===x[0]?' on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
}
function go(t){T=t;SEL=-1;draw();scrollTo(0,0)}
function ver(i){SEL=i;draw();scrollTo(0,0)}
function draw(){
  tabs();const a=$('app');
  if(T==='obras')a.innerHTML=SEL>=0?vDetalle(D.obras[SEL],SEL):vObras();
  else if(T==='certs')a.innerHTML=vCerts();
  else{a.innerHTML=vMovs();lstMovs()}
  cu();
}
function paint(){
  $('upd').textContent=D.hoy;
  $('hs').textContent=D.obras.length+(D.obras.length===1?' obra':' obras')+' en seguimiento';
  $('chips').innerHTML=[['Cobrado','cobrado'],['Pagado','pagado'],['Saldo','saldo']].map(x=>`<div class="chip"><small>${x[0]}</small><b class="${sum(x[1])<0?'neg':''}">${mc(sum(x[1]))}</b></div>`).join('');
  const el=$('hn'),to=sum('neta');
  if(RM)el.textContent=money(to);else{const t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/1100),e=1-Math.pow(1-k,3);el.textContent=money(to*e);if(k<1)requestAnimationFrame(s)})(t0)}
  $('fab').style.display='block';
  draw();
}
function rpc(fn,args,ok,fail){
  const r=google.script.run.withSuccessHandler(ok).withFailureHandler(e=>fail(String((e&&e.message)||e)));
  r[fn].apply(r,args);
}
function msgErr(m){
  if(m.indexOf('CLAVE')>=0&&m.indexOf('SIN_CLAVE')<0)return'Clave incorrecta.';
  if(m.indexOf('BLOQUEADO')>=0)return'Demasiados intentos. Esperá 10 minutos.';
  if(m.indexOf('CAMBIO')>=0)return'Ese movimiento cambió en la planilla. Recargá y probá de nuevo.';
  return m.replace(/^Error:\s*/,'');
}
function cargar(){
  rpc('tbDatos',[CL],d=>{D=d;paint()},m=>{
    if(m.indexOf('SIN_CLAVE')>=0)return gate('setup');
    if(m.indexOf('CLAVE')>=0||m.indexOf('BLOQUEADO')>=0)return gate(msgErr(m));
    $('app').innerHTML='<div class="vacio">No se pudo cargar: '+esc(msgErr(m))+'<br><br><button class="mini" style="float:none" onclick="location.reload()">Reintentar</button></div>';
  });
}
function gate(m){
  $('fab').style.display='none';
  $('gbx').innerHTML=m==='setup'
   ?'<div style="font-size:40px">🔧</div><h2>Falta la clave</h2><p>En Apps Script: ⚙ Configuración del proyecto → Propiedades de la secuencia de comandos → Agregar propiedad <b>TABLERO_PIN</b> con la clave que quieras. Después recargá esta página.</p>'
   :'<div style="font-size:40px">🔒</div><h2>Caja de obra</h2><p>Ingresá la clave para entrar</p><input class="in" id="gpin" type="password" inputmode="text" autocomplete="current-password" placeholder="Clave" onkeydown="if(event.key===\'Enter\')entrar()"><div class="err" id="gerr">'+esc(m||'')+'</div><div class="acts"><button class="pri" onclick="entrar()">Entrar</button></div>';
  $('gate').classList.add('on');
  if($('gpin'))setTimeout(()=>$('gpin').focus(),50);
}
function entrar(){
  CL=$('gpin').value;if(!CL)return;
  try{localStorage.setItem('nj_clave',CL)}catch(e){}
  $('gate').classList.remove('on');cargar();
}
function toast(t,undo){
  const e=$('toast');e.innerHTML=esc(t)+(undo?'<button onclick="('+undo+')()">Deshacer</button>':'');
  e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),undo?7000:2800);
}
function abrir(h){$('sh').innerHTML=h;$('ov').classList.add('on')}
function cerrar(){$('ov').classList.remove('on')}
const num=v=>{v=String(v==null?'':v).trim().replace(/\./g,'').replace(',','.');const n=Number(v);return isFinite(n)?n:0};
const fmtN=n=>Math.round(n||0).toLocaleString('es-AR');
const hoyISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let F={};
function seg(n,opts,v){return`<div class="seg" id="seg_${n}">${opts.map(o=>`<button type="button" data-v="${esc(o[0])}" class="${o[0]===v?'on':''}" onclick="sg('${n}','${o[0]}')">${o[1]}</button>`).join('')}</div>`}
function sg(n,v){
  F[n]=v;document.querySelectorAll('#seg_'+n+' button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(n==='tipo')$('fbon').style.display=(v==='Compra'||v==='Pago sub')?'':'none';
}
function frmMov(row){
  const m=row?D.movs.find(x=>x.row===row):null;
  if(row&&!m)return;
  const ob=m?m.obra:(SEL>=0&&T==='obras'?D.obras[SEL].obra:(D.obras[0]||{}).obra);
  F={tipo:m?m.tipo:'Compra',fac:m?(m.fac==='Sí'?'Sí':'No'):'No',row:row||0,fp:m?m.fp:'',link:m?m.link:''};
  abrir(`<h2>${m?'Editar movimiento':'Nuevo movimiento'}</h2>
  <label class="fl">Tipo</label>${seg('tipo',[['Ingreso','💰 Ingreso'],['Compra','🧱 Compra'],['Pago sub','👷 Pago sub'],['Gasto','🧾 Gasto']],F.tipo)}
  <label class="fl">Obra</label><select class="in" id="fobra">${D.obras.map(o=>`<option${o.obra===ob?' selected':''}>${esc(o.obra)}</option>`).join('')}</select>
  <label class="fl">Monto ($)</label><input class="in big" id="fmonto" inputmode="decimal" placeholder="0" value="${m?fmtN(m.monto):''}">
  <button class="lnk" type="button" onclick="$('fcalc').style.display=$('fcalc').style.display?'':'none'">× Calcular cantidad por precio</button>
  <div class="row2" id="fcalc" style="display:none"><div><label class="fl">Cantidad</label><input class="in" id="fcant" inputmode="decimal" oninput="calc()"></div><div><label class="fl">Precio unitario</label><input class="in" id="fprec" inputmode="decimal" oninput="calc()"></div></div>
  <label class="fl">Rubro</label><select class="in" id="frub">${D.rubros.map(r=>`<option${(m?m.rubro:'General')===r?' selected':''}>${esc(r)}</option>`).join('')}</select>
  <div class="row2"><div><label class="fl">Proveedor</label><input class="in" id="fprov" maxlength="80" value="${m?esc(m.prov):''}"></div><div><label class="fl">Fecha</label><input class="in" id="ffec" type="date" value="${m?m.d:hoyISO()}"></div></div>
  <label class="fl">Detalle</label><input class="in" id="fdet" maxlength="150" placeholder="Ej: 3 bolsas de cemento" value="${m?esc(m.det):''}">
  <label class="fl">Factura</label>${seg('fac',[['Sí','Con factura'],['No','Sin factura']],F.fac)}
  <div id="fbon" style="display:${(F.tipo==='Compra'||F.tipo==='Pago sub')?'':'none'}"><label class="fl">Bonus (%)</label><input class="in" id="fbonv" inputmode="decimal" placeholder="0" value="${m&&m.b?Math.round(m.b*1000)/10:''}"></div>
  <div class="err" id="ferr"></div>
  <div class="acts">${m?'<button class="dan" id="fdel" onclick="borrar()">🗑 Borrar</button>':'<button class="sec" onclick="cerrar()">Cancelar</button>'}<button class="pri" id="fsave" onclick="guardar()">Guardar</button></div>`);
}
function calc(){const c=num($('fcant').value),p=num($('fprec').value);if(c>0&&p>0)$('fmonto').value=fmtN(c*p)}
function guardar(){
  const monto=num($('fmonto').value);
  if(!(monto>0)){$('ferr').textContent='Poné un monto mayor a 0.';return}
  const b=$('fsave');b.disabled=true;b.textContent='Guardando…';
  const p={row:F.row,fp:F.fp,link:F.link,obra:$('fobra').value,tipo:F.tipo,rubro:$('frub').value,concepto:$('fdet').value,proveedor:$('fprov').value,monto:monto,factura:F.fac,bonus:num($('fbonv').value)/100,fecha:$('ffec').value};
  rpc('tbGuardarMov',[CL,p],r=>{D=r.datos;cerrar();paint();toast(r.dup?'⚠ Guardado, pero ya había uno igual':'✅ Guardado')},m=>{b.disabled=false;b.textContent='Guardar';$('ferr').textContent=msgErr(m)});
}
function borrar(){
  const b=$('fdel');
  if(!b.classList.contains('on')){b.classList.add('on');b.textContent='¿Seguro? Tocá de nuevo';return}
  b.disabled=true;b.textContent='Borrando…';
  rpc('tbBorrarMov',[CL,F.row,F.fp],r=>{D=r.datos;cerrar();paint();LASTDEL=r.borrado;toast('🗑 Movimiento borrado','deshacerBorrado')},m=>{b.disabled=false;b.classList.remove('on');b.textContent='🗑 Borrar';$('ferr').textContent=msgErr(m)});
}
let LASTDEL=null;
function deshacerBorrado(){
  if(!LASTDEL)return;const x=LASTDEL;LASTDEL=null;
  rpc('tbGuardarMov',[CL,{obra:x.obra,tipo:x.tipo,rubro:x.rubro,concepto:x.concepto,proveedor:x.proveedor,monto:x.monto,factura:x.factura,link:x.link,bonus:x.bonus,fecha:x.fecha}],r=>{D=r.datos;paint();toast('↩ Restaurado')},m=>toast(msgErr(m)));
}
function frmPres(i){
  const o=D.obras[i];
  abrir(`<h2>Presupuesto · ${esc(o.obra)}</h2><div class="sub" style="margin-bottom:6px">Dejá en blanco los rubros que no uses.</div>
  ${D.rubros.map((r,k)=>`<div class="row2" style="align-items:center;margin-top:6px"><div style="font-size:14px;font-weight:600">${esc(r)}</div><input class="in" style="text-align:right" inputmode="decimal" data-r="${esc(r)}" placeholder="$ 0" value="${o.presMap[r]?fmtN(o.presMap[r]):''}"></div>`).join('')}
  <div class="err" id="ferr"></div><div class="acts"><button class="sec" onclick="cerrar()">Cancelar</button><button class="pri" id="fsave" onclick="guardarPres(${i})">Guardar</button></div>`);
}
function guardarPres(i){
  const mapa={};document.querySelectorAll('#sh input[data-r]').forEach(e=>{mapa[e.dataset.r]=num(e.value)});
  const b=$('fsave');b.disabled=true;b.textContent='Guardando…';
  rpc('tbPresupuestos',[CL,D.obras[i].obra,mapa],d=>{D=d;cerrar();paint();toast('✅ Presupuesto guardado')},m=>{b.disabled=false;b.textContent='Guardar';$('ferr').textContent=msgErr(m)});
}
function frmObra(){
  abrir(`<h2>Nueva obra</h2><label class="fl">Nombre</label><input class="in" id="fon" maxlength="60" placeholder="Ej: Casa Funes"><label class="fl">Dirección</label><input class="in" id="fod" maxlength="120" placeholder="Ej: Corrientes 123 · Rosario">
  <div class="err" id="ferr"></div><div class="acts"><button class="sec" onclick="cerrar()">Cancelar</button><button class="pri" id="fsave" onclick="guardarObra()">Crear</button></div>`);
}
function guardarObra(){
  const b=$('fsave');b.disabled=true;b.textContent='Creando…';
  rpc('tbNuevaObra',[CL,$('fon').value,$('fod').value],d=>{D=d;cerrar();paint();toast('🏗 Obra creada')},m=>{b.disabled=false;b.textContent='Crear';$('ferr').textContent=msgErr(m)});
}
try{CL=localStorage.getItem('nj_clave')||''}catch(e){}
if(CL)cargar();else gate('');
</script></body></html>
