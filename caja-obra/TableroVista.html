<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NJ Arquitectura · Obras</title>
<style>

.rr small{font-size:11px;color:var(--mu)}

.m a{text-decoration:none}
.chipsc{display:flex;flex-wrap:wrap;gap:6px}.cc{background:#FFF7FA;border:1px solid var(--bd);border-radius:12px;padding:7px 10px;font-size:12px}.cc b{display:block;font-size:13px}.cc small{color:var(--mu)}

.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(135deg,#AD1457,#E91E63);color:#fff;font-size:32px;line-height:1;box-shadow:0 12px 26px -8px rgba(173,20,87,.8);z-index:20;display:none}

.fl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mu);margin:12px 0 5px;font-weight:700}

.big{font-size:26px;font-weight:900;color:var(--p);text-align:right}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;min-width:70px;padding:10px 6px;border:1px solid var(--bd);border-radius:12px;background:#fff;color:var(--pd);font-weight:700;font-size:13px}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:10px;margin-top:18px}.acts button{flex:1;padding:14px;border-radius:14px;border:0;font-weight:800;font-size:15px}
.pri{background:linear-gradient(135deg,#AD1457,#E91E63);color:#fff}.sec{background:#F8DCE7;color:var(--pd)}.dan{background:#FDE7E7;color:var(--ng)}.dan.on{background:var(--ng);color:#fff}
.acts button:disabled{opacity:.55}
.lnk{background:none;border:0;color:var(--p);font-weight:700;font-size:13px;padding:6px 0}
.mini{background:#FFF0F6;border:1px solid var(--bd);color:var(--pd);font-weight:700;font-size:12px;border-radius:20px;padding:6px 12px;float:right;margin-top:-4px}
.err{color:var(--ng);font-size:13px;margin-top:10px;min-height:16px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#32091F;color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;z-index:60;display:none;align-items:center;gap:12px;max-width:92vw;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
.toast.on{display:flex;animation:rise .25s both}.toast button{background:none;border:0;color:#F48FB1;font-weight:800;font-size:14px}
.gate{position:fixed;inset:0;background:linear-gradient(135deg,#6A0F3F,#AD1457 60%,#E91E63);z-index:80;display:none;align-items:center;justify-content:center;padding:24px}
.gate.on{display:flex}.gate .bx{background:#fff;border-radius:24px;padding:26px 22px;width:100%;max-width:360px;text-align:center}
.gate h2{margin:6px 0 4px;color:var(--pd)}.gate p{color:var(--mu);font-size:13px;margin:0 0 14px}
.sk1{height:340px;border-radius:22px;margin:14px;background:linear-gradient(90deg,#F8E3EC 25%,#FDF0F5 50%,#F8E3EC 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.nueva{border:2px dashed #E6A9C2;background:transparent;box-shadow:none;display:grid;place-items:center;min-height:120px;color:var(--p);font-weight:800;font-size:15px;text-align:center}
.m{cursor:pointer}.m:active{background:#FFF7FA}
.alerta{margin:12px 14px 0;background:linear-gradient(135deg,#C62828,#E53935);color:#fff;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;cursor:pointer;box-shadow:0 10px 24px -10px rgba(198,40,40,.8);animation:pulse 2s infinite}
.alerta b{font-size:15px}.alerta span{font-size:13px;opacity:.95}.alerta i{font-style:normal;font-size:12px;font-weight:700;opacity:.9;margin-top:2px}
@keyframes pulse{0%,100%{box-shadow:0 10px 24px -10px rgba(198,40,40,.8)}50%{box-shadow:0 10px 30px -4px rgba(198,40,40,1)}}
.cta{width:100%;margin-top:12px;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,#AD1457,#E91E63);color:#fff;font-weight:800;font-size:15px;display:flex;justify-content:center;gap:8px;align-items:center;flex-wrap:wrap}
.cta.urg{background:linear-gradient(135deg,#C62828,#EF5350)}.cta small{font-weight:600;opacity:.9;font-size:12px}
.cst{margin-top:12px;padding:10px 12px;border-radius:12px;background:#FFF7FA;border:1px dashed var(--bd);color:var(--mu);font-size:12.5px;text-align:center}
.oc.urgente{border-color:#EF5350;box-shadow:0 0 0 2px rgba(239,83,80,.35),var(--sh)}
.tab .bd{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:10px;background:#E53935;color:#fff;font-size:11px;line-height:18px}
.acts a.btnl{flex:1;padding:14px;border-radius:14px;font-weight:800;font-size:15px;text-align:center;text-decoration:none;color:#fff}
.cc{cursor:pointer}.cc:active{background:#FCE4EC}
.tap{cursor:pointer}.tap:active{background:#FCE4EC}.wf .r.tap{margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:10px}.wf .r.tap:after{content:'›';color:var(--mu);margin-left:6px}.chip.tap:active{transform:scale(.97)}
.wf .r.mi{padding:16px 8px;font-size:16px;font-weight:700}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<section class="hero">
  <div class="top"><div class="brand">NJ ARQUITECTURA<small>Caja de obra · <span id="upd"></span></small></div><button class="rf" onclick="location.reload()" aria-label="Actualizar">&#8635;</button></div>
  <div class="hl">Ganancia neta total</div><div class="hn" id="hn">$0</div><div class="hs" id="hs">Cargando…</div>
</section>
<div class="chips" id="chips"></div>
<div id="alert"></div>
<div class="tabs" id="tabs"></div>
<div id="app"><div class="sk1"></div><div class="sk1"></div></div>
<button class="fab" id="fab" onclick="menuMas()" aria-label="Agregar">+</button>
<div class="ov" id="ov" onclick="if(event.target===this)cerrar()"><div class="sh" id="sh"></div></div>
<div class="toast" id="toast"></div>
<div class="gate" id="gate"><div class="bx" id="gbx"></div></div>
<script>
let D=null,CL='';
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const PAL=[['#AD1457','#F06292'],['#6A1B9A','#BA68C8'],['#D84315','#FFAB91'],['#00796B','#4DB6AC'],['#283593','#7986CB'],['#EF6C00','#FFB74D']];
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const ICO={'Ingreso':'💰','Compra':'🧱','Pago sub':'👷','Gasto':'🧾'};
let T='obras',SEL=-1,FO=-1,FT='',FQ='',FR='';
const EST=['Sueldos','Oficina','Servicios','Contadora','Impuestos'];
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const money=n=>{n=Math.round(+n||0);return(n<0?'-$':'$')+Math.abs(n).toLocaleString('es-AR')};
const mc=n=>{n=+n||0;const a=Math.abs(n),s=n<0?'-':'';if(a>=1e6)return s+'$'+(a/1e6).toFixed(a>=1e7?1:2).replace('.',',')+' M';if(a>=1e3)return s+'$'+Math.round(a/1e3)+' mil';return s+'$'+Math.round(a)};
const pc=x=>x==null?'—':Math.round(x*100)+'%';
const pct4=x=>(Math.round(x*10000)/100).toString().replace('.',',')+' %';
const col=i=>PAL[i%PAL.length];
const sum=k=>D.obras.reduce((a,o)=>a+(o[k]||0),0);
const sty=i=>`--a:${col(i)[0]};--b:${col(i)[1]}`;
function ringInfo(o){
  if(o.avance!=null)return[o.avance,'avance'];
  if(o.params&&o.params.plazo)return[o.certs.length/o.params.plazo,'certif.'];
  return[null,'s/ presup.'];
}
function ring(p,label,sz){
  const r=42,c=2*Math.PI*r,pp=p==null?0:Math.min(p,1);
  return `<div class="ring${p>1?' over':''}" style="--sz:${sz}px"><svg viewBox="0 0 100 100"><circle class="rb" cx="50" cy="50" r="${r}"/><circle class="rg" cx="50" cy="50" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${c*(1-pp)}"/></svg><div class="rc"><b>${pc(p)}</b><small>${label}</small></div></div>`;
}
function dots(o){
  const p=o.params;if(!p||!p.plazo)return'';
  return`<div class="dots">${Array.from({length:p.plazo},(_,i)=>`<i class="${i<o.certs.length?'on':''}"></i>`).join('')}</div>`;
}
function spark(o){
  const s=o.serie||[],mx=Math.max(1,...s.map(x=>Math.max(x.c,x.p)));
  if(!s.some(x=>x.c||x.p))return'<div class="sk">Sin movimientos en los últimos 6 meses</div>';
  return`<div class="spark">${s.map(x=>`<div><div class="bb"><i style="--h:${Math.max(3,x.c/mx*40)}px"></i><i style="--h:${Math.max(3,x.p/mx*40)}px"></i></div><span>${x.l}</span></div>`).join('')}</div><div class="sk"><span><u style="background:var(--b);opacity:.55"></u>Cobrado</span><span><u style="background:var(--a)"></u>Pagado</span></div>`;
}
function card(o,i){
  const[rp,rl]=ringInfo(o),pg=o.cobrado>0?o.pagado/o.cobrado:null,p=o.params;
  return`<article class="oc${proxCert(o).e==='listo'?' urgente':''}" style="${sty(i)};--i:${i}" onclick="ver(${i})">
  <div class="oh"><div class="av">${esc(o.obra.charAt(0).toUpperCase())}</div><div><h2>${esc(o.obra)}</h2><p>${esc(o.dir)||'Sin dirección'}</p></div>${o.estado?`<span class="st">${esc(o.estado)}</span>`:''}</div>
  <div class="ob">
    <div class="mid">${ring(rp,rl,96)}<div class="sal"><small>Saldo en caja</small><b class="${o.saldo<0?'neg':''}" data-n="${o.saldo}">${money(0)}</b></div></div>

  if(n>p.plazo)return{e:'fin',n};
  const b=(p.base||'').split('/');
  if(b.length<3)return{e:'cfg'};
  const idx=(+b[2])*12+(+b[1]-1)+n,mes=MES[idx%12]+' '+Math.floor(idx/12);
  const due=new Date(Math.floor((idx+1)/12),(idx+1)%12,1),hoy=new Date();hoy.setHours(0,0,0,0);
  return{e:hoy>=due?'listo':'prox',n,mes,due,dias:Math.round((hoy-due)/864e5)};
}
function ctaCert(o,i){
  const c=proxCert(o);
  if(c.e==='listo')return`<button class="cta urg" onclick="event.stopPropagation();frmCert(${i})">📄 Emitir certificado de ${esc(c.mes)} <small>${c.dias>0?'listo hace '+c.dias+' d':'listo hoy'}</small></button>`;
  if(c.e==='prox')return`<button class="cta" onclick="event.stopPropagation();frmCert(${i})">📄 Emitir certificado de ${esc(c.mes)} <small>disponible desde ${fd(c.due)}</small></button>`;
  if(c.e==='cfg')return`<div class="cst" onclick="event.stopPropagation();frmCertCfg(${i})">Sin honorarios cargados · <b style="color:var(--p)">Cargarlos (una sola vez)</b></div>`;
  return'<div class="cst">✔ Certificados completos</div>';
}
const pend=()=>D.obras.map((o,i)=>[o,i,proxCert(o)]).filter(x=>x[2].e==='listo');
function paintAlert(){
  const l=pend();
  $('alert').innerHTML=l.length?`<div class="alerta" onclick="go('certs')"><b>📄 ${l.length===1?'Certificado listo para emitir':l.length+' certificados listos para emitir'}</b><span>${l.map(x=>esc(x[0].obra)+' · '+esc(x[2].mes)).join(' — ')}</span><i>Tocá para emitir ›</i></div>`:'';
}
function calcCert(o,x){let f=1;o.certs.forEach(c=>f*=1+c.pct);f*=1+x;const a=f-1,r=Math.round(o.params.mensual*a);return{acum:a,reaj:r,total:o.params.mensual+r}}
function frmCert(i){
  const o=D.obras[i],c=proxCert(o);
  if(c.e==='cfg')return frmCertCfg(i);
  if(c.e==='fin')return toast('Ya están todos los certificados del plazo');
  F={i:i,n:c.n};
  abrir(`<h2>Certificado N° ${c.n} · ${esc(o.obra)}</h2><div class="sub">Honorario mensual ${money(o.params.mensual)} · ${o.certs.length} emitidos de ${o.params.plazo}</div>
  ${c.e==='prox'?`<div class="nx" style="margin-top:10px">Ese mes todavía no cerró (el IPC se publica a mediados del mes siguiente, desde ${fd(c.due)}). Podés emitirlo igual si ya tenés el dato.</div>`:''}
  <label class="fl">Mes del certificado</label><input class="in" id="cmes" value="${esc(c.mes)}">
  <label class="fl">IPC del mes (%)</label><input class="in big" id="cipc" inputmode="decimal" placeholder="Ej: 2,3" oninput="prevCert()">
  <div class="wf" id="cprev" style="margin-top:10px"><div class="sub">Escribí el IPC para ver el cálculo.</div></div>
  <div class="err" id="ferr"></div>
  <div class="acts"><button class="sec" onclick="cerrar()">Cancelar</button><button class="pri" id="fsave" onclick="emitirCert()">Emitir</button></div>`);
  setTimeout(()=>$('cipc')&&$('cipc').focus(),50);
}
function prevCert(){
  const x=num($('cipc').value)/100,o=D.obras[F.i];
  if(!(x>0&&x<1)){$('cprev').innerHTML='<div class="sub">Escribí el IPC para ver el cálculo.</div>';return}
  const r=calcCert(o,x);
  $('cprev').innerHTML=`<div class="r"><span>Inflación acumulada</span><b>${pct4(r.acum)}</b></div><div class="r"><span>Monto de reajuste</span><b>${money(r.reaj)}</b></div><div class="r t"><span>Total del mes</span><b>${money(r.total)}</b></div>`;
}
function emitirCert(){
  const x=num($('cipc').value)/100;
  if(!(x>0&&x<1)){$('ferr').textContent='Poné el IPC del mes, entre 0 y 100.';return}
  const b=$('fsave'),o=D.obras[F.i];b.disabled=true;b.textContent='Emitiendo…';
  rpc('tbCertEmitir',[CL,o.obra,x,$('cmes').value,F.n],r=>{D=r.datos;paint();resCert(r.cert,o.obra)},m=>{b.disabled=false;b.textContent='Emitir';$('ferr').textContent=msgErr(m)});
}
function resCert(c,obra){
  abrir(`<div style="text-align:center"><div style="font-size:46px">✅</div><h2>Certificado N° ${c.n} emitido</h2><div class="sub">${esc(obra)} · ${esc(c.mes)}</div><div class="big" style="text-align:center;margin:12px 0">${money(c.total)}</div><div class="sub">Acumulada ${pct4(c.acum)} · reajuste ${money(c.reaj)}<br>Ya se cargó como ingreso de la obra.</div></div>
  ${c.url?shareHtml(c.url,c.n,c.mes,obra):'<div class="err">El certificado se emitió, pero no se pudo guardar el PDF. Pedilo tocando el certificado.</div>'}
  <div class="acts"><button class="sec" onclick="cerrar()">Listo</button></div>`);
}
function frmCertAcc(i,n){
  const o=D.obras[i],c=o.certs.find(x=>x.n===n);if(!c)return;
  F={i:i,n:n,mes:c.mes};
  abrir(`<h2>Certificado N° ${n}</h2><div class="sub">${esc(o.obra)} · ${esc(c.mes)}</div>
  <div class="wf" style="margin-top:10px"><div class="r"><span>IPC del mes</span><b>${pct4(c.pct)}</b></div><div class="r"><span>Acumulada</span><b>${pct4(c.acum)}</b></div><div class="r"><span>Reajuste</span><b>${money(c.reaj)}</b></div><div class="r t"><span>Total</span><b>${money(c.total)}</b></div></div>
  <div id="pdfbox"></div><div class="err" id="ferr"></div>
  <div class="acts"><button class="sec" onclick="frmCorr()">✏️ Corregir IPC</button><button class="pri" id="fsave" onclick="verPdf()">📲 Enviar PDF</button></div>
  ${n===Math.max(...o.certs.map(x=>x.n))?'<div class="acts" style="margin-top:10px"><button class="dan" id="fdel" onclick="borrarCert()">🗑 Borrar este certificado</button></div><div class="sub" style="margin-top:6px">Borra el certificado y el ingreso que generó. Queda copia en la Papelera.</div>':''}`);
}
function verPdf(){
  const o=D.obras[F.i],b=$('fsave');b.disabled=true;b.textContent='Generando…';
  rpc('tbCertPdf',[CL,o.obra,F.n],r=>{b.style.display='none';$('pdfbox').innerHTML=shareHtml(r.url,F.n,F.mes,o.obra)},m=>{b.disabled=false;b.textContent='📲 Enviar PDF';$('ferr').textContent=msgErr(m)});
}
function borrarCert(){
  const b=$('fdel');
  if(!b.classList.contains('on')){b.classList.add('on');b.textContent='¿Seguro? Tocá de nuevo';return}
  b.disabled=true;b.textContent='Borrando…';
  rpc('tbCertBorrar',[CL,D.obras[F.i].obra,F.n],d=>{D=d;cerrar();paint();toast('🗑 Certificado borrado')},m=>{b.disabled=false;b.classList.remove('on');b.textContent='🗑 Borrar este certificado';$('ferr').textContent=msgErr(m)});
}
function frmCorr(){
  const o=D.obras[F.i],c=o.certs.find(x=>x.n===F.n);
  abrir(`<h2>Corregir IPC · N° ${F.n}</h2><div class="sub">${esc(o.obra)} · ${esc(F.mes)}. Se recalcula este certificado y los siguientes, y se actualiza el ingreso de la obra.</div>
  <label class="fl">IPC correcto (%)</label><input class="in big" id="cipc" inputmode="decimal" value="${String(Math.round(c.pct*10000)/100).replace('.',',')}">
  <div class="err" id="ferr"></div><div class="acts"><button class="sec" onclick="cerrar()">Cancelar</button><button class="pri" id="fsave" onclick="corregirCert()">Guardar</button></div>`);
}
function corregirCert(){
  const x=num($('cipc').value)/100;
  if(!(x>0&&x<1)){$('ferr').textContent='Poné un IPC entre 0 y 100.';return}
  const b=$('fsave');b.disabled=true;b.textContent='Guardando…';
  rpc('tbCertCorregir',[CL,D.obras[F.i].obra,F.mes,x],d=>{D=d;cerrar();paint();toast('✅ IPC corregido y recalculado')},m=>{b.disabled=false;b.textContent='Guardar';$('ferr').textContent=msgErr(m)});
}
function frmCertCfg(i){
  const o=D.obras[i],p=o.params||{};F={i:i};
  abrir(`<h2>Honorarios · ${esc(o.obra)}</h2><div class="sub">Se carga una sola vez. Después el tablero te avisa cada mes cuándo emitir el certificado.</div>
  <label class="fl">Honorario mensual ($)</label><input class="in big" id="cmen" inputmode="decimal" value="${p.mensual?fmtN(p.mensual):''}">
  <div class="row2"><div><label class="fl">Plazo (meses)</label><input class="in" id="cpla" inputmode="numeric" value="${p.plazo||''}"></div><div><label class="fl">Fecha base</label><input class="in" id="cbas" type="date" value="${p.baseISO||hoyISO()}"></div></div>
  <div class="sub" style="margin-top:8px">El primer certificado corresponde al mes siguiente a la fecha base.</div>
  <div class="err" id="ferr"></div><div class="acts"><button class="sec" onclick="cerrar()">Cancelar</button><button class="pri" id="fsave" onclick="guardarCfg()">Guardar</button></div>`);
}
function guardarCfg(){
  const b=$('fsave');b.disabled=true;b.textContent='Guardando…';
  rpc('tbCertParams',[CL,D.obras[F.i].obra,num($('cmen').value),num($('cpla').value),$('cbas').value],d=>{D=d;cerrar();paint();toast('✅ Certificados configurados')},m=>{b.disabled=false;b.textContent='Guardar';$('ferr').textContent=msgErr(m)});
}

function shareHtml(url,n,mes,obra){
  const t=encodeURIComponent('Hola! Te envío el certificado de honorarios N° '+n+' ('+mes+') de la obra '+obra+': '+url);
  return`<div class="acts" style="flex-direction:column"><a class="pri btnl" style="background:linear-gradient(135deg,#128C7E,#25D366)" href="https://wa.me/?text=${t}" target="_blank" rel="noopener">📲 Enviar por WhatsApp</a>
  <div style="display:flex;gap:10px"><a class="sec btnl" style="color:var(--pd)" href="${esc(url)}" target="_blank" rel="noopener">📄 Abrir PDF</a><button class="sec" onclick="copiar('${esc(url)}')">🔗 Copiar link</button></div></div>`;
}
function copiar(u){
  const ok=()=>toast('🔗 Link copiado');
  try{navigator.clipboard.writeText(u).then(ok,()=>cp2(u,ok))}catch(e){cp2(u,ok)}
}
function cp2(u,ok){const a=document.createElement('textarea');a.value=u;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast(u)}a.remove()}
function menuMas(){
  abrir(`<h2>¿Qué querés hacer?</h2><div class="wf"><div class="r mi tap" onclick="frmMov(0)"><span>💸 Cargar un movimiento</span></div><div class="r mi tap" onclick="frmCertElegir()"><span>📄 Emitir un certificado</span></div><div class="r mi tap" onclick="frmObra()"><span>🏗 Nueva obra</span></div></div><div class="acts"><button class="sec" onclick="cerrar()">Cancelar</button></div>`);
}
function frmCertElegir(){
  const l=D.obras.map((o,i)=>[o,i,proxCert(o)]);
  if(l.length===1)return frmCert(0);
  const et=c=>c.e==='listo'?'listo: '+c.mes:c.e==='prox'?c.mes:c.e==='fin'?'completo':'configurar';
  abrir(`<h2>Emitir certificado</h2><div class="sub">Elegí la obra</div><div class="wf" style="margin-top:8px">${l.map(x=>`<div class="r mi tap" onclick="frmCert(${x[1]})"><span>${esc(x[0].obra)}</span><b style="font-size:12px;color:${x[2].e==='listo'?'var(--ng)':'var(--mu)'}">${esc(et(x[2]))}</b></div>`).join('')}</div><div class="acts"><button class="sec" onclick="cerrar()">Cancelar</button></div>`);
}
try{CL=localStorage.getItem('nj_clave')||''}catch(e){}
if(CL)cargar();else gate('');
</script></body></html>
